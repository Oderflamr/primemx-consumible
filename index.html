<html lang="es">

<title>PrimeMX · Consumibles v4</title>
<style>
/* ── TOKENS ─────────────────────────────────────── */
:root{
  --bg:#f5f5f2;
  --surface:#ffffff;
  --surface2:#f0efeb;
  --border:rgba(0,0,0,.08);
  --border2:rgba(0,0,0,.14);
  --text:#18180f;
  --text2:#6b6b62;
  --text3:#a3a398;
  --blue:#1a56db;
  --blue-bg:#eff4ff;
  --blue-text:#1e40af;
  --green:#166534;
  --green-bg:#f0fdf4;
  --green-text:#15803d;
  --amber:#92400e;
  --amber-bg:#fffbeb;
  --amber-text:#b45309;
  --red:#991b1b;
  --red-bg:#fef2f2;
  --red-text:#dc2626;
  --purple:#5b21b6;
  --purple-bg:#f5f3ff;
  --purple-text:#6d28d9;
  --teal:#134e4a;
  --teal-bg:#f0fdfa;
  --teal-text:#0f766e;
  --r:8px;--rl:12px;--rxl:16px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 16px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.07);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#111110;--surface:#1c1c1a;--surface2:#262623;
    --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
    --text:#f0efe8;--text2:#9a9a90;--text3:#636360;
    --blue-bg:#1e3a8a22;--blue-text:#93c5fd;
    --green-bg:#14532d22;--green-text:#86efac;
    --amber-bg:#78350f22;--amber-text:#fcd34d;
    --red-bg:#7f1d1d22;--red-text:#fca5a5;
    --purple-bg:#4c1d9522;--purple-text:#c4b5fd;
    --teal-bg:#134e4a22;--teal-text:#5eead4;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

/* ── LOGIN ───────────────────────────────────────── */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:var(--bg);
}
.login-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--rxl);
  padding:40px;width:100%;max-width:380px;box-shadow:var(--shadow-md);
}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.login-logo .dot-mark{
  width:34px;height:34px;background:var(--blue);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;
}
.login-logo .dot-mark svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.login-logo .brand{font-size:17px;font-weight:700;letter-spacing:-.02em}
.login-logo .brand span{color:var(--text2);font-weight:400}
.login-card h2{font-size:20px;font-weight:700;margin-bottom:6px}
.login-card p{font-size:13px;color:var(--text2);margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.field input{
  width:100%;height:40px;border:1px solid var(--border2);border-radius:var(--r);
  padding:0 12px;font-size:14px;background:var(--surface);color:var(--text);outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
.login-error{
  background:var(--red-bg);color:var(--red-text);border:1px solid rgba(220,38,38,.2);
  border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:16px;display:none;
}
.btn-login{
  width:100%;height:42px;background:var(--blue);color:#fff;border:none;
  border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s;
}
.btn-login:hover{opacity:.9}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.login-hint{margin-top:20px;padding-top:20px;border-top:1px solid var(--border);
  font-size:12px;color:var(--text3);text-align:center}

/* ── APP SHELL ───────────────────────────────────── */
#app-screen{display:none;min-height:100vh;flex-direction:column}
#app-screen.visible{display:flex}

.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;flex-shrink:0;
}
.topbar-left{display:flex;align-items:center;gap:16px}
.topbar-logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.topbar-logo .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0}
.role-badge{
  font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px;letter-spacing:.03em;
}
.role-admin{background:var(--blue-bg);color:var(--blue-text)}
.role-proveedor{background:var(--amber-bg);color:var(--amber-text)}
.role-consulta{background:var(--green-bg);color:var(--green-text)}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-right .btn-logout{
  font-size:12px;color:var(--text2);background:none;border:1px solid var(--border2);
  border-radius:var(--r);padding:5px 12px;cursor:pointer;transition:all .15s;
}
.topbar-right .btn-logout:hover{background:var(--surface2);color:var(--text)}

.layout{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR (admin only) ────────────────────────── */
.sidebar{
  width:210px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;
}
.nav-label{
  font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.07em;padding:10px 10px 4px;
}
.nav-btn{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);
  font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border:none;
  background:none;width:100%;text-align:left;transition:all .15s;
}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{background:var(--blue-bg);color:var(--blue-text)}
.nav-btn svg{width:17px;height:17px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-spacer{flex:1}

/* ── MAIN CONTENT ────────────────────────────────── */
.main{flex:1;overflow-y:auto;padding:24px}

/* ── PAGE HEADER ─────────────────────────────────── */
.page-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px}
.page-hdr-left h2{font-size:19px;font-weight:700;letter-spacing:-.02em}
.page-hdr-left p{font-size:13px;color:var(--text2);margin-top:2px}

/* ── METRIC CARDS ────────────────────────────────── */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;box-shadow:var(--shadow)}
.mc-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.mc-value{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1}
.mc-sub{font-size:11px;color:var(--text3);margin-top:5px}

/* ── CARD ────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);overflow:hidden}
.card-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.card-header h3{font-size:14px;font-weight:600}

/* ── FILTERS ─────────────────────────────────────── */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=date]{
  height:32px;border:1px solid var(--border2);border-radius:var(--r);padding:0 10px;
  font-size:13px;background:var(--surface);color:var(--text);outline:none;
  transition:border-color .15s;
}
select:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(26,86,219,.1)}

/* ── BUTTONS ─────────────────────────────────────── */
.btn{
  height:32px;padding:0 14px;border-radius:var(--r);font-size:13px;font-weight:500;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border2);
  background:var(--surface);color:var(--text);transition:all .15s;white-space:nowrap;
}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.primary:hover{background:#1648c0}
.btn.success{background:var(--green);color:#fff;border-color:var(--green)}
.btn.success:hover{background:#14532d}
.btn.danger{color:var(--red-text);border-color:rgba(220,38,38,.3)}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── TABLE ───────────────────────────────────────── */
.tbl-wrap{overflow-x:auto;max-height:500px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{position:sticky;top:0;background:var(--surface);z-index:2}
th{
  padding:8px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--text2);
  text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface2)}
.actions{display:flex;gap:4px}

/* ── BADGES ──────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;white-space:nowrap}
.b-abierto{background:var(--blue-bg);color:var(--blue-text)}
.b-pendiente{background:var(--amber-bg);color:var(--amber-text)}
.b-entregado{background:var(--green-bg);color:var(--green-text)}
.b-abierto2{background:var(--blue-bg);color:var(--blue-text)}
.b-cerrado{background:var(--surface2);color:var(--text2)}
.b-rechazado{background:var(--red-bg);color:var(--red-text)}
.b-toner{background:var(--purple-bg);color:var(--purple-text)}
.b-unidad{background:var(--teal-bg);color:var(--teal-text)}
.b-kit{background:var(--amber-bg);color:var(--amber-text)}
.b-falla{background:var(--red-bg);color:var(--red-text)}
.dot-status{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}

/* ── MODAL ───────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;
  align-items:center;justify-content:center;z-index:200;padding:16px;backdrop-filter:blur(2px);
}
.modal{
  background:var(--surface);border-radius:var(--rxl);border:1px solid var(--border);
  width:640px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 25px 80px rgba(0,0,0,.25);
}
.modal-hdr{
  padding:18px 22px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;justify-content:space-between;position:sticky;top:0;
  background:var(--surface);z-index:1;
}
.modal-hdr h3{font-size:16px;font-weight:700}
.modal-body{padding:22px}
.modal-footer{
  padding:14px 22px;border-top:1px solid var(--border);display:flex;
  justify-content:flex-end;gap:8px;background:var(--surface);position:sticky;bottom:0;
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-full{grid-column:1/-1}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.fg input,.fg select,.fg textarea{
  height:38px;border:1px solid var(--border2);border-radius:var(--r);padding:0 12px;
  font-size:13px;background:var(--surface);color:var(--text);outline:none;width:100%;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(26,86,219,.1)}
.fg textarea{height:72px;padding:10px 12px;resize:vertical}
.fg input:read-only,.fg select:disabled{background:var(--surface2);color:var(--text2);cursor:not-allowed}

/* ── PROVEEDOR VIEW ──────────────────────────────── */
.prov-header{
  background:var(--amber-bg);border:1px solid rgba(180,83,9,.15);border-radius:var(--rl);
  padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px;
}
.prov-header svg{width:22px;height:22px;flex-shrink:0;fill:none;stroke:var(--amber-text);stroke-width:2;stroke-linecap:round}
.prov-header p{font-size:13px;color:var(--amber-text)}
.prov-header strong{font-weight:700}

/* ── DASHBOARD CHARTS ────────────────────────────── */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:18px;box-shadow:var(--shadow)}
.chart-card h4{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-lbl{width:145px;font-size:12px;color:var(--text2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.bar-track{flex:1;height:18px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
.bar-cnt{font-size:12px;font-weight:700;min-width:20px}

/* ── TIENDAS TABLE ───────────────────────────────── */
.prog{height:6px;border-radius:3px;background:var(--surface2);width:64px;overflow:hidden;display:inline-block;vertical-align:middle}
.prog-fill{height:100%;background:var(--green);border-radius:3px}

/* ── EMPTY ───────────────────────────────────────── */
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty svg{width:40px;height:40px;stroke:var(--text3);fill:none;stroke-width:1.5;margin:0 auto 10px;display:block}
.empty p{font-size:13px}

/* ── LOADING ─────────────────────────────────────── */
.spinner{
  width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--blue);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-center{display:flex;align-items:center;justify-content:center;padding:48px;gap:12px;color:var(--text2);font-size:13px}

/* ── TOAST ───────────────────────────────────────── */
.toast{
  position:fixed;bottom:24px;right:24px;background:var(--text);color:var(--bg);
  padding:11px 18px;border-radius:var(--r);font-size:13px;font-weight:600;z-index:400;
  opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;max-width:320px;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:var(--red);color:#fff}

/* ── GUIA SECTION ────────────────────────────────── */
.guia-box{background:var(--surface2);border-radius:var(--r);padding:10px 12px;margin-top:8px;font-size:12px;color:var(--text2);border:1px solid var(--border)}
.guia-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.guia-val{font-size:14px;font-weight:700;color:var(--text);font-family:monospace;letter-spacing:.05em}


/* ── TIENDA AUTOCOMPLETE ─────────────────────────── */
.ac-wrap{position:relative}
.ac-input{width:100%;height:38px;border:1px solid var(--border2);border-radius:var(--r);padding:0 12px;font-size:13px;background:var(--surface);color:var(--text);outline:none}
.ac-input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(26,86,219,.1)}

/* ── RESPONSIVE ──────────────────────────────────── */
@media(max-width:768px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .chart-grid{grid-template-columns:1fr}
  .sidebar{display:none}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>

<!-- Firebase (compat SDK via CDN — no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
/* ═══════════════════════════════════════════════════
   CONFIGURACIÓN — REEMPLAZA CON TUS DATOS DE FIREBASE
   Ver instrucciones en README.md
═══════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyCIQGZGwNEw3vAlL4clGVbClLYCcUy3CYU",
  authDomain:        "primemx-consumibles.firebaseapp.com",
  projectId:         "primemx-consumibles",
  storageBucket:     "primemx-consumibles.firebasestorage.app",
  messagingSenderId: "796822637748",
  appId:             "1:796822637748:web:7e8db90898618d26079be1"
};

/* ─── Init Firebase ─── */
// agosto 2026: el login ya NO usa el objeto USERS en texto plano — se migró a Firebase Authentication,
// el mismo mecanismo (y mismo proyecto) que ya usan Dashboard IT y Directorio de Tiendas. Con esto,
// iniciar sesión en cualquiera de las 3 apps ya no vuelve a pedir usuario/contraseña en las otras 2
// (misma sesión de Firebase, persistida por el navegador). El rol (admin/proveedor/consulta) se lee
// de la misma colección Firestore `usuarios` que ya usan las otras 2 apps.
let db, auth;
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  auth = firebase.auth();
} catch(e) {
  console.warn("Firebase no configurado — modo demo (sin persistencia):", e.message);
}
const ROLES_COLLECTION = "usuarios";
const AUTH_DOMAIN = "primecommsmx.com";

/* ─── State ─── */
let currentUser = null;
let tickets     = [];
let unsubscribe = null;
let page        = "tickets";
let filt        = { mes:"", tipo:"", estatus:"", busq:"", anio:"" };
let dashMes     = "";
let dashAnio    = "";
// Estado independiente para los selectores de métricas rápidas
const MESES_ES_G = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let metricsMes  = MESES_ES_G[new Date().getMonth()];
let metricsAnio = String(new Date().getFullYear());
let editId      = null;
// Prefill de "Nuevo ticket" cuando viene de "Ver pendientes" (agosto 2026) — ver openModal().
let prefillNuevoTicket = null;
// Lista vigente del panel "Ver pendientes" (agosto 2026) — se usa para no tener que meter JSON
// dentro de los onclick de la tabla, solo el índice.
let pendientesActuales = [];

const TIPOS   = ["TONER","UNIDAD DE IMAGEN","KIT MANTENIMIENTO","FALLA IMPRESORA"];
const ESTATUS = ["ABIERTO","PENDIENTE","CERRADO"];
const COLORES  = { TONER:"#6d28d9","UNIDAD DE IMAGEN":"#0f766e","KIT MANTENIMIENTO":"#b45309","FALLA IMPRESORA":"#b91c1c" };

/* ══════════════ AUTH ════════════════════════════ */
// Login con Firebase Authentication (email = usuario@primecommsmx.com) — Firebase ya rechaza
// intentos con backoff propio, por eso ya no hace falta el bloqueo manual que tenía la versión
// con USERS en texto plano.
function doLogin() {
  const user = document.getElementById("inp-user").value.trim().toLowerCase();
  const pass = document.getElementById("inp-pass").value;
  const err  = document.getElementById("login-error");
  const btn  = document.getElementById("btn-login");
  err.style.display = "none";
  btn.disabled = true;
  auth.signInWithEmailAndPassword(user + '@' + AUTH_DOMAIN, pass).then(function(){
    localStorage.setItem('primemx_sesion_inicio', String(Date.now()));
  }).catch(function(e){
    console.error(e);
    err.textContent = "Usuario o contraseña incorrectos.";
    err.style.display = "block";
    btn.disabled = false;
  });
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("btn-login").addEventListener("click", doLogin);
  document.getElementById("inp-pass").addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
  document.getElementById("inp-user").addEventListener("keydown", e => { if(e.key==="Enter") document.getElementById("inp-pass").focus(); });
});

function doLogout() {
  localStorage.removeItem('primemx_sesion_inicio');
  auth.signOut();
}

// Caducidad de sesión (agosto 2026, pedido explícito del cliente): 10 horas desde que se inició
// sesión, sin importar actividad. El timestamp (primemx_sesion_inicio) es compartido con Dashboard
// y Directorio (mismo origen/localStorage), para que el reloj de 10h sea uno solo entre las 3 apps.
const SESION_DURACION_MS = 10 * 60 * 60 * 1000;
function sesionExpirada(){
  const inicio = Number(localStorage.getItem('primemx_sesion_inicio') || 0);
  return !inicio || (Date.now() - inicio) > SESION_DURACION_MS;
}
setInterval(()=>{
  if(currentUser && sesionExpirada()){
    localStorage.removeItem('primemx_sesion_inicio');
    auth.signOut();
    toast('Tu sesión expiró después de 10 horas. Vuelve a iniciar sesión.', true);
  }
}, 5 * 60 * 1000);

// Se dispara solo al cargar la página si ya había una sesión de Firebase activa (venir de Dashboard
// IT o Directorio de Tiendas, o haber entrado antes aquí mismo) — así ya no se vuelve a pedir login.
auth.onAuthStateChanged(async function(user){
  const btn = document.getElementById("btn-login");
  if(user && sesionExpirada()){
    localStorage.removeItem('primemx_sesion_inicio');
    auth.signOut();
    return;
  }
  if(user){
    const username = (user.email || '').split('@')[0];
    let roleInfo = { role: 'consulta', display: username };
    try{
      const doc = await db.collection(ROLES_COLLECTION).doc(username).get();
      if(doc.exists){
        roleInfo = { role: doc.data().role || 'consulta', display: doc.data().label || username };
      }
    }catch(e){
      console.error('No se pudo leer el rol del usuario', e);
    }
    currentUser = { id: username, role: roleInfo.role, display: roleInfo.display };
    if(btn) btn.disabled = false;
    startApp();
  } else {
    currentUser = null;
    tickets = [];
    if(unsubscribe) unsubscribe();
    document.getElementById("app-screen").classList.remove("visible");
    document.getElementById("login-screen").style.display = "flex";
    if(btn) btn.disabled = false;
    document.getElementById("inp-pass").value = "";
  }
});

function startApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-screen").classList.add("visible");
  document.getElementById("role-badge").textContent = currentUser.display;
  document.getElementById("role-badge").className = "role-badge role-" + currentUser.role;
  document.getElementById("user-name").textContent = currentUser.display;
  if(currentUser.role === "proveedor") {
    document.getElementById("sidebar").style.display = "none";
  }
  if(currentUser.role === "consulta") {
    document.getElementById("sidebar").style.display = "none";
  }
  loadTickets();

}

/* ══════════════ DATA LAYER ══════════════════════ */
function loadTickets() {
  if(!db) {
    // Demo mode con datos de ejemplo
    tickets = DEMO_DATA.map(t=>({...t}));
    render();
    return;
  }
  const col = db.collection("tickets").orderBy("solicitud","desc");
  unsubscribe = col.onSnapshot(snap => {
    tickets = snap.docs.map(d => ({ ...d.data(), id: d.data().id || d.id }));
    render();
  }, err => {
    toast("Error al conectar con Firebase. Revisa la configuración.", true);
    tickets = DEMO_DATA.map(t=>({...t}));
    render();
  });
}

async function saveTicket(data) {
  if(!db) {
    const idx = tickets.findIndex(t=>t.id===data.id);
    if(idx>=0) tickets[idx]={...data}; else tickets.unshift({...data});
    render(); return true;
  }
  try {
    const { id, ...rest } = data;
    // Siempre usar el número de ticket como ID del documento
    const docId = editId || id;
    await db.collection("tickets").doc(docId).set(rest);
    return true;
  } catch(e) { toast("Error al guardar: "+e.message, true); return false; }
}

async function updateTicketPartial(id, patch) {
  if(!db) {
    const idx = tickets.findIndex(t=>t.id===id);
    if(idx>=0) tickets[idx]={...tickets[idx],...patch};
    render(); return true;
  }
  try {
    await db.collection("tickets").doc(id).update(patch);
    return true;
  } catch(e) { toast("Error: "+e.message, true); return false; }
}

async function deleteTicket(id) {
  if(!db) { tickets=tickets.filter(t=>t.id!==id); render(); return; }
  try { await db.collection("tickets").doc(id).delete(); }
  catch(e) { toast("Error al eliminar: "+e.message, true); }
}

/* ══════════════ ROUTING ═════════════════════════ */
function navigate(p) {
  page = p;
  ["tickets","dashboard","tiendas","top-tiendas","bottom-tiendas"].forEach(x => {
    document.getElementById("nav-"+x)?.classList.toggle("active", x===p);
  });
  render();
}

/* ══════════════ RENDER DISPATCH ═════════════════ */
function render() {
  const c = document.getElementById("main-content");
  if(currentUser.role==="proveedor") { c.innerHTML = renderProveedor(); }
  else if(currentUser.role==="consulta") { c.innerHTML = renderConsulta(); }
  else if(page==="tickets")        { c.innerHTML = renderTickets(); }
  else if(page==="dashboard")      { c.innerHTML = renderDashboard(); }
  else if(page==="top-tiendas")    { c.innerHTML = renderTopTiendas(); }
  else if(page==="bottom-tiendas") { c.innerHTML = renderBottomTiendas(); }

  else                             { c.innerHTML = renderTiendas(); }
  bindEvents();
}

/* ══════════════ HELPERS ═════════════════════════ */
function getFiltered() {
  return tickets.filter(t=>{
    if(filt.anio   && t.anio    !== filt.anio)    return false;
    if(filt.mes    && t.mes    !== filt.mes)       return false;
    if(filt.tipo   && t.tipo   !== filt.tipo)      return false;
    if(filt.estatus&& t.estatus!== filt.estatus)   return false;
    if(filt.busq){
      const q=filt.busq.toLowerCase();
      if(!t.tienda?.toLowerCase().includes(q)&&!t.id?.toLowerCase().includes(q)&&!String(t.ceco||"").includes(q)) return false;
    }
    return true;
  });
}
function anios(){ return [...new Set(tickets.map(t=>t.anio).filter(Boolean))].sort().reverse(); }
function meses(base){ 
  const src = base || tickets;
  return [...new Set(src.map(t=>t.mes ? t.mes.charAt(0).toUpperCase()+t.mes.slice(1).toLowerCase() : "").filter(Boolean))]; 
}
function tipoClass(t){ return {TONER:"toner","UNIDAD DE IMAGEN":"unidad","KIT MANTENIMIENTO":"kit","FALLA IMPRESORA":"falla"}[t]||"toner"; }
function estatusClass(e){ return {ABIERTO:"abierto",PENDIENTE:"pendiente",CERRADO:"cerrado"}[e]||"cerrado"; }
function dias(t){ if(!t.solicitud||!t.entregado)return"—"; return Math.round((new Date(t.entregado)-new Date(t.solicitud))/86400000)+" d"; }
function svgIcon(name){
  const icons={
    plus:`<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
    edit:`<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
    trash:`<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
    inbox:`<svg viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>`,
    send:`<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`,
    truck:`<svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`,
    check:`<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`,
    mail:`<svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`,
  };
  return icons[name]||"";
}

/* ══════════════ CONFIRMACIÓN PROVEEDOR (cruce) ═══ */
function cargarConfirmacionProveedor(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const wb = XLSX.read(ev.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      procesarConfirmacionProveedor(rows, file.name);
    }catch(err){
      console.error(err);
      toast('No se pudo leer el archivo del proveedor.', true);
    }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
}

function buscarCampo(row, posibles){
  const keys = Object.keys(row);
  for(const p of posibles){
    const k = keys.find(k2=>k2.toLowerCase().trim()===p.toLowerCase());
    if(k) return row[k];
  }
  return '';
}

function procesarConfirmacionProveedor(rows, nombreArchivo){
  const entregados = rows.filter(r=>{
    const estatus = String(buscarCampo(r, ['ESTATUS','ESTADO'])||'').toUpperCase().trim();
    return estatus.startsWith('ENTREG');
  });

  const encontrados = [];
  const noEncontrados = [];
  entregados.forEach(r=>{
    const cc = buscarCampo(r, ['CC','CECO']);
    const location = buscarCampo(r, ['LOCATION NAME','TIENDA','LOCATION']);
    const guia = buscarCampo(r, ['GUIA','GUÍA']);
    const ticketRaw = String(buscarCampo(r, ['TICKET'])||'');
    const recibio = buscarCampo(r, ['RECIBIO','RECIBIÓ']);
    const fecha = buscarCampo(r, ['FECHA']);
    const ticketsProveedor = ticketRaw.split('/').map(s=>s.trim()).filter(Boolean);
    if(!ticketsProveedor.length) return;
    ticketsProveedor.forEach(numTicket=>{
      const interno = tickets.find(t=>t.id===numTicket);
      if(interno && interno.estatus!=='CERRADO'){
        encontrados.push({ id:numTicket, tienda: interno.tienda||location, ceco: interno.ceco||cc, guia, recibio, fecha, estatusActual: interno.estatus });
      } else if(!interno){
        noEncontrados.push({ id:numTicket, cc, location, guia, recibio, fecha, motivo:'No existe ese ticket en el sistema' });
      } else {
        noEncontrados.push({ id:numTicket, cc, location, guia, recibio, fecha, motivo:'Ya estaba Cerrado' });
      }
    });
  });

  mostrarModalCruceProveedor(encontrados, noEncontrados, nombreArchivo);
}

async function doSave() {
  const id_     = document.getElementById("m-id")?.value.trim();
  const tiendaHidden = document.getElementById("m-tienda")?.value.trim();
  const tiendaSearch = document.getElementById("m-tienda-search")?.value.trim();
  let tienda = tiendaHidden;
  if(!tienda && tiendaSearch) {
    const parts = tiendaSearch.split(' — ');
    tienda = parts.length > 1 ? parts.slice(1).join(' — ') : tiendaSearch;
  }
  if(!id_||!tienda){ toast("Ticket y tienda son obligatorios", true); return; }
  if(!editId && tickets.find(t=>t.id===id_)){ toast("Ya existe ese número de ticket", true); return; }

  const ceco   = document.getElementById("m-ceco")?.value.trim()||"";
  const tipo   = document.getElementById("m-tipo")?.value||"TONER";
  const mes    = document.getElementById("m-mes")?.value.trim()||"";
  const anio   = (document.getElementById("m-sol")?.value||"").slice(0,4);
  const solVal = document.getElementById("m-sol")?.value||"";

  // Función para comparar si dos tickets son de la misma tienda
  // Usa CECO si está disponible, sino compara por nombre de tienda
  function mismaTienda(t) {
    if(ceco && t.ceco) return t.ceco === ceco;
    return t.tienda.trim().toLowerCase() === tienda.trim().toLowerCase();
  }

  // ── REGLA 1: No duplicar mismo tipo en mismo mes para misma tienda ──
  if(!editId) {
    const duplicado = tickets.find(t =>
      mismaTienda(t) &&
      t.tipo === tipo &&
      t.mes  === mes  &&
      t.anio === anio &&
      t.estatus !== "RECHAZADO"
    );
    if(duplicado) {
      showAlertaDuplicado(
        duplicado,
        `⚠️ La tienda <strong>${tienda}</strong> ya tiene un ticket de <strong>${tipo}</strong> en <strong>${mes} ${anio}</strong>.`
      );
      return;
    }
  }

  // ── REGLA 2: Unidad de imagen — mínimo 2 meses entre solicitudes ──
  if(!editId && tipo === "UNIDAD DE IMAGEN" && solVal) {
    const solFecha = new Date(solVal);
    if(!isNaN(solFecha)) {
      const dosAtras = new Date(solFecha);
      dosAtras.setMonth(dosAtras.getMonth() - 2);
      const prevUnidad = tickets.find(t =>
        mismaTienda(t) &&
        t.tipo === "UNIDAD DE IMAGEN" &&
        t.solicitud &&
        new Date(t.solicitud) >= dosAtras &&
        new Date(t.solicitud) <= solFecha &&
        t.estatus !== "RECHAZADO"
      );
      if(prevUnidad) {
        const diasDesde = Math.round((solFecha - new Date(prevUnidad.solicitud)) / 86400000);
        showAlertaDuplicado(
          prevUnidad,
          `⚠️ La <strong>Unidad de Imagen</strong> tiene vigencia mínima de <strong>2 meses</strong>.<br>Esta tienda ya solicitó una hace <strong>${diasDesde} días</strong>.`
        );
        return;
      }
    }
  }

  const data = {
    id: id_, tienda, ceco,
    sku:    "60540-"+ceco,
    tipo,
    solicitud: document.getElementById("m-sol")?.value||"",
    entregado: document.getElementById("m-ent")?.value||"",
    mes, anio,
    estatus:document.getElementById("m-est")?.value||"ABIERTO",
    observaciones: document.getElementById("m-obs")?.value.trim()||"",
    falla:"", guia:"",
  };
  const ok = await saveTicket(data);
  if(ok){ toast(editId?"Ticket actualizado":"Ticket creado"); closeModal(); }
}

function renderDashboard() {
  const base = monthFilter(tickets);
  const porTipo = {}; TIPOS.forEach(t=>porTipo[t]=0);
  base.forEach(t=>{ if(porTipo[t.tipo]!==undefined) porTipo[t.tipo]++; });
  const maxT = Math.max(...Object.values(porTipo),1);
  const porMes = {}; tickets.forEach(t=>{ porMes[t.mes]=(porMes[t.mes]||0)+1; });
  const maxM = Math.max(...Object.values(porMes),1);
  const porTienda = {}; base.forEach(t=>{ porTienda[t.tienda]=(porTienda[t.tienda]||0)+1; });
  const top = Object.entries(porTienda).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxTi = top[0]?top[0][1]:1;
  const cerr = base.filter(t=>["CERRADO","ENTREGADO"].includes(t.estatus)).length;
  const activos = base.filter(t=>["ABIERTO","PENDIENTE"].includes(t.estatus)).length;

/* ══════════════ ADMIN — TIENDAS ═════════════════ */
function renderTiendas() {
  const map = {};
  tickets.forEach(t=>{
    if(!map[t.tienda]) map[t.tienda]={tienda:t.tienda,ceco:t.ceco,total:0,toner:0,unidad:0,kit:0,falla:0,resueltos:0};
    map[t.tienda].total++;
    if(t.tipo==="TONER")            map[t.tienda].toner++;
    if(t.tipo==="UNIDAD DE IMAGEN") map[t.tienda].unidad++;
    if(t.tipo==="KIT MANTENIMIENTO")map[t.tienda].kit++;
    if(t.tipo==="FALLA IMPRESORA")  map[t.tienda].falla++;
    if(["CERRADO","ENTREGADO"].includes(t.estatus)) map[t.tienda].resueltos++;

/* ══════════════ BIND EVENTS ════════════════════ */
function bindEvents() {
  const on = (id,ev,fn) => document.getElementById(id)?.addEventListener(ev,fn);
  on("f-busq","input",  e=>{ filt.busq=e.target.value; render(); });
  on("f-anio","change", e=>{ filt.anio=e.target.value; filt.mes=""; render(); });
  on("f-mes", "change", e=>{ filt.mes=e.target.value;  render(); });
  on("f-tipo","change", e=>{ filt.tipo=e.target.value; render(); });
  on("f-est", "change", e=>{ filt.estatus=e.target.value; render(); });
  on("d-mes", "change", e=>{ dashMes=e.target.value;   render(); });
  on("d-anio","change", e=>{ dashAnio=e.target.value; dashMes=""; render(); });
  on("btn-nuevo","click",()=> openModal(null));
  // Selectores rápidos de mes en la sección de métricas
  on("ms-anio","change", e=>{ metricsAnio=e.target.value; render(); });
  on("ms-mes", "change", e=>{ metricsMes=e.target.value;  render(); });
}

/* ══════════════ HELPERS TIENDAS ════════════════ */
function buildTiendaMap(base) {
  const map = {};
  base.forEach(t=>{
    if(!map[t.tienda]) map[t.tienda]={tienda:t.tienda,ceco:t.ceco,total:0,toner:0,unidad:0,kit:0,falla:0,resueltos:0};
    map[t.tienda].total++;
    if(t.tipo==="TONER"||t.tipo==="TONER Y UNIDAD") map[t.tienda].toner++;
    if(t.tipo==="UNIDAD DE IMAGEN"||t.tipo==="TONER Y UNIDAD") map[t.tienda].unidad++;
    if(t.tipo==="KIT MANTENIMIENTO") map[t.tienda].kit++;
    if(t.falla&&t.falla.trim()) map[t.tienda].falla++;
    if(["CERRADO","ENTREGADO"].includes(t.estatus)) map[t.tienda].resueltos++;
  });
  return Object.values(map);
}

function monthFilter(base) {
  let src = base || tickets;
  if(dashAnio) src = src.filter(t=>t.anio===dashAnio);
  if(dashMes)  src = src.filter(t=>t.mes===dashMes);
  return src;
}

function renderTiendasSelector(extra='') {
  const allAnios = anios();
  const allMeses = dashAnio ? [...new Set(tickets.filter(t=>t.anio===dashAnio).map(t=>t.mes).filter(Boolean))] : meses();
  return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px">
    <select id="d-anio" style="height:32px"><option value="">Todos los años</option>${allAnios.map(a=>`<option value="${a}"${dashAnio===a?" selected":""}>${a}</option>`).join("")}</select>
    <select id="d-mes" style="height:32px"><option value="">Todos los meses</option>${allMeses.map(m=>`<option value="${m}"${dashMes===m?" selected":""}>${m}</option>`).join("")}</select>
    ${extra}
  </div>`;
}

const PROVEEDOR_EMAILS = "ajuarez@cknew.com.mx;arodriguez@cknew.com.mx;efrias@cknew.com.mx;rmartinez@cknew.com.mx";

function enviarCorreo(id) {
  const t = tickets.find(x => x.id === id);
  if(!t) { toast("Ticket no encontrado", true); return; }
  const asunto = `${t.tipo} / ${t.tienda} / Ticket# ${t.id}`;
  const direccion = direccionParaCorreo(t.tienda, t.ceco);
  let cuerpo;
  if(t.tipo === "FALLA IMPRESORA") {
    cuerpo = `Equipo me ayudan con esta falla del equipo, por favor.\n\nUbicación: ${direccion}`;
  } else {
    cuerpo = `Equipo me ayudan con esta solicitud y me envían la guía, por favor.\n\nUbicación: ${direccion}`;
  }
  window.location.href = `mailto:${PROVEEDOR_EMAILS}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
}

// Versión interna de doSave que retorna true/false sin cerrar modal
async function doSaveInternal() {
  const id_     = document.getElementById("m-id")?.value.trim();
  const tiendaHidden = document.getElementById("m-tienda")?.value.trim();
  const tiendaSearch = document.getElementById("m-tienda-search")?.value.trim();
  let tienda = tiendaHidden;
  if(!tienda && tiendaSearch) {
    const parts = tiendaSearch.split(' — ');
    tienda = parts.length > 1 ? parts.slice(1).join(' — ') : tiendaSearch;
  }
  if(!id_||!tienda){ toast("Ticket y tienda son obligatorios", true); return false; }
  if(!editId && tickets.find(t=>t.id===id_)){ toast("Ya existe ese número de ticket", true); return false; }
  const ceco   = document.getElementById("m-ceco")?.value.trim()||"";
  const tipo   = document.getElementById("m-tipo")?.value||"TONER";
  const mes    = document.getElementById("m-mes")?.value.trim()||"";
  const anio   = (document.getElementById("m-sol")?.value||"").slice(0,4);
  const solVal = document.getElementById("m-sol")?.value||"";
  function mismaTienda(t) {
    if(ceco && t.ceco) return t.ceco === ceco;
    return t.tienda.trim().toLowerCase() === tienda.trim().toLowerCase();
  }
  if(!editId) {
    const duplicado = tickets.find(t => mismaTienda(t) && t.tipo===tipo && t.mes===mes && t.anio===anio && t.estatus!=="RECHAZADO");
    if(duplicado) { showAlertaDuplicado(duplicado, `⚠️ La tienda <strong>${tienda}</strong> ya tiene un ticket de <strong>${tipo}</strong> en <strong>${mes} ${anio}</strong>.`); return false; }
  }
  if(!editId && tipo==="UNIDAD DE IMAGEN" && solVal) {
    const solFecha = new Date(solVal);
    if(!isNaN(solFecha)) {
      const dosAtras = new Date(solFecha); dosAtras.setMonth(dosAtras.getMonth()-2);
      const prevUnidad = tickets.find(t => mismaTienda(t) && t.tipo==="UNIDAD DE IMAGEN" && t.solicitud && new Date(t.solicitud)>=dosAtras && new Date(t.solicitud)<=solFecha && t.estatus!=="RECHAZADO");
      if(prevUnidad) { const d=Math.round((solFecha-new Date(prevUnidad.solicitud))/86400000); showAlertaDuplicado(prevUnidad, `⚠️ La <strong>Unidad de Imagen</strong> tiene vigencia mínima de <strong>2 meses</strong>.<br>Esta tienda ya solicitó una hace <strong>${d} días</strong>.`); return false; }
    }
  }
  const data = { id:id_, tienda, ceco, sku:"60540-"+ceco, tipo, solicitud:solVal, entregado:document.getElementById("m-ent")?.value||"", mes, anio, estatus:document.getElementById("m-est")?.value||"ABIERTO", observaciones:document.getElementById("m-obs")?.value.trim()||"", falla:"", guia:"" };
  const ok = await saveTicket(data);
  if(ok) toast(editId?"Ticket actualizado":"Ticket creado");
  return ok;
}

function autoMes(fechaStr) {
  if(!fechaStr) return;
  const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const d = new Date(fechaStr + 'T12:00:00');

  if(mesEl) mesEl.value = MESES[d.getMonth()];
}

/* ══════════════ CATÁLOGO TIENDAS ════════════════ */
let CATALOGO = [];
// Direcciones en vivo desde Directorio (agosto 2026) — por nombre de tienda (normalizado en
// mayúsculas), a partir de TODAS las tiendas (activas E inactivas: una tienda inactiva puede
// seguir teniendo tickets de consumibles abiertos ya reportados). Reemplaza la dependencia del
// objeto DIRECCIONES fijo (por CECO, cargado a mano y desincronizado — ver enviarCorreo()/
// doSaveAndEmail()) — ese se deja solo como respaldo si Directorio no trae dirección para esa
// tienda. Mismo tipo de arreglo que ya se hizo en Dashboard IT con "catalogoVivo" (ver el
// documento de referencia del proyecto, sección 3.13).
let DIRECCIONES_VIVO = {};
// Catálogo de tiendas — ya no es una lista fija: se lee en vivo de la colección `tiendas`
// del Directorio (mismo Firebase), igual que ya hace Dashboard. Así, dar de alta una tienda
// nueva en Directorio se refleja aquí sin tener que editar el código.
async function cargarCatalogoTiendasVivo() {
  if(!db) return;
  try{
    const snap = await db.collection('tiendas').get();
    const todas = snap.docs.map(d => d.data());
    CATALOGO = todas
      .filter(t => String(t.activo) === '1')
      .map(t => ({ ceco: String(t.cc || ''), nombre: t.plaza || '' }))
      .filter(t => t.ceco && t.nombre);
    DIRECCIONES_VIVO = {};
    todas.forEach(t=>{
      if(t.plaza && t.direccion) DIRECCIONES_VIVO[String(t.plaza).trim().toUpperCase()] = t.direccion;
    });
    initTiendaAC();
  }catch(err){
    console.error('No se pudo cargar el catálogo de tiendas desde Directorio', err);
  }
}
// Dirección para el correo al proveedor — primero busca en vivo por nombre de tienda (Directorio,
// siempre actualizado); si esa tienda no tiene dirección capturada ahí, cae al mapa fijo DIRECCIONES
// por CECO (ver arriba); si tampoco, deja el texto de "favor de completar".
function direccionParaCorreo(tienda, ceco){
  const viva = tienda ? DIRECCIONES_VIVO[String(tienda).trim().toUpperCase()] : null;
  return viva || DIRECCIONES[ceco] || "(favor de completar dirección del PDV)";
}

function initTiendaAC() {
  const searchEl = document.getElementById('m-tienda-search');
  const hiddenEl = document.getElementById('m-tienda');
  const cecoEl   = document.getElementById('m-ceco');
  const skuEl    = document.getElementById('m-sku');
  const dl       = document.getElementById('tienda-list');
  if(!searchEl || !dl) return;

  // Llenar datalist con todas las tiendas
  dl.innerHTML = CATALOGO.map(t =>
    `<option value="${t.ceco} — ${t.nombre}" data-ceco="${t.ceco}" data-nombre="${t.nombre}">`
  ).join('');

  // Cuando el usuario escribe o selecciona
  searchEl.addEventListener('input', () => {
    const val = searchEl.value;
    // Buscar si coincide exactamente con alguna opción del datalist
    const match = CATALOGO.find(t =>
      val === t.ceco + ' — ' + t.nombre || val === t.ceco || val === t.nombre
    );
    if(match) {
      if(hiddenEl) hiddenEl.value = match.nombre;
      if(cecoEl)   cecoEl.value  = match.ceco;
      if(skuEl)    skuEl.value   = '60540-' + match.ceco;
    }
  });

  // También detectar cuando pierde el foco para limpiar si no hay match
  searchEl.addEventListener('blur', () => {
    const val = searchEl.value.trim();
    const match = CATALOGO.find(t =>
      val === t.ceco + ' — ' + t.nombre || val === t.ceco || val === t.nombre
    );
    if(!match && val) {
      // Buscar coincidencia parcial por CECO numérico
      const byCeco = CATALOGO.find(t => val === t.ceco);
      if(byCeco) {
        searchEl.value = byCeco.ceco + ' — ' + byCeco.nombre;
        if(hiddenEl) hiddenEl.value = byCeco.nombre;
        if(cecoEl)   cecoEl.value  = byCeco.ceco;
        if(skuEl)    skuEl.value   = '60540-' + byCeco.ceco;
      }
    }
  });
}

/* ══════════════ VER PENDIENTES (agosto 2026) ════════════════════
   Cruce por número de Ticket exacto contra lo que Dashboard IT guardó en
   validacion_consumibles/pendientes (mismo proyecto de Firebase) al procesar el reporte
   general de tickets — solo trae los que ya están Abiertos ahí desde julio 2026. Aquí
   solo falta ver cuáles de esos números NO existen ya como documento en `tickets`
   (el arreglo `tickets` ya se mantiene vivo con onSnapshot, no hace falta leerlo de nuevo). */
function fmtFechaValidacion(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  const pad = n => String(n).padStart(2,"0");
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function abrirVerPendientes(){
  const ov = document.createElement("div");
  ov.className = "modal-overlay";
  ov.id = "pendientes-overlay";
  ov.onclick = e => { if(e.target===ov) ov.remove(); };
  ov.innerHTML = `
<div class="modal" onclick="event.stopPropagation()">
  <div class="modal-hdr">
    <h3>Tickets abiertos pendientes de dar de alta</h3>
    <button class="btn sm" onclick="document.getElementById('pendientes-overlay').remove()">&times;</button>
  </div>
  <div class="modal-body" id="pendientes-body">
    <p style="font-size:13px;color:var(--text2)">Comparando contra el último reporte subido en Dashboard IT...</p>
  </div>
</div>`;
  document.body.appendChild(ov);

  if(!db){
    document.getElementById("pendientes-body").innerHTML = `<p style="font-size:13px;color:var(--text2)">Firebase no está configurado en este modo de demostración.</p>`;
    return;
  }
  try{
    const snap = await db.collection("validacion_consumibles").doc("pendientes").get();
    const body = document.getElementById("pendientes-body");
    if(!body) return; // el usuario ya cerró el modal mientras cargaba
    if(!snap.exists){
      body.innerHTML = `<p style="font-size:13px;color:var(--text2)">Todavía no se ha subido ningún reporte de tickets desde Dashboard IT (Resumen 2026).</p>`;
      return;
    }
    const data = snap.data();
    const idsExistentes = new Set(tickets.map(t=>String(t.id)));
    pendientesActuales = (data.tickets||[]).filter(p=>!idsExistentes.has(String(p.ticket)));
    if(pendientesActuales.length===0){
      body.innerHTML = `
        <p style="font-size:12px;color:var(--text3);margin-bottom:10px;">Comparado contra "${data.archivo||"—"}" (actualizado ${fmtFechaValidacion(data.actualizado)}).</p>
        <p style="font-size:13px;color:var(--green-text);">Todos los tickets abiertos del reporte ya están capturados en Consumibles.</p>`;
      return;
    }
    body.innerHTML = `
      <p style="font-size:12px;color:var(--text3);margin-bottom:10px;">Comparado contra "${data.archivo||"—"}" (actualizado ${fmtFechaValidacion(data.actualizado)}) · ${pendientesActuales.length} ticket(s) abierto(s) sin capturar en Consumibles.</p>
      <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:12px;">
        <thead><tr style="text-align:left;color:var(--text3);border-bottom:1px solid var(--border2)">
          <th style="padding:6px 8px;">Ticket</th><th style="padding:6px 8px;">Tienda</th><th style="padding:6px 8px;">Tipo</th><th style="padding:6px 8px;">Fecha</th><th style="padding:6px 8px;"></th>
        </tr></thead>
        <tbody>${pendientesActuales.map((p,i)=>`
          <tr style="border-bottom:1px solid var(--border2)">
            <td style="padding:6px 8px;font-weight:600">${p.ticket}</td>
            <td style="padding:6px 8px;">${p.tienda}</td>
            <td style="padding:6px 8px;">${p.tipo}</td>
            <td style="padding:6px 8px;">${fmtFechaValidacion(p.fecha)}</td>
            <td style="padding:6px 8px;"><button class="btn sm" onclick="darDeAltaPendiente(${i})">Dar de alta</button></td>
          </tr>`).join("")}
        </tbody>
      </table>
      </div>`;
  }catch(err){
    console.error(err);
    const body = document.getElementById("pendientes-body");
    if(body) body.innerHTML = `<p style="font-size:13px;color:var(--warn)">No se pudo leer la validación. Revisa la consola (F12).</p>`;
  }
}

function darDeAltaPendiente(i){
  const p = pendientesActuales[i];
  if(!p) return;
  prefillNuevoTicket = p;
  const overlay = document.getElementById("pendientes-overlay");
  if(overlay) overlay.remove();
  openModal(null);
}
