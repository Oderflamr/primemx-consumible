        ${card('Starlink',sl,sv.Starlink,sl)}
      </div>
      <div class="panel">
        <div class="editbar">${editing
          ? `<button id="btnCancel">Cancelar</button><button class="primary" id="btnSave">Guardar cambios</button>`
          : (canEdit ? `<button id="btnEdit">Editar datos del mes</button>` : '')}</div>
      </div>
      <div class="panel">
        <h3>Caídas por mes y proveedor</h3>
        <canvas id="chartTendencia"></canvas>
      </div>
      ${editing ? editorTendencia() : ''}
    `;
    if(editing) wireTendenciaEditor(); else if(canEdit) document.getElementById('btnEdit').onclick=()=>{editing=true;render();};
    const hasta = idxMes(state.periodo_actual);
    const labels = MESES.slice(0,hasta+1);
    if(charts.tendencia) charts.tendencia.destroy();
    charts.tendencia = new Chart(document.getElementById('chartTendencia'), {
      type:'line',
      data:{ labels, datasets:[
        { label:'TotalPlay', data:state.tendencia.data.TotalPlay.slice(0,hasta+1), borderColor:COLOR.TotalPlay, backgroundColor:COLOR.TotalPlay, tension:.25, pointRadius:4, borderWidth:2.5 },
        { label:'Telmex', data:state.tendencia.data.Telmex.slice(0,hasta+1), borderColor:COLOR.Telmex, backgroundColor:COLOR.Telmex, tension:.25, pointRadius:4, borderWidth:2.5 },
        { label:'Metrocarrier', data:state.tendencia.data.Metrocarrier.slice(0,hasta+1), borderColor:COLOR.Metrocarrier, backgroundColor:COLOR.Metrocarrier, tension:.25, pointRadius:4, borderWidth:2.5 }
      ]},
      options:{responsive:true, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true}}}
    });
  }
  function editorTendencia(){
    const provs=['TotalPlay','Telmex','Metrocarrier'];
    const rows = provs.map(p=>`<tr><td>${p}</td>${MESES.map((m,i)=>`<td><input type="number" min="0" data-prov="${p}" data-idx="${i}" value="${state.tendencia.data[p][i]}"></td>`).join('')}</tr>`).join('');
    return `<div class="panel"><h3>Editar caídas por mes</h3>
      <div style="overflow-x:auto;"><table><thead><tr><th>Proveedor</th>${MESES.map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
      <h3 style="margin-top:16px;">Periodo actual</h3>
      <select id="selPeriodo">${MESES.map(m=>`<option value="${m}" ${m===state.periodo_actual?'selected':''}>${m}</option>`).join('')}</select>
      <h3 style="margin-top:16px;">Starlink (acumulado, sin desglose mensual)</h3>
      <div class="servicios-grid" style="grid-template-columns:repeat(2,1fr);">
        <div class="sv-field"><label>Starlink — Caídas</label><input type="number" min="0" id="slExtra" value="${state.tendencia.caidas_extra.Starlink}"></div>
      </div>
      <div class="foot">Megacable ya no se captura a mano — usa el mismo dato calculado que Metrocarrier (categoría "Metro Carrier" de los tickets), son el mismo proveedor.</div>
      <h3 style="margin-top:16px;">Servicios activos por proveedor</h3>
      <div class="servicios-grid">${['TotalPlay','Telmex','Megacable','Starlink'].map(p=>`
        <div class="sv-field"><label>${p}</label><input type="number" min="0" data-svc="${p}" value="${state.tendencia.servicios[p]}"></div>`).join('')}</div>
    </div>`;
  }
  function wireTendenciaEditor(){
    document.getElementById('btnCancel').onclick=()=>{editing=false;render();};
    document.getElementById('btnSave').onclick=()=>{
      document.querySelectorAll('input[data-prov]').forEach(i=>{ state.tendencia.data[i.dataset.prov][Number(i.dataset.idx)] = Number(i.value||0); });
      document.querySelectorAll('input[data-svc]').forEach(i=>{ state.tendencia.servicios[i.dataset.svc] = Number(i.value||0); });
      state.tendencia.caidas_extra.Starlink = Number(document.getElementById('slExtra').value||0);
      const sel = document.getElementById('selPeriodo'); if(sel) state.periodo_actual = sel.value;
      descripcionActualizacion = 'Edición manual — Tendencia mensual';
      save();
    };
  }

  // ---------- YoY (TotalPlay / Telmex) ----------
  function renderYoy(c, prov){
    const hasta = idxMes(state.periodo_actual);
    const serie2026 = state.tendencia.data[prov];
    const serie2025 = state.yoy_2025[prov];
    const cum2026 = cumulativo(prov);
    const notas = state.yoy_notas[prov] || (state.yoy_notas[prov] = []);
    c.innerHTML = `
      <div class="title">Caídas ${prov} — comparativo 2025 vs 2026</div>
      <div class="subtitle">Barras por mes, acumulado por año</div>
      <div class="cards" style="grid-template-columns:repeat(2,1fr);">
        <div class="card"><div class="head" style="background:${CARD_COLOR[prov]}">Año ${state.anio}</div>
          <div class="body"><div class="big">${cum2026}</div><div class="lbl">Caídas acumuladas (a ${state.periodo_actual})</div></div></div>
        <div class="card"><div class="head" style="background:${COLOR_2025[prov]||'#B39DDB'}">Año ${state.anio-1}</div>
          <div class="body"><div class="big">${serie2025.reduce((a,b)=>a+Number(b||0),0)}</div><div class="lbl">Caídas acumuladas (año completo)</div></div></div>
      </div>
      <div class="panel">
        <div class="editbar">${editing
          ? `<button id="btnCancel">Cancelar</button><button class="primary" id="btnSave">Guardar cambios</button>`
          : (canEdit ? `<button id="btnEdit">Editar ${state.anio-1} y notas</button>` : '')}</div>
        <h3>Comparativo mensual</h3>
        <canvas id="chartYoy"></canvas>
        ${notas.length ? `
        <div style="margin-top:14px; display:flex; flex-wrap:wrap; gap:8px;">
          ${notas.map((n,i)=>`
            <div style="font-size:12px; padding:6px 10px; border-radius:8px; background:${n.anio===state.anio-1?'#EDE7F6':'#F3E5F5'}; border:1px solid ${n.anio===state.anio-1?(COLOR_2025[prov]||'#B39DDB'):CARD_COLOR[prov]}; display:flex; align-items:center; gap:6px;">
              🚩 <b>${n.mes} ${n.anio}:</b> ${n.nota}
              ${editing ? `<button data-yoy-nota-remove="${i}" style="padding:1px 6px; margin-left:4px;">✕</button>` : ''}
            </div>`).join('')}
        </div>` : (editing ? '' : `<div class="foot" style="margin-top:10px;">Sin anotaciones en este comparativo todavía.</div>`)}
        ${editing ? `
        <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line);">
          <h3 style="margin-bottom:8px;">Agregar anotación</h3>
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <select id="notaMes">${MESES.map(m=>`<option value="${m}">${m}</option>`).join('')}</select>
            <select id="notaAnio"><option value="${state.anio-1}">${state.anio-1}</option><option value="${state.anio}">${state.anio}</option></select>
            <input type="text" id="notaTexto" placeholder="Ej. Migración de servicios" style="flex:1; min-width:220px; padding:6px 10px; border:1px solid var(--line); border-radius:6px;">
            <button id="btnAddNota">Agregar</button>
          </div>
        </div>` : ''}
      </div>
      ${editing ? `<div class="panel"><h3>Caídas ${prov} — año ${state.anio-1}</h3>
        <div style="overflow-x:auto;"><table><thead><tr>${MESES.map(m=>`<th>${m}</th>`).join('')}</tr></thead>
        <tbody><tr>${MESES.map((m,i)=>`<td><input type="number" min="0" data-yoy-idx="${i}" value="${serie2025[i]}"></td>`).join('')}</tr></tbody></table></div>
        <div class="foot">El año ${state.anio} se toma de la pestaña "Tendencia mensual" — no se edita aquí, para que ambos siempre coincidan.</div>
      </div>` : ''}
    `;
    if(editing){
      document.getElementById('btnCancel').onclick=()=>{editing=false;render();};
      document.getElementById('btnSave').onclick=()=>{
        document.querySelectorAll('input[data-yoy-idx]').forEach(i=>{ state.yoy_2025[prov][Number(i.dataset.yoyIdx)] = Number(i.value||0); });
        descripcionActualizacion = `Edición manual — YoY ${prov}`;
        save();
      };
      document.querySelectorAll('[data-yoy-nota-remove]').forEach(btn=>{
        btn.onclick = ()=>{ notas.splice(Number(btn.dataset.yoyNotaRemove),1); render(); };
      });
      const btnAdd = document.getElementById('btnAddNota');
      if(btnAdd) btnAdd.onclick = ()=>{
        const mes = document.getElementById('notaMes').value;
        const anio = Number(document.getElementById('notaAnio').value);
        const texto = document.getElementById('notaTexto').value.trim();
        if(!texto) return;
        notas.push({anio, mes, nota:texto});
        render();
      };
    } else {
      if(canEdit) document.getElementById('btnEdit').onclick=()=>{editing=true;render();};
    }
    // Plugin de dibujo: pone una bandera roja arriba de la barra que tenga una nota para ese mes/año
    const banderaPlugin = {
      id:'banderasYoy',
      afterDatasetsDraw(chart){
        try{
          const ctx = chart.ctx;
          ctx.save();
          ctx.font = '14px sans-serif';
          ctx.textAlign = 'center';
          [state.anio-1, state.anio].forEach((anio,dsIdx)=>{
            const meta = chart.getDatasetMeta(dsIdx);
            if(!meta || !meta.data) return;
            MESES.forEach((mes,i)=>{
              const tieneNota = notas.some(n=>n.anio===anio && n.mes===mes);
              if(!tieneNota) return;
              const el = meta.data[i];
              if(!el) return;
              ctx.fillText('🚩', el.x, el.y - 8);
            });
          });
          ctx.restore();
        }catch(e){ /* no bloquear el render de la gráfica por un error de dibujo */ }
      }
    };
    charts.yoy = new Chart(document.getElementById('chartYoy'), {
      type:'bar',
      data:{ labels:MESES, datasets:[
        {label:String(state.anio-1), data:serie2025, backgroundColor:COLOR_2025[prov]||'#CBB6E8'},
        {label:String(state.anio), data:MESES.map((m,i)=> i<=hasta ? serie2026[i] : 0), backgroundColor:CARD_COLOR[prov]}
      ]},
      options:{responsive:true, plugins:{legend:{position:'bottom'}, tooltip:{ callbacks:{
        afterLabel(ctx){
          const anio = ctx.datasetIndex===0 ? state.anio-1 : state.anio;
          const mes = MESES[ctx.dataIndex];
          const n = notas.find(x=>x.anio===anio && x.mes===mes);
          return n ? '🚩 ' + n.nota : '';
        }
      }}}, scales:{y:{beginAtZero:true}}},
      plugins:[banderaPlugin]
    });
  }

  // ---------- Resumen 2026 ----------
  function renderResumen(c){
    const tp=cumulativo('TotalPlay'), tm=cumulativo('Telmex'), mg=cumulativo('Metrocarrier');
    const sl=Number(state.tendencia.caidas_extra.Starlink||0);
    const total = tp+tm+mg+sl;
    const r = state.resumen;
    const TIENDAS_CATALOGO = { TotalPlay:478, Telmex:138, Megacable:5 }; // total de tiendas por carrier (catálogo)
    function autoPeer(prov, caidas){
      const totalTiendas = TIENDAS_CATALOGO[prov];
      if(!totalTiendas) return r.peer[prov]; // Starlink: no viene del catálogo de tickets, se queda con el valor guardado
      return Math.round((caidas / totalTiendas) * 100) / 100;
    }
    function autoAtn(prov){
      const clave = prov==='Megacable' ? 'Metrocarrier' : prov;
      if(prov==='Starlink' || !state.atencion[clave]) return r.atn[prov];
      return state.atencion[clave].avg + ' hrs';
    }
    function card(prov,caidas){
      const peerVal = autoPeer(prov,caidas);
      const atnVal = autoAtn(prov);
      return `<div class="card"><div class="head" style="background:${CARD_COLOR[prov]}">${prov}</div>
        <div class="body">
          <div class="big" style="font-size:22px">${caidas}</div><div class="lbl">Caídas · ${fmtPct(caidas,total)} del total</div>
          <div class="rule"></div>
          <div style="font-size:12px;color:var(--sub)">Peer: <b style="color:var(--ink)">${peerVal}</b> &nbsp;·&nbsp; Atn: <b style="color:var(--ink)">${atnVal}</b></div>
        </div></div>`;
    }
    const sem = r.semana_actual;
    const textoSemana = (sem && sem.numero)
      ? `Semana ${sem.numero} (${fmtFechaCorta(sem.inicio)} – ${fmtFechaCorta(sem.fin)}): <b>${sem.caidas}</b> caídas`
      : 'Carga un archivo de tickets para ver la semana en curso.';
    c.innerHTML = `
      ${canEdit ? `
      <div class="uploadbar">
        <div class="txt">
          <b>Cargar reporte de tickets (.xlsx, año completo)</b> — recalcula Tendencia, Atención y Top 15 (TotalPlay/Telmex/Metrocarrier) a partir de las categorías "Internet y telefonia".
          ${state.carga.archivo ? `<div class="upload-summary">Último archivo: ${state.carga.archivo} · ${state.carga.tickets_caidas} tickets de caídas procesados · ${fmtFecha(state.carga.fecha)}</div>` : ''}
          <div id="uploadError"></div>
        </div>
        <input type="file" id="fileTickets" accept=".xlsx,.xls" style="display:none">
        <button class="upload" id="btnUpload">Cargar archivo</button>
      </div>` : ''}
      ${cargaPendiente ? `
      <div class="panel" style="border-color:var(--tm);">
        <h3 style="color:var(--tm);">Confirmar carga · ${cargaPendiente.fileName}</h3>
        <div style="font-size:13px; line-height:1.8;">
          Tickets de caídas identificados: <b>${cargaPendiente.resumen.totalCaidas}</b> (Ene–${cargaPendiente.periodo_actual})<br>
          Tiendas con caídas — TotalPlay: <b>${cargaPendiente.resumen.tiendasTP}</b> (${cargaPendiente.resumen.criticasTP} críticas) ·
          Telmex: <b>${cargaPendiente.resumen.tiendasTM}</b> (${cargaPendiente.resumen.criticasTM} críticas)
        </div>
        <div class="foot">Esto reemplaza Tendencia mensual, Atención y Top 15 (TotalPlay/Telmex/Metrocarrier). Peer y Atn se recalculan solos; Megacable/Starlink no se tocan.</div>
        <div class="editbar" style="margin-top:10px;">
          <button id="btnCancelCarga">Cancelar</button>
          <button class="primary" id="btnAplicarCarga">Aplicar datos</button>
        </div>
      </div>` : ''}
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;">
        <div>
          <div class="title" style="margin-bottom:2px;">Total de caídas ${state.anio}</div>
          <div class="subtitle">${textoSemana}</div>
        </div>
        <div class="panel" style="text-align:center; padding:14px 26px; margin:0;">
          <div style="font-size:24px; font-weight:800;">${total}</div>
          <div class="foot" style="margin-top:2px;">total caídas ${state.anio}</div>
        </div>
      </div>
      <div class="cards" style="margin-top:16px;">${card('TotalPlay',tp)}${card('Telmex',tm)}${card('Megacable',mg)}${card('Starlink',sl)}</div>
      <div class="panel">
        <h3>Caídas por proveedor</h3>
        <canvas id="chartResumen"></canvas>
      </div>
      <div class="foot" style="margin-top:6px;">Peer = caídas ÷ tiendas del catálogo, redondeado a 2 decimales. Atn = mismo promedio que aparece en "ETR". Starlink sigue siendo manual (no viene del archivo de tickets).</div>
    `;
    if(canEdit){
      document.getElementById('btnUpload').onclick = () => document.getElementById('fileTickets').click();
      document.getElementById('fileTickets').onchange = handleFileUpload;
      if(cargaPendiente){
        document.getElementById('btnCancelCarga').onclick = ()=>{ cargaPendiente = null; render(); };
        document.getElementById('btnAplicarCarga').onclick = ()=>{ aplicarDatosTickets(cargaPendiente); };
      }
    }
    charts.resumen = new Chart(document.getElementById('chartResumen'), {
      type:'bar',
      data:{ labels:['TotalPlay','Telmex','Megacable','Starlink'], datasets:[{ data:[tp,tm,mg,sl],
        backgroundColor:[CARD_COLOR.TotalPlay,CARD_COLOR.Telmex,CARD_COLOR.Megacable,CARD_COLOR.Starlink] }] },
      options:{responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}
    });
  }

  // ---------- Atencion ----------
  function renderAtencion(c){
    const a = state.atencion;
    const provs = ['TotalPlay','Telmex','Metrocarrier'];
    const dLabels = ['<4h','4-12h','12-24h','1-3d','>3d'];

        save();
      };
    } else {
      if(canEdit) document.getElementById('btnEdit').onclick=()=>{editing=true;render();};

  }
  function editorAtencion(p){

  // ---------- Top 15 tiendas ----------
  function renderVelocidadTrend(prov){
    const hasta = idxMes(state.periodo_actual);
    const mesesCortos = MESES.slice(0,hasta+1);
    const key = prov==='TotalPlay' ? 'top_velocidad_totalplay' : 'top_velocidad_telmex';
    const filas = state[key] || [];
    const totalServicios = filas.length;
    const totalTickets = filas.reduce((s,r)=>s+r.meses.reduce((a,b)=>a+Number(b||0),0),0);
    const withTotals = filas.map(r=>{
        const cat = buscarCatalogo(r.nombre);
        const carrier = cat.carrier !== '—' ? cat.carrier : r.carrier;
        const tecnologia = cat.tecnologia !== '—' ? cat.tecnologia : r.tecnologia;
        return {...r, carrier, tecnologia, total:r.meses.reduce((a,b)=>a+Number(b||0),0)};
      })
      .sort((a,b)=>b.total-a.total).slice(0,15);
    return `
      <div class="panel">
        <h3 style="margin-bottom:2px;">Problemas con velocidad — ${prov} (no cuenta como caída)</h3>
        <div class="foot" style="margin-bottom:10px;">Tendencia informativa aparte: estos tickets ya no se suman a "caídas", pero se siguen monitoreando por si conviene actuar.</div>
        <div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr)); margin-bottom:16px;">
          <div class="card"><div class="head" style="background:var(--sub)">Servicios afectados</div>
            <div class="body"><div class="big">${totalServicios}</div><div class="lbl">tiendas con al menos 1 ticket de velocidad</div></div></div>
          <div class="card"><div class="head" style="background:var(--sub)">Tickets de velocidad</div>
            <div class="body"><div class="big">${totalTickets}</div><div class="lbl">Ene-${state.periodo_actual} ${state.anio}</div></div></div>
        </div>
        ${filas.length===0 ? `<div class="foot">No hay tickets de "Problemas con velocidad" para ${prov} en el periodo cargado.</div>` : `
        <div style="overflow-x:auto;"><table>
          <thead><tr><th>#</th><th>Tienda</th><th>Carrier</th><th>Tecnología</th>${mesesCortos.map(m=>`<th>${m.slice(0,3)}</th>`).join('')}<th>Total</th><th>Estatus</th></tr></thead>

  function filasMigracion(lista, hasta){
    return lista.map(nombre=>{
      const enTop = state.top_totalplay.find(r=>r.nombre===nombre);
      const meses = enTop ? enTop.meses : new Array(hasta+1).fill(0);
      const total = meses.reduce((a,b)=>a+Number(b||0),0);
      const cat = buscarCatalogo(nombre);
      const carrier = cat.carrier !== '—' ? cat.carrier : (enTop?.carrier || cat.carrier);
      const tecnologia = cat.tecnologia !== '—' ? cat.tecnologia : (enTop?.tecnologia || cat.tecnologia);
      return { nombre, carrier, tecnologia, meses, total };
    });
  }
  // Columna "Motivo" (agosto 2026): a petición del cliente, después de la columna de migración
  // (Cambio a Megacable / Migración) — por ahora el motivo es fijo para todas las filas de ambas tablas.

  function computeWin11(){
    const REGIONES_WIN11 = ['Bajio','Centro I','Centro II','Noroeste I','Noroeste II','Norte I','Norte II','Pacifico','Sur Peninsula'];
    const equipos = state.win11_equipos || [];
    const porRegion = REGIONES_WIN11.map(reg=>{
      const key = reg.toUpperCase();
      const rows = equipos.filter(e=> String(e.region||'').trim().toUpperCase()===key);
      const win11 = rows.filter(e=>e.tipo_so==='win11').length;
      const win10 = rows.filter(e=>e.tipo_so==='win10').length;
      const nocompat = rows.filter(e=>e.tipo_so==='nocompat').length;
      const total = win11+win10+nocompat;
      const pendientes = win10+nocompat;
      return {region:reg, win11, win10, nocompat, total, pendientes, avance: total ? win11/total*100 : 0};
    });
    const totalEquipos = porRegion.reduce((s,r)=>s+r.total,0);
    const totalWin11 = porRegion.reduce((s,r)=>s+r.win11,0);
    const totalWin10 = porRegion.reduce((s,r)=>s+r.win10,0);
    const totalNocompat = porRegion.reduce((s,r)=>s+r.nocompat,0);
    const totalPendientes = totalWin10+totalNocompat;
    const avanceGlobal = totalEquipos ? totalWin11/totalEquipos*100 : 0;
    const desktops = equipos.filter(e=>e.chasis==='desktop');
    const laptops = equipos.filter(e=>e.chasis==='laptop');
    const avanceDesktop = desktops.length ? desktops.filter(e=>e.tipo_so==='win11').length/desktops.length*100 : 0;
    const avanceLaptop = laptops.length ? laptops.filter(e=>e.tipo_so==='win11').length/laptops.length*100 : 0;
    return {porRegion, totalEquipos, totalWin11, totalWin10, totalNocompat, totalPendientes, avanceGlobal,
      desktops: desktops.length, laptops: laptops.length, avanceDesktop, avanceLaptop};
  }

  function handleFileUploadWin11(e){
    const file = e.target.files[0];
    if(!file) return;
    const errBox = document.getElementById('uploadErrorWin11');
    errBox.innerHTML = '';
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        function detectarChasis(row){
          const chasisCol = String(row['Tipo de chasis']||'').trim().toLowerCase();
          if(chasisCol) return chasisCol.includes('lap') ? 'laptop' : 'desktop';
          const nombre = String(row['Nombre']||'').toUpperCase();
          if(nombre.startsWith('CMB-')) return 'laptop';
          if(nombre.includes('LAP')) return 'laptop';
          if(nombre.includes('PC')) return 'desktop';
          return 'desktop';
        }
        // "Sistema_Operativo F" es la columna normalizada (distingue "No es compatible Windows 11" y
        // "Retirado de operación"); "Sistema Operativo" es el respaldo si esa viene vacía.
        function detectarTipoSO(row){
          const sof = String(row['Sistema_Operativo F  '] || row['Sistema_Operativo F'] || '').trim();
          const so = String(row['Sistema Operativo'] || '').trim();
          const val = sof || so;
          const low = val.toLowerCase();
          if(low.includes('retirado')) return 'retirado';
          if(low.includes('no es compatible') || low.includes('no compatible')) return 'nocompat';
          if(low.includes('windows 10')) return 'win10';
          if(low.includes('windows 11')) return 'win11';
          return 'otro';
        }
        const nuevos = rows.map(row=>({
          pdv: String(row['Nombre_PDV']||'').trim(),
          region: String(row['Region']||'').trim(),
          chasis: detectarChasis(row),
          tipo_so: detectarTipoSO(row)
        })).filter(r=>r.pdv && (r.tipo_so==='win10' || r.tipo_so==='nocompat' || r.tipo_so==='win11'));
        if(!nuevos.length){ throw new Error('No se encontraron filas con "Nombre_PDV" y un Sistema Operativo reconocible en el archivo.'); }
        state.win11_equipos = nuevos;
        if(!state.win11_pendientes_historial) state.win11_pendientes_historial = [];
        state.win11_pendientes_historial.unshift({
          fecha: new Date().toISOString(),
          usuario: (typeof currentUser!=='undefined' && currentUser) ? currentUser.username : 'desconocido',
          archivo: file.name,
          total: nuevos.length
        });
        if(state.win11_pendientes_historial.length > 30) state.win11_pendientes_historial.length = 30;
        descripcionActualizacion = `Carga de Excel — Migración Win11 (${file.name})`;
        save();
      }catch(err){
        console.error(err);
        errBox.innerHTML = `<div style="color:var(--warn); font-size:12px; margin-top:6px;">No se pudo leer el archivo: ${err.message}</div>`;
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // ---------- Budget IT 2026 ----------
  const MESES_CORTOS_BI = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const CAPEX_MESES_BI = ['Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  function moneyIT(n){ return '$' + Math.round(n||0).toLocaleString('es-MX'); }
  // Para meses sin dato real (null) se muestra una proyección: promedio de los hasta 3 meses reales
  // más recientes anteriores a ese mes. No se guarda como dato real hasta que alguien lo edite.
  function budgetItValorMes(serie, i){
    if(serie[i]!==null && serie[i]!==undefined) return {valor:Number(serie[i]), esReal:true};
    let vals = [];
    for(let k=i-1; k>=0 && vals.length<3; k--){ if(serie[k]!==null && serie[k]!==undefined) vals.push(Number(serie[k])); }
    return {valor: vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0, esReal:false};
  }
  // Nota: los valores calculados (reales + proyectados) se guardan en un arreglo aparte (valoresPorVendor),
  // nunca sobre state.budget_it.opex directamente — así el objeto que se persiste en Firestore solo
  // contiene los datos reales que alguien capturó, sin caché de cálculos.
  function computeBudgetIT(){
    const data = state.budget_it;
    const valoresPorVendor = data.opex.map(v=> v.meses.map((_,i)=>budgetItValorMes(v.meses,i)));
    const monthlyActual = new Array(12).fill(0);
    valoresPorVendor.forEach(valores=> valores.forEach((o,i)=> monthlyActual[i]+=o.valor));
    const monthlyBudget = data.opex.reduce((s,v)=>s+Number(v.presupuesto_mes||0),0);
    const budgetSeries = new Array(12).fill(monthlyBudget);
    const janJunActual = monthlyActual.slice(0,6).reduce((a,b)=>a+b,0);
    const janJunBudget = monthlyBudget*6;
    const ahorroJanJun = janJunBudget - janJunActual;
    const opexAnnualProjected = monthlyActual.reduce((a,b)=>a+b,0);
    const opexAnnualBudget = monthlyBudget*12;
    const ahorroProyectado = opexAnnualBudget - opexAnnualProjected;
    // Solo los proyectos con la casilla "incluir" marcada entran al cálculo de CAPEX y a sus gráficas.
    const capexIncluidos = data.capex.filter(c=>c.incluir!==false);
    const capexBudget = capexIncluidos.reduce((s,c)=>s+Number(c.presupuesto||0),0);
    const capexEjecutado = capexIncluidos.reduce((s,c)=>s+Number(c.ejecutado||0),0);
    const capexPendiente = Math.max(capexBudget - capexEjecutado, 0);
    const totalPresupuestoAnual = opexAnnualBudget + capexBudget;
    const totalProyeccionAnual = opexAnnualProjected + capexEjecutado + capexPendiente;
    const ahorroTotalProyectado = totalPresupuestoAnual - totalProyeccionAnual;
    const catTotals = {};
    data.opex.forEach((v,vi)=>{
      const total6 = valoresPorVendor[vi].slice(0,6).reduce((a,o)=>a+o.valor,0);
      catTotals[v.categoria] = (catTotals[v.categoria]||0) + total6;
    });
    return {monthlyActual, monthlyBudget, budgetSeries, janJunActual, janJunBudget, ahorroJanJun,
      opexAnnualProjected, opexAnnualBudget, ahorroProyectado, capexBudget, capexEjecutado, capexPendiente,
      totalPresupuestoAnual, totalProyeccionAnual, ahorroTotalProyectado, catTotals, valoresPorVendor};
  }

  function renderBudgetIT(c){
    const data = state.budget_it;
    const puedeEditar = canEditBudgetIT();
    const d = computeBudgetIT();
    const pctAhorro = d.ahorroProyectado/d.opexAnnualBudget*100;
    const pctReal = Math.max(0, Math.min(100, d.janJunActual/d.opexAnnualBudget*100));
    const pctProj = Math.max(0, Math.min(100-pctReal, (d.opexAnnualProjected-d.janJunActual)/d.opexAnnualBudget*100));

    c.innerHTML = `
      <div class="title">Budget IT 2026</div>
      <div class="subtitle">Presupuesto y ejercido de proveedores de IT · corte mensual · recreado de Budget 2026_IT.xlsx</div>
      <div class="editbar">${editing && puedeEditar
        ? `<button id="btnCancelBI">Cancelar</button><button class="primary" id="btnSaveBI">Guardar cambios</button>`
        : (puedeEditar ? `<button id="btnEditBI">Editar Jul–Dic</button>` : '')}</div>

        <div class="card"><div class="head" style="background:${cardGrad('#0C8599')}">Presupuesto anual OPEX</div>
          <div class="body"><div class="big" style="font-size:20px;">${moneyIT(d.opexAnnualBudget)}</div><div class="lbl">${moneyIT(d.monthlyBudget)}/mes</div></div></div>

        <div class="card"><div class="head" style="background:${cardGrad('#0C8599')}">Proyección anual OPEX</div>

        <div class="card"><div class="head" style="background:${cardGrad('#0C8599')}">CAPEX ejecutado</div>

        <div class="card"><div class="head" style="background:${cardGrad('#0C8599')}">CAPEX pendiente</div>

      <div class="panel">
        <h3>Presupuesto vs. ejercido — OPEX mensual (Ene–Jun congelado)</h3>
        <div class="foot" style="margin-bottom:10px;">Enero–Junio son meses cerrados, de solo lectura. Julio en adelante es editable para amartinez, mgiron y admin. Las celdas en cursiva son una proyección (promedio de los últimos meses reales) mientras no se captura el dato real.</div>
        <div style="overflow-x:auto;"><table id="tbl-budget-it">
          <colgroup>
            <col style="width:200px;"><col style="width:130px;"><col style="width:92px;">
            ${MESES_CORTOS_BI.map(()=>'<col style="width:88px;">').join('')}
            <col style="width:100px;">
          </colgroup>
          <thead><tr><th class="bi-prov" style="text-align:left;">Proveedor</th><th class="bi-cat" style="text-align:left;">Categoría</th><th class="bi-presup">Presup./mes</th>${MESES_CORTOS_BI.map(m=>`<th>${m}</th>`).join('')}<th>Anual</th></tr></thead>
          <tbody>
            ${data.opex.map((v,vi)=>{
              const valores = d.valoresPorVendor[vi];
              const anual = valores.reduce((s,o)=>s+o.valor,0);
              let cells = `<td class="bi-prov">${v.proveedor}</td><td class="bi-cat">${v.categoria}</td><td class="bi-presup">${moneyIT(v.presupuesto_mes)}</td>`;

                  cells += `<td class="bi-locked">${moneyIT(o.valor)}</td>`;

                  cells += `<td><input type="number" step="1" data-bi-v="${vi}" data-bi-m="${i}" value="${v.meses[i]!==null && v.meses[i]!==undefined ? v.meses[i] : ''}" placeholder="${Math.round(o.valor)}" style="width:72px;"></td>`;

                  cells += `<td>${o.esReal ? moneyIT(o.valor) : '<span style="color:var(--sub);">—</span>'}</td>`;

              });
              cells += `<td><b>${moneyIT(anual)}</b></td>`;
              return `<tr>${cells}</tr>`;
            }).join('')}
          </tbody>
          <tfoot>
            <tr class="bi-totales">
              <td class="bi-prov">Total OPEX</td><td class="bi-cat"></td><td class="bi-presup">${moneyIT(d.monthlyBudget)}</td>
              ${d.monthlyActual.map(v=>`<td>${moneyIT(v)}</td>`).join('')}
              <td>${moneyIT(d.opexAnnualProjected)}</td>
            </tr>
            <tr class="bi-presupuesto">
              <td class="bi-prov">Presupuesto/mes</td><td class="bi-cat"></td><td class="bi-presup"></td>
              ${d.budgetSeries.map(v=>`<td>${moneyIT(v)}</td>`).join('')}
              <td>${moneyIT(d.opexAnnualBudget)}</td>
            </tr>
            <tr class="bi-ahorro">
              <td class="bi-prov">Ahorro del mes</td><td class="bi-cat"></td><td class="bi-presup"></td>

            </tr>
          </tfoot>
        </table></div>
        <div class="bi-legend">
          <span><span class="bi-swatch locked"></span> Cerrado (Ene–Jun, no editable)</span>

      <div class="panel">
        <h3>CAPEX 2026 — ejecución de proyectos</h3>
        <div class="foot" style="margin-bottom:10px;">Presupuesto anual (no mensual). Desmarca la casilla para excluir un proyecto del cálculo de CAPEX (montos y gráficas) — por ejemplo si se cancela o se mueve a otro año. Para los pendientes incluidos, elige el mes estimado de ejecución para incluirlos en la proyección anual.</div>
        <div style="display:grid; grid-template-columns:1.3fr 1fr; gap:16px;">
          <div style="overflow-x:auto;"><table>
            <thead><tr><th></th><th style="text-align:left;">Proyecto</th><th>Presupuesto</th><th>Ejecutado</th><th>Pendiente</th><th>Mes estimado</th></tr></thead>
            <tbody>${data.capex.map((cx,ci)=>{
              const incluido = cx.incluir!==false;
              const pendiente = Math.max(cx.presupuesto-cx.ejecutado,0);
              let status;
              if(!incluido) status = `<span class="status-badge" style="background:#F1F1F3; color:var(--sub);">No incluido</span>`;
              else if(pendiente<=0) status = `<span class="status-badge estable">Pagado</span>`;
              else status = `<span class="status-badge alerta">Pendiente</span>`;
              const checkbox = `<input type="checkbox" data-bi-capex-incluir="${ci}" ${incluido?'checked':''} ${(editing && puedeEditar)?'':'disabled'}>`;
              const sel = (incluido && pendiente>0 && editing && puedeEditar)
                ? `<select data-bi-capex="${ci}">${CAPEX_MESES_BI.map(m=>`<option value="${m}" ${m===cx.mes_plan?'selected':''}>${m}</option>`).join('')}</select>`
                : (incluido && pendiente>0 ? (cx.mes_plan||'—') : (cx.mes_ejecucion||'—'));
              return `<tr style="${incluido?'':'opacity:.5;'}"><td>${checkbox}</td><td style="text-align:left;">${cx.proveedor} ${status}</td><td>${moneyIT(cx.presupuesto)}</td><td>${moneyIT(cx.ejecutado)}</td><td>${moneyIT(pendiente)}</td><td style="text-align:left;">${sel}</td></tr>`;
            }).join('')}</tbody>
          </table></div>
          <div><canvas id="chartBudgetItCapex"></canvas></div>
        </div>
      </div>

      <div class="panel">
        <h3>Análisis de proyección anual</h3>
        <p style="font-size:13px; line-height:1.55; margin:0 0 14px;">Con el ritmo real de Enero–Junio (cerrado) y una proyección Julio–Diciembre basada en el promedio de los últimos meses reales por proveedor, el gasto OPEX 2026 terminaría en <b>${moneyIT(d.opexAnnualProjected)}</b> contra un presupuesto de <b>${moneyIT(d.opexAnnualBudget)}</b> — ${d.ahorroProyectado>=0?'un ahorro proyectado':'un sobre-ejercicio proyectado'} de <b>${moneyIT(Math.abs(d.ahorroProyectado))}</b> (${fmtPct(Math.abs(d.ahorroProyectado), d.opexAnnualBudget)}). Sumando los ${moneyIT(d.capexPendiente)} de CAPEX que aún no se ejecutan, el ${d.ahorroTotalProyectado>=0?'ahorro':'sobre-ejercicio'} total proyectado del presupuesto combinado de IT es de <b>${moneyIT(Math.abs(d.ahorroTotalProyectado))}</b> (${fmtPct(Math.abs(d.ahorroTotalProyectado), d.totalPresupuestoAnual)}). Se recalcula cada vez que se guarda un cambio en Julio–Diciembre.</p>
        <div class="cards" style="grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:0;">
          <div class="card"><div class="head" style="background:#4B5A6B">Presupuesto total 2026</div><div class="body"><div class="big" style="font-size:17px;">${moneyIT(d.totalPresupuestoAnual)}</div><div class="lbl">OPEX + CAPEX</div></div></div>
          <div class="card"><div class="head" style="background:#4B5A6B">Proyección total 2026</div><div class="body"><div class="big" style="font-size:17px;">${moneyIT(d.totalProyeccionAnual)}</div></div></div>
          <div class="card"><div class="head" style="background:#4B5A6B">Ahorro / sobre-ejercicio</div><div class="body"><div class="big" style="font-size:17px;">${moneyIT(d.ahorroTotalProyectado)}</div></div></div>
          <div class="card"><div class="head" style="background:#4B5A6B">% del presupuesto total</div><div class="body"><div class="big" style="font-size:17px;">${fmtPct(Math.abs(d.ahorroTotalProyectado), d.totalPresupuestoAnual)}</div></div></div>
        </div>
      </div>

      <div class="panel">
        <h3>Gráficas</h3>
        <div style="display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:16px;">
          <div><div class="foot" style="margin-bottom:6px;">Ejercido mensual vs. presupuesto</div><canvas id="chartBudgetItTrend"></canvas></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div><div class="foot" style="margin-bottom:6px;">Gasto Ene–Jun por categoría</div><canvas id="chartBudgetItCat"></canvas></div>
          <div>
            <div class="foot" style="margin-bottom:6px;">Presupuesto anual OPEX vs. proyección</div>
            <div class="bi-bullet-wrap">
              <div class="bi-bullet-track">
                <div class="bi-bullet-seg bi-bullet-real" style="width:${pctReal}%;"></div>
                <div class="bi-bullet-seg bi-bullet-proj" style="left:${pctReal}%; width:${pctProj}%;"></div>
              </div>
              <div class="bi-bullet-labels"><span>$0</span><span>${moneyIT(d.opexAnnualBudget)} (100% del presupuesto)</span></div>
              <div class="bi-bullet-legend">
                <span><span class="bi-sw real"></span> Ejercido Ene–Jun</span>
                <span><span class="bi-sw proj"></span> Proyectado Jul–Dic</span>
                <span><span class="bi-sw gap"></span> ${d.ahorroProyectado>=0?'Ahorro':'Sobre-ejercicio'} proyectado</span>
              </div>
              <div class="bi-bullet-callout ${d.ahorroProyectado>=0?'':'warn'}">${d.ahorroProyectado>=0?'✓ Ahorro proyectado':'⚠ Sobre-ejercicio proyectado'}: ${moneyIT(Math.abs(d.ahorroProyectado))} (${fmtPct(Math.abs(d.ahorroProyectado), d.opexAnnualBudget)} del presupuesto anual)</div>
            </div>
          </div>
        </div>
        <div style="margin-top:16px;">
          <div class="foot" style="margin-bottom:6px;">Gasto Ene–Jun por proveedor (de mayor a menor)</div>
          <canvas id="chartBudgetItProv"></canvas>
        </div>
      </div>

      ${puedeVerBudgetIT() ? renderHistorialBudgetIT() : ''}
    `;

    if(editing && puedeEditar){
      document.getElementById('btnCancelBI').onclick = ()=>{ editing=false; render(); };
      document.getElementById('btnSaveBI').onclick = ()=>{
        document.querySelectorAll('[data-bi-v]').forEach(inp=>{
          const vi = Number(inp.dataset.biV), mi = Number(inp.dataset.biM);
          const raw = inp.value.trim();
          data.opex[vi].meses[mi] = raw==='' ? null : Number(raw);
        });
        document.querySelectorAll('[data-bi-capex-incluir]').forEach(chk=>{
          data.capex[Number(chk.dataset.biCapexIncluir)].incluir = chk.checked;
        });
        document.querySelectorAll('[data-bi-capex]').forEach(sel=>{
          data.capex[Number(sel.dataset.biCapex)].mes_plan = sel.value;
        });
        const dSave = computeBudgetIT();
        if(!state.budget_it.historial) state.budget_it.historial = [];
        state.budget_it.historial.unshift({
          fecha: new Date().toISOString(),
          usuario: (typeof currentUser!=='undefined' && currentUser) ? currentUser.username : 'desconocido',
          resumen: { ejercido_anual_proyectado: dSave.opexAnnualProjected, ahorro_proyectado: dSave.ahorroProyectado, capex_pendiente: dSave.capexPendiente }
        });
        if(state.budget_it.historial.length > 30) state.budget_it.historial.length = 30;
        descripcionActualizacion = 'Edición manual — Budget IT 2026';
        editing = false;
        save();
      };
    } else if(puedeEditar){
      document.getElementById('btnEditBI').onclick = ()=>{ editing=true; render(); };
    }
    document.querySelectorAll('[data-hist-bi-ver]').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = Number(btn.dataset.histBiVer);
        historialBudgetItExpandido = historialBudgetItExpandido===idx ? null : idx;
        render();
      };
    });

    const catEntries = Object.entries(d.catTotals).sort((a,b)=>b[1]-a[1]);
    const provEntries = data.opex.map((v,vi)=>[v.proveedor, d.valoresPorVendor[vi].slice(0,6).reduce((s,o)=>s+o.valor,0)]).sort((a,b)=>b[1]-a[1]);
    if(charts.budgetItTrend) charts.budgetItTrend.destroy();
    charts.budgetItTrend = new Chart(document.getElementById('chartBudgetItTrend'), {
      data:{ labels: MESES_CORTOS_BI,
        datasets:[
          {type:'bar', label:'Ejercido', data:d.monthlyActual, backgroundColor: d.monthlyActual.map((v,i)=> i<6 ? '#0C8599' : 'rgba(12,133,153,.55)'), borderRadius:4, maxBarThickness:30},
          {type:'line', label:'Presupuesto', data:d.budgetSeries, borderColor:'#4B5A6B', borderDash:[5,4], borderWidth:2, pointRadius:0}
        ]},
      options:{plugins:{legend:{position:'bottom'}}, scales:{y:{ticks:{callback:(v)=>'$'+(v/1e6).toFixed(1)+'M'}}}}
    });
    if(charts.budgetItCat) charts.budgetItCat.destroy();
    charts.budgetItCat = new Chart(document.getElementById('chartBudgetItCat'), {
      type:'bar',
      data:{labels:catEntries.map(e=>e[0]), datasets:[{data:catEntries.map(e=>e[1]), backgroundColor:'#0C8599', borderRadius:4, maxBarThickness:16}]},
      options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{ticks:{callback:(v)=>'$'+(v/1e6).toFixed(1)+'M'}}}}
    });
    if(charts.budgetItProv) charts.budgetItProv.destroy();
    charts.budgetItProv = new Chart(document.getElementById('chartBudgetItProv'), {
      type:'bar',
      data:{labels:provEntries.map(e=>e[0]), datasets:[{data:provEntries.map(e=>e[1]), backgroundColor:'#0C8599', borderRadius:4, maxBarThickness:16}]},
      options:{indexAxis:'y', plugins:{legend:{display:false}, tooltip:{callbacks:{label:(ctx)=>moneyIT(ctx.parsed.x)}}}, scales:{x:{ticks:{callback:(v)=>'$'+(v/1e6).toFixed(1)+'M'}}}}
    });
    if(charts.budgetItCapex) charts.budgetItCapex.destroy();
    charts.budgetItCapex = new Chart(document.getElementById('chartBudgetItCapex'), {
      type:'bar',
      data:{labels:['CAPEX 2026'], datasets:[
        {label:'Ejecutado', data:[d.capexEjecutado], backgroundColor:'#00B050', borderRadius:4},
        {label:'Pendiente', data:[d.capexPendiente], backgroundColor:'#C00000', borderRadius:4}
      ]},
      options:{indexAxis:'y', plugins:{legend:{position:'bottom'}}, scales:{x:{stacked:true, ticks:{callback:(v)=>'$'+(v/1e6).toFixed(1)+'M'}}, y:{stacked:true}}}
    });
  }

  function renderHistorialBudgetIT(){
    const hist = (state.budget_it && state.budget_it.historial) || [];
    if(!hist.length){
      return `<div class="panel"><h3>Historial de cambios</h3><div class="foot">Todavía no hay cambios guardados en esta pestaña.</div></div>`;
    }
    return `
      <div class="panel">
        <h3>Historial de cambios</h3>
        <div class="foot" style="margin-bottom:10px;">Solo visible para amartinez, mgiron y lalzaga. Se guardan los últimos 30 cambios, más reciente arriba.</div>
        <div style="overflow-x:auto;"><table>
          <thead><tr><th style="text-align:left;">Fecha</th><th style="text-align:left;">Usuario</th><th></th></tr></thead>
          <tbody>${hist.map((h,i)=>`
            <tr>
              <td style="text-align:left;">${fmtFecha(h.fecha)}</td>
              <td style="text-align:left;">${h.usuario}</td>
              <td><button data-hist-bi-ver="${i}" style="padding:3px 8px;">${historialBudgetItExpandido===i ? 'Ocultar' : 'Ver'}</button></td>
            </tr>
            ${historialBudgetItExpandido===i ? `
            <tr><td colspan="3">
              <div style="font-size:12.5px; padding:8px 0; text-align:left;">
                Proyección anual OPEX al guardar: ${moneyIT(h.resumen.ejercido_anual_proyectado)} · Ahorro proyectado: ${moneyIT(h.resumen.ahorro_proyectado)} · CAPEX pendiente: ${moneyIT(h.resumen.capex_pendiente)}
              </div>
            </td></tr>` : ''}
          `).join('')}
          </tbody>
        </table></div>
      </div>
    `;
  }

  // ---------- Actualizaciones (agosto 2026) ----------
  // Log global de todo lo que se guarda en el dashboard, sin importar la pestaña — visible solo para
  // amartinez, mgiron y lalzaga (mismo criterio que Budget IT). Es de solo lectura para los tres: nadie

    c.innerHTML = `
      <div class="title">Actualizaciones</div>
      <div class="subtitle">Registro de cambios guardados en todo el dashboard — quién, qué y cuándo</div>
      <div class="foot" style="margin-bottom:14px;">Solo visible para amartinez, mgiron y lalzaga. Se guardan las últimas 200 actualizaciones, más reciente arriba. Es de solo lectura: se llena sola cada vez que alguien guarda un cambio en cualquier pestaña.</div>
      ${log.length===0 ? `
      <div class="placeholder">
        <h3>Todavía no hay actualizaciones registradas</h3>
        <p>Aquí va a aparecer cada cambio que se guarde en cualquier pestaña del dashboard — por ejemplo, si amartinez carga el Excel de Tickets, o si mgiron edita Budget IT — con usuario, archivo o tipo de actualización, fecha y hora.</p>

      <div class="panel">

          <tbody>${log.map(h=>`
            <tr>

          </tbody>
        </table></div>
      </div>`}

  function renderExpansion(c){

      c.innerHTML = `
        <div class="title">Plan de expansión · PrimeMX ${state.anio}</div>
        <div class="subtitle">Aperturas de tienda, hardware e internet asignado</div>
        ${canEdit ? `
        <div class="uploadbar">
          <div class="txt">
            <b>Cargar archivo de expansión (.xlsx)</b> — agrega o actualiza tiendas (por Clave PDV); no borra lo que ya tenías cargado.

          </div>
          <input type="file" id="fileExpansion" accept=".xlsx,.xls" style="display:none">
          <button class="upload" id="btnUploadExp">Cargar archivo</button>
        </div>` : ''}
        ${cargaPendienteExpansion ? panelConfirmacionExpansion() : `
        <div class="placeholder">
          <h3>Todavía no hay tiendas cargadas</h3>

    const prospecto = tiendas.filter(t=>t.estatus==='Prospecto');
    const cerradas = tiendas.filter(t=>t.estatus==='Cerrada');
    const esteMes = abiertas.filter(t=>t.mes.startsWith(state.periodo_actual)).length;

    c.innerHTML = `
      <div class="title">Plan de expansión · PrimeMX ${state.anio}</div>
      <div class="subtitle">${exp.carga.archivo ? `Última carga: ${exp.carga.archivo}${exp.carga.agregadas!==undefined ? ` · ${exp.carga.agregadas} nuevas, ${exp.carga.actualizadas} actualizadas` : ''} · ${fmtFecha(exp.carga.fecha)}` : 'Aperturas de tienda, hardware e internet asignado'}</div>

      ${canEdit ? `
      <div class="uploadbar">
        <div class="txt">
          <b>Cargar archivo de la semana (.xlsx)</b> — solo necesitas subir los registros nuevos: se agregan a lo que ya tienes o actualizan la tienda que coincida por Clave PDV. Nada se borra. Las notas se conservan.
          <div id="uploadErrorExp"></div>
        </div>
        <input type="file" id="fileExpansion" accept=".xlsx,.xls" style="display:none">
        <button class="upload" id="btnUploadExp">Cargar archivo</button>
      </div>` : ''}
      ${cargaPendienteExpansion ? panelConfirmacionExpansion() : ''}

      <div class="cards">
        <div class="card"><div class="head" style="background:${cardGrad(COLOR_EXPANSION)}">Total tiendas</div>
          <div class="body"><div class="big">${tiendas.length}</div><div class="lbl">${prospecto.length} prospecto sin clave</div></div></div>
        <div class="card"><div class="head" style="background:${cardGrad('#16A34A')}">Abiertas</div>
          <div class="body"><div class="big">${abiertas.length}</div><div class="lbl">${esteMes} etiquetadas "${state.periodo_actual}"</div></div></div>
        <div class="card"><div class="head" style="background:${cardGrad('#D97706')}">En proceso</div>
          <div class="body"><div class="big">${enProceso.length}</div><div class="lbl">con ARQ o impresora pendiente</div></div></div>
        <div class="card"><div class="head" style="background:${cardGrad('#DC2626')}">Cerradas</div>
          <div class="body"><div class="big">${cerradas.length}</div><div class="lbl">marcadas manualmente</div></div></div>
      </div>

      <div class="panel">
        <div class="editbar">${editing
          ? `<button id="btnCancel">Cancelar</button><button id="btnAddTienda">Agregar tienda</button><button class="primary" id="btnSave">Guardar cambios</button>`
          : (canEdit ? `<button id="btnEdit">Editar todo</button>` : '')}</div>
        <h3>Tiendas — mes, hardware, internet y estatus</h3>
        <div style="overflow-x:auto;"><table>
          <thead><tr>
            <th>#</th><th>Clave PDV</th><th>Tienda</th><th>Región</th><th>Mes</th>
            <th>PC</th><th>Lap</th><th>Internet</th><th>ARQ</th><th>Impresora</th><th>Estatus</th><th style="text-align:left;">Nota</th>${editing?'<th></th>':''}
          </tr></thead>
          <tbody>${tiendas.map((t,i)=> editing ? `
            <tr data-exp-row="${i}">
              <td><input type="text" style="width:44px;" data-exp-field="numero" data-exp-row="${i}" value="${t.numero!==null && t.numero!==undefined ? t.numero : ''}"></td>
              <td><input type="text" style="width:110px;" data-exp-field="clave" data-exp-row="${i}" value="${t.clave||''}"></td>
              <td><input type="text" style="width:220px; text-align:left;" data-exp-field="nombre" data-exp-row="${i}" value="${(t.nombre||'').replace(/"/g,'&quot;')}"></td>
              <td><input type="text" style="width:90px;" data-exp-field="region" data-exp-row="${i}" value="${t.region||''}"></td>
              <td><input type="text" style="width:80px;" data-exp-field="mes" data-exp-row="${i}" value="${t.mes||''}"></td>
              <td><input type="text" style="width:36px;" data-exp-field="pc" data-exp-row="${i}" value="${t.pc||''}"></td>
              <td><input type="text" style="width:36px;" data-exp-field="lap" data-exp-row="${i}" value="${t.lap||''}"></td>
              <td><input type="text" style="width:70px;" data-exp-field="internet" data-exp-row="${i}" value="${t.internet||''}"></td>
              <td><input type="text" style="width:80px;" data-exp-field="entregado_arq" data-exp-row="${i}" value="${t.entregado_arq||''}"></td>
              <td><input type="text" style="width:80px;" data-exp-field="entrega_impresora" data-exp-row="${i}" value="${t.entrega_impresora||''}"></td>
              <td><select data-exp-field="estatus" data-exp-row="${i}">
                ${['Abierta','En proceso','Prospecto','Cerrada'].map(op=>`<option value="${op}" ${t.estatus===op?'selected':''}>${op}</option>`).join('')}
              </select></td>
              <td><input type="text" style="width:220px; text-align:left;" data-exp-field="nota" data-exp-row="${i}" value="${(t.nota||'').replace(/"/g,'&quot;')}"></td>
              <td><button data-exp-remove="${i}" style="padding:3px 8px;">✕</button></td>
            </tr>` : `
            <tr data-exp-row="${i}">
              <td>${t.numero!==null && t.numero!==undefined ? t.numero : '—'}</td>
              <td>${t.clave||'—'}</td>
              <td style="text-align:left;">${t.nombre}</td>
              <td>${t.region}</td>
              <td>${t.mes||'—'}</td>
              <td>${t.pc}</td>
              <td>${t.lap}</td>
              <td>${t.internet}</td>
              <td>${t.entregado_arq}</td>
              <td>${t.entrega_impresora}</td>
              <td><span class="status-badge ${estatusExpClass(t.estatus)}">${t.estatus}</span></td>
              <td style="text-align:left;">${t.nota||'<span style="color:var(--sub)">—</span>'}</td>
            </tr>`).join('')}
          </tbody>
        </table></div>
      </div>
      <div class="panel">
        <h3>Notas generales de expansión</h3>
        ${editing
          ? `<textarea id="notasGenerales" rows="6" style="width:100%; font-family:inherit; font-size:13px; padding:10px; border:1px solid var(--line); border-radius:8px;" placeholder="Ejemplo: Tienda CITY SHOP — cierre de tienda para el 03 de agosto">${exp.notas_generales||''}</textarea>`
          : `<div style="font-size:13px; white-space:pre-wrap; color:${exp.notas_generales ? 'var(--ink)' : 'var(--sub)'};">${exp.notas_generales || 'Sin notas capturadas todavía. Da clic en "Editar todo" arriba para agregar.'}</div>`}
        <div class="foot">Espacio libre para movimientos que no vienen en el archivo (cierres, cambios de plaza, pausas, etc.). No se sobreescribe al cargar un nuevo Excel.</div>
      </div>
      <div class="foot">En modo edición puedes cambiar cualquier campo de la tabla, agregar tiendas manualmente o quitarlas. Al cargar un archivo nuevo, esos cambios manuales se respetan salvo que ese mismo campo venga distinto en el Excel para esa Clave PDV.</div>
      ${seccionCierreTiendas()}
    `;
    if(editing){
      document.getElementById('btnCancel').onclick=()=>{editing=false;render();};
      document.getElementById('btnAddTienda').onclick=()=>{
        tiendas.push({numero:null, clave:'', nombre:'Nueva tienda', mes:'', region:'-', pc:'-', lap:'-', hc:'-', pinpad:'-', dif_pinpad:'-', biometricos:'-', dif_biometricos:'-', prep_equipo:'-', envio_mac:'-', internet:'-', solicitud_arq:'-', entregado_arq:'-', entrega_impresora:'-', modelo_impresora:'-', estatus:'Prospecto', nota:''});
        render();
      };
      document.getElementById('btnSave').onclick=()=>{
        document.querySelectorAll('[data-exp-field]').forEach(inp=>{
          const i = Number(inp.dataset.expRow);
          const field = inp.dataset.expField;
          let val = inp.value;
          if(field==='numero') val = val==='' ? null : Number(val);
          tiendas[i][field] = val;
        });
        const ng = document.getElementById('notasGenerales');
        if(ng) exp.notas_generales = ng.value;
        descripcionActualizacion = 'Edición manual — Plan de Expansión';
        save();
      };
      document.querySelectorAll('[data-exp-remove]').forEach(btn=>{
        btn.onclick = ()=>{ tiendas.splice(Number(btn.dataset.expRemove),1); render(); };
      });
    } else {
      if(canEdit) document.getElementById('btnEdit').onclick=()=>{editing=true;render();};
    }
    wireExpansionUpload();
    wireCierreTiendas();
  }
  function panelConfirmacionExpansion(){
    const d = cargaPendienteExpansion;
    const existentes = state.expansion.tiendas || [];
    const keyOf = t => t.clave ? ('clave:'+t.clave) : ('nombre:'+t.nombre);
    const clavesExistentes = new Set(existentes.map(keyOf));
    const nuevas = d.tiendas.filter(t=>!clavesExistentes.has(keyOf(t))).length;
    const actualizan = d.tiendas.length - nuevas;
    return `<div class="panel" style="border-color:var(--tm);">
      <h3 style="color:var(--tm);">Confirmar carga · ${d.fileName}</h3>
      <div style="font-size:13px; line-height:1.8;">
        Filas en el archivo: <b>${d.resumen.total}</b> → <b>${nuevas} tiendas nuevas</b> se agregarán, <b>${actualizan}</b> ya existían y se actualizarán.<br>
        En el archivo: Abiertas <b>${d.resumen.abiertas}</b> · En proceso <b>${d.resumen.enProceso}</b> · Prospecto <b>${d.resumen.prospecto}</b>
      </div>
      <div class="foot">No se borra nada de lo que ya tenías. Las notas manuales que ya hayas escrito se conservan (se empatan por Clave PDV, o por nombre si no tiene clave).</div>
      <div class="editbar" style="margin-top:10px;">
        <button id="btnCancelCargaExp">Cancelar</button>
        <button class="primary" id="btnAplicarCargaExp">Aplicar datos</button>
      </div>
    </div>`;
  }
  function wireExpansionUpload(){
    const btn = document.getElementById('btnUploadExp');
    if(btn) btn.onclick = () => document.getElementById('fileExpansion').click();
    const inp = document.getElementById('fileExpansion');
    if(inp) inp.onchange = handleFileUploadExpansion;
    const btnCancel = document.getElementById('btnCancelCargaExp');
    if(btnCancel) btnCancel.onclick = ()=>{ cargaPendienteExpansion = null; render(); };
    const btnAplicar = document.getElementById('btnAplicarCargaExp');
    if(btnAplicar) btnAplicar.onclick = ()=>{ aplicarDatosExpansion(cargaPendienteExpansion); };
  }

  // ---------- Cierre de tiendas (agosto 2026) ----------
  // A propósito NO es una pestaña aparte: es una sección más, más abajo, dentro de la misma pestaña
  // "Plan de expansión" (pedido explícito del cliente). Antes las tiendas cerradas vivían mezcladas
  // en la tabla de arriba con estatus:'Cerrada' y todo el detalle (fechas de entrega/recolección/
  // vigencia) embarrado en el campo "nota". Aquí quedan en su propia tabla, con un campo nuevo
  // "Observaciones" separado del detalle. Solo admin puede editar/mover (ver canEdit). Tiene su
  // propio interruptor de edición (editingCierre) para no forzar a editar las dos tablas juntas.
  // Candidatas a migrar: cualquier fila de Plan de expansión ya marcada 'Cerrada' que siga ahí.
  function candidatosMigracionCierre(){
    return (state.expansion.tiendas || []).filter(t=>t.estatus==='Cerrada');
  }
  let modalMigrarCierre = false;
  function migrarCerradasDesdeExpansion(){
    const candidatas = candidatosMigracionCierre();
    if(candidatas.length===0) return;
    // Se clona la fila completa tal cual está en Expansión (mismos campos: numero, clave, nombre,
    // región, mes, pc, lap, internet, entregado_arq, entrega_impresora, estatus, nota, etc.) y solo
    // se le agrega "observaciones" nuevo — así no se pierde ni se reinterpreta nada de lo que ya
    // tenían capturado, incluidas ediciones manuales posteriores (ej. "YA SE RECOLECTO" en la nota).
    candidatas.forEach(t=>{
      state.cierre_tiendas.tiendas.push({ ...clone(t), observaciones: t.observaciones || '' });
    });
    state.expansion.tiendas = state.expansion.tiendas.filter(t=>t.estatus!=='Cerrada');
    modalMigrarCierre = false;
    descripcionActualizacion = `Mover tiendas cerradas — Plan de Expansión → Cierre de tiendas (${candidatas.length} tienda${candidatas.length===1?'':'s'})`;
    save();
  }
  function panelMigracionCierre(){
    const candidatas = candidatosMigracionCierre();
    return `<div class="panel" style="border-color:var(--tm);">
      <h3 style="color:var(--tm);">Mover tiendas cerradas desde Plan de expansión</h3>
      <div style="font-size:13px; line-height:1.7;">
        Se moverán <b>${candidatas.length}</b> tienda(s) marcada(s) como "Cerrada" en Plan de expansión a este apartado. Se quitan de Expansión y se agregan aquí con los mismos campos que ya tenían (Observaciones queda vacío para captura nueva).
        <ul style="margin:8px 0 0 18px; padding:0;">
          ${candidatas.map(t=>`<li>${t.nombre}${t.clave?` (${t.clave})`:''}</li>`).join('')}
        </ul>
      </div>
      <div class="editbar" style="margin-top:10px;">
        <button id="btnCancelMigrarCierre">Cancelar</button>
        <button class="primary" id="btnConfirmarMigrarCierre">Mover ${candidatas.length} tienda(s)</button>
      </div>
    </div>`;
  }
  // Devuelve el HTML de la sub-sección "Cierre de tiendas" para insertarla DENTRO de la misma
  // pantalla de "Plan de expansión" (más abajo de la tabla de aperturas) — a petición del cliente
  // esto NO es una pestaña aparte, es una sección más dentro de la misma pestaña de Expansión.
  // Los campos editables son EXACTAMENTE los mismos que la tabla de arriba (#, Clave PDV, Tienda,
  // Región, Mes, PC, Lap, Internet, ARQ, Impresora, Estatus, Nota) + una columna nueva: Observaciones.
  function seccionCierreTiendas(){
    const cz = state.cierre_tiendas;
    const tiendas = cz.tiendas || [];
    const candidatas = candidatosMigracionCierre();
    const cerradas = tiendas.filter(t=>t.estatus==='Cerrada').length;

    return `
      <div class="foot" style="margin-top:26px; margin-bottom:4px; height:1px; border-top:1px solid var(--line);"></div>
      <div class="title" style="font-size:18px; margin-top:18px;">Cierre de tiendas</div>
      <div class="subtitle">Mismos campos que la tabla de arriba, más la columna de Observaciones</div>

      ${canEdit && candidatas.length>0 ? `
      <div class="uploadbar">
        <div class="txt">
          <b>${candidatas.length} tienda(s) marcada(s) "Cerrada" siguen arriba, en la tabla de Expansión.</b> Muévelas aquí abajo para llevar el seguimiento de cierre en un solo lugar.
        </div>
        <button class="upload" id="btnAbrirMigrarCierre">Mover tiendas cerradas de arriba</button>
      </div>` : ''}
      ${modalMigrarCierre ? panelMigracionCierre() : ''}

      <div class="cards">
        <div class="card"><div class="head" style="background:${cardGrad(COLOR_CIERRE)}">Total en este apartado</div>
          <div class="body"><div class="big">${tiendas.length}</div><div class="lbl">tiendas bajo seguimiento</div></div></div>
        <div class="card"><div class="head" style="background:${cardGrad('#DC2626')}">Cerradas</div>
          <div class="body"><div class="big">${cerradas}</div><div class="lbl">marcadas manualmente</div></div></div>
      </div>

      <div class="panel">
        <div class="editbar">${editingCierre
          ? `<button id="btnCancelCierre">Cancelar</button><button id="btnAddCierre">Agregar tienda</button><button class="primary" id="btnSaveCierre">Guardar cambios</button>`
          : (canEdit ? `<button id="btnEditCierre">Editar todo</button>` : '')}</div>
        <h3>Tiendas — mes, hardware, internet, estatus y observaciones</h3>
        ${tiendas.length===0 ? `<div class="placeholder"><h3>Todavía no hay tiendas aquí</h3><p>${canEdit ? 'Da clic en "Editar todo" para agregar una tienda manualmente, o usa "Mover tiendas cerradas de arriba" si ya hay alguna marcada como Cerrada en la tabla de Expansión.' : 'Todavía no hay tiendas capturadas en este apartado.'}</p></div>` : `
        <div style="overflow-x:auto;"><table>
          <thead><tr>
            <th>#</th><th>Clave PDV</th><th>Tienda</th><th>Región</th><th>Mes</th>
            <th>PC</th><th>Lap</th><th>Internet</th><th>ARQ</th><th>Impresora</th><th>Estatus</th><th style="text-align:left;">Nota</th><th style="text-align:left;">Observaciones</th>${editingCierre?'<th></th>':''}
          </tr></thead>
          <tbody>${tiendas.map((t,i)=> editingCierre ? `
            <tr data-cz-row="${i}">
              <td><input type="text" style="width:44px;" data-cz-field="numero" data-cz-row="${i}" value="${t.numero!==null && t.numero!==undefined ? t.numero : ''}"></td>
              <td><input type="text" style="width:110px;" data-cz-field="clave" data-cz-row="${i}" value="${t.clave||''}"></td>
              <td><input type="text" style="width:220px; text-align:left;" data-cz-field="nombre" data-cz-row="${i}" value="${(t.nombre||'').replace(/"/g,'&quot;')}"></td>
              <td><input type="text" style="width:90px;" data-cz-field="region" data-cz-row="${i}" value="${t.region||''}"></td>
              <td><input type="text" style="width:80px;" data-cz-field="mes" data-cz-row="${i}" value="${t.mes||''}"></td>
              <td><input type="text" style="width:36px;" data-cz-field="pc" data-cz-row="${i}" value="${t.pc||''}"></td>
              <td><input type="text" style="width:36px;" data-cz-field="lap" data-cz-row="${i}" value="${t.lap||''}"></td>
              <td><input type="text" style="width:70px;" data-cz-field="internet" data-cz-row="${i}" value="${t.internet||''}"></td>
              <td><input type="text" style="width:80px;" data-cz-field="entregado_arq" data-cz-row="${i}" value="${t.entregado_arq||''}"></td>
              <td><input type="text" style="width:80px;" data-cz-field="entrega_impresora" data-cz-row="${i}" value="${t.entrega_impresora||''}"></td>
              <td><select data-cz-field="estatus" data-cz-row="${i}">
                ${['Abierta','En proceso','Prospecto','Cerrada'].map(op=>`<option value="${op}" ${t.estatus===op?'selected':''}>${op}</option>`).join('')}
              </select></td>
              <td><input type="text" style="width:220px; text-align:left;" data-cz-field="nota" data-cz-row="${i}" value="${(t.nota||'').replace(/"/g,'&quot;')}"></td>
              <td><input type="text" style="width:220px; text-align:left;" data-cz-field="observaciones" data-cz-row="${i}" value="${(t.observaciones||'').replace(/"/g,'&quot;')}"></td>
              <td><button data-cz-remove="${i}" style="padding:3px 8px;">✕</button></td>
            </tr>` : `
            <tr data-cz-row="${i}">
              <td>${t.numero!==null && t.numero!==undefined ? t.numero : '—'}</td>
              <td>${t.clave||'—'}</td>
              <td style="text-align:left;">${t.nombre}</td>
              <td>${t.region}</td>
              <td>${t.mes||'—'}</td>
              <td>${t.pc}</td>
              <td>${t.lap}</td>
              <td>${t.internet}</td>
              <td>${t.entregado_arq}</td>
              <td>${t.entrega_impresora}</td>
              <td><span class="status-badge ${estatusExpClass(t.estatus)}">${t.estatus}</span></td>
              <td style="text-align:left;">${t.nota||'<span style="color:var(--sub)">—</span>'}</td>
              <td style="text-align:left;">${t.observaciones||'<span style="color:var(--sub)">—</span>'}</td>
            </tr>`).join('')}
          </tbody>
        </table></div>`}
      </div>
      <div class="panel">
        <h3>Notas generales de cierre de tiendas</h3>
        ${editingCierre
          ? `<textarea id="notasGeneralesCierre" rows="6" style="width:100%; font-family:inherit; font-size:13px; padding:10px; border:1px solid var(--line); border-radius:8px;" placeholder="Ejemplo: pendiente confirmar recolección de equipo en Obregón Sonora Puerta">${cz.notas_generales||''}</textarea>`
          : `<div style="font-size:13px; white-space:pre-wrap; color:${cz.notas_generales ? 'var(--ink)' : 'var(--sub)'};">${cz.notas_generales || 'Sin notas capturadas todavía.'}</div>`}
      </div>
      <div class="foot">En modo edición puedes cambiar cualquier campo de la tabla, agregar tiendas manualmente o quitarlas. "Observaciones" es la única columna nueva respecto a la tabla de arriba.</div>
    `;
  }
  function wireCierreTiendas(){
    const cz = state.cierre_tiendas;
    const tiendas = cz.tiendas || [];
    if(canEdit){
      const btnMig = document.getElementById('btnAbrirMigrarCierre');
      if(btnMig) btnMig.onclick = ()=>{ modalMigrarCierre = true; render(); };
      const btnCancelMig = document.getElementById('btnCancelMigrarCierre');
      if(btnCancelMig) btnCancelMig.onclick = ()=>{ modalMigrarCierre = false; render(); };
      const btnConfirmMig = document.getElementById('btnConfirmarMigrarCierre');
      if(btnConfirmMig) btnConfirmMig.onclick = migrarCerradasDesdeExpansion;
    }

    if(editingCierre){
      document.getElementById('btnCancelCierre').onclick=()=>{editingCierre=false;render();};
      document.getElementById('btnAddCierre').onclick=()=>{
        tiendas.push({numero:null, clave:'', nombre:'Nueva tienda', region:'-', mes:'', pc:'-', lap:'-', internet:'-', entregado_arq:'-', entrega_impresora:'-', estatus:'Prospecto', nota:'', observaciones:''});
        render();
      };
      document.getElementById('btnSaveCierre').onclick=()=>{
        document.querySelectorAll('[data-cz-field]').forEach(inp=>{
          const i = Number(inp.dataset.czRow);
          const field = inp.dataset.czField;
          let val = inp.value;
          if(field==='numero') val = val==='' ? null : Number(val);
          tiendas[i][field] = val;
        });
        const ng = document.getElementById('notasGeneralesCierre');
        if(ng) cz.notas_generales = ng.value;
        descripcionActualizacion = 'Edición manual — Cierre de tiendas';
        save();
        editingCierre = false;
      };
      document.querySelectorAll('[data-cz-remove]').forEach(btn=>{
        btn.onclick = ()=>{ tiendas.splice(Number(btn.dataset.czRemove),1); render(); };
      });
    } else {
      const btnEditCz = document.getElementById('btnEditCierre');
      if(btnEditCz) btnEditCz.onclick=()=>{editingCierre=true;render();};
    }
  }

  window.initCaidasApp = function(role){
    canEdit = (role === 'admin');
    load();
    iniciarAutoRefreshEstatusServicio();
  };
})();
</script>
</body>
</html>
