<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Dashboard IT · PrimeMX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ===== Portal: variables, login, shell y header (igual que directorio.html) ===== */
<style>
:root{
  --bg:#F4F6F5;
  --panel:#FFFFFF;
  --ink:#122031;
  --ink-soft:#4B5A6B;
  --line:#DCE3E2;
  --signal:#0C8599;
  --signal-dark:#0A6B79;
  --signal-soft:#E3F1F2;
  --ok:#1E8E5A;
  --ok-soft:#E6F5EC;
  --warn:#C6421B;
  --warn-soft:#FBE9E4;
  --radius:10px;
  --font-ui:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}

/* ===== LOGIN ===== */
#login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 15% 20%, rgba(12,133,153,0.10), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(12,133,153,0.08), transparent 45%),
    var(--bg);
}
.login-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:40px 36px;
  width:100%;
  max-width:380px;
  box-shadow:0 12px 40px rgba(18,32,49,0.08);
}
.login-signal{
  display:flex;
  gap:4px;
  align-items:flex-end;
  height:22px;
  margin-bottom:18px;
}
.login-signal span{
  width:6px;
  background:var(--signal);
  border-radius:2px;
  animation:pulseBar 1.6s ease-in-out infinite;
}
.login-signal span:nth-child(1){height:30%;animation-delay:0s;}
.login-signal span:nth-child(2){height:55%;animation-delay:.15s;}
.login-signal span:nth-child(3){height:80%;animation-delay:.3s;}
.login-signal span:nth-child(4){height:100%;animation-delay:.45s;}
@keyframes pulseBar{0%,100%{opacity:.4;}50%{opacity:1;}}
.login-card h1{
  font-size:20px;
  margin:0 0 2px;
  letter-spacing:-0.01em;
}
.login-card .sub{
  color:var(--ink-soft);
  font-size:13px;
  margin:0 0 26px;
}
.field{margin-bottom:14px;}
.field label{
  display:block;
  font-size:12px;
  font-weight:600;
  color:var(--ink-soft);
  margin-bottom:6px;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.field input, .field select{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:14px;
  background:#FAFBFB;
  color:var(--ink);
}
.field input:focus, .field select:focus{
  outline:2px solid var(--signal);
  outline-offset:1px;
  border-color:var(--signal);
}
.btn{
  border:none;
  border-radius:8px;
  padding:11px 18px;
  font-size:14px;
  font-weight:600;
  transition:transform .05s ease, opacity .15s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--signal);color:#fff;width:100%;}
.btn-primary:hover{background:var(--signal-dark);}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
.btn-ghost:hover{background:#F0F2F1;}
.btn-danger{background:var(--warn);color:#fff;}
.btn-danger:hover{opacity:.9;}
.login-error{
  background:var(--warn-soft);
  color:var(--warn);
  font-size:13px;
  padding:9px 12px;
  border-radius:8px;
  margin-bottom:14px;
  display:none;
}
.login-error.show{display:block;}
.login-hint{
  margin-top:18px;
  font-size:11.5px;
  color:#8B9AA5;
  line-height:1.5;
}

/* ===== APP SHELL ===== */
#app{display:none;min-height:100vh;flex-direction:column;}
#app.show{display:flex;}
header.topbar{
  background:var(--panel);
  border-bottom:1px solid var(--line);
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  position:sticky;
  top:0;
  z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{
  width:30px;height:30px;border-radius:8px;
  background:var(--signal);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--font-mono);font-weight:600;font-size:13px;
}
.brand h1{font-size:15px;margin:0;font-weight:700;}
.brand .brand-sub{font-size:11px;color:var(--ink-soft);margin:0;}
.user-chip{
  display:flex;align-items:center;gap:10px;
  font-size:13px;color:var(--ink-soft);
}
.role-tag{
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  padding:3px 8px;
  border-radius:20px;
  background:var(--signal-soft);
  color:var(--signal-dark);
}
.role-tag.admin{background:#FDEBD8;color:#A6560F;}

main{flex:1;padding:20px;max-width:1400px;margin:0 auto;width:100%;}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;
  font-size:13px;opacity:0;transition:all .25s ease;z-index:200;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{background:var(--warn);}
.toast.ok{background:var(--ok);}

</style>
<style>
/* ===== Estilos propios del dashboard de caídas ===== */
  :root{
    --tp:#6600CC; --tm:#00B0F0; --mg:#92D050; --st:#212121;
    --ink:#1A1A1F; --sub:#6B7280; --line:#E5E7EB;
    --crit:#C00000; --med:#B8860B; --good:#00B050;
    --bg:#FFFFFF;
    font-family:'Segoe UI','Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;}
  #caidas-root{background:var(--bg); color:var(--ink);}
  .topbar{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .brand{font-weight:800; font-size:22px;}
  .brand span{color:var(--tm);}
  /* Barra de "última actualización" + pestañas fija al hacer scroll (agosto 2026, pedido explícito:
     poder cambiar de pestaña sin tener que subir hasta arriba). top usa la altura real del header
     principal (--header-h, medida por JS) para no taparlo ni dejar hueco. */
  .sticky-subnav{position:sticky; top:var(--header-h,64px); z-index:15; background:var(--bg); padding-top:12px; margin-top:-12px;}
  /* Modo pantalla (carrusel, agosto 2026): nadie hace scroll frente a una TV, así que se achica todo
     el contenido para que quepa completo en la pantalla mientras el carrusel está activo. */
  main.carrusel-zoom{ zoom: 0.68; }
  /* .noc-grid usa auto-fill (columnas que se ajustan solas al ancho disponible) — con zoom eso mete
     más columnas de las que debería y las tarjetas de tienda salen más chicas que el resto de las
     pestañas (que usan un número fijo de columnas). Fijamos columnas solo en modo pantalla para que
     el achicado sea parejo con todo lo demás. */
  main.carrusel-zoom .noc-grid{ grid-template-columns: repeat(8, minmax(0,1fr)); }
  .status-line{font-size:12px; color:var(--sub); display:flex; gap:8px; align-items:center;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--good); display:inline-block;}

  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:20px; overflow-x:auto;}
  .tab{padding:9px 14px; font-size:13px; font-weight:600; color:var(--sub); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
  .tab.active{color:var(--tp); border-color:var(--tp);}
  .tab:hover{color:var(--ink);}

  .title{font-size:19px; font-weight:700; margin-bottom:2px;}
  .subtitle{color:var(--sub); font-size:13px; margin-bottom:18px;}

  .cards{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:24px;}
  @media (max-width:1100px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:560px){ .cards{grid-template-columns:1fr;} }
  /* Variantes de número de columnas (agosto 2026) — antes cada pestaña fijaba su propio
     grid-template-columns por estilo inline (repeat(2)/(3)/(5)...), lo que GANABA a las
     media queries de arriba sin importar el tamaño de pantalla (un estilo inline siempre
     le gana a una regla de clase) y dejaba tarjetas amontonadas/cortadas en teléfono. Con
     estas clases (misma especificidad extra en cada media query) sí se ajustan solas. */
  .cards.cards-2{grid-template-columns:repeat(2,minmax(0,1fr));}
  @media (max-width:380px){ .cards.cards-2{grid-template-columns:1fr;} }
  .cards.cards-3{grid-template-columns:repeat(3,minmax(0,1fr));}
  @media (max-width:900px){ .cards.cards-3{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:480px){ .cards.cards-3{grid-template-columns:1fr;} }
  .cards.cards-5{grid-template-columns:repeat(5,minmax(0,1fr));}
  @media (max-width:1100px){ .cards.cards-5{grid-template-columns:repeat(3,minmax(0,1fr));} }
  @media (max-width:560px){ .cards.cards-5{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:380px){ .cards.cards-5{grid-template-columns:1fr;} }
  .card{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:linear-gradient(145deg,#FFFFFF,#F2F4F6); box-shadow:0 8px 20px rgba(26,26,31,0.08), 0 2px 6px rgba(26,26,31,0.05); min-width:0;}
  .card .head{padding:9px 14px; font-weight:700; color:#fff; font-size:14px;}
  .card .body{padding:14px;}
  .card .big{font-size:27px; font-weight:800; line-height:1;}
  .card .lbl{font-size:11px; color:var(--sub); margin-top:2px;}
  .card .rule{border-top:1px solid var(--line); margin:8px 0;}
  .pill{display:inline-block; margin-top:8px; font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:20px; border:1.5px solid;}
  .pill.crit{color:var(--crit); border-color:var(--crit);}
  .pill.med{color:var(--med); border-color:var(--med);}
  .pill.good{color:var(--good); border-color:var(--good);}

  .panel{border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:18px; max-width:100%; overflow-x:hidden; background:linear-gradient(160deg,#FFFFFF,#F5F7F8); box-shadow:0 8px 20px rgba(26,26,31,0.07), 0 2px 6px rgba(26,26,31,0.05);}
  .panel h3{margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--sub);}
  canvas{max-height:320px;}

  .editbar{display:flex; justify-content:flex-end; gap:8px; margin-bottom:12px;}
  #caidas-root button{font-family:inherit; font-size:13px; font-weight:600; padding:7px 14px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink);}
  button.primary{background:var(--tp); color:#fff; border-color:var(--tp);}
  button.primary:hover{background:#5400a8;}
  button:hover{background:#f7f7f8;}

  #caidas-root table{width:100%; border-collapse:collapse; font-size:12.5px;}
  #caidas-root th, #caidas-root td{padding:6px 7px; text-align:center; border-bottom:1px solid var(--line);}
  #caidas-root th{color:var(--sub); font-weight:600; font-size:11px; text-transform:uppercase;}
  td:first-child, th:first-child{text-align:left; font-weight:600;}
  input[type=number],input[type=text]{width:56px; padding:4px; border:1px solid var(--line); border-radius:5px; text-align:center; font-size:12.5px;}
  input[type=text]{width:190px; text-align:left;}
  .status-badge{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:10px;}
  .status-badge.critica{background:#FDECEC; color:var(--crit);}
  .status-badge.alerta{background:#FFF3D6; color:#A15C00;}
  .status-badge.atencion{background:#FFF9DB; color:var(--med);}
  .status-badge.estable{background:#E7F7EC; color:var(--good);}

  .servicios-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:6px;}
  @media (max-width:560px){ .servicios-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:340px){ .servicios-grid{grid-template-columns:1fr;} }
  .sv-field label{font-size:11px; color:var(--sub); display:block; margin-bottom:4px;}
  .sv-field input{width:100%;}

  .placeholder{border:1.5px dashed var(--line); border-radius:12px; padding:32px 26px; text-align:center; color:var(--sub);}
  .placeholder h3{color:var(--ink); font-size:16px; margin-bottom:8px;}
  .placeholder ul{text-align:left; max-width:460px; margin:16px auto 0; font-size:13px; line-height:1.7;}

  .toast{position:fixed; bottom:20px; right:20px; background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transform:translateY(8px); transition:.25s; z-index:99;}
  .toast.show{opacity:1; transform:translateY(0);}
  .foot{font-size:11px; color:var(--sub); margin-top:6px;}
  #caidas-root:not(.is-admin) .foot{display:none;}

  @media (max-width:1366px){
    .title{font-size:17px;}
    .card .big{font-size:22px;}
    .panel{padding:14px 16px;}
  }
  @media (max-width:640px){
    .title{font-size:16px;}
    .subtitle{font-size:12px;}
    .card .big{font-size:19px;}
    .card .head{font-size:13px; padding:7px 10px;}
    .panel{padding:12px 14px;}
    #caidas-root table{font-size:11.5px;}
  }

  .uploadbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:16px; background:#FAFAFB;}
  .uploadbar .txt{font-size:12px; color:var(--sub); flex:1; min-width:220px;}
  .uploadbar .txt b{color:var(--ink);}
  button.upload{background:var(--tm); color:#fff; border-color:var(--tm);}
  button.upload:hover{background:#0090c8;}
  button.upload:disabled{opacity:.55; cursor:default;}
  .upload-summary{font-size:11.5px; color:var(--good); margin-top:2px;}
  .upload-error{font-size:11.5px; color:var(--crit); margin-top:2px;}

  /* ===== Guardias (Soporte IT) — agosto 2026: rotación de sábado y domingo por ingeniero ===== */
  .guardia-hero{border-radius:14px; padding:14px 16px; color:#fff; min-width:0; box-shadow:0 8px 18px rgba(26,26,31,0.18), 0 2px 6px rgba(26,26,31,0.08);}
  .guardia-hero .tag{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; opacity:.85;}
  .guardia-hero .nombre{font-size:20px; font-weight:700; margin-top:4px;}
  .guardia-hero .rango{font-size:12px; opacity:.9; margin-top:2px;}
  .guardia-mes{margin-bottom:16px;}
  .guardia-mes h4{font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--sub); margin:0 0 8px; font-weight:700;}
  .guardia-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; font-size:13px; flex-wrap:wrap;}
  .guardia-row.es-actual{border-color:#0D9488; background:#F0FDFA;}
  .guardia-row.es-proxima{border-color:#94A3B8; background:#F8FAFC;}
  .guardia-row .fecha{color:var(--ink); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .guardia-row .fecha .tagmini{font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:2px 7px; border-radius:20px; color:#fff;}
  .guardia-row .fecha .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .guardia-toggle{display:block; width:100%; text-align:center; margin:6px 0 14px; padding:9px; border:1px dashed var(--line); border-radius:8px; background:#FAFAFB; color:var(--tm); font-size:12.5px; font-weight:700; cursor:pointer;}
  .guardia-toggle:hover{background:#F0F7FB; border-color:var(--tm);}

  /* ===== Apartados nuevos (Envíos y Recolecciones / Resumen y detalle de Reemplazos) — agosto 2026 ===== */
  .note-row{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:8px;}
  @media (max-width:900px){ .note-row{grid-template-columns:1fr;} }
  .note{border-radius:10px; padding:12px 14px; font-size:12.5px; line-height:1.5;}
  .note b{display:block; font-size:12.5px; margin-bottom:4px;}
  .note.green{background:#E6F5EC; color:#14532D;}
  .note.red{background:#FBE9E4; color:#7A1F1F;}
  .note.blue{background:#E3F1F2; color:#0A4A54;}
  .resumen3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media (max-width:900px){ .resumen3{grid-template-columns:1fr;} }
  .rescard{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff;}
  .rescard .rhead{color:#fff; font-weight:700; font-size:14px; padding:10px 16px;}
  .rescard .rbig{font-size:30px; font-weight:800; padding:16px 16px 2px;}
  .rescard .rsub{font-size:11.5px; color:var(--sub); padding:0 16px 14px;}
  .rescard .rrow{display:flex; justify-content:space-between; padding:9px 16px; font-size:12.5px; border-top:1px solid var(--line);}
  .rescard .rrow b{font-size:14px;}

  /* ===== Estatus de Servicio (Internet) — fondo blanco + rotativo, agosto 2026 =====
     A petición explícita del cliente: fondo BLANCO (no el tema oscuro que tenía antes), tiendas
     caídas siempre fijas al inicio (nunca rotan), y el resto ("en línea") rotando cada 15 segundos
     en páginas de hasta 40 en pantalla, hasta cubrir las 622. Sin filtros ni botón de "Actualizar"
     (se quitaron antes a petición explícita) — todo el refresco es automático. */
  .noc-wrap{background:#fff; border-radius:14px; padding:22px 24px; margin:-4px 0 4px; color:var(--ink); border:1px solid var(--line);}
  .noc-head{display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:4px;}
  .noc-title{display:flex; align-items:center; gap:10px; font-size:16px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink); font-family:'JetBrains Mono',ui-monospace,monospace;}
  .noc-live{width:9px; height:9px; border-radius:50%; background:#1E8E5A; animation:nocPulse 1.6s infinite;}
  @keyframes nocPulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .noc-sub{font-size:11.5px; color:var(--sub); margin:2px 0 16px;}
  .noc-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px;}
  @media (max-width:900px){ .noc-stats{grid-template-columns:repeat(2,1fr);} }
  .noc-stat{background:#FAFBFB; border:1px solid var(--line); border-radius:10px; padding:14px 16px; text-align:center;}
  .noc-stat .num{font-size:26px; font-weight:700; font-family:'JetBrains Mono',ui-monospace,monospace; color:var(--ink);}
  .noc-stat .lbl{font-size:10px; color:var(--sub); text-transform:uppercase; letter-spacing:.04em; margin-top:4px;}
  .noc-alert{display:flex; align-items:center; gap:10px; background:#FECACA; border:1px solid #DC2626; color:#DC2626; border-radius:10px; padding:10px 16px; font-size:12.5px; font-weight:600; margin-bottom:16px;}
  .noc-live-dot{width:8px; height:8px; border-radius:50%; background:#DC2626; animation:nocPulse 1s infinite; flex-shrink:0;}
  .noc-toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
  .noc-legend{display:flex; gap:16px; font-size:11.5px; color:var(--sub); align-items:center;}
  .noc-legend span{display:flex; align-items:center; gap:6px;}
  .noc-dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .noc-dot.on{background:#1E8E5A;}
  .noc-dot.off{background:#DC2626;}
  .noc-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:10px;}
  .noc-card{background:#FAFBFB; border:1px solid var(--line); border-radius:10px; padding:12px 10px; text-align:center; position:relative; cursor:pointer; transition:transform .12s ease, border-color .12s ease;}
  .noc-card:hover{transform:translateY(-2px); border-color:#9AA6A5;}
  .noc-card.caida{border-color:#F87171; background:#FECACA;}
  .noc-card.caida:hover{border-color:#DC2626;}
  .noc-card .noc-dot{position:absolute; top:8px; right:8px; width:10px; height:10px; animation:nocPulse 1.6s infinite;}
  .noc-card.caida .noc-dot{animation:nocPulse 1s infinite;}
  .noc-card .noc-plaza{font-size:10px; font-weight:700; line-height:1.25; margin:4px 0 6px; min-height:24px; color:var(--ink);}
  .noc-carrier-badge{display:inline-block; font-size:9px; font-weight:700; letter-spacing:.02em; padding:2px 8px; border-radius:20px; color:#fff; text-transform:uppercase; white-space:nowrap;}
  .noc-estado{font-size:9.5px; font-weight:700; margin-top:6px; text-transform:uppercase; letter-spacing:.03em; font-family:'JetBrains Mono',ui-monospace,monospace;}
  .noc-card.en-linea .noc-estado{color:#1E8E5A;}
  .noc-card.caida .noc-estado{color:#DC2626;}
  .noc-foot{font-size:10.5px; color:var(--sub); margin-top:16px;}
  .noc-overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;}
  .noc-modal{background:#fff; border:1px solid var(--line); border-radius:14px; padding:24px; width:100%; max-width:420px; color:var(--ink); box-shadow:0 12px 40px rgba(18,32,49,0.14);}
  .noc-modal h3{margin:0 0 4px; font-size:17px; font-family:'JetBrains Mono',ui-monospace,monospace;}
  .noc-modal-sub{font-size:11.5px; color:var(--sub); margin-bottom:16px;}
  .noc-modal-row{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .noc-modal-row span:first-child{color:var(--sub);}
  .noc-modal-row b{color:var(--ink); font-weight:600; text-align:right;}
  #caidas-root .noc-modal-close{margin-top:18px; width:100%; background:var(--ink); color:#fff; border:none; border-radius:8px; padding:10px; font-size:13px; cursor:pointer; font-family:inherit;}
  #caidas-root .noc-modal-close:hover{background:#2c3a4a;}
  .noc-modal-status{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:4px 10px; border-radius:20px; margin-bottom:14px;}
  .noc-modal-status.caida{background:#FECACA; color:#DC2626;}
  .noc-modal-status.en-linea{background:#E6F5EC; color:#1E8E5A;}

  /* ===== Budget IT 2026 ===== */
  #tbl-budget-it{min-width:1710px; table-layout:fixed;}
  /* Proveedor / Categoría / Moneda / Presup. quedan fijas (sticky) al hacer scroll horizontal para llegar al mes que se necesita editar */
  #tbl-budget-it .bi-prov{position:sticky; left:0; z-index:2; background:#fff; text-align:left; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #tbl-budget-it .bi-cat{position:sticky; left:200px; z-index:2; background:#fff; text-align:left; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #tbl-budget-it .bi-moneda{position:sticky; left:330px; z-index:2; background:#fff; text-align:center; color:var(--sub); font-weight:600;}
  #tbl-budget-it .bi-presup{position:sticky; left:400px; z-index:2; background:#fff; border-right:2px solid var(--line);}
  #tbl-budget-it thead th.bi-prov, #tbl-budget-it thead th.bi-cat, #tbl-budget-it thead th.bi-moneda, #tbl-budget-it thead th.bi-presup{background:#fff; z-index:3;}
  #tbl-budget-it tr.bi-totales .bi-prov, #tbl-budget-it tr.bi-totales .bi-cat, #tbl-budget-it tr.bi-totales .bi-moneda, #tbl-budget-it tr.bi-totales .bi-presup{background:#FAFAFB;}
  #tbl-budget-it td.bi-locked{background:#F4F5F7; color:var(--sub); position:relative;}
  #tbl-budget-it td.bi-locked::after{content:'🔒'; font-size:8px; position:absolute; top:1px; right:2px; opacity:.5;}
  #tbl-budget-it input.bi-proyectado{color:var(--sub); font-style:italic; background:#FBFBFC;}
  #tbl-budget-it tr.bi-totales td{font-weight:700; border-top:2px solid var(--ink); background:#FAFAFB;}
  #tbl-budget-it tr.bi-presupuesto td{color:var(--sub); font-style:italic;}
  #tbl-budget-it tr.bi-ahorro td.pos{color:var(--good); font-weight:700;}
  #tbl-budget-it tr.bi-ahorro td.neg{color:var(--crit); font-weight:700;}
  .bi-legend{display:flex; gap:16px; margin:10px 0 0; font-size:11.5px; color:var(--sub); flex-wrap:wrap;}
  .bi-legend span{display:inline-flex; align-items:center; gap:5px;}
  .bi-swatch{width:10px; height:10px; border-radius:3px; display:inline-block; border:1px solid var(--line);}
  .bi-swatch.locked{background:#F4F5F7;}
  .bi-swatch.real{background:#fff;}
  .bi-swatch.proy{background:#FBFBFC; border-style:dashed;}
  .bi-insight{display:flex; gap:9px; padding:10px 11px; border-radius:8px; background:#FAFAFB; border:1px solid var(--line); margin-bottom:9px; border-left:3px solid var(--line);}
  .bi-insight.mejora{border-left-color:var(--med);}
  .bi-insight.riesgo{border-left-color:var(--crit);}
  .bi-insight.oportunidad{border-left-color:var(--good);}
  .bi-insight .body b{display:block; font-size:12.5px; margin-bottom:2px;}
  .bi-insight .body span{font-size:12px; color:var(--sub); line-height:1.4;}

  /* Barra de progreso "presupuesto anual vs. proyección" (bullet bar) */
  .bi-bullet-wrap{padding:10px 2px 0;}
  .bi-bullet-track{position:relative; height:34px; border-radius:8px; background:#EEF1F1; border:1px solid var(--line); overflow:hidden;}
  .bi-bullet-seg{position:absolute; top:0; left:0; height:100%;}
  .bi-bullet-real{background:#0C8599; z-index:2;}
  .bi-bullet-proj{background:repeating-linear-gradient(135deg, #0C8599 0 5px, #cfe9ec 5px 10px); opacity:.75; border-right:2px solid #0A6B79; z-index:1;}
  .bi-bullet-labels{display:flex; justify-content:space-between; margin-top:8px; font-size:11px; color:var(--sub);}
  .bi-bullet-legend{display:flex; gap:14px; margin-top:10px; font-size:11px; color:var(--sub); flex-wrap:wrap;}
  .bi-bullet-legend span{display:inline-flex; align-items:center; gap:5px;}
  .bi-sw{width:12px; height:12px; border-radius:3px; display:inline-block;}
  .bi-sw.real{background:#0C8599;}
  .bi-sw.proj{background:repeating-linear-gradient(135deg, #0C8599 0 2px, #cfe9ec 2px 4px); border:1px solid #0A6B79;}
  .bi-sw.gap{background:#fff; border:1.5px dashed var(--sub);}
  .bi-bullet-callout{margin-top:12px; background:#E7F7EC; border-radius:8px; padding:9px 12px; font-size:12.5px; color:var(--good); font-weight:600;}
  .bi-bullet-callout.warn{background:#FDECEC; color:var(--crit);}
</style>
</head>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCIQGZGwNEw3vAlL4clGVbClLYCcUy3CYU",
  authDomain: "primemx-consumibles.firebaseapp.com",
  projectId: "primemx-consumibles",
  storageBucket: "primemx-consumibles.firebasestorage.app",
  messagingSenderId: "796822637748",
  appId: "1:796822637748:web:7e8db90898618d26079be1"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const ROLES_COLLECTION = "usuarios";
const AUTH_DOMAIN = "primecomms.mx";
let currentUser = null;

function toast(msg, type=""){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(()=> el.className = 'toast', 2500);
}

/* LOGIN (mismo mecanismo que Directorio de Tiendas: usuario+contraseña de Firebase Auth) */
document.getElementById('login-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const u = document.getElementById('login-user').value.trim().toLowerCase();
  const p = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  try{
    await auth.signInWithEmailAndPassword(u + '@' + AUTH_DOMAIN, p);
    errEl.classList.remove('show');
    localStorage.setItem('primemx_sesion_inicio', String(Date.now()));
    db.collection('accesos_dashboard').add({ usuario: u, fecha: new Date().toISOString() })
      .catch(err2=>console.error('No se pudo registrar el acceso', err2));
  }catch(err){
    console.error(err);
    errEl.textContent = 'No se pudo entrar (' + (err.code || err.message || 'error desconocido') + ').';
    errEl.classList.add('show');
  }
  submitBtn.disabled = false;
});

document.getElementById('logout-btn').addEventListener('click', function(){
  localStorage.removeItem('primemx_sesion_inicio');
  auth.signOut();
});

// Caducidad de sesión (agosto 2026, pedido explícito del cliente — reemplaza la nota anterior de que
// esto se había quitado): 10 horas desde que se inició sesión, sin importar actividad. El timestamp de
// inicio (primemx_sesion_inicio) es compartido entre las 3 apps (mismo origen/localStorage), para que
// el reloj de 10h sea uno solo aunque se navegue entre Dashboard/Directorio/Consumibles.
const SESION_DURACION_MS = 10 * 60 * 60 * 1000;
function sesionExpirada(){
  const inicio = Number(localStorage.getItem('primemx_sesion_inicio') || 0);
  return !inicio || (Date.now() - inicio) > SESION_DURACION_MS;
}
setInterval(()=>{
  if(currentUser && sesionExpirada()){
    localStorage.removeItem('primemx_sesion_inicio');
    auth.signOut();
    toast('Tu sesión expiró después de 10 horas. Vuelve a iniciar sesión.', 'error');
  }
}, 5 * 60 * 1000);

document.getElementById('link-olvide-pass').addEventListener('click', function(e){
  e.preventDefault();
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('reset-pass-box').style.display = 'block';
  document.getElementById('reset-user').value = document.getElementById('login-user').value || '';
  document.getElementById('login-error').classList.remove('show');
});

document.getElementById('link-cancelar-reset').addEventListener('click', function(e){
  e.preventDefault();
  document.getElementById('reset-pass-box').style.display = 'none';
  document.getElementById('login-form').style.display = '';
  document.getElementById('reset-msg').style.display = 'none';
});

// Vuelve a funcionar de verdad (agosto 2026): AUTH_DOMAIN ya es primecomms.mx, el dominio real de la
// empresa, después de migrar las 10 cuentas de Firebase Authentication de @primecommsmx.com. Solo
// llegará el correo si esa cuenta específica tiene buzón real en Office 365 (algunas genéricas como
// admin/admincaidas/tienda podrían no tenerlo).
document.getElementById('btn-reset-pass').addEventListener('click', async function(){
  const u = document.getElementById('reset-user').value.trim().toLowerCase();
  const msg = document.getElementById('reset-msg');
  if(!u){
    msg.textContent = 'Escribe tu usuario primero.';
    msg.style.color = 'var(--warn)';
    msg.style.display = 'block';
    return;
  }
  const btn = document.getElementById('btn-reset-pass');
  btn.disabled = true;
  try{
    await auth.sendPasswordResetEmail(u + '@' + AUTH_DOMAIN);
    msg.textContent = 'Listo. Revisa tu correo (' + u + '@' + AUTH_DOMAIN + ') para crear una contraseña nueva.';
    msg.style.color = 'var(--ok)';
  }catch(err){
    console.error(err);
    // Mensaje genérico a propósito: no confirmamos si el usuario existe o no.
    msg.textContent = 'Si el usuario existe, te llegará un correo para restablecer la contraseña.';
    msg.style.color = 'var(--ink-soft)';
  }
  msg.style.display = 'block';
  btn.disabled = false;
});

auth.onAuthStateChanged(async function(user){
  if(user && sesionExpirada()){
    localStorage.removeItem('primemx_sesion_inicio');
    auth.signOut();
    return;
  }
  if(user){
    const username = (user.email || '').split('@')[0];
    let roleInfo = { role: 'consulta', label: username };
    try{
      const doc = await db.collection(ROLES_COLLECTION).doc(username).get();
      if(doc.exists){
        roleInfo = { role: doc.data().role || 'consulta', label: doc.data().label || username };
      }
    }catch(err){
      console.error('No se pudo leer el rol del usuario', err);
    }
    currentUser = { username, role: roleInfo.role, label: roleInfo.label };
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('show');
    document.getElementById('user-label').textContent = currentUser.label;
    const roleTag = document.getElementById('role-tag');
    roleTag.textContent = currentUser.role === 'admin' ? 'Administrador' : 'Consulta';
    roleTag.className = 'role-tag' + (currentUser.role === 'admin' ? ' admin' : '');
    window.initCaidasApp(currentUser.role);
    const enlaceConsumibles = document.getElementById('link-a-consumibles');
    if(enlaceConsumibles) enlaceConsumibles.style.display = (currentUser.username === 'marafic') ? 'none' : '';
  } else {
    currentUser = null;
    document.getElementById('app').classList.remove('show');
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-pass').value = '';
  }
});
</script>

<!-- Dashboard de caídas (lógica propia) -->
<script>
(function(){
  const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Sep.','Octubre','Nov.','Dic.'];
  const FIRESTORE_COLLECTION = 'caidas_dashboard';
  const FIRESTORE_DOC = 'estado';
  const COLOR = { TotalPlay:'#6600CC', Telmex:'#00B0F0', Metrocarrier:'#66BB6A' };
  const CARD_COLOR = { TotalPlay:'#6600CC', Telmex:'#29B6F6', Megacable:'#92D050', Starlink:'#212121' };
  const COLOR_2025 = { TotalPlay:'#CBB6E8', Telmex:'#B3E5FC', Metrocarrier:'#B39DDB' };
  const COLOR_COMBINADO = '#4012A5'; // (sin usar ya, se deja por compatibilidad histórica)
  // Paleta ejecutiva (agosto 2026) — un color de identidad vivo por pestaña, para las tarjetas/encabezados
  // de TODO lo que NO sea la sección de Internet (esa conserva sus colores de carrier tal cual).
  const COLOR_SOPORTE = '#1A56DB';       // Tickets Soporte — azul
  const COLOR_SOPORTE_CLARO = '#93C5FD'; // Tickets Soporte — comparativo año anterior
  const COLOR_MESA = '#7C3AED';          // Tickets Mesa de control — violeta
  const COLOR_PDV = '#4C1D95';           // Equipos PDV Región — púrpura profundo
  const COLOR_PDV_CERRADO = '#D97706';   // Equipos PDV Región — acento ámbar para "Laptop PDV cerrado"
  const COLOR_EXPANSION = '#1E3A8A';     // Plan de expansión — azul marino
  const COLOR_CIERRE = '#7F1D1D';        // Cierre de tiendas — rojo vino (agosto 2026)
  const COLOR_WIN11 = '#0F6E56';         // Migración Win11 — verde esmeralda (avance)
  // Sombra suave para barras/líneas/puntos en TODAS las gráficas del dashboard (agosto 2026, estilo
  // "con profundidad" pedido por Dirección). Plugin global de Chart.js: no requiere tocar cada gráfica
  // una por una, aplica solo mientras se dibujan los datasets (no afecta ejes ni leyenda).
  if(typeof Chart !== 'undefined'){
    Chart.register({
      id: 'profundidadDashboard',
      beforeDatasetsDraw(chart){
        chart.ctx.save();
        chart.ctx.shadowColor = 'rgba(26,26,31,0.22)';
        chart.ctx.shadowBlur = 6;
        chart.ctx.shadowOffsetX = 0;
        chart.ctx.shadowOffsetY = 3;
      },
      afterDatasetsDraw(chart){
        chart.ctx.restore();
      }
    });
  }
  // Degradado vertical para relleno de barras (mismo tratamiento que se usa en cardGrad, pero como
  // CanvasGradient para Chart.js). Usado por renderBarLineApartado para las gráficas de barra+línea.
  function gradienteBarra(canvasEl, hex){
    const ctx = canvasEl.getContext('2d');
    const alto = canvasEl.height || 300;
    const g = ctx.createLinearGradient(0, 0, 0, alto);
    const h = hex.replace('#','');

    const claro = '#' + [r,gg,b].map(x=>Math.min(255,Math.round(x*1.35+40)).toString(16).padStart(2,'0')).join('');

  // Degradado sutil para encabezados de tarjeta/panel — misma tonalidad, más profundo al 72%, para un
  // acabado más "premium" en presentaciones a Dirección. Solo se usa en fondos, nunca en texto.
  function cardGrad(hex){
    const h = hex.replace('#','');
    const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
    const dark = '#' + [r,g,b].map(x=>Math.max(0,Math.round(x*0.72)).toString(16).padStart(2,'0')).join('');
    return `linear-gradient(135deg, ${hex} 0%, ${dark} 100%)`;
  }
  // Formato numérico es-MX (1,234) — usado por los apartados nuevos de Envíos/Reemplazos (agosto 2026).
  function fmtMX(n){ return Number(n||0).toLocaleString('es-MX'); }
  // Catálogo de tiendas EN VIVO (agosto 2026, homologación con Directorio) — antes esta constante traía
  // una copia fija de ~620 tiendas escrita a mano dentro del propio dashboard.html, que se iba
  // desincronizando cada vez que alguien abría/cerraba una tienda o le cambiaba el carrier en Directorio
  // (ver "Auditoría: catálogos y sincronización", agosto 2026). Ahora Dashboard IT lee la colección
  // `tiendas` de Directorio en tiempo real (mismo proyecto Firebase) al abrir la app y cada vez que se
  // entra a una pestaña que la necesita si el dato ya tiene más de 60 segundos — ver cargarCatalogoVivo()
  // y asegurarCatalogoVivoFresco() más abajo. `catalogoVivo.porNombre` incluye TODAS las tiendas (activas
  // e inactivas, para no perder el Carrier/Tecnología de tickets históricos de tiendas ya cerradas);
  // `catalogoVivo.activasPorCarrier` solo cuenta activas y alimenta el Peer de Resumen 2026 y las
  // tarjetas "Servicios" de Tendencia mensual, que antes eran un número fijo editado a mano.
  const CARRIER_DASHBOARD_LABEL = { 'TOTALPLAY':'TotalPlay', 'TELMEX':'Telmex', 'MEGA CABLE':'Megacable', 'STARLIK':'Starlink' };
  let catalogoVivo = { cargado:false, cargando:false, error:null, porNombre:{}, activasPorCarrier:{ TotalPlay:0, Telmex:0, Megacable:0, Starlink:0 }, actualizado:null };
  // Calendario de caídas — 100% independiente del Excel de tickets. Lee en vivo la colección
  // `fallas` de Directorio (mismo Firebase), filtrando Tipo="Sin servicio". El día es la fecha
  // de captura de la falla; el estatus es "Abierto" si no tiene fecha_cierre, o "Cerrado" si ya
  // se cerró. Se organiza por mes (0=Enero...11=Diciembre) para el selector del calendario.
  let calendarioFallas = { cargado:false, cargando:false, error:null, porMes:{}, actualizado:null };
  // Fecha completa + hora juntos (agosto 2026) — una falla puede abrirse un día y cerrarse días
  // después, así que la hora sola es ambigua sin saber a qué día pertenece. Ej: "Lunes 01 Ago 11:43 am".
  // Se arma a mano (no con toLocaleTimeString con hour12) porque el formato es-MX de Intl mete
  // "a. m."/"p. m." con puntos y espacio raro en vez de un limpio "am"/"pm".
  function diaHoraTexto(fecha){
    const dia = fecha.toLocaleDateString('es-MX', {weekday:'long'});
    const diaCap = dia.charAt(0).toUpperCase() + dia.slice(1);
    const diaNum = String(fecha.getDate()).padStart(2,'0');
    const mes = MESES_CORTOS_BI[fecha.getMonth()];
    let h = fecha.getHours();
    const m = String(fecha.getMinutes()).padStart(2,'0');
    const ampm = h >= 12 ? 'pm' : 'am';

  async function cargarCalendarioFallas(opts){
    const silencioso = !!(opts && opts.silencioso);
    if(calendarioFallas.cargando) return;
    calendarioFallas.cargando = true;
    if(!silencioso && state) render();
    try{
      const [snapTiendas, snapFallas] = await Promise.all([
        db.collection('tiendas').get(),
        db.collectionGroup('fallas').get()
      ]);
      const tiendaPorId = {};
      snapTiendas.docs.forEach(d=>{
        const t = d.data();
        const label = CARRIER_DASHBOARD_LABEL[String(t.carrier||'').toUpperCase().trim()] || (t.carrier||'—');
        tiendaPorId[d.id] = { plaza: t.plaza || 'Tienda no encontrada', carrier: label };
      });
      const porMes = {};
      snapFallas.docs.forEach(d=>{
        const f = d.data();
        if(String(f.tipo||'').trim() !== 'Sin servicio') return; // filtramos aquí, no en la consulta
        const fc = f.fecha_captura ? new Date(f.fecha_captura) : null;
        if(!fc || isNaN(fc)) return;
        const storeId = d.ref.parent.parent.id;
        const tienda = tiendaPorId[storeId] || { plaza:'Tienda no encontrada', carrier:'—' };
        const mesIdx = fc.getMonth(), dia = fc.getDate();
        if(!porMes[mesIdx]) porMes[mesIdx] = { caidas_por_dia:{}, detalle_por_dia:{} };
        const celda = porMes[mesIdx];
        celda.caidas_por_dia[dia] = (celda.caidas_por_dia[dia]||0) + 1;
        if(!celda.detalle_por_dia[dia]) celda.detalle_por_dia[dia] = [];
        const fCierre = f.fecha_cierre ? new Date(f.fecha_cierre) : null;
        const cierreValido = fCierre && !isNaN(fCierre);
        celda.detalle_por_dia[dia].push({
          tienda: tienda.plaza,
          carrier: tienda.carrier,
          horaAlta: diaHoraTexto(fc),
          horaCierre: cierreValido ? diaHoraTexto(fCierre) : null,
          tardoHoras: cierreValido ? Math.round(((fCierre - fc) / 3600000) * 10) / 10 : null,
          estatus: f.fecha_cierre ? 'Cerrado' : 'Abierto'
        });
      });
      calendarioFallas = { cargado:true, cargando:false, error:null, porMes, actualizado:new Date().toISOString() };
    }catch(err){
      console.error('No se pudo cargar el calendario de fallas desde Directorio', err);
      calendarioFallas.cargando = false;
      calendarioFallas.error = 'No se pudo cargar el calendario desde el Directorio de Tiendas.';
    }
    if(state) render();
  }
  function asegurarCalendarioFallasFresco(){
    if(calendarioFallas.cargando) return;
    const stale = !calendarioFallas.actualizado || (Date.now() - new Date(calendarioFallas.actualizado).getTime()) > 60000;
    if(!calendarioFallas.cargado || stale) cargarCalendarioFallas({silencioso:true});
  }

  async function cargarCatalogoVivo(opts){
    const silencioso = !!(opts && opts.silencioso);
    if(catalogoVivo.cargando) return;
    catalogoVivo.cargando = true;
    // Ojo: al iniciar la app, cargarCatalogoVivo() corre en paralelo con load() (ver initCaidasApp) y
    // puede llegar a este punto ANTES de que load() termine de poner `state` (arranca en null) — llamar
    // a render() aquí sin este guard tronaría con "Cannot read properties of null" en cada carga de la
    // página. Si `state` todavía no existe, no hace falta repintar nada: la primera pintura la hace
    // load() en cuanto termine, y ya va a mostrar el placeholder "…" de las tarjetas de Servicios.
    if(!silencioso && state) render();
    try{
      const snap = await db.collection('tiendas').get();
      const porNombre = {};
      const activasPorCarrier = { TotalPlay:0, Telmex:0, Megacable:0, Starlink:0 };
      snap.docs.forEach(d=>{
        const t = d.data();
        const nombre = String(t.plaza||'').toUpperCase().trim();
        if(!nombre) return;
        porNombre[nombre] = { carrier: t.carrier, tecnologia: t.tecnologia };
        const label = CARRIER_DASHBOARD_LABEL[String(t.carrier||'').toUpperCase().trim()];
        if(label && String(t.activo)==='1') activasPorCarrier[label]++;
      });
      catalogoVivo = { cargado:true, cargando:false, error:null, porNombre, activasPorCarrier, actualizado:new Date().toISOString() };
    }catch(err){
      console.error('No se pudo cargar el catálogo en vivo de Directorio', err);
      catalogoVivo.cargando = false;
      catalogoVivo.error = 'No se pudo leer el catálogo de tiendas desde Directorio.';
    }
    // Mismo guard que arriba: si `state` sigue sin existir (load() todavía no resolvió), no hay nada
    // que repintar todavía — cuando load() termine, su propio render() ya va a leer catalogoVivo fresco.
    if(state) render();
  }

  // Top 15, Migración de carrier) — si el último dato tiene más de 60 segundos, lo refresca en silencio
  // (sin pantalla de carga) para no golpear Firestore en cada clic de pestaña, pero sí quedar "casi en
  // vivo" contra cualquier cambio reciente en Directorio.
  function asegurarCatalogoVivoFresco(){

  async function cargarEstatusServicio(opts){

    // por debajo, para no interrumpir a quien esté viendo el tablero o el detalle de una tienda.

      const [snapTiendas, snapFallas] = await Promise.all([
        db.collection('tiendas').get(),
        db.collectionGroup('fallas').where('fecha_cierre','==',null).get()
      ]);
      const tiendas = snapTiendas.docs
        .map(d=>({ id:d.id, ...d.data() }))
        .filter(t=> String(t.activo)==='1');
      tiendas.sort((a,b)=> String(a.plaza||'').localeCompare(String(b.plaza||''), 'es'));
      const fallasPorTienda = new Map();
      snapFallas.docs.forEach(d=>{
        const storeId = d.ref.parent.parent.id;

      });
      estatusServicio = { cargado:true, cargando:false, error:null, tiendas, fallasPorTienda, actualizado:new Date().toISOString() };
    }catch(err){
      console.error('No se pudo cargar el estatus de servicio', err);
      // En modo silencioso (refresco automático) no se rompe la pantalla si un ciclo falla —
      // se deja el último dato bueno tal cual y se reintenta solo en el siguiente ciclo de 3 min.
      if(!silencioso){
        estatusServicio.cargado = false;
        estatusServicio.cargando = false;
        estatusServicio.error = 'No se pudo cargar el estatus de servicio desde el Directorio de Tiendas. Intenta de nuevo.';
      }

  // ---------- Carga de archivo de tickets (Excel) ----------
  const DIST_LABELS = ['<4h','4-12h','12-24h','1-3d','>3d'];

  function parseFechaTicket(v){
    if(!v) return null;
    if(v instanceof Date) return isNaN(v.getTime()) ? null : v;
    const s = String(v).trim();
    const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s*(\d{1,2}):(\d{2})/);
    if(!m) return null;
    const [,d,mo,y,h,mi] = m.map(Number);
    const dt = new Date(y, mo-1, d, h, mi);
    return isNaN(dt.getTime()) ? null : dt;
  }
  // A qué proveedor y si cuenta como "caída" según la categoría del ticket
  // El campo "Cliente" de los tickets trae un alias pegado antes del nombre real de la tienda
  // (ej. "CDMX FLORENCIA PRM TDA CDMX FLORENCIA"). El nombre correcto es lo que empieza en la ÚLTIMA
  // aparición de "PRM TDA" (o "PRM " si esa tienda no usa "TDA"), para no cortar a la mitad si el
  // propio alias también arranca con "PRM TDA".
  // Correcciones manuales de nombre: cuando el ticket trae un alias distinto al nombre real de catálogo.
  // Clave = nombre tal como sale de extraerNombreCanonico(); valor = nombre correcto (el del catálogo).
  const CORRECCIONES_NOMBRE = {
    'PRM TDA IRAPUATO BERRIOZABAL CENTRO': 'PRM TDA IRAPUATO DE BERRIOZABAL',
    'PRM TDA HEB LOS MORALES SAN NICOLAS': 'PRM TDA HEB LOS MORALES NICOLAS',
    'PRM TDA MIGUEL ANGEL DE QUEVEDO CDMX': 'PRM TDA MIGUEL A DE QUEVEDO CDMX',
    'PRM TDA GOMEZ PALACIO LAS ROSAS': 'PRM TDA TORREON GOMEZ PALACIO LAS ROSAS'
  };

  function extraerNombreCanonico(cliente){
    if(!cliente) return '';
    const c = String(cliente).trim();
    const up = c.toUpperCase();
    let idx = up.lastIndexOf('PRM TDA');
    if(idx === -1) idx = up.lastIndexOf('PRM ');
    if(idx === -1) return c;
    const nombre = c.slice(idx).trim();
    return CORRECCIONES_NOMBRE[nombre.toUpperCase()] || nombre;
  }
  // Busca Carrier/Tecnología en el catálogo EN VIVO (catalogoVivo.porNombre, leído de Directorio —
  // ver arriba) por nombre canónico exacto (mayúsculas), con un segundo intento quitando/agregando
  // "TDA" (el catálogo no siempre lo incluye).
  function buscarCatalogo(nombreCanonico){
    const up = String(nombreCanonico).toUpperCase();
    const alt = up.includes('PRM TDA ') ? up.replace('PRM TDA ', 'PRM ') : up.replace('PRM ', 'PRM TDA ');
    const catalogo = catalogoVivo.porNombre;
    let info = catalogo[up] || catalogo[alt];
    if(!info){
      // Regla de identidad (agosto 2026): el nombre que trae el ticket puede venir TRUNCADO (el sistema de
      // origen recorta "Cliente" a cierta longitud), ej. "...PLAZA PUERTO PA" en vez de "...PUERTO PARAISO".
      // Si ese nombre truncado es el INICIO de una sola tienda del catálogo (ya la tenemos completa ahí),
      // se usa esa tienda completa. Si el prefijo calza con más de una tienda (ambiguo), se deja sin
      // resolver ("—"/"—") en vez de adivinar mal — mejor que quede pendiente de revisión manual.
      const candidatos = Object.keys(catalogo).filter(k => k.startsWith(up) || k.startsWith(alt));
      if(candidatos.length === 1) info = catalogo[candidatos[0]];
    }
    return info ? { carrier: info.carrier, tecnologia: info.tecnologia } : { carrier: '—', tecnologia: '—' };
  }

  function proveedorCaida(categoria){
    if(!categoria) return null;
    const c = String(categoria);
    if(!c.startsWith('Internet y telefonia')) return null;
    const esCaida = c.includes('Sin servicio');
    if(!esCaida) return null;
    if(c.includes('Totalplay')) return 'TotalPlay';
    if(c.includes('Telmex')) return 'Telmex';
    if(c.includes('Metro Carrier')) return 'Metrocarrier';
    return null;
  }
  // Problemas de velocidad se mide aparte: ya NO cuenta como "caída", pero se muestra
  // como tendencia informativa en Top 15 TotalPlay/Telmex.
  function proveedorVelocidad(categoria){
    if(!categoria) return null;
    const c = String(categoria);
    if(!c.startsWith('Internet y telefonia')) return null;
    if(!c.includes('Problemas con velocidad')) return null;
    if(c.includes('Totalplay')) return 'TotalPlay';
    if(c.includes('Telmex')) return 'Telmex';
    if(c.includes('Metro Carrier')) return 'Metrocarrier';
    return null;
  }
  function median(sortedArr){
    const n = sortedArr.length;
    if(n===0) return 0;
    const mid = Math.floor(n/2);
    return n%2 ? sortedArr[mid] : (sortedArr[mid-1]+sortedArr[mid])/2;
  }
  function statsFromDurations(durations){
    if(!durations.length) return {tickets:0,avg:0,dias:0,min:0,mediana:0,max:0,dist:[0,0,0,0,0],pct24:0,pct48:0};
    const sorted = [...durations].sort((a,b)=>a-b);
    const tickets = durations.length;
    const sum = durations.reduce((a,b)=>a+b,0);
    const dist = [0,0,0,0,0];
    let c24=0, c48=0;
    durations.forEach(h=>{
      if(h<4) dist[0]++; else if(h<12) dist[1]++; else if(h<24) dist[2]++; else if(h<72) dist[3]++; else dist[4]++;
      if(h<24) c24++;
      if(h<48) c48++;
    });
    return {
      tickets,
      avg: Math.round((sum/tickets)*10)/10,
      dias: Math.round((sum/tickets/24)*100)/100,
      min: Math.round(sorted[0]*10)/10,
      mediana: Math.round(median(sorted)*10)/10,
      max: Math.round(sorted[sorted.length-1]*10)/10,
      dist,
      pct24: Math.round(100*c24/tickets),
      pct48: Math.round(100*c48/tickets)
    };
  }

  // Ingenieros que no se miden en el ranking (colas/sistemas automáticos, no personas;
  // o personas que el usuario pidió excluir explícitamente de esta medición).
  const AGENTES_EXCLUIDOS = ['MC PPM','MC EGF','MESA CONTROL','Alfredo Martínez R','Eder Ernesto Castillo Colin','Daniel Aguilar Solis','Ariadna Sánchez Ramírez','Luis Alzaga Hernandez'];
  // Agentes que se miden aparte, en la pestaña "Tickets Mesa de control" (son colas, no personas individuales).
  const AGENTES_MESA_CONTROL = ['MC PPM','MC EGF','MESA CONTROL'];
  const MESAS_CONTROL = ['Mesa de Control','Mesa de Control Nivel 1'];
  // Tickets Soporte: se cuentan TODOS los tickets del archivo, sin importar categoría ni mesa de
  // ayuda, EXCEPTO estas 4 categorías exactas (que son de Mesa de Control, no de Soporte).
  const CATEGORIAS_EXCLUIR_SOPORTE = [
    'Mesa de Control > Reset Correo Zimbra',
    'Mesa de Control > Reset de contraseña',
    'Mesa de Control > Reactivacion de aplicativos de ventas y servicios ATT',
    'Mesa de Control > RESET de YUBIKEY por BAJA de colaborador'
  ];
  // Tickets que se quedaron mal categorizados (Sin subcategoría / Otros) y que se decidió
  // tratar siempre como Rechazado/Cancelado, sin importar qué diga el Excel para ellos.
  const IDS_FORZAR_RECHAZADO = [220456, 233508, 237902, 229151, 248027];

  // Calcula los datos a partir de las filas del Excel SIN tocar el estado (para poder confirmar antes de aplicar)
  function calcularDatosTickets(rows, fileName){
    const monthCounts = { TotalPlay:new Array(12).fill(0), Telmex:new Array(12).fill(0), Metrocarrier:new Array(12).fill(0) };
    const velocidadCounts = { TotalPlay:new Array(12).fill(0), Telmex:new Array(12).fill(0), Metrocarrier:new Array(12).fill(0) };
    const durations   = { TotalPlay:[], Telmex:[], Metrocarrier:[] };
    const storeMonth  = { TotalPlay:{}, Telmex:{} };
    const storeMonthVelocidad = { TotalPlay:{}, Telmex:{} };
    const mesaSoporteIT = new Array(12).fill(0);
    const mesaControl = new Array(12).fill(0);
    // Tickets por día de la semana de creación (agosto 2026) — 0=Lunes...6=Domingo, mismo mapeo que
    // ya usa "caídas de la semana en curso" más abajo ((getDay()+6)%7). Cada uno cuenta EL MISMO
    // universo que su gráfica mensual hermana (mesaControl / mesaSoporteIT), para que los totales
    // siempre cuadren entre la gráfica por mes y la gráfica por día de la semana de cada pestaña.
    const mesaControlDia = new Array(7).fill(0);
    const mesaSoporteDia = new Array(7).fill(0);
    // Tickets por hora del día de creación (agosto 2026) — 0..23, mismo universo que su gráfica
    // hermana de día de la semana (mesaControlDia / mesaSoporteDia), para saber a qué hora se
    // concentra más la carga de tickets.
    const mesaControlHora = new Array(24).fill(0);
    const mesaSoporteHora = new Array(24).fill(0);
    const agenteMonth = {};
    const agenteDuraciones = {};
    const agenteMonthMC = {};
    const agenteDuracionesMC = {};
    const catMonth = {};
    const catAgente = {};
    let rechazoCancelMC = 0;
    let maxMonthIdx = -1, totalCaidas = 0;

    // Caídas de la semana en curso (lunes a domingo), calculado sobre la fecha real de hoy.
    const hoy = new Date();
    const diaSemana = (hoy.getDay() + 6) % 7; // 0=lunes ... 6=domingo
    const lunesActual = new Date(hoy); lunesActual.setDate(hoy.getDate() - diaSemana); lunesActual.setHours(0,0,0,0);
    const domingoActual = new Date(lunesActual); domingoActual.setDate(lunesActual.getDate() + 6); domingoActual.setHours(23,59,59,999);
    function numeroSemanaISO(d){
      const t = new Date(d.getTime());
      t.setHours(0,0,0,0);
      t.setDate(t.getDate() + 3 - ((t.getDay()+6)%7));
      const enero1 = new Date(t.getFullYear(),0,1);
      return Math.round(((t - enero1) / 86400000 - 3 + ((enero1.getDay()+6)%7)) / 7) + 1;
    }
    let caidasSemanaActual = 0;

    // Calendario de caídas por día, para TODOS los meses que traiga el archivo (para poder
    // consultar meses anteriores sin volver a cargar). Se guarda conteo y detalle por día.
    const calendarioPorMes = {}; // { mesIdx: { caidas_por_dia:{dia:n}, detalle_por_dia:{dia:[...]} } }
    function celdaCalendarioMes(mesIdx){
      if(!calendarioPorMes[mesIdx]) calendarioPorMes[mesIdx] = { caidas_por_dia:{}, detalle_por_dia:{} };
      return calendarioPorMes[mesIdx];
    }

    // Detecta tickets duplicados de caída: misma tienda, categoría "Sin servicio", creados con
    // 90 minutos o menos de diferencia, ambos con Estado "Cerrado". El segundo (el más nuevo de
    // cada pareja) se trata igual que un "Rechazado" — no cuenta como caída real.
    const LIMITE_DUPLICADO_MIN = 90;
    const idsDuplicados = new Set();
    {
      const porTienda = {};
      rows.forEach(row=>{
        const prov = proveedorCaida(row['Categoría']);
        if(!prov) return;
        if(String(row['Estado']).trim() !== 'Cerrado') return;
        const fc = parseFechaTicket(row['Fecha de creación']);
        if(!fc) return;
        const tienda = extraerNombreCanonico(row['Cliente']) || 'Sin nombre';
        if(!porTienda[tienda]) porTienda[tienda] = [];
        porTienda[tienda].push({ id: row['ID'], fc });
      });
      Object.values(porTienda).forEach(lista=>{
        lista.sort((a,b)=> a.fc - b.fc);
        for(let i=1; i<lista.length; i++){
          const diffMin = (lista[i].fc - lista[i-1].fc) / 60000;
          if(diffMin <= LIMITE_DUPLICADO_MIN && !idsDuplicados.has(lista[i-1].id)){
            idsDuplicados.add(lista[i].id);
          }
        }
      });
    }

    // Validación de tickets de impresión vs Consumibles (agosto 2026) — estas 4 categorías del Excel
    // corresponden 1:1 a los "Tipo" que ya maneja la app de Consumibles (TONER, UNIDAD DE IMAGEN, KIT
    // MANTENIMIENTO, FALLA IMPRESORA). Se guarda aparte en Firestore (validacion_consumibles/pendientes,
    // ver aplicarDatosTickets) para que el botón "Ver pendientes" de Consumibles la lea y cruce contra
    // su propia colección `tickets` por número de Ticket exacto (columna "ID" de este mismo archivo) —
    // no hay otro campo en común entre los dos sistemas. Solo se guardan los que ya están Abiertos y a
    // partir de julio 2026, a petición explícita del cliente.
    const CATEGORIA_A_TIPO_CONSUMIBLE = {
      'Hardware > Multifuncionales e Impresoras > Solicitud de toner': 'TONER',
      'Hardware > Multifuncionales e Impresoras > Solicitud de unidad de imagen': 'UNIDAD DE IMAGEN',
      'Hardware > Multifuncionales e Impresoras > Solicitud Kit de mantenimiento': 'KIT MANTENIMIENTO',
      'Hardware > Multifuncionales e Impresoras > Fallas con la Impresora': 'FALLA IMPRESORA'
    };
    const FECHA_INICIO_VALIDACION_CONSUMIBLES = new Date(2026, 6, 1);
    const pendientesConsumibles = [];

    rows.forEach(row=>{
      const fc = parseFechaTicket(row['Fecha de creación']);
      if(!fc) return;
      const mIdx = fc.getMonth();
      if(mIdx > maxMonthIdx) maxMonthIdx = mIdx;

      const tipoConsumible = CATEGORIA_A_TIPO_CONSUMIBLE[String(row['Categoría']||'').trim()];
      if(tipoConsumible && String(row['Estado']).trim()==='Abierto' && fc >= FECHA_INICIO_VALIDACION_CONSUMIBLES){
        pendientesConsumibles.push({
          ticket: String(row['ID']),
          tienda: extraerNombreCanonico(row['Cliente']),
          tipo: tipoConsumible,
          fecha: fc.toISOString()
        });
      }

      // Tickets Soporte: UNA sola fuente de verdad — TODOS los tickets del archivo, sin importar
      // categoría ni mesa de ayuda, EXCEPTO las 4 categorías de Mesa de Control (arriba). La tabla
      // por ingeniero es un recorte de este MISMO conjunto de filas, para que el total de la
      // gráfica y el total de la tabla siempre cuadren entre sí. Los agentes que no se miden
      // individualmente (Alfredo, Eder, Daniel, Ariadna, Luis Alzaga, MC PPM/EGF/Mesa de Control)
      // y los tickets sin agente asignado se agrupan todos en una sola fila: "Soporte Prime".
      const mesaAyuda = String(row['Mesa de ayuda']).trim();
      const agente = row['Agente asignado'] ? String(row['Agente asignado']).trim().replace(/\s+/g, ' ') : '';
      const categoriaTicket = String(row['Categoría']||'').trim();
      if(!CATEGORIAS_EXCLUIR_SOPORTE.includes(categoriaTicket)){
        mesaSoporteIT[mIdx]++;
        mesaSoporteDia[(fc.getDay()+6)%7]++;
        mesaSoporteHora[fc.getHours()]++;
        const agenteSoporte = (!agente || AGENTES_EXCLUIDOS.includes(agente)) ? 'Soporte Prime' : agente;
        if(!agenteMonth[agenteSoporte]) agenteMonth[agenteSoporte] = new Array(12).fill(0);
        agenteMonth[agenteSoporte][mIdx]++;
        if(String(row['Estado']).trim()==='Cerrado'){
          const fcierreAg = parseFechaTicket(row['Fecha de cierre']);
          if(fcierreAg){
            const hrsAg = (fcierreAg - fc)/3600000;
            if(hrsAg >= 0){
              if(!agenteDuraciones[agenteSoporte]) agenteDuraciones[agenteSoporte] = [];
              agenteDuraciones[agenteSoporte].push(hrsAg);
            }
          }
        }
      }

      // Mesa de Control: UNA sola fuente de verdad (columna "Mesa de ayuda"). Todo lo que se
      // desglosa abajo (por agente, por categoría, el cruce) es un recorte de este MISMO
      // conjunto de filas, para que los totales siempre cuadren entre las distintas tablas.
      if(MESAS_CONTROL.includes(mesaAyuda)){
        mesaControl[mIdx]++;
        mesaControlDia[(fc.getDay()+6)%7]++;
        mesaControlHora[fc.getHours()]++;
        const estadoMC = String(row['Estado']).trim();
        const idTicket = Number(row['ID']);
        const forzarRechazado = IDS_FORZAR_RECHAZADO.includes(idTicket);

        if(forzarRechazado || estadoMC === 'Rechazado' || estadoMC === 'Cancelado'){
          rechazoCancelMC++;
        } else {
          // Solo Cerrado/Abierto entran al detalle por agente y por categoría.
          // Los que no tienen agente asignado se cuentan como MESA CONTROL (no aparte).
          const agenteMC = agente || 'MESA CONTROL';
          if(!agenteMonthMC[agenteMC]) agenteMonthMC[agenteMC] = new Array(12).fill(0);
          agenteMonthMC[agenteMC][mIdx]++;
          let hrsMC = null;
          if(estadoMC === 'Cerrado'){
            const fcierreMC = parseFechaTicket(row['Fecha de cierre']);
            if(fcierreMC){
              const h = (fcierreMC - fc)/3600000;
              if(h >= 0) hrsMC = h;
            }
          }
          if(hrsMC !== null){
            if(!agenteDuracionesMC[agenteMC]) agenteDuracionesMC[agenteMC] = [];
            agenteDuracionesMC[agenteMC].push(hrsMC);
          }

          const categoriaFull = String(row['Categoría']||'').trim();
          const catCorta = categoriaFull.startsWith('Mesa de Control > ')
            ? categoriaFull.replace('Mesa de Control > ', '')
            : (categoriaFull === 'Mesa de Control' || !categoriaFull ? 'Sin subcategoría' : 'Otros');
          if(!catMonth[catCorta]) catMonth[catCorta] = new Array(12).fill(0);
          catMonth[catCorta][mIdx]++;
          if(!catAgente[catCorta]) catAgente[catCorta] = {};
          if(!catAgente[catCorta][agenteMC]) catAgente[catCorta][agenteMC] = { count:0, dur:[] };
          catAgente[catCorta][agenteMC].count++;
          if(hrsMC !== null) catAgente[catCorta][agenteMC].dur.push(hrsMC);
        }
      }

      const provVel = proveedorVelocidad(row['Categoría']);
      if(provVel){
        velocidadCounts[provVel][mIdx]++;
        if(provVel==='TotalPlay' || provVel==='Telmex'){
          const storeV = extraerNombreCanonico(row['Cliente']) || 'Sin nombre';
          if(!storeMonthVelocidad[provVel][storeV]) storeMonthVelocidad[provVel][storeV] = new Array(12).fill(0);
          storeMonthVelocidad[provVel][storeV][mIdx]++;
        }
      }

      const prov = proveedorCaida(row['Categoría']);
      if(!prov) return;
      if(String(row['Estado']).trim()==='Rechazado') return; // un ticket rechazado no cuenta como caída real
      if(idsDuplicados.has(row['ID'])) return; // duplicado de otra caída de la misma tienda (<=90 min)
      monthCounts[prov][mIdx]++;
      totalCaidas++;
      if(fc >= lunesActual && fc <= domingoActual) caidasSemanaActual++;
      {
        const celda = celdaCalendarioMes(fc.getMonth());
        const dia = fc.getDate();
        celda.caidas_por_dia[dia] = (celda.caidas_por_dia[dia]||0) + 1;
        if(!celda.detalle_por_dia[dia]) celda.detalle_por_dia[dia] = [];
        celda.detalle_por_dia[dia].push({
          tienda: extraerNombreCanonico(row['Cliente']) || 'Sin nombre',
          carrier: prov,
          hora: fc.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'}),
          estatus: String(row['Estado']||'').trim() || '—'
        });
      }

      if(prov==='TotalPlay' || prov==='Telmex'){
        const store = extraerNombreCanonico(row['Cliente']) || 'Sin nombre';
        if(!storeMonth[prov][store]) storeMonth[prov][store] = new Array(12).fill(0);
        storeMonth[prov][store][mIdx]++;
      }
      if(String(row['Estado']).trim()==='Cerrado'){
        const fcierre = parseFechaTicket(row['Fecha de cierre']);
        if(fcierre){
          const hrs = (fcierre - fc)/3600000;
          if(hrs >= 0) durations[prov].push(hrs);
        }
      }
    });

    if(maxMonthIdx < 0){
      throw new Error('No se encontraron tickets con categoría "Internet y telefonia" (Sin servicio / Problemas con velocidad) en el archivo.');
    }

    const hasta = maxMonthIdx;
    const provs = ['TotalPlay','Telmex','Metrocarrier'];
    const atencion = {};
    provs.forEach(p=>{ atencion[p] = statsFromDurations(durations[p]); });
    const tops = {};
    const topsVelocidad = {};
    // El nombre en mayúsculas usado como "carrier esperado" para comparar contra el catálogo.
    const carrierEsperado = { TotalPlay:'TOTALPLAY', Telmex:'TELMEX' };
    // Si el catálogo dice que la tienda tiene contratado un carrier distinto al de la categoría
    // del ticket, es muy probable que sea un error de captura del agente (eligió mal el carrier
    // al levantar el ticket) — se descarta esa fila y se confía en el catálogo, no en el ticket.
    function coincideConCatalogo(nombre, prov){
      const cat = buscarCatalogo(nombre);
      if(cat.carrier === '—') return true; // sin dato en catálogo: no se puede descartar, se deja
      return cat.carrier === carrierEsperado[prov];
    }
    ['TotalPlay','Telmex'].forEach(p=>{
      tops[p] = Object.entries(storeMonth[p])
        .filter(([nombre])=> coincideConCatalogo(nombre, p))
        .map(([nombre,meses])=>{
          const cat = buscarCatalogo(nombre);
          return { nombre, meses: meses.slice(0,hasta+1), carrier: cat.carrier, tecnologia: cat.tecnologia };
        });
      topsVelocidad[p] = Object.entries(storeMonthVelocidad[p])
        .filter(([nombre])=> coincideConCatalogo(nombre, p))
        .map(([nombre,meses])=>{
          const cat = buscarCatalogo(nombre);
          return { nombre, meses: meses.slice(0,hasta+1), carrier: cat.carrier, tecnologia: cat.tecnologia };
        });
    });

    const ingenieros = Object.entries(agenteMonth).map(([nombre,meses])=>{
      const dur = agenteDuraciones[nombre] || [];
      const promedio = dur.length ? Math.round((dur.reduce((a,b)=>a+b,0)/dur.length)*10)/10 : null;
      return { nombre, meses: meses.slice(0,hasta+1), promedio };
    });
    const agentesMC = Object.entries(agenteMonthMC).map(([nombre,meses])=>{
      const dur = agenteDuracionesMC[nombre] || [];
      const promedio = dur.length ? Math.round((dur.reduce((a,b)=>a+b,0)/dur.length)*10)/10 : null;
      return { nombre, meses: meses.slice(0,hasta+1), promedio };
    });
    const mcCategorias = Object.entries(catMonth).map(([categoria,meses])=>({
      categoria, meses: meses.slice(0,hasta+1)
    }));
    const mcCategoriaAgente = Object.entries(catAgente).map(([categoria,porAgente])=>{
      const fila = { categoria };
      Object.entries(porAgente).forEach(([ag,d])=>{
        const promedio = d.dur.length ? Math.round((d.dur.reduce((a,b)=>a+b,0)/d.dur.length)*10)/10 : null;
        fila[ag] = { count: d.count, promedio };
      });
      return fila;
    });

    return {
      fileName,
      periodo_actual: MESES[hasta],
      pendientes_consumibles: pendientesConsumibles,
      tendencia_data: { TotalPlay: monthCounts.TotalPlay, Telmex: monthCounts.Telmex, Metrocarrier: monthCounts.Metrocarrier },
      velocidad_data: { TotalPlay: velocidadCounts.TotalPlay, Telmex: velocidadCounts.Telmex, Metrocarrier: velocidadCounts.Metrocarrier },
      atencion,
      top_totalplay: tops.TotalPlay,
      top_telmex: tops.Telmex,
      top_velocidad_totalplay: topsVelocidad.TotalPlay,
      top_velocidad_telmex: topsVelocidad.Telmex,
      mesa_soporte_it: mesaSoporteIT,
      mesa_soporte_por_dia_semana: mesaSoporteDia,
      mesa_soporte_por_hora_dia: mesaSoporteHora,
      mesa_control: mesaControl,
      mesa_control_por_dia_semana: mesaControlDia,
      mesa_control_por_hora_dia: mesaControlHora,
      mesa_control_rechazado_cancelado: rechazoCancelMC,
      ingenieros,
      agentes_mc: agentesMC,
      mc_categorias: mcCategorias,
      mc_categoria_agente: mcCategoriaAgente,
      resumen: {
        totalCaidas, mesesCubiertos: hasta+1,
        tiendasTP: tops.TotalPlay.length,
        tiendasTM: tops.Telmex.length,
        criticasTP: tops.TotalPlay.filter(r=>r.meses.reduce((a,b)=>a+b,0)>=5).length,
        criticasTM: tops.Telmex.filter(r=>r.meses.reduce((a,b)=>a+b,0)>=5).length,
        semana_actual: {
          numero: numeroSemanaISO(hoy),
          inicio: lunesActual.toISOString(),
          fin: domingoActual.toISOString(),
          caidas: caidasSemanaActual
        },
        calendario_por_mes: calendarioPorMes
      }
    };
  }

  function aplicarDatosTickets(datos){
    state.tendencia.data.TotalPlay = datos.tendencia_data.TotalPlay;
    state.tendencia.data.Telmex = datos.tendencia_data.Telmex;
    state.tendencia.data.Metrocarrier = datos.tendencia_data.Metrocarrier;
    if(!state.tendencia.velocidad) state.tendencia.velocidad = {TotalPlay:new Array(12).fill(0), Telmex:new Array(12).fill(0), Metrocarrier:new Array(12).fill(0)};
    state.tendencia.velocidad.TotalPlay = datos.velocidad_data.TotalPlay;
    state.tendencia.velocidad.Telmex = datos.velocidad_data.Telmex;
    state.tendencia.velocidad.Metrocarrier = datos.velocidad_data.Metrocarrier;
    state.periodo_actual = datos.periodo_actual;
    if(!state.resumen) state.resumen = {};
    state.resumen.semana_actual = datos.resumen.semana_actual;
    state.resumen.calendario_por_mes = datos.resumen.calendario_por_mes;
    state.atencion.TotalPlay = datos.atencion.TotalPlay;
    state.atencion.Telmex = datos.atencion.Telmex;
    state.atencion.Metrocarrier = datos.atencion.Metrocarrier;
    state.top_totalplay = datos.top_totalplay;
    state.top_telmex = datos.top_telmex;
    state.top_velocidad_totalplay = datos.top_velocidad_totalplay;
    state.top_velocidad_telmex = datos.top_velocidad_telmex;
    if(!state.ingenieros) state.ingenieros = {};
    state.ingenieros.mesa_soporte_it = datos.mesa_soporte_it;
    state.ingenieros.por_dia_semana = datos.mesa_soporte_por_dia_semana;
    state.ingenieros.por_hora_dia = datos.mesa_soporte_por_hora_dia;
    state.ingenieros.agentes = datos.ingenieros;
    if(!state.ticketsmc) state.ticketsmc = {};
    state.ticketsmc.mesa_control = datos.mesa_control;
    state.ticketsmc.por_dia_semana = datos.mesa_control_por_dia_semana;
    state.ticketsmc.por_hora_dia = datos.mesa_control_por_hora_dia;
    state.ticketsmc.rechazado_cancelado = datos.mesa_control_rechazado_cancelado;
    state.ticketsmc.agentes = datos.agentes_mc;
    state.ticketsmc.categorias = datos.mc_categorias;
    state.ticketsmc.categoria_agente = datos.mc_categoria_agente;
    state.carga = { archivo: datos.fileName, tickets_caidas: datos.resumen.totalCaidas, fecha: new Date().toISOString() };
    cargaPendiente = null;
    descripcionActualizacion = `Carga de Excel — Tickets y Caídas (${datos.fileName})`;
    save();
    // Validación de tickets de impresión vs Consumibles (agosto 2026) — documento aparte, fuera del
    // `state` de este dashboard, para que el botón "Ver pendientes" de index.html (Consumibles) lo
    // pueda leer directo (mismo proyecto de Firebase). Si falla, no debe tumbar la carga principal de
    // arriba — por eso va en su propio try/catch, después de que save() ya se disparó.
    db.collection('validacion_consumibles').doc('pendientes').set({
      archivo: datos.fileName,
      actualizado: new Date().toISOString(),
      tickets: datos.pendientes_consumibles
    }).catch(err=>console.error('No se pudo guardar la validación de Consumibles', err));
  }

  function handleFileUpload(e){
    const file = e.target.files[0];
    if(!file) return;
    const errBox = document.getElementById('uploadError');
    errBox.innerHTML = '';
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        cargaPendiente = calcularDatosTickets(rows, file.name);
        render();
      }catch(err){
        console.error(err);
        errBox.innerHTML = `<div class="upload-error">No se pudo procesar el archivo: ${err.message}</div>`;
      }finally{
        e.target.value = '';
      }
    };
    reader.onerror = ()=>{ errBox.innerHTML = '<div class="upload-error">No se pudo leer el archivo.</div>'; };
    reader.readAsArrayBuffer(file);
  }

  // ---------- Carga de archivo de expansión (Excel) ----------
  function normalizeMes(v){
    if(v === null || v === undefined || v === '') return '';
    if(v instanceof Date){
      return MESES[v.getMonth()] + ' ' + v.getFullYear();
    }
    return String(v).trim();
  }
  function fmtCellExp(v){
    if(v === null || v === undefined || v === '') return '-';
    if(v instanceof Date) return v.toISOString().slice(0,10);
    return String(v).trim();
  }
  function numOrDashExp(v){
    if(v === null || v === undefined || v === '') return '-';
    return v;
  }
  function computeEstatusExpansion(clave, region, mes, entregadoArq, entregaImpresora){
    const sinDatos = !clave && (!region || region==='-');
    if(sinDatos) return 'Prospecto';
    const mesStr = String(mes).toUpperCase();
    const arq = String(entregadoArq).toUpperCase();
    const imp = String(entregaImpresora).toUpperCase();
    if(mesStr.includes('PROCESO') || arq.includes('PENDIENTE') || imp.includes('PENDIENTE')) return 'En proceso';
    return 'Abierta';
  }
  function estatusExpClass(estatus){
    if(estatus==='Abierta') return 'estable';
    if(estatus==='En proceso') return 'alerta';
    if(estatus==='Cerrada') return 'critica';
    return 'atencion';
  }

  function calcularDatosExpansion(rows2d, fileName){
    let headerIdx = -1;
    for(let i=0;i<Math.min(10,rows2d.length);i++){
      if(String((rows2d[i]||[])[0]).trim()==='#Tienda'){ headerIdx = i; break; }
    }
    if(headerIdx < 0) throw new Error('No se encontró el encabezado "#Tienda" en la hoja. Verifica que sea el archivo de expansión correcto.');

    const tiendas = [];
    for(let i=headerIdx+1; i<rows2d.length; i++){
      const row = rows2d[i] || [];
      const isBlank = row.slice(0,19).every(v=> v===undefined || v===null || v==='');
      if(isBlank){
        if(tiendas.length>0) break; else continue;
      }
      const pdv = row[3];
      if(!pdv || String(pdv).trim()==='') continue;
      const clave = row[2] ? String(row[2]).trim() : '';
      const region = row[4] ? String(row[4]).trim() : '';
      const mes = normalizeMes(row[1]);
      const entregadoArq = row[16];
      const entregaImpresora = row[17];
      tiendas.push({
        numero: (row[0]!==undefined && row[0]!==null && row[0]!=='') ? Number(row[0]) : null,
        clave,
        nombre: String(pdv).trim(),
        mes,
        region: region || '-',
        pc: numOrDashExp(row[5]),
        lap: numOrDashExp(row[6]),
        hc: numOrDashExp(row[7]),
        pinpad: numOrDashExp(row[8]),
        dif_pinpad: numOrDashExp(row[9]),
        biometricos: numOrDashExp(row[10]),
        dif_biometricos: numOrDashExp(row[11]),
        prep_equipo: fmtCellExp(row[12]),
        envio_mac: fmtCellExp(row[13]),
        internet: row[14] ? String(row[14]).trim() : '-',
        solicitud_arq: fmtCellExp(row[15]),
        entregado_arq: entregadoArq ? String(entregadoArq).trim() : '-',
        entrega_impresora: fmtCellExp(entregaImpresora),
        modelo_impresora: row[18] ? String(row[18]).trim() : '-',
        estatus: computeEstatusExpansion(clave, region, mes, entregadoArq, entregaImpresora),
        nota: ''
      });
    }
    if(tiendas.length===0) throw new Error('No se encontraron filas de tiendas después del encabezado.');

    const abiertas = tiendas.filter(t=>t.estatus==='Abierta').length;
    const enProceso = tiendas.filter(t=>t.estatus==='En proceso').length;
    const prospecto = tiendas.filter(t=>t.estatus==='Prospecto').length;
    const esteMes = tiendas.filter(t=>t.estatus==='Abierta' && t.mes.startsWith(state.periodo_actual)).length;

    return { fileName, tiendas, resumen:{ total:tiendas.length, abiertas, enProceso, prospecto, esteMes } };
  }

  // Acumula (no reemplaza): las tiendas del archivo nuevo se agregan o actualizan por Clave PDV
  // (o por nombre si no tienen clave); las tiendas que ya estaban y no vienen en este archivo
  // se quedan tal cual (así funciona la carga semanal de "solo lo nuevo de esta semana").
  // Las notas manuales (por tienda y generales) nunca se tocan aquí.
  function aplicarDatosExpansion(datos){
    const existentes = state.expansion.tiendas || [];
    const keyOf = t => t.clave ? ('clave:'+t.clave) : ('nombre:'+t.nombre);
    const indexPorKey = {};
    existentes.forEach((t,i)=>{ indexPorKey[keyOf(t)] = i; });

    let agregadas = 0, actualizadas = 0;
    datos.tiendas.forEach(nuevo=>{
      const key = keyOf(nuevo);
      if(indexPorKey.hasOwnProperty(key)){
        const i = indexPorKey[key];
        const notaPrevia = existentes[i].nota || '';
        existentes[i] = { ...nuevo, nota: notaPrevia };
        actualizadas++;
      } else {
        existentes.push({ ...nuevo });
        indexPorKey[key] = existentes.length - 1;
        agregadas++;
      }
    });

    state.expansion.tiendas = existentes;
    state.expansion.carga = { archivo: datos.fileName, fecha: new Date().toISOString(), agregadas, actualizadas };
    cargaPendienteExpansion = null;
    descripcionActualizacion = `Carga de Excel — Plan de Expansión (${datos.fileName})`;
    save();
  }

  function handleFileUploadExpansion(e){
    const file = e.target.files[0];
    if(!file) return;
    const errBox = document.getElementById('uploadErrorExp');
    if(errBox) errBox.innerHTML = '';
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'array', cellDates:true});
        const sheetName = wb.SheetNames.find(n=>/hoja ?1|expansi/i.test(n)) || wb.SheetNames[0];
        const ws = wb.Sheets[sheetName];
        const rows2d = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
        cargaPendienteExpansion = calcularDatosExpansion(rows2d, file.name);
        render();
      }catch(err){
        console.error(err);
        if(errBox) errBox.innerHTML = `<div class="upload-error">No se pudo procesar el archivo: ${err.message}</div>`;
      }finally{
        e.target.value = '';
      }
    };
    reader.onerror = ()=>{ if(errBox) errBox.innerHTML = '<div class="upload-error">No se pudo leer el archivo.</div>'; };
    reader.readAsArrayBuffer(file);
  }
