      </div>
    </div>`;
  }
  function wireEnviosRecUpload(){
    const btn = document.getElementById('btnUploadEnviosRec');
    if(btn) btn.onclick = () => document.getElementById('fileEnviosRec').click();
    const inp = document.getElementById('fileEnviosRec');
    if(inp) inp.onchange = handleFileUploadEnviosRec;
    const btnCancel = document.getElementById('btnCancelCargaEnviosRec');
    if(btnCancel) btnCancel.onclick = ()=>{ cargaPendienteEnviosRec = null; render(); };
    const btnAplicar = document.getElementById('btnAplicarCargaEnviosRec');
    if(btnAplicar) btnAplicar.onclick = ()=>{ aplicarDatosEnviosRecolecciones(cargaPendienteEnviosRec); };
  }

  function renderEnviosRecolecciones(c){
    const er = state.envios_recolecciones;

    const totalEnvios = registros.reduce((s,r)=>s+r.envios,0);
    const totalRecoleccion = registros.reduce((s,r)=>s+r.recoleccion,0);
    const pctRecuperacion = fmtPct(totalRecoleccion, totalEnvios);
    const promedioMensual = registros.length ? Math.round(totalEnvios/registros.length) : 0;
    // La gráfica solo muestra hasta el mes actual: si el Excel trae filas de meses futuros (por ejemplo
    // una plantilla con los 12 meses ya listados aunque todavía no haya información real de ellos), no
    // se dibujan barras "en cero" adelantadas. Si el mes no se reconoce en MESES12, se muestra por si acaso.
    const idxMesActual = new Date().getMonth(); // 0=Enero ... 11=Diciembre
    const registrosGrafica = registros.filter(r=>{
      const idx = MESES12.indexOf(r.mes);

    c.innerHTML = `
      <div class="title">Envíos y Recolecciones</div>

      ${canEditEnviosRec() ? `

          <div id="uploadErrorEnviosRec"></div>

      ${cargaPendienteEnviosRec ? panelConfirmacionEnviosRec() : ''}

      <div class="cards">
        <div class="card"><div class="head" style="background:${cardGrad(COL_ENV)}">Total Envíos</div><div class="body"><div class="big">${fmtMX(totalEnvios)}</div><div class="lbl">suma de la columna Envío</div></div></div>
        <div class="card"><div class="head" style="background:${cardGrad(COL_REC)}">Total Recolección</div><div class="body"><div class="big">${fmtMX(totalRecoleccion)}</div><div class="lbl">suma de la columna Recolección</div></div></div>
        <div class="card"><div class="head" style="background:${cardGrad(COL_PCT)}">% Recuperación</div><div class="body"><div class="big">${pctRecuperacion}</div><div class="lbl">Recolección ÷ Envíos</div></div></div>
        <div class="card"><div class="head" style="background:${cardGrad(COL_PROM)}">Prom. Mensual Envíos</div><div class="body"><div class="big">${fmtMX(promedioMensual)}</div><div class="lbl">Total Envíos ÷ meses cargados</div></div></div>
      </div>

      ${registrosGrafica.length===0 ? `
      <div class="placeholder">
        <h3>Todavía no hay datos cargados</h3>
        <p>Sube el Excel con las columnas Mes, Envío y Recolección para llenar esta pestaña.</p>
      </div>` : `
      <div class="panel">
        <h3>Envíos vs. recolección por mes</h3>
        <canvas id="chartEnviosRec"></canvas>
      </div>`}
    `;
    if(registrosGrafica.length>0){
      if(charts.enviosRec) charts.enviosRec.destroy();
      charts.enviosRec = new Chart(document.getElementById('chartEnviosRec'), {
        type:'bar',
        data:{ labels: registrosGrafica.map(r=>r.mes), datasets:[
          {label:'Envíos', data:registrosGrafica.map(r=>r.envios), backgroundColor:COL_ENV, borderRadius:4},
          {label:'Recolección', data:registrosGrafica.map(r=>r.recoleccion), backgroundColor:COL_REC, borderRadius:4}
        ]},
        options:{responsive:true, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true}}}
      });

    wireEnviosRecUpload();
  }

  // ---------- 3. Reemplazo de Laptop ----------
  // Reemplazo de Laptop (agosto 2026, segunda vuelta): las barras "2025" siguen fijas (referencia
  // histórica de la lámina original) — solo la línea "2026" y los 3 indicadores de arriba vienen ahora
  // del Excel (botón exclusivo de ecastillo/daguilar/admin, ver canEditInventario()). "Total 2026" usa
  // la columna Total tal cual la trae el archivo (el cliente aclaró que NO es necesariamente Reem.+Robo).
  function renderReemplazoLaptop(c){
    const rl = state.reemplazo_laptop;
    const registros = rl.registros || [];
    const porMes = {};
    const robosPorMes = {};
    registros.forEach(r=>{
      const key = normalizarTextoEnvios(r.mes);
      porMes[key] = r.reem;
      robosPorMes[key] = r.robo;
    });

    // ---- Ventana Dic25 → mes actual real (agosto 2026 según la fecha de hoy; septiembre el mes que
    // entra, y así sucesivamente) — pedido explícito del cliente, agosto 2026. Diciembre se recorre al
    // inicio del eje (referencia 2025) y las barras 2025 se muestran completas, solo reordenadas; los
    // puntos rojos de 2026 se acotan al mes real (no se dibuja nada de meses que todavía no llegan,
    // aunque el Excel ya traiga esas filas cargadas de más).
    const MESES_DIC_PRIMERO = ['Diciembre','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre'];
    const bars2025Reordenado = MESES_DIC_PRIMERO.map(m => DATA_REEMPLAZO_LAPTOP.bars2025[MESES12.indexOf(m)]);
    // Respaldo si todavía no se ha cargado ningún Excel con una fila "Dic.25" — mismo valor que ya traía
    // la barra azul de referencia (12), solo para que la gráfica no salga vacía en diciembre antes de la
    // primera carga.
    const DIC25_REEM_RESPALDO = DATA_REEMPLAZO_LAPTOP.bars2025[MESES12.indexOf('Diciembre')];
    // Llave de diciembre 2025 dentro de porMes/robosPorMes: viene de la fila "Dic.25" (o variantes) del
    // Excel, remapeada a 'Dic25' en handleFileUploadReemplazoLaptop → aquí normalizarTextoEnvios('Dic25')
    // = 'DIC25'. Si el cliente ya cargó esa fila, su Reem./Robo real manda; si no, se usa el respaldo.
    const DIC25_KEY = normalizarTextoEnvios('Dic25');

    const hoy = new Date();
    // Índice dentro de MESES_DIC_PRIMERO (Diciembre=0, Enero=1, ..., Noviembre=11) del mes real actual.
    // ⚠️ Diciembre 2026 (dentro de 4 meses desde este cambio) es un caso sin resolver: esta ventana de
    // 12 casillas ya tiene a "Diciembre" ocupado por la referencia de 2025 al inicio, así que no hay
    // casilla separada para Diciembre 2026 — por ahora el índice se queda topado en Noviembre (11) y no
    // avanza más. Si se llega a diciembre 2026 y el cliente quiere ver ese mes también, hay que decidir
    // entonces si se agrega una 13ª casilla o se maneja distinto — no se resuelve aquí para no adivinar.
    const mesActualIdx = (hoy.getFullYear() < 2026) ? 0
      : (hoy.getFullYear() === 2026 ? Math.min(hoy.getMonth() + 1, 11) : 11);

    const puntosRojos = MESES_DIC_PRIMERO.map((m, i) => {
      if (i > mesActualIdx) return null; // acotado: nada de meses que todavía no llegan
      if (i === 0) return porMes.hasOwnProperty(DIC25_KEY) ? porMes[DIC25_KEY] : DIC25_REEM_RESPALDO;
      const key = normalizarTextoEnvios(m);
      return porMes.hasOwnProperty(key) ? porMes[key] : null;
    });

    // Robos: misma ventana Dic25→mes actual acotada. Si el Excel ya trae Robo de la fila "Dic.25" se usa
    // ese valor; si no, diciembre 2025 se queda sin dato de robo (no se inventa). Igual que en puntosRojos:
    // aunque el Excel traiga filas de meses futuros ya cargadas, se ignoran hasta que ese mes sea
    // realmente el mes corriente.
    const robosAcotados = MESES_DIC_PRIMERO.map((m, i) => {
      if (i > mesActualIdx) return null;
      if (i === 0) return robosPorMes.hasOwnProperty(DIC25_KEY) ? robosPorMes[DIC25_KEY] : null;
      const key = normalizarTextoEnvios(m);
      return robosPorMes.hasOwnProperty(key) ? robosPorMes[key] : null;
    });

    // Total y Promedio / mes: pedido del cliente (ago 2026) — ambos se calculan sobre la MISMA serie de
    // reemplazos (puntosRojos), acotada a Dic25→mes actual real. Total = suma; Promedio = suma/meses con
    // dato. Ya no se usa la columna "Total" del Excel para esta tarjeta (esa columna queda sin uso aquí).
    const puntosConDato = puntosRojos.filter(v => v !== null && v !== undefined);
    const totalReemplazos = puntosConDato.reduce((s,v)=>s+v,0);
    const promedioMes = puntosConDato.length ? Math.round(totalReemplazos / puntosConDato.length) : 0;
    const totalRobo = robosAcotados.filter(v => v !== null && v !== undefined).reduce((s,v)=>s+v,0);

    const COL_BAR='#1E88C7', COL_LINE='#EF4444';
    renderBarLineApartado(c, {
      titulo:'Reemplazo de Laptop',
      uploadBarHtml: canEditInventario() ? `
      <div class="uploadbar">
        <div class="txt">
          <b>Cargar archivo de Reemplazo de Laptop (.xlsx)</b> — columnas Mes, Reem., Total y Robo (solo 2026). Si un mes ya existía se actualiza; si es nuevo se agrega.
          <div id="uploadErrorReemplazoLaptop"></div>
        </div>
        <input type="file" id="fileReemplazoLaptop" accept=".xlsx,.xls" style="display:none">
        <button class="upload" id="btnUploadReemplazoLaptop">Cargar archivo</button>
      </div>` : '',
      previewHtml: cargaPendienteReemplazoLaptop ? panelConfirmacionReemplazoLaptop() : '',
      kpis:[
        {label:'Promedio / mes', valor:fmtMX(promedioMes), lbl:'unidades · Dic25 a hoy', color:COL_BAR},
        {label:'Total', valor:fmtMX(totalReemplazos), lbl:'reemplazos · Dic25 a hoy', color:'#334155'},
        {label:'Robos', valor:fmtMX(totalRobo), lbl:'unidades · Dic25 a hoy', color:'#B91C1C'}
      ],
      chartTitle:'Laptop dañada/reemplazada por mes', canvasId:'chartLaptop',
      // Eje acotado a Dic25 → mes actual real (agosto 2026, a petición del cliente) — antes el eje
      // siempre mostraba los 12 meses completos (hasta Noviembre) aunque no hubieran llegado; ahora
      // se recorta igual que ya se recortaban los puntos rojos, así que crece un mes a la vez solo.
      labels: MESES_DIC_PRIMERO.slice(0, mesActualIdx+1),
      datasets:[
        {type:'bar', label:'2025', data:bars2025Reordenado.slice(0, mesActualIdx+1), backgroundColor:COL_BAR, borderRadius:4, order:2},
        {type:'line', label:'2026', data:puntosRojos.slice(0, mesActualIdx+1), borderColor:COL_LINE, backgroundColor:COL_LINE, showLine:true, tension:0, pointRadius:6, pointHoverRadius:8, borderWidth:2.5, order:1}
      ]
    });
    wireReemplazoLaptopUpload();
  }

  // ---------- 4. Reemplazo de CPU ----------
  // Mismo patrón que Reemplazo de Laptop, pero el Excel solo trae Mes y Total (igual que Reemplazo
  // Disco Duro) — no hay columnas Reem./Robo por separado aquí.
  function renderReemplazoCpu(c){
    const rc = state.reemplazo_cpu;
    const registros = rc.registros || [];
    const totalGeneral = registros.reduce((s,r)=>s+r.total,0);
    const promedioMes = registros.length ? Math.round(totalGeneral/registros.length) : 0;
    const porMes = {};
    registros.forEach(r=>{ porMes[normalizarTextoEnvios(r.mes)] = r.total; });
    const line2026 = MESES12.map(m => {
      const key = normalizarTextoEnvios(m);
      return porMes.hasOwnProperty(key) ? porMes[key] : null;
    });
    // Eje acotado a Enero → mes actual real (agosto 2026, mismo pedido que ya se aplicó en Reemplazo de
    // Laptop) — antes el eje siempre mostraba los 12 meses completos aunque no hubieran llegado. Aquí no
    // hay "Dic25" que anteponer (esa regla es exclusiva de Laptop), así que el índice 0 ya es Enero.
    const hoy = new Date();
    const mesActualIdxCpu = (hoy.getFullYear() < 2026) ? 0
      : (hoy.getFullYear() === 2026 ? hoy.getMonth() : 11);
    const COL_BAR='#0B3D5C', COL_LINE='#F08A24';
    renderBarLineApartado(c, {
      titulo:'Reemplazo de CPU',
      uploadBarHtml: canEditInventario() ? `
      <div class="uploadbar">
        <div class="txt">
          <b>Cargar archivo de Reemplazo de CPU (.xlsx)</b> — columnas Mes y Total (solo 2026). Si un mes ya existía se actualiza; si es nuevo se agrega.
          <div id="uploadErrorReemplazoCpu"></div>
        </div>
        <input type="file" id="fileReemplazoCpu" accept=".xlsx,.xls" style="display:none">
        <button class="upload" id="btnUploadReemplazoCpu">Cargar archivo</button>
      </div>` : '',
      previewHtml: cargaPendienteReemplazoCpu ? panelConfirmacionReemplazoCpu() : '',
      kpis:[
        {label:'Promedio / mes', valor:fmtMX(promedioMes), lbl:'unidades · 2026', color:COL_BAR},
        {label:'Total 2026', valor:fmtMX(totalGeneral), lbl:'unidades reemplazadas', color:'#334155'}
      ],
      chartTitle:'CPU dañada/reemplazada por mes', canvasId:'chartCpu',
      labels: MESES12.slice(0, mesActualIdxCpu+1),
      datasets:[
        {type:'bar', label:'2025', data:DATA_REEMPLAZO_CPU.bars2025.slice(0, mesActualIdxCpu+1), backgroundColor:COL_BAR, borderRadius:4, order:2},
        {type:'line', label:'2026', data:line2026.slice(0, mesActualIdxCpu+1), borderColor:COL_LINE, backgroundColor:COL_LINE, tension:.3, pointRadius:4, borderWidth:2.5, spanGaps:true, order:1}
      ]
    });
    wireReemplazoCpuUpload();
  }

  // ---------- 5. Reemplazo Disco Duro ----------
  // Carga de Excel (Mes, Total), exclusiva de asanchez — mismo patrón que Envíos y Recolecciones:
  // vista previa antes de aplicar, "actualiza por Mes si ya existe, agrega si es nuevo". Reutiliza
  // los helpers genéricos normalizarTextoEnvios/buscarColumnaEnvios/normalizeMesEnvios (el nombre
  // trae "Envios" por dónde se escribieron primero, pero no son específicos de esa pestaña).
  function calcularDatosReemplazoDisco(rows2d, fileName){
    let headerIdx = -1, colMes=-1, colTotal=-1;
    for(let i=0;i<Math.min(10,rows2d.length);i++){
      const row = rows2d[i] || [];
      const m = buscarColumnaEnvios(row, ['MES']);
      const t = buscarColumnaEnvios(row, ['TOTAL']);
      if(m>=0 && t>=0){ headerIdx=i; colMes=m; colTotal=t; break; }
    }
    if(headerIdx<0) throw new Error('No se encontraron las columnas "Mes" y "Total" en la hoja. Verifica los encabezados del archivo.');

    const registros = [];
    for(let i=headerIdx+1; i<rows2d.length; i++){
      const row = rows2d[i] || [];
      const mesRaw = row[colMes];
      if(mesRaw===undefined || mesRaw===null || String(mesRaw).trim()==='') continue;
      const total = Number(row[colTotal]) || 0;
      registros.push({ mes: normalizeMesEnvios(mesRaw), total });
    }
    if(registros.length===0) throw new Error('No se encontraron filas con datos después del encabezado.');

    const totalUnidades = registros.reduce((s,r)=>s+r.total,0);
    return { fileName, registros, resumen:{ totalFilas: registros.length, totalUnidades } };
  }
  function aplicarDatosReemplazoDisco(datos){
    const existentes = state.reemplazo_disco.registros || [];
    const indexPorMes = {};
    existentes.forEach((r,i)=>{ indexPorMes[normalizarTextoEnvios(r.mes)] = i; });

    let agregados = 0, actualizados = 0;
    datos.registros.forEach(nuevo=>{
      const key = normalizarTextoEnvios(nuevo.mes);
      if(indexPorMes.hasOwnProperty(key)){
        existentes[indexPorMes[key]] = { ...nuevo };
        actualizados++;
      } else {
        existentes.push({ ...nuevo });
        indexPorMes[key] = existentes.length - 1;
        agregados++;
      }
    });
    existentes.sort((a,b)=>{
      const ia = MESES12.indexOf(a.mes), ib = MESES12.indexOf(b.mes);
      if(ia<0 && ib<0) return 0;
      if(ia<0) return 1;
      if(ib<0) return -1;
      return ia-ib;
    });

    state.reemplazo_disco.registros = existentes;
    state.reemplazo_disco.carga = { archivo: datos.fileName, fecha: new Date().toISOString(), agregados, actualizados };
    cargaPendienteReemplazoDisco = null;
    descripcionActualizacion = `Carga de Excel — Reemplazo Disco Duro (${datos.fileName})`;
    save();
  }
  function handleFileUploadReemplazoDisco(e){
    const file = e.target.files[0];
    if(!file) return;
    const errBox = document.getElementById('uploadErrorReemplazoDisco');
    if(errBox) errBox.innerHTML = '';
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows2d = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
        cargaPendienteReemplazoDisco = calcularDatosReemplazoDisco(rows2d, file.name);
        render();
      }catch(err){
        console.error(err);
        if(errBox) errBox.innerHTML = `<div style="color:var(--crit); font-size:12.5px; margin-top:6px;">${err.message}</div>`;
      }
      e.target.value = '';
    };
    reader.readAsArrayBuffer(file);
  }
  function panelConfirmacionReemplazoDisco(){
    const d = cargaPendienteReemplazoDisco;
    return `<div class="panel" style="border-color:var(--tm);">
      <h3 style="color:var(--tm);">Confirmar carga · ${d.fileName}</h3>
      <div style="font-size:13px; line-height:1.8;">
        Filas leídas: <b>${d.resumen.totalFilas}</b> · Total de unidades en el archivo: <b>${fmtMX(d.resumen.totalUnidades)}</b>
      </div>
      <div class="editbar" style="margin-top:10px;">
        <button id="btnCancelCargaReemplazoDisco">Cancelar</button>
        <button class="primary" id="btnAplicarCargaReemplazoDisco">Aplicar datos</button>
      </div>
    </div>`;
  }
  function wireReemplazoDiscoUpload(){
    const btn = document.getElementById('btnUploadReemplazoDisco');
    if(btn) btn.onclick = () => document.getElementById('fileReemplazoDisco').click();
    const inp = document.getElementById('fileReemplazoDisco');
    if(inp) inp.onchange = handleFileUploadReemplazoDisco;
    const btnCancel = document.getElementById('btnCancelCargaReemplazoDisco');
    if(btnCancel) btnCancel.onclick = ()=>{ cargaPendienteReemplazoDisco = null; render(); };
    const btnAplicar = document.getElementById('btnAplicarCargaReemplazoDisco');
    if(btnAplicar) btnAplicar.onclick = ()=>{ aplicarDatosReemplazoDisco(cargaPendienteReemplazoDisco); };
  }

  // ===== Carga de Excel por mes, genérica (agosto 2026) =====
  // Reemplazo de Laptop, Reemplazo de CPU, Biométricos y PIN PAD siguen el mismo patrón que Reemplazo
  // Disco Duro arriba (encabezado "Mes" + N columnas más, tolerante a variantes de nombre, vista previa
  // antes de aplicar, "actualiza el mes si ya existía, agrega si es nuevo") — en vez de repetir la misma
  // lógica 4 veces, estas 2 funciones son genéricas: cada pestaña solo declara sus columnas.
  // `columnas`: [{key, label, variantes}, ...] — variantes ya en MAYÚSCULAS sin acentos (ver
  // normalizarTextoEnvios), porque así compara buscarColumnaEnvios.
  function calcularDatosPorMes(rows2d, fileName, columnas){
    let headerIdx = -1;
    const colIdx = {};
    for(let i=0;i<Math.min(10,rows2d.length);i++){
      const row = rows2d[i] || [];
      const m = buscarColumnaEnvios(row, ['MES']);
      if(m<0) continue;
      const idxs = {};
      let ok = true;
      columnas.forEach(col=>{
        const idx = buscarColumnaEnvios(row, col.variantes);
        if(idx<0) ok = false;
        idxs[col.key] = idx;
      });
      if(ok){ headerIdx=i; colIdx.mes=m; Object.assign(colIdx, idxs); break; }
    }
    if(headerIdx<0){
      const nombres = ['Mes'].concat(columnas.map(c=>c.label)).join('", "');
      throw new Error(`No se encontraron las columnas "${nombres}" en la hoja. Verifica los encabezados del archivo.`);
    }
    const registros = [];
    for(let i=headerIdx+1; i<rows2d.length; i++){
      const row = rows2d[i] || [];
      const mesRaw = row[colIdx.mes];
      if(mesRaw===undefined || mesRaw===null || String(mesRaw).trim()==='') continue;
      const registro = { mes: normalizeMesEnvios(mesRaw) };
      columnas.forEach(col=>{ registro[col.key] = Number(row[colIdx[col.key]]) || 0; });
      registros.push(registro);
    }
    if(registros.length===0) throw new Error('No se encontraron filas con datos después del encabezado.');

    const totales = {};
    columnas.forEach(col=>{ totales[col.key] = registros.reduce((s,r)=>s+r[col.key],0); });
    return { fileName, registros, resumen:{ totalFilas: registros.length, totales } };
  }
  // Aplica los registros nuevos/actualizados sobre `destino` (uno de state.reemplazo_laptop/
  // reemplazo_cpu/biometricos/pin_pad) y guarda — mismo "actualiza por Mes si ya existe, agrega si es
  // nuevo" que Reemplazo Disco Duro/Envíos y Recolecciones (nunca borra un mes que no venga en el
  // archivo nuevo).
  function aplicarDatosPorMes(destino, datos, descripcionCorta){
    const existentes = destino.registros || [];
    const indexPorMes = {};
    existentes.forEach((r,i)=>{ indexPorMes[normalizarTextoEnvios(r.mes)] = i; });
    let agregados = 0, actualizados = 0;
    datos.registros.forEach(nuevo=>{
      const key = normalizarTextoEnvios(nuevo.mes);
      if(indexPorMes.hasOwnProperty(key)){
        existentes[indexPorMes[key]] = { ...nuevo };
        actualizados++;
      } else {
        existentes.push({ ...nuevo });
        indexPorMes[key] = existentes.length - 1;
        agregados++;
      }
    });
    // 'Dic25' (fila ancla de diciembre 2025 de Reemplazo de Laptop, ver esFilaDic25ReemplazoLaptop) va
    // siempre primero; el resto de los meses conocidos siguen el orden normal de MESES12; cualquier mes
    // no reconocido, al final — mismo comportamiento de antes, solo se agrega el caso especial 'Dic25'
    // (los demás apartados que usan esta misma función — CPU/Biométricos/Pin Pad — nunca traen 'Dic25',
    // así que para ellos el orden no cambia en nada).
    const ordenMes = (m)=> m==='Dic25' ? -1 : (MESES12.indexOf(m)>=0 ? MESES12.indexOf(m) : 999);
    existentes.sort((a,b)=> ordenMes(a.mes) - ordenMes(b.mes));
    destino.registros = existentes;
    destino.carga = { archivo: datos.fileName, fecha: new Date().toISOString(), agregados, actualizados };
    descripcionActualizacion = `Carga de Excel — ${descripcionCorta} (${datos.fileName})`;
    save();
  }

  // ---- Reemplazo de Laptop: Mes, Reem., Total, Robo (Total es independiente, NO se calcula como
  // Reem.+Robo — el cliente aclaró que puede incluir otra cosa, así que se suma aparte tal cual). ----
  const COLUMNAS_REEMPLAZO_LAPTOP = [
    {key:'reem', label:'Reem.', variantes:['REEM','REEM.','REEMPLAZOS','REEMPLAZO']},
    {key:'total', label:'Total', variantes:['TOTAL']},
    {key:'robo', label:'Robo', variantes:['ROBO','ROBOS']}
  ];
  // Reconoce la fila ancla de diciembre 2025 en el Excel de Reemplazo de Laptop — el cliente la sube
  // como "Dic.25" (también se aceptan variantes tipo "Dic25", "Dic-25", "Dic 25", "Diciembre 2025",
  // sin importar puntos/espacios/guiones) — se remapea a la llave interna 'Dic25', DISTINTA de
  // "Diciembre" a secas (que en este apartado solo tendría sentido para un diciembre 2026 futuro,
  // caso que no se resuelve aquí — ver nota de mesActualIdx más abajo). Antes de este cambio esta fila
  // se ignoraba silenciosamente (no calzaba con ningún mes de MESES12) y el punto de diciembre en la
  // gráfica salía siempre del valor fijo interno (12), sin importar lo que trajera el archivo.
  function esFilaDic25ReemplazoLaptop(mesTexto){
    const compacto = normalizarTextoEnvios(mesTexto).replace(/[.\-\s]/g,'');
    return /^DIC(IEMBRE)?25$/.test(compacto);
  }
  function handleFileUploadReemplazoLaptop(e){
    const file = e.target.files[0];
    if(!file) return;
    const errBox = document.getElementById('uploadErrorReemplazoLaptop');
    if(errBox) errBox.innerHTML = '';
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows2d = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
        cargaPendienteReemplazoLaptop = calcularDatosPorMes(rows2d, file.name, COLUMNAS_REEMPLAZO_LAPTOP);
        cargaPendienteReemplazoLaptop.registros.forEach(r=>{
          if(esFilaDic25ReemplazoLaptop(r.mes)) r.mes = 'Dic25';
        });
        render();
      }catch(err){
        console.error(err);
        if(errBox) errBox.innerHTML = `<div style="color:var(--crit); font-size:12.5px; margin-top:6px;">${err.message}</div>`;
      }
      e.target.value = '';
    };
    reader.readAsArrayBuffer(file);
  }
  function panelConfirmacionReemplazoLaptop(){
    const d = cargaPendienteReemplazoLaptop;
    return `<div class="panel" style="border-color:var(--tm);">
      <h3 style="color:var(--tm);">Confirmar carga · ${d.fileName}</h3>
      <div style="font-size:13px; line-height:1.8;">
        Filas leídas: <b>${d.resumen.totalFilas}</b> · Reem.: <b>${fmtMX(d.resumen.totales.reem)}</b> · Total: <b>${fmtMX(d.resumen.totales.total)}</b> · Robo: <b>${fmtMX(d.resumen.totales.robo)}</b>
      </div>
      <div class="editbar" style="margin-top:10px;">
        <button id="btnCancelCargaReemplazoLaptop">Cancelar</button>
        <button class="primary" id="btnAplicarCargaReemplazoLaptop">Aplicar datos</button>
      </div>
    </div>`;
  }
  function wireReemplazoLaptopUpload(){
    const btn = document.getElementById('btnUploadReemplazoLaptop');
    if(btn) btn.onclick = () => document.getElementById('fileReemplazoLaptop').click();
    const inp = document.getElementById('fileReemplazoLaptop');
    if(inp) inp.onchange = handleFileUploadReemplazoLaptop;
    const btnCancel = document.getElementById('btnCancelCargaReemplazoLaptop');
    if(btnCancel) btnCancel.onclick = ()=>{ cargaPendienteReemplazoLaptop = null; render(); };
    const btnAplicar = document.getElementById('btnAplicarCargaReemplazoLaptop');
    if(btnAplicar) btnAplicar.onclick = ()=>{ aplicarDatosPorMes(state.reemplazo_laptop, cargaPendienteReemplazoLaptop, 'Reemplazo de Laptop'); cargaPendienteReemplazoLaptop = null; };
  }

  // ---- Reemplazo de CPU: Mes, Total (igual que Reemplazo Disco Duro). ----
  const COLUMNAS_REEMPLAZO_CPU = [{key:'total', label:'Total', variantes:['TOTAL']}];
  function handleFileUploadReemplazoCpu(e){
    const file = e.target.files[0];
    if(!file) return;
    const errBox = document.getElementById('uploadErrorReemplazoCpu');
    if(errBox) errBox.innerHTML = '';
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows2d = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
        cargaPendienteReemplazoCpu = calcularDatosPorMes(rows2d, file.name, COLUMNAS_REEMPLAZO_CPU);
        render();
      }catch(err){
        console.error(err);
        if(errBox) errBox.innerHTML = `<div style="color:var(--crit); font-size:12.5px; margin-top:6px;">${err.message}</div>`;
      }
      e.target.value = '';
    };
    reader.readAsArrayBuffer(file);
  }
  function panelConfirmacionReemplazoCpu(){

  // ---------- 7.1 HUB (Soporte IT) — agosto 2026 ----------
  // A diferencia del resto de "Apartados nuevos" (ver 3.8 en el doc de referencia), el Excel de HUB no
  // trae datos ya resumidos por mes: trae una fila por CADA TICKET, con columnas TICKET, PROCESO, PDV,
  // DISPOSITIVO, STATUS, REGION. Solo se cuentan las filas cuyo PROCESO sea "HUB" (sin importar
  // mayúsculas/minúsculas — el archivo real trae ambas variantes mezcladas). El cliente confirmó
  // explícitamente que cada carga es un REEMPLAZO TOTAL del listado completo (igual que "Actualizar
  // catálogo" en Directorio) — NO se acumula por ticket entre cargas, así que no hace falta ninguna
  // lógica de "actualiza si ya existía / agrega si es nuevo" aquí.
  function normalizarTextoHub(s){
    return String(s==null?'':s).trim().toUpperCase()
      .replace(/Á/g,'A').replace(/É/g,'E').replace(/Í/g,'I').replace(/Ó/g,'O').replace(/Ú/g,'U');
  }
  function buscarColumnaHub(headerRow, variantes){
    for(let i=0;i<headerRow.length;i++){
      const h = normalizarTextoHub(headerRow[i]);
      if(variantes.includes(h)) return i;
    }
    return -1;
  }
  function calcularDatosHub(rows2d, fileName){
    let headerIdx=-1, colTicket=-1, colProceso=-1, colPdv=-1, colDispositivo=-1, colStatus=-1, colRegion=-1;
    for(let i=0;i<Math.min(10,rows2d.length);i++){
      const row = rows2d[i] || [];
      const t = buscarColumnaHub(row, ['TICKET']);
      const p = buscarColumnaHub(row, ['PROCESO']);
      const pdv = buscarColumnaHub(row, ['PDV']);
      const d = buscarColumnaHub(row, ['DISPOSITIVO']);
      const s = buscarColumnaHub(row, ['STATUS','ESTATUS']);
      const r = buscarColumnaHub(row, ['REGION','REGIÓN']);
      if(t>=0 && p>=0 && pdv>=0 && d>=0 && s>=0 && r>=0){ headerIdx=i; colTicket=t; colProceso=p; colPdv=pdv; colDispositivo=d; colStatus=s; colRegion=r; break; }
    }
    if(headerIdx<0) throw new Error('No se encontraron las columnas TICKET, PROCESO, PDV, DISPOSITIVO, STATUS y REGION en la hoja. Verifica los encabezados del archivo.');

    const registros = [];
    let ignoradasProceso = 0;
    for(let i=headerIdx+1; i<rows2d.length; i++){
      const row = rows2d[i] || [];
      const ticketRaw = row[colTicket];
      if(ticketRaw===undefined || ticketRaw===null || String(ticketRaw).trim()==='') continue;
      const proceso = normalizarTextoHub(row[colProceso]);
      if(proceso !== 'HUB'){ ignoradasProceso++; continue; }
      registros.push({
        ticket: String(ticketRaw).trim(),
        pdv: String(row[colPdv]==null?'':row[colPdv]).trim(),
        dispositivo: normalizarTextoHub(row[colDispositivo]),
        status: normalizarTextoHub(row[colStatus]),
        region: normalizarTextoHub(row[colRegion])
      });
    }
    if(registros.length===0) throw new Error('No se encontraron filas con PROCESO = "HUB" después del encabezado.');

    return { fileName, registros, resumen:{ totalFilas: registros.length, ignoradasProceso } };
  }

  const REGION_HUB_DISPLAY = { 'BAJIO':'Bajío', 'PACIFICO':'Pacífico', 'SUR PENINSULA':'Sur Península' };
  function tituloRegionHub(regionUpper){
    if(REGION_HUB_DISPLAY[regionUpper]) return REGION_HUB_DISPLAY[regionUpper];

  }
  function claseAvanceHub(pct){

    const porRegion = {}; const ordenAparicion = [];
    let totalCpu=0, totalLaptop=0, totalCerrados=0;
    registros.forEach(r=>{
      if(!porRegion[r.region]){ porRegion[r.region] = {cpu:0, laptop:0, cerrados:0, total:0}; ordenAparicion.push(r.region); }
      const g = porRegion[r.region];
      g.total++;
      if(r.dispositivo==='CPU'){ g.cpu++; totalCpu++; }
      else if(r.dispositivo==='LAPTOP'){ g.laptop++; totalLaptop++; }
      if(r.status==='CERRADO'){ g.cerrados++; totalCerrados++; }
    });
    const totalEquipos = registros.length;
    const pctCerradoGlobal = totalEquipos ? Math.round(100*totalCerrados/totalEquipos) : 0;
    const filas = ordenAparicion.map(region=>({region, ...porRegion[region]}));

    c.innerHTML = `

        <div class="card"><div class="head" style="background:${cardGrad(COL_TOTAL)}">Total equipos</div><div class="body"><div class="big">${fmtMX(totalEquipos)}</div><div class="lbl">tickets de HUB</div></div></div>
        <div class="card"><div class="head" style="background:${cardGrad(COL_CPU)}">CPU en HUB</div><div class="body"><div class="big">${fmtMX(totalCpu)}</div><div class="lbl">dispositivo CPU</div></div></div>
        <div class="card"><div class="head" style="background:${cardGrad(COL_LAPTOP)}">Laptops</div><div class="body"><div class="big">${fmtMX(totalLaptop)}</div><div class="lbl">dispositivo Laptop</div></div></div>
        <div class="card"><div class="head" style="background:${cardGrad(COL_PCT)}">% Cerrado</div><div class="body"><div class="big">${pctCerradoGlobal}%</div><div class="lbl">status Cerrado</div></div></div>

        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th style="text-align:left;">Región</th><th>CPU</th><th>Laptops</th><th>Total</th><th>Cerrados</th><th>% Avance</th></tr></thead>
            <tbody>
              ${filas.map(f=>{
                const pct = f.total ? Math.round(100*f.cerrados/f.total) : 0;
                return `<tr><td>${tituloRegionHub(f.region)}</td><td>${f.cpu}</td><td>${f.laptop}</td><td>${f.total}</td><td>${f.cerrados}</td>

  // ---------- 8. Guardias (Soporte IT) ----------
  // Rotación de guardias de fin de semana, SOLO sábado y domingo (el cliente lo aclaró explícitamente:
  // no aplica de lunes a viernes). A petición explícita del cliente esta pestaña NO tiene carga de Excel
  // ni botón — el orden de la rotación se cargó una sola vez (guardias_SIT.xlsx, ago 2026) y de ahí en
  // adelante la serie se genera sola: cada sábado le toca al siguiente ingeniero de GUARDIA_ORDEN, en
  // ciclo de 5, para siempre — no hay que tocar nada mes a mes. GUARDIA_ANCLA_TS es el primer sábado del
  // archivo (1 de agosto 2026 = Daniel Aguilar, índice 0); cualquier otro sábado se ubica contando cuántas
  // semanas de 7 días lo separan de esa ancla.
  const GUARDIA_ORDEN = ['Daniel Aguilar','Alfredo Martinez','Ariadna Sanchez','Eder Castillo','Javier Marafic'];
  const GUARDIA_PALETA = ['#2563EB','#7C3AED','#0D9488','#D97706','#DB2777'];
  const GUARDIA_ANCLA_TS = Date.UTC(2026,7,1); // sábado 1 de agosto de 2026
  const GUARDIA_COLOR = {}; GUARDIA_ORDEN.forEach((nombre,i)=>{ GUARDIA_COLOR[nombre] = GUARDIA_PALETA[i % GUARDIA_PALETA.length]; });
  function guardiaHoyUTC(){
    const n = new Date();
    return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
  }
  function fmtGuardiaFecha(ts){
    const d = new Date(ts);
    const DIAS_SEM = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    return `${DIAS_SEM[d.getUTCDay()]} ${d.getUTCDate()} de ${MESES12[d.getUTCMonth()].toLowerCase()}`;
  }
  // Ingeniero que le toca en el sábado cuyo timestamp (UTC, medianoche) es sabTs.
  function guardiaIngenieroEn(sabTs){
    const semanas = Math.round((sabTs - GUARDIA_ANCLA_TS) / (7*86400000));
    const idx = ((semanas % GUARDIA_ORDEN.length) + GUARDIA_ORDEN.length) % GUARDIA_ORDEN.length;
    return GUARDIA_ORDEN[idx];
  }
  // Genera la ventana de sábados a mostrar: 2 fines de semana hacia atrás (contexto reciente) y 22 hacia
  // adelante (~5 meses) contados desde el sábado de esta semana — así conforme avanzan los meses, la
  // próxima vez que se abra esta pestaña la ventana ya se recorrió sola, sin tocar código ni datos.
  function generarGuardias(){
    const hoyTs = guardiaHoyUTC();
    let sab = new Date(hoyTs);
    while(sab.getUTCDay() !== 6) sab.setUTCDate(sab.getUTCDate()+1); // sábado de esta semana o el próximo
    const sabEstaSemanaTs = sab.getTime();
    const HACIA_ATRAS = 2, HACIA_ADELANTE = 22;
    const registros = [];
    for(let i=-HACIA_ATRAS; i<=HACIA_ADELANTE; i++){
      const ts = sabEstaSemanaTs + i*7*86400000;
      registros.push({ ts, ingeniero: guardiaIngenieroEn(ts) });
    }
    return registros;
  }
  function renderGuardias(c){
    const registros = generarGuardias();
    const hoyTs = guardiaHoyUTC();
    let actual = null, siguiente = null, anterior = null;
    registros.forEach(r=>{
      const domTs = r.ts + 86400000;
      if(hoyTs===r.ts || hoyTs===domTs) actual = r;
      else if(r.ts > hoyTs && !siguiente) siguiente = r;
      else if(r.ts < hoyTs) anterior = r;
    });
    function heroCard(tag, r){
      if(!r) return `<div class="guardia-hero" style="background:#94A3B8"><div class="tag">${tag}</div><div class="nombre">Sin datos</div></div>`;
      return `<div class="guardia-hero" style="background:${GUARDIA_COLOR[r.ingeniero]||'#94A3B8'}">
        <div class="tag">${tag}</div>
        <div class="nombre">${escEsv(r.ingeniero)}</div>
        <div class="rango">${fmtGuardiaFecha(r.ts)} y ${fmtGuardiaFecha(r.ts+86400000)}</div>
      </div>`;
    }
    // Agrupa por mes (clave "YYYY-MM") preservando el orden cronológico.
    const meses = [];
    const porMes = {};
    registros.forEach(r=>{
      const d = new Date(r.ts);
      const key = `${d.getUTCFullYear()}-${String(d.getUTCMonth()).padStart(2,'0')}`;
      if(!porMes[key]){ porMes[key] = { label: `${MESES12[d.getUTCMonth()]} ${d.getUTCFullYear()}`, rows: [] }; meses.push(key); }
      porMes[key].rows.push(r);
    });
    function bloqueMes(key){
      return `<div class="guardia-mes">
        <h4>${porMes[key].label}</h4>
        ${porMes[key].rows.map(r=>{
          const esActual = actual && actual.ts===r.ts;
          const esProxima = !actual && siguiente && siguiente.ts===r.ts;
          return `<div class="guardia-row ${esActual?'es-actual':esProxima?'es-proxima':''}">
            <div class="fecha">
              <span class="dot" style="background:${GUARDIA_COLOR[r.ingeniero]||'#94A3B8'}"></span>
              <b>${escEsv(r.ingeniero)}</b> — ${fmtGuardiaFecha(r.ts)} y ${fmtGuardiaFecha(r.ts+86400000)}
              ${esActual ? '<span class="tagmini" style="background:#0D9488">En curso</span>' : ''}
              ${esProxima ? '<span class="tagmini" style="background:#64748B">Próxima</span>' : ''}
            </div>
          </div>`;
        }).join('')}
      </div>`;
    }
    // Solo el mes que contiene "hoy" se ve abierto de entrada; el resto queda comprimido detrás de
    // un botón "+" (a petición explícita del cliente) para no llenar la pantalla con ~6 meses de golpe.
    const hoyD = new Date(hoyTs);
    const mesActualKey = `${hoyD.getUTCFullYear()}-${String(hoyD.getUTCMonth()).padStart(2,'0')}`;
    const mesesOtros = meses.filter(k=>k!==mesActualKey);
    c.innerHTML = `
      <div class="title">Guardias</div>
      <div class="cards">
        ${heroCard(actual ? 'Guardia actual' : 'Próxima guardia', actual || siguiente)}
        ${actual ? heroCard('Próxima guardia', siguiente) : heroCard('Guardia anterior', anterior)}
      </div>
      <div class="panel">
        ${porMes[mesActualKey] ? bloqueMes(mesActualKey) : ''}
        ${mesesOtros.length ? `
          <button class="guardia-toggle" id="btnToggleGuardiaMeses">${guardiaOtrosMesesAbiertos ? '− Ocultar los demás meses' : `+ Ver los demás meses (${mesesOtros.length})`}</button>
          ${guardiaOtrosMesesAbiertos ? mesesOtros.map(bloqueMes).join('') : ''}
        ` : ''}
      </div>
    `;
    const btnToggle = document.getElementById('btnToggleGuardiaMeses');
    if(btnToggle) btnToggle.onclick = ()=>{ guardiaOtrosMesesAbiertos = !guardiaOtrosMesesAbiertos; render(); };
  }

  // ---------- Resumen 2026 ----------
  const ORDEN_CARRIER_CALENDARIO = ['TotalPlay','Telmex','Megacable','Starlink'];
  function desgloseCarrierDia(detalle){
    const conteo = {};
    (detalle||[]).forEach(f=>{ conteo[f.carrier] = (conteo[f.carrier]||0) + 1; });
    const ordenados = ORDEN_CARRIER_CALENDARIO.filter(p=>conteo[p]).map(p=>({ prov:p, n:conteo[p] }));
    const otros = Object.keys(conteo).filter(p=>!ORDEN_CARRIER_CALENDARIO.includes(p)).map(p=>({ prov:p, n:conteo[p] }));
    return ordenados.concat(otros);
  }

  function renderResumen(c){
    const tp=cumulativo('TotalPlay'), tm=cumulativo('Telmex'), mg=cumulativo('Metrocarrier');
    const sl=Number(state.tendencia.caidas_extra.Starlink||0);
    const total = tp+tm+mg+sl;
    const r = state.resumen;
    // Denominador del Peer — agosto 2026, homologación: ya no es la constante fija TIENDAS_CATALOGO
    // (478/138/5, congelada desde hace tiempo); ahora sale en vivo de catalogoVivo.activasPorCarrier
    // (leído de Directorio). Esto también resuelve Starlink, que antes se quedaba siempre con el valor
    // manual guardado porque la constante fija ni siquiera tenía una entrada para ese carrier — ahora
    // sí se cuenta en vivo (el número de tiendas Starlink sí se sabe desde Directorio; lo único que
    // sigue siendo manual para Starlink son las caídas, porque no vienen del Excel de tickets).
    function autoPeer(prov, caidas){
      const totalTiendas = catalogoVivo.activasPorCarrier[prov];
      if(!totalTiendas) return r.peer[prov]; // catálogo vivo aún sin cargar, o 0 tiendas activas para ese carrier
      return Math.round((caidas / totalTiendas) * 100) / 100;
    }
    function autoAtn(prov){
      const clave = prov==='Megacable' ? 'Metrocarrier' : prov;
      if(prov==='Starlink' || !state.atencion[clave]) return r.atn[prov];
      return state.atencion[clave].avg + ' hrs';
    }
    function card(prov,caidas){
      const peerVal = autoPeer(prov,caidas);
      const atnVal = autoAtn(prov);
      return `<div class="card"><div class="head" style="background:${CARD_COLOR[prov]}">${prov}</div>
        <div class="body">

          <div class="rule"></div>
          <div style="font-size:12px;color:var(--sub)">Peer: <b style="color:var(--ink)">${peerVal}</b> &nbsp;·&nbsp; Atn: <b style="color:var(--ink)">${atnVal}</b></div>
        </div></div>`;
    }
    const sem = r.semana_actual;
    const textoSemana = (sem && sem.numero)
      ? `Semana ${sem.numero} (${fmtFechaCorta(sem.inicio)} – ${fmtFechaCorta(sem.fin)}): <b>${sem.caidas}</b> caídas`

    c.innerHTML = `
      ${canEdit ? `

          ${state.carga.archivo ? `<div class="upload-summary">Último archivo: ${state.carga.archivo} · ${state.carga.tickets_caidas} tickets de caídas procesados · ${fmtFecha(state.carga.fecha)}</div>` : ''}

      ${cargaPendiente ? `
      <div class="panel" style="border-color:var(--tm);">

          Tickets de caídas identificados: <b>${cargaPendiente.resumen.totalCaidas}</b> (Ene–${cargaPendiente.periodo_actual})<br>
          Tiendas con caídas — TotalPlay: <b>${cargaPendiente.resumen.tiendasTP}</b> (${cargaPendiente.resumen.criticasTP} críticas) ·
          Telmex: <b>${cargaPendiente.resumen.tiendasTM}</b> (${cargaPendiente.resumen.criticasTM} críticas)

        <div class="editbar" style="margin-top:10px;">

      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;">

          <div class="title" style="margin-bottom:2px;">Total de caídas ${state.anio}</div>
        </div>
        <div class="panel" style="text-align:center; padding:14px 26px; margin:0;">

        </div>

    charts.resumen = new Chart(document.getElementById('chartResumen'), {

      data:{ labels:['TotalPlay','Telmex','Megacable','Starlink'], datasets:[{ data:[tp,tm,mg,sl],
        backgroundColor:[CARD_COLOR.TotalPlay,CARD_COLOR.Telmex,CARD_COLOR.Megacable,CARD_COLOR.Starlink] }] },

  function renderVelocidadTrend(prov){
    const hasta = idxMes(state.periodo_actual);
    const mesesCortos = MESES.slice(0,hasta+1);
    const key = prov==='TotalPlay' ? 'top_velocidad_totalplay' : 'top_velocidad_telmex';
    const filas = state[key] || [];
    const totalServicios = filas.length;
    const totalTickets = filas.reduce((s,r)=>s+r.meses.reduce((a,b)=>a+Number(b||0),0),0);
    const withTotals = filas.map(r=>{
        const cat = buscarCatalogo(r.nombre);
        const carrier = cat.carrier !== '—' ? cat.carrier : r.carrier;

  const MIGRACION_MEGACABLE = [

  function filasMigracion(lista, hasta){
    return lista.map(nombre=>{
      const enTop = state.top_totalplay.find(r=>r.nombre===nombre);
      const meses = enTop ? enTop.meses : new Array(hasta+1).fill(0);
      const total = meses.reduce((a,b)=>a+Number(b||0),0);
      const cat = buscarCatalogo(nombre);
      const carrier = cat.carrier !== '—' ? cat.carrier : (enTop?.carrier || cat.carrier);
      const tecnologia = cat.tecnologia !== '—' ? cat.tecnologia : (enTop?.tecnologia || cat.tecnologia);
      return { nombre, carrier, tecnologia, meses, total };
    });

  // Columna "Motivo" (agosto 2026): a petición del cliente, después de la columna de migración
  // (Cambio a Megacable / Migración) — por ahora el motivo es fijo para todas las filas de ambas tablas.
  const MOTIVO_MIGRACION = 'Problemas de DNS con MO';

  // amartinez (ni siquiera el resto de admins la puede editar, mismo patrón que canEditHub()).

    return !!(typeof currentUser !== 'undefined' && currentUser && currentUser.username === 'amartinez');

  function tablaMigracion(filas, mesesCortos, tituloMigracion, textoMigracion){

  function computeWin11(){
    const REGIONES_WIN11 = ['Bajio','Centro I','Centro II','Noroeste I','Noroeste II','Norte I','Norte II','Pacifico','Sur Peninsula'];
    const equipos = state.win11_equipos || [];
    const porRegion = REGIONES_WIN11.map(reg=>{
      const key = reg.toUpperCase();
      const rows = equipos.filter(e=> String(e.region||'').trim().toUpperCase()===key);
      const win11 = rows.filter(e=>e.tipo_so==='win11').length;
      const win10 = rows.filter(e=>e.tipo_so==='win10').length;
      const nocompat = rows.filter(e=>e.tipo_so==='nocompat').length;
      const total = win11+win10+nocompat;
      const pendientes = win10+nocompat;
      return {region:reg, win11, win10, nocompat, total, pendientes, avance: total ? win11/total*100 : 0};
    });
    const totalEquipos = porRegion.reduce((s,r)=>s+r.total,0);
    const totalWin11 = porRegion.reduce((s,r)=>s+r.win11,0);
    const totalWin10 = porRegion.reduce((s,r)=>s+r.win10,0);
    const totalNocompat = porRegion.reduce((s,r)=>s+r.nocompat,0);
    const totalPendientes = totalWin10+totalNocompat;
    const avanceGlobal = totalEquipos ? totalWin11/totalEquipos*100 : 0;
    const desktops = equipos.filter(e=>e.chasis==='desktop');
    const laptops = equipos.filter(e=>e.chasis==='laptop');
    const avanceDesktop = desktops.length ? desktops.filter(e=>e.tipo_so==='win11').length/desktops.length*100 : 0;
    const avanceLaptop = laptops.length ? laptops.filter(e=>e.tipo_so==='win11').length/laptops.length*100 : 0;
    return {porRegion, totalEquipos, totalWin11, totalWin10, totalNocompat, totalPendientes, avanceGlobal,
      desktops: desktops.length, laptops: laptops.length, avanceDesktop, avanceLaptop};
  }

  function handleFileUploadWin11(e){
    const file = e.target.files[0];
    if(!file) return;
    const errBox = document.getElementById('uploadErrorWin11');
    errBox.innerHTML = '';
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        function detectarChasis(row){
          const chasisCol = String(row['Tipo de chasis']||'').trim().toLowerCase();
          if(chasisCol) return chasisCol.includes('lap') ? 'laptop' : 'desktop';
          const nombre = String(row['Nombre']||'').toUpperCase();
          if(nombre.startsWith('CMB-')) return 'laptop';
          if(nombre.includes('LAP')) return 'laptop';
          if(nombre.includes('PC')) return 'desktop';
          return 'desktop';
        }
        // "Sistema_Operativo F" es la columna normalizada (distingue "No es compatible Windows 11" y
        // "Retirado de operación"); "Sistema Operativo" es el respaldo si esa viene vacía.
        function detectarTipoSO(row){
          const sof = String(row['Sistema_Operativo F  '] || row['Sistema_Operativo F'] || '').trim();
          const so = String(row['Sistema Operativo'] || '').trim();
          const val = sof || so;
          const low = val.toLowerCase();
          if(low.includes('retirado')) return 'retirado';
          if(low.includes('no es compatible') || low.includes('no compatible')) return 'nocompat';
          if(low.includes('windows 10')) return 'win10';
          if(low.includes('windows 11')) return 'win11';
          return 'otro';
        }
        const nuevos = rows.map(row=>({
          pdv: String(row['Nombre_PDV']||'').trim(),
          region: String(row['Region']||'').trim(),
          chasis: detectarChasis(row),
          tipo_so: detectarTipoSO(row)
        })).filter(r=>r.pdv && (r.tipo_so==='win10' || r.tipo_so==='nocompat' || r.tipo_so==='win11'));
        if(!nuevos.length){ throw new Error('No se encontraron filas con "Nombre_PDV" y un Sistema Operativo reconocible en el archivo.'); }
        state.win11_equipos = nuevos;
        if(!state.win11_pendientes_historial) state.win11_pendientes_historial = [];
        state.win11_pendientes_historial.unshift({
          fecha: new Date().toISOString(),
          usuario: (typeof currentUser!=='undefined' && currentUser) ? currentUser.username : 'desconocido',
          archivo: file.name,
          total: nuevos.length
        });
        if(state.win11_pendientes_historial.length > 30) state.win11_pendientes_historial.length = 30;
        descripcionActualizacion = `Carga de Excel — Migración Win11 (${file.name})`;
        save();
      }catch(err){
        console.error(err);
        errBox.innerHTML = `<div style="color:var(--warn); font-size:12px; margin-top:6px;">No se pudo leer el archivo: ${err.message}</div>`;
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // ---------- Plan de expansion ----------
  // Acota un arreglo de 24 horas a la ventana continua entre la primera y la última hora "relevante"
  // (agosto 2026, segunda vuelta) — antes cortaba solo en cero exacto, pero una hora con muy pocos
  // tickets (ej. 1 de 4,917 en la hora pico) se veía plana e igual de inútil en la gráfica. Ahora
  // corta cualquier hora de arranque/cierre por debajo del 1% del pico de esa misma serie. Si no hay
  // ningún dato, regresa las 24 horas tal cual (no debería pintarse, ya que el caller solo entra aquí
  // cuando el total es mayor a 0).
  const UMBRAL_HORA_RELEVANTE = 0.01;
  function acotarPorHora(etiquetas, valores){
    const pico = Math.max(...valores);
    if(pico <= 0) return { labels: etiquetas, valores };
    const minimo = pico * UMBRAL_HORA_RELEVANTE;
    let primero = 0, ultimo = valores.length - 1;
    while(primero < ultimo && valores[primero] < minimo) primero++;
    while(ultimo > primero && valores[ultimo] < minimo) ultimo--;
    return { labels: etiquetas.slice(primero, ultimo+1), valores: valores.slice(primero, ultimo+1) };
  }
  // Línea de tendencia como promedio móvil centrado (agosto 2026) — antes la "Tendencia" repetía
  // exactamente los mismos valores de la barra, sin aportar nada. Ahora suaviza cada punto con el
  // promedio de sí mismo + los vecinos dentro de la ventana (recortada en los bordes, sin envolver).
  function promedioMovil(valores, ventana){
    return valores.map((_,i)=>{
      const desde = Math.max(0, i - Math.floor(ventana/2));
      const hasta = Math.min(valores.length, i + Math.ceil(ventana/2));
      const trozo = valores.slice(desde, hasta);
      return Math.round(trozo.reduce((a,b)=>a+b,0) / trozo.length);
    });
  }

  // ---------- Inventario de Equipo ----------
  function panelInventario(tipo, data, color, editando){
    const nombreTipo = tipo==='LAPTOP' ? 'Laptop' : 'CPU';
    const filasAdq = [
      ['Adquiridas','adquiridas'], ['Entregadas','entregadas'], ['Inventariadas','inventariadas'],
      ['No inventariadas','no_inventariadas'], ['Falta por recibir','falta_recibir']
    ];
    const total = data.asignaciones.reduce((s,a)=>s+Number(a.valor||0),0);
    const mesesTranscurridos = idxMes(state.periodo_actual) + 2; // diciembre + Ene..periodo_actual
    const promMensual = Math.round(total / mesesTranscurridos);
    return `
      <div style="border:1px solid var(--line); border-radius:10px; overflow:hidden;">
        <div style="background:${cardGrad(color)}; color:#fff; font-weight:700; font-size:15px; padding:10px 16px;">Adquisición — ${nombreTipo}</div>
        <div style="padding:10px 16px;">
          ${filasAdq.map(([label,key])=>`
            <div style="display:flex; justify-content:space-between; padding:5px 0;">
              <span>${label}</span>
              ${editando ? `<input type="number" data-inv="${tipo}.${key}" value="${data[key]}" style="width:80px; text-align:right;">` : `<b>${data[key]}</b>`}
            </div>`).join('')}
        </div>
        <div style="background:${cardGrad(color)}; color:#fff; font-weight:700; font-size:15px; padding:10px 16px;">Asignación</div>
        <div style="padding:10px 16px;">
          ${data.asignaciones.map((a,i)=>`
            <div style="display:flex; justify-content:space-between; align-items:center; padding:5px 0;">
              ${editando
                ? `<input type="text" data-inv-asig-nombre="${tipo}.${i}" value="${a.nombre}" style="flex:1; margin-right:8px;">`
                : `<span>${a.nombre}</span>`}
              ${editando
                ? `<input type="number" data-inv-asig-valor="${tipo}.${i}" value="${a.valor}" style="width:70px; text-align:right;">`
                : `<b>${a.valor}</b>`}
              ${editando ? `<button data-inv-asig-quitar="${tipo}.${i}" style="margin-left:8px; padding:2px 7px;">✕</button>` : ''}
            </div>`).join('')}
          ${editando ? `<button data-inv-asig-agregar="${tipo}" style="margin-top:8px;">Agregar renglón</button>` : ''}
          <div style="border-top:1px solid var(--line); margin-top:${editando?'10px':'8px'};"></div>
          <div style="display:flex; justify-content:space-between; padding:8px 0 2px;">
            <span style="font-weight:700; color:${color};">Total entregadas</span>
            <b style="color:${color};">${total}</b>
          </div>
          <div style="display:flex; justify-content:space-between; padding:6px 0 2px;">
            <span style="font-weight:700; color:${color};">Inventario en almacén</span>
            <b style="color:${color};">${data.adquiridas - total}</b>
          </div>
          <div style="display:flex; justify-content:space-between; padding:6px 0 2px;">
            <span style="font-weight:700; color:${color};">Prom. Mensual</span>
            <b style="color:${color};">${promMensual}</b>
          </div>
          <div style="display:flex; justify-content:space-between; padding:6px 0 2px;">
            <span style="font-weight:700; color:${color};">Proyección Anual</span>
            ${editando ? `<input type="number" data-inv="${tipo}.proyeccion_anual" value="${data.proyeccion_anual}" style="width:80px; text-align:right; font-weight:700;">` : `<b style="color:${color};">${data.proyeccion_anual}</b>`}
          </div>
        </div>
      </div>
    `;
  }
  function renderInventario(c){
    const inv = state.inventario;
    const puedeEditar = canEditInventario();
    c.innerHTML = `
      <div class="title">Adquisición de Equipo ${state.anio}</div>
      <div class="editbar">${editing && puedeEditar
        ? `<button id="btnCancel">Cancelar</button><button class="primary" id="btnSave">Guardar cambios</button>`
        : (puedeEditar ? `<button id="btnEdit">Editar</button>` : '')}</div>
      <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin-top:10px; align-items:start;">
        <div style="display:flex; flex-direction:column; gap:20px;">
          ${panelInventario('LAPTOP', inv.laptop, '#1D4ED8', editing && puedeEditar)}
          ${panelMasarykDetalle(inv, editing && puedeEditar, '#1D4ED8')}
        </div>
        ${panelInventario('CPU', inv.cpu, '#0F8A5F', editing && puedeEditar)}
      </div>
      ${canEdit ? renderHistorialInventario() : ''}
    `;
    if(editing && puedeEditar){
      document.getElementById('btnCancel').onclick = ()=>{ editing=false; render(); };
      document.getElementById('btnSave').onclick = ()=>{
        document.querySelectorAll('[data-inv]').forEach(inp=>{
          const [tipo,key] = inp.dataset.inv.split('.');
          const obj = tipo==='LAPTOP' ? inv.laptop : inv.cpu;
          obj[key] = Number(inp.value||0);
        });
        document.querySelectorAll('[data-inv-asig-nombre]').forEach(inp=>{
          const [tipo,idx] = inp.dataset.invAsigNombre.split('.');
          const obj = tipo==='LAPTOP' ? inv.laptop : inv.cpu;
          obj.asignaciones[Number(idx)].nombre = inp.value;
        });
        document.querySelectorAll('[data-inv-asig-valor]').forEach(inp=>{
          const [tipo,idx] = inp.dataset.invAsigValor.split('.');
          const obj = tipo==='LAPTOP' ? inv.laptop : inv.cpu;
          obj.asignaciones[Number(idx)].valor = Number(inp.value||0);
        });
        const inpUtil = document.getElementById('masarykUtilizadas');
        if(inpUtil) inv.masaryk_detalle.utilizadas = Number(inpUtil.value||0);
        document.querySelectorAll('[data-masaryk-obs]').forEach(inp=>{
          inv.masaryk_detalle.observaciones[Number(inp.dataset.masarykObs)] = inp.value;
        });
        if(!state.inventario_historial) state.inventario_historial = [];
        state.inventario_historial.unshift({
          fecha: new Date().toISOString(),
          usuario: (typeof currentUser!=='undefined' && currentUser) ? currentUser.username : 'desconocido',
          snapshot: JSON.parse(JSON.stringify(inv))
        });
        if(state.inventario_historial.length > 30) state.inventario_historial.length = 30;
        descripcionActualizacion = 'Edición manual — Adquisición de Equipo';
        editing = false;
        save();
      };
      document.querySelectorAll('[data-inv-asig-quitar]').forEach(btn=>{
        btn.onclick = ()=>{
          const [tipo,idx] = btn.dataset.invAsigQuitar.split('.');
          const obj = tipo==='LAPTOP' ? inv.laptop : inv.cpu;
          obj.asignaciones.splice(Number(idx),1);
          render();
        };
      });
      document.querySelectorAll('[data-inv-asig-agregar]').forEach(btn=>{
        btn.onclick = ()=>{
          const tipo = btn.dataset.invAsigAgregar;
          const obj = tipo==='LAPTOP' ? inv.laptop : inv.cpu;
          obj.asignaciones.push({nombre:'Nuevo renglón', valor:0});
          render();
        };
      });
      const inpUtil = document.getElementById('masarykUtilizadas');
      if(inpUtil) inpUtil.onchange = ()=>{
        inv.masaryk_detalle.utilizadas = Math.max(0, Number(inpUtil.value||0));
        render();
      };
    } else if(puedeEditar){
      document.getElementById('btnEdit').onclick = ()=>{ editing=true; render(); };
    }
    if(canEdit){
      document.querySelectorAll('[data-hist-ver]').forEach(btn=>{
        btn.onclick = ()=>{
          const idx = Number(btn.dataset.histVer);
          historialExpandido = historialExpandido===idx ? null : idx;
          render();
        };
      });
    }
  }

  function panelMasarykDetalle(inv, editando, color){
    const masarykRow = inv.laptop.asignaciones.find(a=>/mazaryk|masaryk/i.test(a.nombre));
    const entregadas = masarykRow ? Number(masarykRow.valor||0) : 0;
    const det = inv.masaryk_detalle;
    let utilizadas = Math.max(0, Math.min(Number(det.utilizadas||0), entregadas));
    if(det.utilizadas !== utilizadas) det.utilizadas = utilizadas;
    while(det.observaciones.length < utilizadas) det.observaciones.push('');
    while(det.observaciones.length > utilizadas) det.observaciones.pop();
    const totalDisponible = entregadas - utilizadas;
    return `
      <div style="border:1px solid var(--line); border-radius:10px; overflow:hidden;">
        <div style="background:${cardGrad(color)}; color:#fff; font-weight:700; font-size:15px; padding:10px 16px;">Detalle — Masaryk</div>
        <div style="padding:10px 16px;">
          <div style="display:flex; justify-content:space-between; padding:5px 0;">
            <span>Entregadas</span><b>${entregadas}</b>
          </div>
          <div style="display:flex; justify-content:space-between; padding:5px 0;">
            <span>Utilizadas</span>
            ${editando ? `<input type="number" id="masarykUtilizadas" min="0" max="${entregadas}" value="${utilizadas}" style="width:70px; text-align:right;">` : `<b>${utilizadas}</b>`}
          </div>
          ${det.observaciones.length ? `
          <div style="margin-top:10px;">
            <div style="font-size:11px; font-weight:700; color:var(--sub); letter-spacing:.5px; margin-bottom:6px;">OBSERVACIONES (a quién se asignó)</div>
            ${det.observaciones.map((obs,i)=> editando
              ? `<input type="text" data-masaryk-obs="${i}" value="${(obs||'').replace(/"/g,'&quot;')}" placeholder="Nombre de quién recibió esta laptop" style="width:100%; margin-bottom:6px;">`
              : `<div style="padding:4px 0;">${obs || '<span style="color:var(--sub);">— sin capturar —</span>'}</div>`
            ).join('')}
          </div>` : ''}
          <div style="border-top:1px solid var(--line); margin-top:8px;"></div>
          <div style="display:flex; justify-content:space-between; padding:8px 0 2px;">
            <span style="font-weight:700; color:${color};">Total disponible</span><b style="color:${color};">${totalDisponible}</b>
          </div>
        </div>
      </div>
    `;
  }

    if(!hist.length){
      return `<div class="panel" style="margin-top:20px;"><h3>Historial de cambios</h3></div>`;

    return `
      <div class="panel" style="margin-top:20px;">
        <h3>Historial de cambios</h3>
        <div style="overflow-x:auto;"><table>
          <thead><tr><th>Fecha</th><th>Usuario</th><th></th></tr></thead>
          <tbody>${hist.map((h,i)=>`
            <tr>
              <td>${fmtFecha(h.fecha)}</td>
              <td>${h.usuario}</td>
              <td><button data-hist-ver="${i}" style="padding:3px 8px;">${historialExpandido===i ? 'Ocultar' : 'Ver'}</button></td>
            </tr>
            ${historialExpandido===i ? `
            <tr><td colspan="3">
              <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; padding:10px 0;">
                <div>
                  <b>Laptop</b>

                    Asignación: ${h.snapshot.laptop.asignaciones.map(a=>a.nombre+': '+a.valor).join(' · ')}<br>

                    Adquiridas: ${h.snapshot.cpu.adquiridas} · Entregadas: ${h.snapshot.cpu.entregadas} · Inventariadas: ${h.snapshot.cpu.inventariadas}<br>
                    Asignación: ${h.snapshot.cpu.asignaciones.map(a=>a.nombre+': '+a.valor).join(' · ')}<br>
                    Proyección Anual: ${h.snapshot.cpu.proyeccion_anual}
                  </div>
                </div>
              </div>
              <div style="font-size:12.5px;">
                <b>Detalle Masaryk</b> — Utilizadas: ${h.snapshot.masaryk_detalle.utilizadas} ·

  // ---------- Equipos PDV Región ----------
  function renderPdvRegion(c){
    const data = state.equipos_pdv_region;
    const puedeEditar = canEditPdvRegion();
    const puedeEditarCerrado = canEditLaptopCerrado();
    const laptopCerrado = Number(data.laptop_pdv_cerrado||0);
    // _i conserva el índice real dentro de data.regiones — las tarjetas se muestran ordenadas de mayor a
    // menor total, pero el guardado siempre debe escribir en la región correcta, no en la posición visual.
    const regs = data.regiones
      .map((r,i)=>({...r, _i:i, total: Number(r.pdv_laptop||0)+Number(r.cambaceo||0)+Number(r.desktop||0)}))
      .sort((a,b)=> b.total - a.total);
    const totalGeneral = regs.reduce((s,r)=>s+r.total,0);
    const totalDesktop = regs.reduce((s,r)=>s+Number(r.desktop||0),0);
    const totalPdvLaptop = regs.reduce((s,r)=>s+Number(r.pdv_laptop||0),0);
    const totalCambaceo = regs.reduce((s,r)=>s+Number(r.cambaceo||0),0);
    const pdvLaptopNeto = Math.max(0, totalPdvLaptop - laptopCerrado);
    c.innerHTML = `
      <div class="title">Equipos PDV Región</div>
      <div class="editbar">${editing && puedeEditar
        ? `<button id="btnCancel">Cancelar</button><button class="primary" id="btnSave">Guardar cambios</button>`
        : (puedeEditar ? `<button id="btnEdit">Editar</button>` : '')}</div>
      <div class="cards cards-5" style="margin-top:10px;">
        <div class="card"><div class="head" style="background:${cardGrad(COLOR_PDV)}">Total general</div><div class="body"><div class="big">${totalGeneral.toLocaleString('es-MX')}</div></div></div>
        <div class="card"><div class="head" style="background:${cardGrad(COLOR_PDV)}">Desktop</div><div class="body"><div class="big">${totalDesktop.toLocaleString('es-MX')}</div></div></div>
        <div class="card"><div class="head" style="background:${cardGrad(COLOR_PDV)}">PDV con laptop</div>
          <div class="body"><div class="big">${pdvLaptopNeto.toLocaleString('es-MX')}</div><div class="lbl">${totalPdvLaptop.toLocaleString('es-MX')} activas − ${laptopCerrado.toLocaleString('es-MX')} cerradas</div></div></div>
        <div class="card" style="${puedeEditarCerrado ? 'border-color:'+COLOR_PDV_CERRADO+'; box-shadow:0 0 0 2px rgba(217,119,6,.15);' : ''}">
          <div class="head" style="background:${cardGrad(COLOR_PDV_CERRADO)}; display:flex; justify-content:space-between; align-items:center; gap:6px;">
            <span>Laptop PDV cerrado</span>
            ${puedeEditarCerrado ? `<button id="btnPencilCerrado" title="Editar" style="background:rgba(255,255,255,.25); border:none; border-radius:6px; width:22px; height:22px; color:#fff; cursor:pointer; flex:none;">✎</button>` : ''}
          </div>
          <div class="body">
            ${editandoLaptopCerrado && puedeEditarCerrado ? `
              <div style="display:flex; align-items:center; gap:8px;">
                <input type="number" id="inputLaptopCerrado" min="0" value="${laptopCerrado}" style="width:70px; font-size:16px; font-weight:700; padding:4px 6px; border:1px solid var(--line); border-radius:6px;">
                <button class="primary" id="btnGuardarCerrado" style="padding:5px 12px;">Guardar</button>
              </div>
              <div class="lbl">Editable por cualquier usuario, excepto mgiron</div>
            ` : `
              <div class="big">${laptopCerrado.toLocaleString('es-MX')}</div><div class="lbl">Se resta de "PDV con laptop"</div>
            `}
          </div>
        </div>
        <div class="card"><div class="head" style="background:${cardGrad(COLOR_PDV)}">Laptop cambaceo</div><div class="body"><div class="big">${totalCambaceo.toLocaleString('es-MX')}</div></div></div>
      </div>
      <div style="display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px;">
        ${regs.map((r,rank)=>`
          <div style="border:1px solid var(--line); border-radius:10px; overflow:hidden;">
            <div style="background:${cardGrad(COLOR_PDV)}; color:#fff; font-weight:700; font-size:14px; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
              ${editing && puedeEditar
                ? `<input type="text" data-pdv-nombre="${r._i}" value="${r.nombre}" style="width:100%; background:transparent; border:1px solid rgba(255,255,255,.5); color:#fff; padding:2px 6px;">`
                : `<span>${r.nombre}</span>`}
              <span style="font-size:11px; font-weight:700; background:rgba(255,255,255,.25); border-radius:20px; padding:2px 8px; flex:none;">#${rank+1}</span>
            </div>
            <div style="padding:14px 16px;">
            <div style="font-size:26px; font-weight:700;">${r.total}</div>
            <div style="display:flex; justify-content:space-between; padding:4px 0; font-size:12.5px;">
              <span>PDV laptop</span>${editing && puedeEditar ? `<input type="number" data-pdv-campo="${r._i}.pdv_laptop" value="${r.pdv_laptop}" style="width:60px; text-align:right;">` : `<b>${r.pdv_laptop}</b>`}

          data.regiones[Number(inp.dataset.pdvNombre)].nombre = inp.value;
        });
        document.querySelectorAll('[data-pdv-campo]').forEach(inp=>{
          const [idx,campo] = inp.dataset.pdvCampo.split('.');
          data.regiones[Number(idx)][campo] = Number(inp.value||0);
        });
        if(!state.equipos_pdv_region_historial) state.equipos_pdv_region_historial = [];
        state.equipos_pdv_region_historial.unshift({
          fecha: new Date().toISOString(),
          usuario: (typeof currentUser!=='undefined' && currentUser) ? currentUser.username : 'desconocido',
          snapshot: JSON.parse(JSON.stringify(data))
        });
        if(state.equipos_pdv_region_historial.length > 30) state.equipos_pdv_region_historial.length = 30;
        descripcionActualizacion = 'Edición manual — Equipos PDV Región';
        editing = false;
        save();

  // ---------- Budget IT 2026 ----------
  const MESES_CORTOS_BI = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const CAPEX_MESES_BI = ['Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  // Moneda por proveedor — fija, no editable (agosto 2026, a petición del cliente).
  const PROVEEDORES_MONEDA_USD = ['IQSEC (KACE)', 'COLOUR KLUB'];
  // Tipo de cambio fijo (agosto 2026, a petición del cliente): lo que se captura en la casilla de un
  // proveedor USD se entiende en dólares, y se convierte a pesos con este factor antes de guardarse —
  // en Firestore y en toda la tabla siempre se ve en pesos, nunca en dólares.
  const TIPO_CAMBIO_USD = 20;
  function esProveedorUSD(proveedor){ return PROVEEDORES_MONEDA_USD.includes(proveedor); }
  function monedaProveedor(proveedor){ return esProveedorUSD(proveedor) ? 'USD' : 'MX'; }
  // Proveedores que meten 2 facturas por mes — en edición se capturan por separado y se suman;
  // solo se guarda el total, nunca las 2 cantidades por separado (agosto 2026).
  const PROVEEDORES_DOBLE_FACTURA = ['COLOUR KLUB', 'GRUPO LEYMARK', 'METROCARRIER', 'MARAFIC', 'RED', 'REDSLOG'];
  // Semáforo de fondo (tenue) para medir cualquier monto real contra el presupuesto/mes de ese proveedor —
  // aplica a los 14 proveedores, tanto en los meses ya cerrados (Ene–Jun) como en cualquier mes de
  // Jul–Dic que ya tenga dato capturado. Mismos tonos que ya usa `.status-badge.estable/.critica`.
  function bgPresupuesto(valor, presupuesto){ return valor<=presupuesto ? '#E7F7EC' : '#FDECEC'; }
  function moneyIT(n){ return '$' + Math.round(n||0).toLocaleString('es-MX'); }
  // Para meses sin dato real (null) se muestra una proyección: promedio de los hasta 3 meses reales
  // más recientes anteriores a ese mes. No se guarda como dato real hasta que alguien lo edite.
  function budgetItValorMes(serie, i){
    if(serie[i]!==null && serie[i]!==undefined) return {valor:Number(serie[i]), esReal:true};
    let vals = [];
    for(let k=i-1; k>=0 && vals.length<3; k--){ if(serie[k]!==null && serie[k]!==undefined) vals.push(Number(serie[k])); }
    return {valor: vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0, esReal:false};
  }
  // Nota: los valores calculados (reales + proyectados) se guardan en un arreglo aparte (valoresPorVendor),
  // nunca sobre state.budget_it.opex directamente — así el objeto que se persiste en Firestore solo
  // contiene los datos reales que alguien capturó, sin caché de cálculos.
  function computeBudgetIT(){
    const data = state.budget_it;
    const valoresPorVendor = data.opex.map(v=> v.meses.map((_,i)=>budgetItValorMes(v.meses,i)));
    const monthlyActual = new Array(12).fill(0);
    valoresPorVendor.forEach(valores=> valores.forEach((o,i)=> monthlyActual[i]+=o.valor));
    const monthlyBudget = data.opex.reduce((s,v)=>s+Number(v.presupuesto_mes||0),0);
    const budgetSeries = new Array(12).fill(monthlyBudget);
    const janJunActual = monthlyActual.slice(0,6).reduce((a,b)=>a+b,0);
    const janJunBudget = monthlyBudget*6;
    const ahorroJanJun = janJunBudget - janJunActual;
    const opexAnnualProjected = monthlyActual.reduce((a,b)=>a+b,0);
    const opexAnnualBudget = monthlyBudget*12;
    const ahorroProyectado = opexAnnualBudget - opexAnnualProjected;
    // Solo los proyectos con la casilla "incluir" marcada entran al cálculo de CAPEX y a sus gráficas.
    const capexIncluidos = data.capex.filter(c=>c.incluir!==false);
    const capexBudget = capexIncluidos.reduce((s,c)=>s+Number(c.presupuesto||0),0);
    const capexEjecutado = capexIncluidos.reduce((s,c)=>s+Number(c.ejecutado||0),0);
    const capexPendiente = Math.max(capexBudget - capexEjecutado, 0);
    const totalPresupuestoAnual = opexAnnualBudget + capexBudget;
    const totalProyeccionAnual = opexAnnualProjected + capexEjecutado + capexPendiente;
    const ahorroTotalProyectado = totalPresupuestoAnual - totalProyeccionAnual;
    const catTotals = {};
    data.opex.forEach((v,vi)=>{
      const total6 = valoresPorVendor[vi].slice(0,6).reduce((a,o)=>a+o.valor,0);
      catTotals[v.categoria] = (catTotals[v.categoria]||0) + total6;
    });
    return {monthlyActual, monthlyBudget, budgetSeries, janJunActual, janJunBudget, ahorroJanJun,
      opexAnnualProjected, opexAnnualBudget, ahorroProyectado, capexBudget, capexEjecutado, capexPendiente,
      totalPresupuestoAnual, totalProyeccionAnual, ahorroTotalProyectado, catTotals, valoresPorVendor};
  }

              const dobleFactura = PROVEEDORES_DOBLE_FACTURA.includes(v.proveedor);

        document.querySelectorAll('[data-bi-v]:not([data-bi-factura])').forEach(inp=>{

          const factor = esProveedorUSD(data.opex[vi].proveedor) ? TIPO_CAMBIO_USD : 1;
          if(raw!=='') data.opex[vi].meses[mi] = Number(raw) * factor;

        document.querySelectorAll('[data-bi-v][data-bi-factura="1"]').forEach(inp1=>{
          const vi = Number(inp1.dataset.biV), mi = Number(inp1.dataset.biM);
          const inp2 = document.querySelector(`[data-bi-v="${vi}"][data-bi-m="${mi}"][data-bi-factura="2"]`);
          const raw1 = inp1.value.trim();
          const raw2 = inp2 ? inp2.value.trim() : '';
          const factor = esProveedorUSD(data.opex[vi].proveedor) ? TIPO_CAMBIO_USD : 1;
          if(raw1!=='' || raw2!==''){
            data.opex[vi].meses[mi] = (Number(raw1||0) + Number(raw2||0)) * factor;
          }
        });
        document.querySelectorAll('[data-bi-capex-incluir]').forEach(chk=>{
          data.capex[Number(chk.dataset.biCapexIncluir)].incluir = chk.checked;
        });
        document.querySelectorAll('[data-bi-capex]').forEach(sel=>{
          data.capex[Number(sel.dataset.biCapex)].mes_plan = sel.value;
        });
        const dSave = computeBudgetIT();
        if(!state.budget_it.historial) state.budget_it.historial = [];
        state.budget_it.historial.unshift({
          fecha: new Date().toISOString(),
          usuario: (typeof currentUser!=='undefined' && currentUser) ? currentUser.username : 'desconocido',

        if(state.budget_it.historial.length > 30) state.budget_it.historial.length = 30;
        descripcionActualizacion = 'Edición manual — Budget IT 2026';
        editing = false;
        save();

    document.querySelectorAll('[data-hist-bi-ver]').forEach(btn=>{

    const catEntries = Object.entries(d.catTotals).sort((a,b)=>b[1]-a[1]);
    const provEntries = data.opex.map((v,vi)=>[v.proveedor, d.valoresPorVendor[vi].slice(0,6).reduce((s,o)=>s+o.valor,0)]).sort((a,b)=>b[1]-a[1]);

      options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{ticks:{callback:(v)=>'$'+(v/1e6).toFixed(1)+'M'}}}}

    if(charts.budgetItProv) charts.budgetItProv.destroy();
