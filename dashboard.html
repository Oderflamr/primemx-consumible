  // ---------- Inventario de Equipo ----------
  function panelInventario(tipo, data, color, editando){
    const nombreTipo = tipo==='LAPTOP' ? 'Laptop' : 'CPU';
    const filasAdq = [
      ['Adquiridas','adquiridas'], ['Entregadas','entregadas'], ['Inventariadas','inventariadas'],
      ['No inventariadas','no_inventariadas'], ['Falta por recibir','falta_recibir']
    ];
    const total = data.asignaciones.reduce((s,a)=>s+Number(a.valor||0),0);
    const mesesTranscurridos = idxMes(state.periodo_actual) + 2; // diciembre + Ene..periodo_actual
    const promMensual = Math.round(total / mesesTranscurridos);
    return `
      <div style="border:1px solid var(--line); border-radius:10px; overflow:hidden;">
        <div style="background:${cardGrad(color)}; color:#fff; font-weight:700; font-size:15px; padding:10px 16px;">Adquisición — ${nombreTipo}</div>
        <div style="padding:10px 16px;">
          ${filasAdq.map(([label,key])=>`
            <div style="display:flex; justify-content:space-between; padding:5px 0;">
              <span>${label}</span>
              ${editando ? `<input type="number" data-inv="${tipo}.${key}" value="${data[key]}" style="width:80px; text-align:right;">` : `<b>${data[key]}</b>`}
            </div>`).join('')}
        </div>
        <div style="background:${cardGrad(color)}; color:#fff; font-weight:700; font-size:15px; padding:10px 16px;">Asignación</div>
        <div style="padding:10px 16px;">
          ${data.asignaciones.map((a,i)=>`
            <div style="display:flex; justify-content:space-between; align-items:center; padding:5px 0;">
              ${editando
                ? `<input type="text" data-inv-asig-nombre="${tipo}.${i}" value="${a.nombre}" style="flex:1; margin-right:8px;">`
                : `<span>${a.nombre}</span>`}
              ${editando
                ? `<input type="number" data-inv-asig-valor="${tipo}.${i}" value="${a.valor}" style="width:70px; text-align:right;">`
                : `<b>${a.valor}</b>`}
              ${editando ? `<button data-inv-asig-quitar="${tipo}.${i}" style="margin-left:8px; padding:2px 7px;">✕</button>` : ''}
            </div>`).join('')}
          ${editando ? `<button data-inv-asig-agregar="${tipo}" style="margin-top:8px;">Agregar renglón</button>` : ''}
          <div style="border-top:1px solid var(--line); margin-top:${editando?'10px':'8px'};"></div>
          <div style="display:flex; justify-content:space-between; padding:8px 0 2px;">
            <span style="font-weight:700; color:${color};">Total entregadas</span>
            <b style="color:${color};">${total}</b>
          </div>
          <div style="display:flex; justify-content:space-between; padding:6px 0 2px;">
            <span style="font-weight:700; color:${color};">Inventario en almacén</span>
            <b style="color:${color};">${data.adquiridas - total}</b>
          </div>
          <div style="display:flex; justify-content:space-between; padding:6px 0 2px;">
            <span style="font-weight:700; color:${color};">Prom. Mensual</span>
            <b style="color:${color};">${promMensual}</b>
          </div>
          <div style="display:flex; justify-content:space-between; padding:6px 0 2px;">
            <span style="font-weight:700; color:${color};">Proyección Anual</span>
            ${editando ? `<input type="number" data-inv="${tipo}.proyeccion_anual" value="${data.proyeccion_anual}" style="width:80px; text-align:right; font-weight:700;">` : `<b style="color:${color};">${data.proyeccion_anual}</b>`}
          </div>
        </div>
      </div>
    `;
  }
  function renderInventario(c){
    const inv = state.inventario;
    const puedeEditar = canEditInventario();
    c.innerHTML = `
      <div class="title">Adquisición de Equipo ${state.anio}</div>
      <div class="editbar">${editing && puedeEditar
        ? `<button id="btnCancel">Cancelar</button><button class="primary" id="btnSave">Guardar cambios</button>`
        : (puedeEditar ? `<button id="btnEdit">Editar</button>` : '')}</div>
      <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin-top:10px; align-items:start;">
        <div style="display:flex; flex-direction:column; gap:20px;">
          ${panelInventario('LAPTOP', inv.laptop, '#1D4ED8', editing && puedeEditar)}
          ${panelMasarykDetalle(inv, editing && puedeEditar, '#1D4ED8')}
        </div>
        ${panelInventario('CPU', inv.cpu, '#0F8A5F', editing && puedeEditar)}
      </div>
      ${canEdit ? renderHistorialInventario() : ''}
    `;
    if(editing && puedeEditar){
      document.getElementById('btnCancel').onclick = ()=>{ editing=false; render(); };
      document.getElementById('btnSave').onclick = ()=>{
        document.querySelectorAll('[data-inv]').forEach(inp=>{
          const [tipo,key] = inp.dataset.inv.split('.');
          const obj = tipo==='LAPTOP' ? inv.laptop : inv.cpu;
          obj[key] = Number(inp.value||0);
        });
        document.querySelectorAll('[data-inv-asig-nombre]').forEach(inp=>{
          const [tipo,idx] = inp.dataset.invAsigNombre.split('.');
          const obj = tipo==='LAPTOP' ? inv.laptop : inv.cpu;
          obj.asignaciones[Number(idx)].nombre = inp.value;
        });
        document.querySelectorAll('[data-inv-asig-valor]').forEach(inp=>{
          const [tipo,idx] = inp.dataset.invAsigValor.split('.');
          const obj = tipo==='LAPTOP' ? inv.laptop : inv.cpu;
          obj.asignaciones[Number(idx)].valor = Number(inp.value||0);
        });
        const inpUtil = document.getElementById('masarykUtilizadas');
        if(inpUtil) inv.masaryk_detalle.utilizadas = Number(inpUtil.value||0);
        document.querySelectorAll('[data-masaryk-obs]').forEach(inp=>{
          inv.masaryk_detalle.observaciones[Number(inp.dataset.masarykObs)] = inp.value;
        });
        if(!state.inventario_historial) state.inventario_historial = [];
        state.inventario_historial.unshift({
          fecha: new Date().toISOString(),
          usuario: (typeof currentUser!=='undefined' && currentUser) ? currentUser.username : 'desconocido',
          snapshot: JSON.parse(JSON.stringify(inv))
        });
        if(state.inventario_historial.length > 30) state.inventario_historial.length = 30;
        descripcionActualizacion = 'Edición manual — Adquisición de Equipo';
        editing = false;
        save();
      };
      document.querySelectorAll('[data-inv-asig-quitar]').forEach(btn=>{
        btn.onclick = ()=>{
          const [tipo,idx] = btn.dataset.invAsigQuitar.split('.');
          const obj = tipo==='LAPTOP' ? inv.laptop : inv.cpu;
          obj.asignaciones.splice(Number(idx),1);
          render();
        };
      });
      document.querySelectorAll('[data-inv-asig-agregar]').forEach(btn=>{
        btn.onclick = ()=>{
          const tipo = btn.dataset.invAsigAgregar;
          const obj = tipo==='LAPTOP' ? inv.laptop : inv.cpu;
          obj.asignaciones.push({nombre:'Nuevo renglón', valor:0});
          render();
        };
      });
      const inpUtil = document.getElementById('masarykUtilizadas');
      if(inpUtil) inpUtil.onchange = ()=>{
        inv.masaryk_detalle.utilizadas = Math.max(0, Number(inpUtil.value||0));
        render();
      };
    } else if(puedeEditar){
      document.getElementById('btnEdit').onclick = ()=>{ editing=true; render(); };
    }
    if(canEdit){
      document.querySelectorAll('[data-hist-ver]').forEach(btn=>{
        btn.onclick = ()=>{
          const idx = Number(btn.dataset.histVer);
          historialExpandido = historialExpandido===idx ? null : idx;
          render();
        };
      });
    }
  }

  function panelMasarykDetalle(inv, editando, color){
    const masarykRow = inv.laptop.asignaciones.find(a=>/mazaryk|masaryk/i.test(a.nombre));
    const entregadas = masarykRow ? Number(masarykRow.valor||0) : 0;
    const det = inv.masaryk_detalle;
    let utilizadas = Math.max(0, Math.min(Number(det.utilizadas||0), entregadas));
    if(det.utilizadas !== utilizadas) det.utilizadas = utilizadas;
    while(det.observaciones.length < utilizadas) det.observaciones.push('');
    while(det.observaciones.length > utilizadas) det.observaciones.pop();
    const totalDisponible = entregadas - utilizadas;
    return `
      <div style="border:1px solid var(--line); border-radius:10px; overflow:hidden;">
        <div style="background:${cardGrad(color)}; color:#fff; font-weight:700; font-size:15px; padding:10px 16px;">Detalle — Masaryk</div>
        <div style="padding:10px 16px;">
          <div style="display:flex; justify-content:space-between; padding:5px 0;">
            <span>Entregadas</span><b>${entregadas}</b>
          </div>
          <div style="display:flex; justify-content:space-between; padding:5px 0;">
            <span>Utilizadas</span>
            ${editando ? `<input type="number" id="masarykUtilizadas" min="0" max="${entregadas}" value="${utilizadas}" style="width:70px; text-align:right;">` : `<b>${utilizadas}</b>`}
          </div>
          ${det.observaciones.length ? `
          <div style="margin-top:10px;">
            <div style="font-size:11px; font-weight:700; color:var(--sub); letter-spacing:.5px; margin-bottom:6px;">OBSERVACIONES (a quién se asignó)</div>
            ${det.observaciones.map((obs,i)=> editando
              ? `<input type="text" data-masaryk-obs="${i}" value="${(obs||'').replace(/"/g,'&quot;')}" placeholder="Nombre de quién recibió esta laptop" style="width:100%; margin-bottom:6px;">`
              : `<div style="padding:4px 0;">${obs || '<span style="color:var(--sub);">— sin capturar —</span>'}</div>`
            ).join('')}
          </div>` : ''}
          <div style="border-top:1px solid var(--line); margin-top:8px;"></div>
          <div style="display:flex; justify-content:space-between; padding:8px 0 2px;">
            <span style="font-weight:700; color:${color};">Total disponible</span><b style="color:${color};">${totalDisponible}</b>
          </div>
        </div>
      </div>
    `;
  }

  function renderHistorialInventario(){
    const hist = state.inventario_historial || [];
    if(!hist.length){
      return `<div class="panel" style="margin-top:20px;"><h3>Historial de cambios</h3></div>`;

    return `
      <div class="panel" style="margin-top:20px;">
        <h3>Historial de cambios</h3>
        <div style="overflow-x:auto;"><table>
          <thead><tr><th>Fecha</th><th>Usuario</th><th></th></tr></thead>
          <tbody>${hist.map((h,i)=>`
            <tr>
              <td>${fmtFecha(h.fecha)}</td>
              <td>${h.usuario}</td>
              <td><button data-hist-ver="${i}" style="padding:3px 8px;">${historialExpandido===i ? 'Ocultar' : 'Ver'}</button></td>
            </tr>
            ${historialExpandido===i ? `
            <tr><td colspan="3">
              <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; padding:10px 0;">
                <div>
                  <b>Laptop</b>
                  <div style="font-size:12.5px; margin-top:4px;">

                    Asignación: ${h.snapshot.laptop.asignaciones.map(a=>a.nombre+': '+a.valor).join(' · ')}<br>

                    Asignación: ${h.snapshot.cpu.asignaciones.map(a=>a.nombre+': '+a.valor).join(' · ')}<br>
                    Proyección Anual: ${h.snapshot.cpu.proyeccion_anual}
                  </div>
                </div>
              </div>
              <div style="font-size:12.5px;">
                <b>Detalle Masaryk</b> — Utilizadas: ${h.snapshot.masaryk_detalle.utilizadas} ·
                Observaciones: ${h.snapshot.masaryk_detalle.observaciones.filter(o=>o).join(', ') || '—'}

  // ---------- Equipos PDV Región ----------
  function renderPdvRegion(c){
    const data = state.equipos_pdv_region;
    const puedeEditar = canEditPdvRegion();
    const puedeEditarCerrado = canEditLaptopCerrado();
    const laptopCerrado = Number(data.laptop_pdv_cerrado||0);
    // _i conserva el índice real dentro de data.regiones — las tarjetas se muestran ordenadas de mayor a
    // menor total, pero el guardado siempre debe escribir en la región correcta, no en la posición visual.
    const regs = data.regiones
      .map((r,i)=>({...r, _i:i, total: Number(r.pdv_laptop||0)+Number(r.cambaceo||0)+Number(r.desktop||0)}))
      .sort((a,b)=> b.total - a.total);
    const totalGeneral = regs.reduce((s,r)=>s+r.total,0);
    const totalDesktop = regs.reduce((s,r)=>s+Number(r.desktop||0),0);
    const totalPdvLaptop = regs.reduce((s,r)=>s+Number(r.pdv_laptop||0),0);
    const totalCambaceo = regs.reduce((s,r)=>s+Number(r.cambaceo||0),0);
    const pdvLaptopNeto = Math.max(0, totalPdvLaptop - laptopCerrado);
    c.innerHTML = `
      <div class="title">Equipos PDV Región</div>
      <div class="editbar">${editing && puedeEditar
        ? `<button id="btnCancel">Cancelar</button><button class="primary" id="btnSave">Guardar cambios</button>`
        : (puedeEditar ? `<button id="btnEdit">Editar</button>` : '')}</div>
      <div class="cards cards-5" style="margin-top:10px;">
        <div class="card"><div class="head" style="background:${cardGrad(COLOR_PDV)}">Total general</div><div class="body"><div class="big">${totalGeneral.toLocaleString('es-MX')}</div></div></div>
        <div class="card"><div class="head" style="background:${cardGrad(COLOR_PDV)}">Desktop</div><div class="body"><div class="big">${totalDesktop.toLocaleString('es-MX')}</div></div></div>
        <div class="card"><div class="head" style="background:${cardGrad(COLOR_PDV)}">PDV con laptop</div>
          <div class="body"><div class="big">${pdvLaptopNeto.toLocaleString('es-MX')}</div><div class="lbl">${totalPdvLaptop.toLocaleString('es-MX')} activas − ${laptopCerrado.toLocaleString('es-MX')} cerradas</div></div></div>
        <div class="card" style="${puedeEditarCerrado ? 'border-color:'+COLOR_PDV_CERRADO+'; box-shadow:0 0 0 2px rgba(217,119,6,.15);' : ''}">
          <div class="head" style="background:${cardGrad(COLOR_PDV_CERRADO)}; display:flex; justify-content:space-between; align-items:center; gap:6px;">
            <span>Laptop PDV cerrado</span>
            ${puedeEditarCerrado ? `<button id="btnPencilCerrado" title="Editar" style="background:rgba(255,255,255,.25); border:none; border-radius:6px; width:22px; height:22px; color:#fff; cursor:pointer; flex:none;">✎</button>` : ''}
          </div>
          <div class="body">
            ${editandoLaptopCerrado && puedeEditarCerrado ? `
              <div style="display:flex; align-items:center; gap:8px;">
                <input type="number" id="inputLaptopCerrado" min="0" value="${laptopCerrado}" style="width:70px; font-size:16px; font-weight:700; padding:4px 6px; border:1px solid var(--line); border-radius:6px;">
                <button class="primary" id="btnGuardarCerrado" style="padding:5px 12px;">Guardar</button>
              </div>
              <div class="lbl">Editable por cualquier usuario, excepto mgiron</div>
            ` : `
              <div class="big">${laptopCerrado.toLocaleString('es-MX')}</div><div class="lbl">Se resta de "PDV con laptop"</div>
            `}
          </div>
        </div>
        <div class="card"><div class="head" style="background:${cardGrad(COLOR_PDV)}">Laptop cambaceo</div><div class="body"><div class="big">${totalCambaceo.toLocaleString('es-MX')}</div></div></div>
      </div>
      <div style="display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px;">
        ${regs.map((r,rank)=>`
          <div style="border:1px solid var(--line); border-radius:10px; overflow:hidden;">
            <div style="background:${cardGrad(COLOR_PDV)}; color:#fff; font-weight:700; font-size:14px; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
              ${editing && puedeEditar
                ? `<input type="text" data-pdv-nombre="${r._i}" value="${r.nombre}" style="width:100%; background:transparent; border:1px solid rgba(255,255,255,.5); color:#fff; padding:2px 6px;">`
                : `<span>${r.nombre}</span>`}
              <span style="font-size:11px; font-weight:700; background:rgba(255,255,255,.25); border-radius:20px; padding:2px 8px; flex:none;">#${rank+1}</span>
            </div>
            <div style="padding:14px 16px;">
            <div style="font-size:26px; font-weight:700; text-align:right;">${r.total}</div>
            <div style="display:flex; justify-content:space-between; padding:4px 0; font-size:12.5px;">
              <span>PDV laptop</span>${editing && puedeEditar ? `<input type="number" data-pdv-campo="${r._i}.pdv_laptop" value="${r.pdv_laptop}" style="width:60px; text-align:right;">` : `<b>${r.pdv_laptop}</b>`}
            </div>
            <div style="display:flex; justify-content:space-between; padding:4px 0; font-size:12.5px;">
              <span>Cambaceo</span>${editing && puedeEditar ? `<input type="number" data-pdv-campo="${r._i}.cambaceo" value="${r.cambaceo}" style="width:60px; text-align:right;">` : `<b>${r.cambaceo}</b>`}

            <div style="display:flex; justify-content:space-between; padding:4px 0; font-size:12.5px;">
              <span>HeadCount</span>${editing && puedeEditar ? `<input type="number" data-pdv-campo="${r._i}.headcount" value="${r.headcount}" style="width:60px; text-align:right;">` : `<b>${r.headcount}</b>`}
            </div>
            <div style="display:flex; justify-content:space-between; padding:4px 0; font-size:12.5px;">
              <span>Vacantes</span>${editing && puedeEditar ? `<input type="number" data-pdv-campo="${r._i}.vacantes" value="${r.vacantes}" style="width:60px; text-align:right;">` : `<b>${r.vacantes}</b>`}
            </div>
            </div>
          </div>
        `).join('')}
      </div>
      ${canEdit ? renderHistorialPdvRegion() : ''}
    `;
    if(editing && puedeEditar){
      document.getElementById('btnCancel').onclick = ()=>{ editing=false; render(); };
      document.getElementById('btnSave').onclick = ()=>{
        document.querySelectorAll('[data-pdv-nombre]').forEach(inp=>{
          data.regiones[Number(inp.dataset.pdvNombre)].nombre = inp.value;
        });
        document.querySelectorAll('[data-pdv-campo]').forEach(inp=>{
          const [idx,campo] = inp.dataset.pdvCampo.split('.');
          data.regiones[Number(idx)][campo] = Number(inp.value||0);
        });
        if(!state.equipos_pdv_region_historial) state.equipos_pdv_region_historial = [];
        state.equipos_pdv_region_historial.unshift({
          fecha: new Date().toISOString(),
          usuario: (typeof currentUser!=='undefined' && currentUser) ? currentUser.username : 'desconocido',
          snapshot: JSON.parse(JSON.stringify(data))
        });
        if(state.equipos_pdv_region_historial.length > 30) state.equipos_pdv_region_historial.length = 30;
        descripcionActualizacion = 'Edición manual — Equipos PDV Región';
        editing = false;
        save();
      };
    } else if(puedeEditar){
      document.getElementById('btnEdit').onclick = ()=>{ editing=true; render(); };
    }
    if(puedeEditarCerrado){
      const btnPencilCerrado = document.getElementById('btnPencilCerrado');
      if(btnPencilCerrado) btnPencilCerrado.onclick = ()=>{ editandoLaptopCerrado = true; render(); };
      const btnGuardarCerrado = document.getElementById('btnGuardarCerrado');
      if(btnGuardarCerrado) btnGuardarCerrado.onclick = ()=>{
        const val = Math.max(0, Number(document.getElementById('inputLaptopCerrado').value || 0));
        data.laptop_pdv_cerrado = val;
        if(!state.equipos_pdv_region_historial) state.equipos_pdv_region_historial = [];
        state.equipos_pdv_region_historial.unshift({
          fecha: new Date().toISOString(),
          usuario: (typeof currentUser!=='undefined' && currentUser) ? currentUser.username : 'desconocido',
          snapshot: JSON.parse(JSON.stringify(data))
        });
        if(state.equipos_pdv_region_historial.length > 30) state.equipos_pdv_region_historial.length = 30;
        descripcionActualizacion = 'Edición manual — Laptop PDV cerrado';
        editandoLaptopCerrado = false;
        save();
      };
    }
    if(canEdit){
      document.querySelectorAll('[data-hist-pdv-ver]').forEach(btn=>{
        btn.onclick = ()=>{
          const idx = Number(btn.dataset.histPdvVer);
          historialPdvExpandido = historialPdvExpandido===idx ? null : idx;
          render();
        };
      });
    }
  }

  function renderHistorialPdvRegion(){
    const hist = state.equipos_pdv_region_historial || [];
    if(!hist.length){
      return `<div class="panel" style="margin-top:20px;"><h3>Historial de cambios</h3></div>`;
    }
    return `
      <div class="panel" style="margin-top:20px;">
        <h3>Historial de cambios</h3>
        <div style="overflow-x:auto;"><table>
          <thead><tr><th>Fecha</th><th>Usuario</th><th></th></tr></thead>

            <tr>
              <td>${fmtFecha(h.fecha)}</td>
              <td>${h.usuario}</td>
              <td><button data-hist-pdv-ver="${i}" style="padding:3px 8px;">${historialPdvExpandido===i ? 'Ocultar' : 'Ver'}</button></td>
            </tr>
            ${historialPdvExpandido===i ? `
            <tr><td colspan="3">
              <div style="font-size:12.5px; padding:8px 0;">
                ${h.snapshot.regiones.map(r=>`${r.nombre}: PDV laptop ${r.pdv_laptop} · Cambaceo ${r.cambaceo} · Desktop ${r.desktop}`).join('<br>')}
              </div>
            </td></tr>` : ''}
          `).join('')}
          </tbody>
        </table></div>
      </div>
    `;
  }

  // ---------- Budget IT 2026 ----------
  const MESES_CORTOS_BI = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const CAPEX_MESES_BI = ['Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  // Moneda por proveedor — fija, no editable (agosto 2026, a petición del cliente).
  const PROVEEDORES_MONEDA_USD = ['IQSEC (KACE)', 'COLOUR KLUB'];
  // Tipo de cambio fijo (agosto 2026, a petición del cliente): lo que se captura en la casilla de un
  // proveedor USD se entiende en dólares, y se convierte a pesos con este factor antes de guardarse —
  // en Firestore y en toda la tabla siempre se ve en pesos, nunca en dólares.
  const TIPO_CAMBIO_USD = 20;
  function esProveedorUSD(proveedor){ return PROVEEDORES_MONEDA_USD.includes(proveedor); }
  function monedaProveedor(proveedor){ return esProveedorUSD(proveedor) ? 'USD' : 'MX'; }
  // Proveedores que meten 2 facturas por mes — en edición se capturan por separado y se suman;
  // solo se guarda el total, nunca las 2 cantidades por separado (agosto 2026).
  const PROVEEDORES_DOBLE_FACTURA = ['COLOUR KLUB', 'GRUPO LEYMARK', 'METROCARRIER', 'MARAFIC', 'RED', 'REDSLOG'];
  // Semáforo de fondo (tenue) para medir cualquier monto real contra el presupuesto/mes de ese proveedor —
  // aplica a los 14 proveedores, tanto en los meses ya cerrados (Ene–Jun) como en cualquier mes de
  // Jul–Dic que ya tenga dato capturado. Mismos tonos que ya usa `.status-badge.estable/.critica`.
  function bgPresupuesto(valor, presupuesto){ return valor<=presupuesto ? '#E7F7EC' : '#FDECEC'; }
  function moneyIT(n){ return '$' + Math.round(n||0).toLocaleString('es-MX'); }
  // Para meses sin dato real (null) se muestra una proyección: promedio de los hasta 3 meses reales
  // más recientes anteriores a ese mes. No se guarda como dato real hasta que alguien lo edite.
  function budgetItValorMes(serie, i){
    if(serie[i]!==null && serie[i]!==undefined) return {valor:Number(serie[i]), esReal:true};
    let vals = [];
    for(let k=i-1; k>=0 && vals.length<3; k--){ if(serie[k]!==null && serie[k]!==undefined) vals.push(Number(serie[k])); }
    return {valor: vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0, esReal:false};
  }
  // Nota: los valores calculados (reales + proyectados) se guardan en un arreglo aparte (valoresPorVendor),
  // nunca sobre state.budget_it.opex directamente — así el objeto que se persiste en Firestore solo
  // contiene los datos reales que alguien capturó, sin caché de cálculos.
  function computeBudgetIT(){
    const data = state.budget_it;
    const valoresPorVendor = data.opex.map(v=> v.meses.map((_,i)=>budgetItValorMes(v.meses,i)));
    const monthlyActual = new Array(12).fill(0);
    valoresPorVendor.forEach(valores=> valores.forEach((o,i)=> monthlyActual[i]+=o.valor));
    const monthlyBudget = data.opex.reduce((s,v)=>s+Number(v.presupuesto_mes||0),0);
    const budgetSeries = new Array(12).fill(monthlyBudget);
    const janJunActual = monthlyActual.slice(0,6).reduce((a,b)=>a+b,0);
    const janJunBudget = monthlyBudget*6;
    const ahorroJanJun = janJunBudget - janJunActual;
    const opexAnnualProjected = monthlyActual.reduce((a,b)=>a+b,0);
    const opexAnnualBudget = monthlyBudget*12;
    const ahorroProyectado = opexAnnualBudget - opexAnnualProjected;
    // Solo los proyectos con la casilla "incluir" marcada entran al cálculo de CAPEX y a sus gráficas.
    const capexIncluidos = data.capex.filter(c=>c.incluir!==false);
    const capexBudget = capexIncluidos.reduce((s,c)=>s+Number(c.presupuesto||0),0);
    const capexEjecutado = capexIncluidos.reduce((s,c)=>s+Number(c.ejecutado||0),0);
    const capexPendiente = Math.max(capexBudget - capexEjecutado, 0);
    const totalPresupuestoAnual = opexAnnualBudget + capexBudget;
    const totalProyeccionAnual = opexAnnualProjected + capexEjecutado + capexPendiente;
    const ahorroTotalProyectado = totalPresupuestoAnual - totalProyeccionAnual;
    const catTotals = {};
    data.opex.forEach((v,vi)=>{
      const total6 = valoresPorVendor[vi].slice(0,6).reduce((a,o)=>a+o.valor,0);
      catTotals[v.categoria] = (catTotals[v.categoria]||0) + total6;
    });
    return {monthlyActual, monthlyBudget, budgetSeries, janJunActual, janJunBudget, ahorroJanJun,
      opexAnnualProjected, opexAnnualBudget, ahorroProyectado, capexBudget, capexEjecutado, capexPendiente,
      totalPresupuestoAnual, totalProyeccionAnual, ahorroTotalProyectado, catTotals, valoresPorVendor};
  }

  function renderBudgetIT(c){

    c.innerHTML = `

      <div class="cards cards-5">

        <div class="card"><div class="head" style="background:${cardGrad('#0C8599')}">Ejercido Ene–Jun</div>

        <div class="card"><div class="head" style="background:${cardGrad('#0C8599')}">CAPEX ejecutado</div>
          <div class="body"><div class="big" style="font-size:20px;">${moneyIT(d.capexEjecutado)}</div><div class="lbl">${fmtPct(d.capexEjecutado, d.capexBudget)} del presupuesto CAPEX</div></div></div>
        <div class="card"><div class="head" style="background:${cardGrad('#0C8599')}">CAPEX pendiente</div>
          <div class="body"><div class="big" style="font-size:20px;">${moneyIT(d.capexPendiente)}</div><div class="lbl"><span class="status-badge ${d.capexPendiente>0?'alerta':'estable'}">de ${moneyIT(d.capexBudget)}</span></div></div></div>

      <div class="panel">
        <h3>Presupuesto vs. ejercido — OPEX mensual (Ene–Jun congelado)</h3>
        <div class="foot" style="margin:2px 0 10px;">Nota: los proveedores que manejan moneda en USD consideran un tipo de cambio fijo de $${TIPO_CAMBIO_USD} pesos por dólar.</div>
        <div style="overflow-x:auto;"><table id="tbl-budget-it">
          <colgroup>
            <col style="width:200px;"><col style="width:130px;"><col style="width:70px;"><col style="width:92px;">
            ${MESES_CORTOS_BI.map(()=>'<col style="width:88px;">').join('')}
            <col style="width:100px;">
          </colgroup>
          <thead><tr><th class="bi-prov" style="text-align:left;">Proveedor</th><th class="bi-cat" style="text-align:left;">Categoría</th><th class="bi-moneda">Moneda</th><th class="bi-presup">Presup./mes</th>${MESES_CORTOS_BI.map(m=>`<th>${m}</th>`).join('')}<th>Anual</th></tr></thead>
          <tbody>
            ${data.opex.map((v,vi)=>{
              const valores = d.valoresPorVendor[vi];
              const anual = valores.reduce((s,o)=>s+o.valor,0);
              const dobleFactura = PROVEEDORES_DOBLE_FACTURA.includes(v.proveedor);
              const esUSD = esProveedorUSD(v.proveedor);
              const unidadFactura = esUSD ? ' (USD)' : '';
              let cells = `<td class="bi-prov">${v.proveedor}</td><td class="bi-cat">${v.categoria}</td><td class="bi-moneda">${monedaProveedor(v.proveedor)}</td><td class="bi-presup">${moneyIT(v.presupuesto_mes)}</td>`;
              valores.forEach((o,i)=>{
                const bloqueado = i<6 || o.esReal;
                const puedeReabrir = bloqueado && editing && puedeEditar && puedeEditarBloqueadosBI();
                if(bloqueado && !puedeReabrir){
                  cells += `<td class="bi-locked" style="background:${bgPresupuesto(o.valor, v.presupuesto_mes)};">${moneyIT(o.valor)}</td>`;
                } else if(puedeReabrir){
                  // El dato guardado siempre está en pesos — para un proveedor USD se vuelve a mostrar
                  // en dólares (÷ tipo de cambio) para que mgiron edite en la misma unidad de la factura.
                  const valorPesos = v.meses[i]!==null && v.meses[i]!==undefined ? v.meses[i] : o.valor;
                  const valorMostrado = esUSD ? Math.round((valorPesos/TIPO_CAMBIO_USD)*100)/100 : Math.round(valorPesos);
                  cells += `<td><input type="number" step="1" data-bi-v="${vi}" data-bi-m="${i}" value="${valorMostrado}" style="width:72px; background:${bgPresupuesto(o.valor, v.presupuesto_mes)};" title="Mes ya cerrado — mgiron puede editarlo${esUSD?' (en dólares)':''}"></td>`;
                } else if(editing && puedeEditar && dobleFactura){
                  cells += `<td><div style="display:flex; flex-direction:column; gap:2px;">
                    <input type="number" step="1" data-bi-v="${vi}" data-bi-m="${i}" data-bi-factura="1" placeholder="Factura 1${unidadFactura}" style="width:72px; font-size:11px;">
                    <input type="number" step="1" data-bi-v="${vi}" data-bi-m="${i}" data-bi-factura="2" placeholder="Factura 2${unidadFactura}" style="width:72px; font-size:11px;">
                  </div></td>`;
                } else if(editing && puedeEditar){
                  cells += `<td><input type="number" step="1" data-bi-v="${vi}" data-bi-m="${i}" placeholder="${esUSD?'USD':''}" style="width:72px;"></td>`;
                } else {
                  cells += `<td><span style="color:var(--sub);">—</span></td>`;
                }
              });
              cells += `<td><b>${moneyIT(anual)}</b></td>`;
              return `<tr>${cells}</tr>`;
            }).join('')}
          </tbody>
          <tfoot>
            <tr class="bi-totales">
              <td class="bi-prov">Total OPEX</td><td class="bi-cat"></td><td class="bi-moneda"></td><td class="bi-presup">${moneyIT(d.monthlyBudget)}</td>
              ${d.monthlyActual.map(v=>`<td>${moneyIT(v)}</td>`).join('')}
              <td>${moneyIT(d.opexAnnualProjected)}</td>
            </tr>
            <tr class="bi-presupuesto">
              <td class="bi-prov">Presupuesto/mes</td><td class="bi-cat"></td><td class="bi-moneda"></td><td class="bi-presup"></td>
              ${d.budgetSeries.map(v=>`<td>${moneyIT(v)}</td>`).join('')}
              <td>${moneyIT(d.opexAnnualBudget)}</td>
            </tr>
            <tr class="bi-ahorro">
              <td class="bi-prov">Ahorro del mes</td><td class="bi-cat"></td><td class="bi-moneda"></td><td class="bi-presup"></td>
              ${d.monthlyActual.map((v,i)=>{ const s=d.budgetSeries[i]-v; return `<td class="${s>=0?'pos':'neg'}">${moneyIT(s)}</td>`; }).join('')}
              <td class="${d.ahorroProyectado>=0?'pos':'neg'}">${moneyIT(d.ahorroProyectado)}</td>
            </tr>
          </tfoot>
        </table></div>
        <div class="bi-legend">
          <span><span class="bi-swatch locked"></span> Con dato capturado (no editable — Ene–Jun cerrado, o Jul–Dic ya guardado)</span>
          <span><span class="bi-swatch" style="background:#E7F7EC;"></span> Dentro de presupuesto</span>
          <span><span class="bi-swatch" style="background:#FDECEC;"></span> Sobre presupuesto</span>
          <span>— Sin captura todavía (editable)</span>
        </div>
      </div>

      <div class="panel">
        <h3>CAPEX 2026 — ejecución de proyectos</h3>
        <div style="display:grid; grid-template-columns:1.3fr 1fr; gap:16px;">
          <div style="overflow-x:auto;"><table>
            <thead><tr><th></th><th style="text-align:left;">Proyecto</th><th>Presupuesto</th><th>Ejecutado</th><th>Pendiente</th><th>Mes estimado</th></tr></thead>
            <tbody>${data.capex.map((cx,ci)=>{
              const incluido = cx.incluir!==false;
              const pendiente = Math.max(cx.presupuesto-cx.ejecutado,0);
              let status;
              if(!incluido) status = `<span class="status-badge" style="background:#F1F1F3; color:var(--sub);">No incluido</span>`;
              else if(pendiente<=0) status = `<span class="status-badge estable">Pagado</span>`;
              else status = `<span class="status-badge alerta">Pendiente</span>`;
              const checkbox = `<input type="checkbox" data-bi-capex-incluir="${ci}" ${incluido?'checked':''} ${(editing && puedeEditar)?'':'disabled'}>`;
              const sel = (incluido && pendiente>0 && editing && puedeEditar)
                ? `<select data-bi-capex="${ci}">${CAPEX_MESES_BI.map(m=>`<option value="${m}" ${m===cx.mes_plan?'selected':''}>${m}</option>`).join('')}</select>`
                : (incluido && pendiente>0 ? (cx.mes_plan||'—') : (cx.mes_ejecucion||'—'));
              return `<tr style="${incluido?'':'opacity:.5;'}"><td>${checkbox}</td><td style="text-align:left;">${cx.proveedor} ${status}</td><td>${moneyIT(cx.presupuesto)}</td><td>${moneyIT(cx.ejecutado)}</td><td>${moneyIT(pendiente)}</td><td style="text-align:left;">${sel}</td></tr>`;
            }).join('')}</tbody>
          </table></div>
          <div><canvas id="chartBudgetItCapex"></canvas></div>
        </div>
      </div>

      <div class="panel">
        <h3>Análisis de proyección anual</h3>
        <p style="font-size:13px; line-height:1.55; margin:0 0 14px;">Con el ritmo real de Enero–Junio (cerrado) y una proyección Julio–Diciembre basada en el promedio de los últimos meses reales por proveedor, el gasto OPEX 2026 terminaría en <b>${moneyIT(d.opexAnnualProjected)}</b> contra un presupuesto de <b>${moneyIT(d.opexAnnualBudget)}</b> — ${d.ahorroProyectado>=0?'un ahorro proyectado':'un sobre-ejercicio proyectado'} de <b>${moneyIT(Math.abs(d.ahorroProyectado))}</b> (${fmtPct(Math.abs(d.ahorroProyectado), d.opexAnnualBudget)}). Sumando los ${moneyIT(d.capexPendiente)} de CAPEX que aún no se ejecutan, el ${d.ahorroTotalProyectado>=0?'ahorro':'sobre-ejercicio'} total proyectado del presupuesto combinado de IT es de <b>${moneyIT(Math.abs(d.ahorroTotalProyectado))}</b> (${fmtPct(Math.abs(d.ahorroTotalProyectado), d.totalPresupuestoAnual)}). Se recalcula cada vez que se guarda un cambio en Julio–Diciembre.</p>
        <div class="cards" style="margin-bottom:0;">
          <div class="card"><div class="head" style="background:#4B5A6B">Presupuesto total 2026</div><div class="body"><div class="big" style="font-size:17px;">${moneyIT(d.totalPresupuestoAnual)}</div><div class="lbl">OPEX + CAPEX</div></div></div>
          <div class="card"><div class="head" style="background:#4B5A6B">Proyección total 2026</div><div class="body"><div class="big" style="font-size:17px;">${moneyIT(d.totalProyeccionAnual)}</div></div></div>
          <div class="card"><div class="head" style="background:#4B5A6B">Ahorro / sobre-ejercicio</div><div class="body"><div class="big" style="font-size:17px;">${moneyIT(d.ahorroTotalProyectado)}</div></div></div>
          <div class="card"><div class="head" style="background:#4B5A6B">% del presupuesto total</div><div class="body"><div class="big" style="font-size:17px;">${fmtPct(Math.abs(d.ahorroTotalProyectado), d.totalPresupuestoAnual)}</div></div></div>
        </div>

      <div class="panel">

          <div><canvas id="chartBudgetItCat"></canvas></div>
          <div>
            <div class="bi-bullet-wrap">
              <div class="bi-bullet-track">
                <div class="bi-bullet-seg bi-bullet-real" style="width:${pctReal}%;"></div>
                <div class="bi-bullet-seg bi-bullet-proj" style="left:${pctReal}%; width:${pctProj}%;"></div>
              </div>
              <div class="bi-bullet-labels"><span>$0</span><span>${moneyIT(d.opexAnnualBudget)} (100% del presupuesto)</span></div>
              <div class="bi-bullet-legend">
                <span><span class="bi-sw real"></span> Ejercido Ene–Jun</span>
                <span><span class="bi-sw proj"></span> Proyectado Jul–Dic</span>
                <span><span class="bi-sw gap"></span> ${d.ahorroProyectado>=0?'Ahorro':'Sobre-ejercicio'} proyectado</span>
              </div>
              <div class="bi-bullet-callout ${d.ahorroProyectado>=0?'':'warn'}">${d.ahorroProyectado>=0?'✓ Ahorro proyectado':'⚠ Sobre-ejercicio proyectado'}: ${moneyIT(Math.abs(d.ahorroProyectado))} (${fmtPct(Math.abs(d.ahorroProyectado), d.opexAnnualBudget)} del presupuesto anual)</div>

      ${puedeVerBudgetIT() ? renderHistorialBudgetIT() : ''}

    if(editing && puedeEditar){
      document.getElementById('btnCancelBI').onclick = ()=>{ editing=false; render(); };
      document.getElementById('btnSaveBI').onclick = ()=>{
        // Los inputs solo existen para meses sin dato todavía (ver render de arriba) — si se deja en
        // blanco, no se toca nada (sigue "sin capturar", se ve como -). Nunca se sobreescribe un mes
        // que ya tenía un dato real guardado, porque para ese caso no se dibuja ningún input.
        document.querySelectorAll('[data-bi-v]:not([data-bi-factura])').forEach(inp=>{
          const vi = Number(inp.dataset.biV), mi = Number(inp.dataset.biM);
          const raw = inp.value.trim();
          // Para un proveedor USD, lo capturado es dólares — se convierte a pesos con TIPO_CAMBIO_USD
          // antes de guardarse. En Firestore y en toda la tabla el dato siempre queda en pesos.
          const factor = esProveedorUSD(data.opex[vi].proveedor) ? TIPO_CAMBIO_USD : 1;
          if(raw!=='') data.opex[vi].meses[mi] = Number(raw) * factor;
        });
        // Proveedores de doble factura (Colour Klub y los demás en PROVEEDORES_DOBLE_FACTURA): se suman
        // las 2 casillas y se guarda un solo total — nunca se persisten las 2 cantidades por separado.
        // Si el proveedor es USD (Colour Klub), cada factura también se convierte a pesos antes de sumar.
        document.querySelectorAll('[data-bi-v][data-bi-factura="1"]').forEach(inp1=>{
          const vi = Number(inp1.dataset.biV), mi = Number(inp1.dataset.biM);
          const inp2 = document.querySelector(`[data-bi-v="${vi}"][data-bi-m="${mi}"][data-bi-factura="2"]`);
          const raw1 = inp1.value.trim();
          const raw2 = inp2 ? inp2.value.trim() : '';
          const factor = esProveedorUSD(data.opex[vi].proveedor) ? TIPO_CAMBIO_USD : 1;
          if(raw1!=='' || raw2!==''){
            data.opex[vi].meses[mi] = (Number(raw1||0) + Number(raw2||0)) * factor;
          }
        });
        document.querySelectorAll('[data-bi-capex-incluir]').forEach(chk=>{
          data.capex[Number(chk.dataset.biCapexIncluir)].incluir = chk.checked;
        });

          data.capex[Number(sel.dataset.biCapex)].mes_plan = sel.value;
        });
        const dSave = computeBudgetIT();
        if(!state.budget_it.historial) state.budget_it.historial = [];
        state.budget_it.historial.unshift({
          fecha: new Date().toISOString(),
          usuario: (typeof currentUser!=='undefined' && currentUser) ? currentUser.username : 'desconocido',
          resumen: { ejercido_anual_proyectado: dSave.opexAnnualProjected, ahorro_proyectado: dSave.ahorroProyectado, capex_pendiente: dSave.capexPendiente }

        if(state.budget_it.historial.length > 30) state.budget_it.historial.length = 30;

  let logAccesos = { cargado:false, cargando:false, error:null, registros:[] };
  async function cargarLogAccesos(){
    logAccesos.cargando = true;
    render();
    try{
      const snap = await db.collection('accesos_dashboard').orderBy('fecha','desc').limit(300).get();

  function panelConfirmacionExpansion(){

    const actualizan = d.tiendas.length - nuevas;

  // ---------- Cierre de tiendas (agosto 2026) ----------
  // A propósito NO es una pestaña aparte: es una sección más, más abajo, dentro de la misma pestaña
  // "Plan de expansión" (pedido explícito del cliente). Antes las tiendas cerradas vivían mezcladas
  // en la tabla de arriba con estatus:'Cerrada' y todo el detalle (fechas de entrega/recolección/
  // vigencia) embarrado en el campo "nota". Aquí quedan en su propia tabla, con un campo nuevo
  // "Observaciones" separado del detalle. Solo admin puede editar/mover (ver canEdit). Tiene su
  // propio interruptor de edición (editingCierre) para no forzar a editar las dos tablas juntas.
  // Candidatas a migrar: cualquier fila de Plan de expansión ya marcada 'Cerrada' que siga ahí.
  function candidatosMigracionCierre(){
    return (state.expansion.tiendas || []).filter(t=>t.estatus==='Cerrada');
  }
  let modalMigrarCierre = false;
  function migrarCerradasDesdeExpansion(){
    const candidatas = candidatosMigracionCierre();
    if(candidatas.length===0) return;
    // Se clona la fila completa tal cual está en Expansión (mismos campos: numero, clave, nombre,
    // región, mes, pc, lap, internet, entregado_arq, entrega_impresora, estatus, nota, etc.) y solo
    // se le agrega "observaciones" nuevo — así no se pierde ni se reinterpreta nada de lo que ya
    // tenían capturado, incluidas ediciones manuales posteriores (ej. "YA SE RECOLECTO" en la nota).
    candidatas.forEach(t=>{
      state.cierre_tiendas.tiendas.push({ ...clone(t), observaciones: t.observaciones || '' });
    });
    state.expansion.tiendas = state.expansion.tiendas.filter(t=>t.estatus!=='Cerrada');
    modalMigrarCierre = false;
    descripcionActualizacion = `Mover tiendas cerradas — Plan de Expansión → Cierre de tiendas (${candidatas.length} tienda${candidatas.length===1?'':'s'})`;
    save();
  }
  function panelMigracionCierre(){
    const candidatas = candidatosMigracionCierre();
    return `<div class="panel" style="border-color:var(--tm);">
      <h3 style="color:var(--tm);">Mover tiendas cerradas desde Plan de expansión</h3>
      <div style="font-size:13px; line-height:1.7;">
        Se moverán <b>${candidatas.length}</b> tienda(s) marcada(s) como "Cerrada" en Plan de expansión a este apartado. Se quitan de Expansión y se agregan aquí con los mismos campos que ya tenían (Observaciones queda vacío para captura nueva).
        <ul style="margin:8px 0 0 18px; padding:0;">
          ${candidatas.map(t=>`<li>${t.nombre}${t.clave?` (${t.clave})`:''}</li>`).join('')}
        </ul>
      </div>
      <div class="editbar" style="margin-top:10px;">
        <button id="btnCancelMigrarCierre">Cancelar</button>
        <button class="primary" id="btnConfirmarMigrarCierre">Mover ${candidatas.length} tienda(s)</button>
      </div>
    </div>`;
  }
  // Devuelve el HTML de la sub-sección "Cierre de tiendas" para insertarla DENTRO de la misma
  // pantalla de "Plan de expansión" (más abajo de la tabla de aperturas) — a petición del cliente
  // esto NO es una pestaña aparte, es una sección más dentro de la misma pestaña de Expansión.
  // Los campos editables son EXACTAMENTE los mismos que la tabla de arriba (#, Clave PDV, Tienda,
  // Región, Mes, PC, Lap, Internet, ARQ, Impresora, Estatus, Nota) + una columna nueva: Observaciones.
  function seccionCierreTiendas(){
    const cz = state.cierre_tiendas;
    const tiendas = cz.tiendas || [];
    const candidatas = candidatosMigracionCierre();
    const cerradas = tiendas.filter(t=>t.estatus==='Cerrada').length;

    return `
      <div class="title" style="font-size:18px; margin-top:18px;">Cierre de tiendas</div>

      ${canEdit && candidatas.length>0 ? `
      <div class="uploadbar">
        <div class="txt">
          <b>${candidatas.length} tienda(s) marcada(s) "Cerrada" siguen arriba, en la tabla de Expansión.</b> Muévelas aquí abajo para llevar el seguimiento de cierre en un solo lugar.
        </div>
        <button class="upload" id="btnAbrirMigrarCierre">Mover tiendas cerradas de arriba</button>
      </div>` : ''}
      ${modalMigrarCierre ? panelMigracionCierre() : ''}

      <div class="cards">
        <div class="card"><div class="head" style="background:${cardGrad(COLOR_CIERRE)}">Total en este apartado</div>
          <div class="body"><div class="big">${tiendas.length}</div><div class="lbl">tiendas bajo seguimiento</div></div></div>
        <div class="card"><div class="head" style="background:${cardGrad('#DC2626')}">Cerradas</div>
          <div class="body"><div class="big">${cerradas}</div><div class="lbl">marcadas manualmente</div></div></div>
      </div>

      <div class="panel">
        <div class="editbar">${editingCierre
          ? `<button id="btnCancelCierre">Cancelar</button><button id="btnAddCierre">Agregar tienda</button><button class="primary" id="btnSaveCierre">Guardar cambios</button>`
          : (canEdit ? `<button id="btnEditCierre">Editar todo</button>` : '')}</div>
        <h3>Tiendas — mes, hardware, internet, estatus y observaciones</h3>
        ${tiendas.length===0 ? `<div class="placeholder"><h3>Todavía no hay tiendas aquí</h3><p>${canEdit ? 'Da clic en "Editar todo" para agregar una tienda manualmente, o usa "Mover tiendas cerradas de arriba" si ya hay alguna marcada como Cerrada en la tabla de Expansión.' : 'Todavía no hay tiendas capturadas en este apartado.'}</p></div>` : `
        <div style="overflow-x:auto;"><table>
          <thead><tr>
            <th>#</th><th>Clave PDV</th><th>Tienda</th><th>Región</th><th>Mes</th>
            <th>PC</th><th>Lap</th><th>Internet</th><th>ARQ</th><th>Impresora</th><th>Estatus</th><th style="text-align:left;">Nota</th><th style="text-align:left;">Observaciones</th>${editingCierre?'<th></th>':''}
          </tr></thead>
          <tbody>${tiendas.map((t,i)=> editingCierre ? `
            <tr data-cz-row="${i}">
              <td><input type="text" style="width:44px;" data-cz-field="numero" data-cz-row="${i}" value="${t.numero!==null && t.numero!==undefined ? t.numero : ''}"></td>
              <td><input type="text" style="width:110px;" data-cz-field="clave" data-cz-row="${i}" value="${t.clave||''}"></td>
              <td><input type="text" style="width:220px; text-align:left;" data-cz-field="nombre" data-cz-row="${i}" value="${(t.nombre||'').replace(/"/g,'&quot;')}"></td>
              <td><input type="text" style="width:90px;" data-cz-field="region" data-cz-row="${i}" value="${t.region||''}"></td>
              <td><input type="text" style="width:80px;" data-cz-field="mes" data-cz-row="${i}" value="${t.mes||''}"></td>
              <td><input type="text" style="width:36px;" data-cz-field="pc" data-cz-row="${i}" value="${t.pc||''}"></td>
              <td><input type="text" style="width:36px;" data-cz-field="lap" data-cz-row="${i}" value="${t.lap||''}"></td>
              <td><input type="text" style="width:70px;" data-cz-field="internet" data-cz-row="${i}" value="${t.internet||''}"></td>
              <td><input type="text" style="width:80px;" data-cz-field="entregado_arq" data-cz-row="${i}" value="${t.entregado_arq||''}"></td>
              <td><input type="text" style="width:80px;" data-cz-field="entrega_impresora" data-cz-row="${i}" value="${t.entrega_impresora||''}"></td>
              <td><select data-cz-field="estatus" data-cz-row="${i}">
                ${['Abierta','En proceso','Prospecto','Cerrada'].map(op=>`<option value="${op}" ${t.estatus===op?'selected':''}>${op}</option>`).join('')}
              </select></td>
              <td><input type="text" style="width:220px; text-align:left;" data-cz-field="nota" data-cz-row="${i}" value="${(t.nota||'').replace(/"/g,'&quot;')}"></td>
              <td><input type="text" style="width:220px; text-align:left;" data-cz-field="observaciones" data-cz-row="${i}" value="${(t.observaciones||'').replace(/"/g,'&quot;')}"></td>
              <td><button data-cz-remove="${i}" style="padding:3px 8px;">✕</button></td>
            </tr>` : `
            <tr data-cz-row="${i}">
              <td>${t.numero!==null && t.numero!==undefined ? t.numero : '—'}</td>
              <td>${t.clave||'—'}</td>
              <td style="text-align:left;">${t.nombre}</td>
              <td>${t.region}</td>
              <td>${t.mes||'—'}</td>
              <td>${t.pc}</td>
              <td>${t.lap}</td>
              <td>${t.internet}</td>
              <td>${t.entregado_arq}</td>
              <td>${t.entrega_impresora}</td>
              <td><span class="status-badge ${estatusExpClass(t.estatus)}">${t.estatus}</span></td>
              <td style="text-align:left;">${t.nota||'<span style="color:var(--sub)">—</span>'}</td>
              <td style="text-align:left;">${t.observaciones||'<span style="color:var(--sub)">—</span>'}</td>
            </tr>`).join('')}
          </tbody>
        </table></div>`}
      </div>
      <div class="panel">
        <h3>Notas generales de cierre de tiendas</h3>
        ${editingCierre
          ? `<textarea id="notasGeneralesCierre" rows="6" style="width:100%; font-family:inherit; font-size:13px; padding:10px; border:1px solid var(--line); border-radius:8px;" placeholder="Ejemplo: pendiente confirmar recolección de equipo en Obregón Sonora Puerta">${cz.notas_generales||''}</textarea>`
          : `<div style="font-size:13px; white-space:pre-wrap; color:${cz.notas_generales ? 'var(--ink)' : 'var(--sub)'};">${cz.notas_generales || 'Sin notas capturadas todavía.'}</div>`}
      </div>
    `;
  }
  function wireCierreTiendas(){
    const cz = state.cierre_tiendas;
    const tiendas = cz.tiendas || [];
    if(canEdit){
      const btnMig = document.getElementById('btnAbrirMigrarCierre');
      if(btnMig) btnMig.onclick = ()=>{ modalMigrarCierre = true; render(); };
      const btnCancelMig = document.getElementById('btnCancelMigrarCierre');
      if(btnCancelMig) btnCancelMig.onclick = ()=>{ modalMigrarCierre = false; render(); };
      const btnConfirmMig = document.getElementById('btnConfirmarMigrarCierre');
      if(btnConfirmMig) btnConfirmMig.onclick = migrarCerradasDesdeExpansion;
    }

    if(editingCierre){
      document.getElementById('btnCancelCierre').onclick=()=>{editingCierre=false;render();};
      document.getElementById('btnAddCierre').onclick=()=>{
        tiendas.push({numero:null, clave:'', nombre:'Nueva tienda', region:'-', mes:'', pc:'-', lap:'-', internet:'-', entregado_arq:'-', entrega_impresora:'-', estatus:'Prospecto', nota:'', observaciones:''});
        render();
      };
      document.getElementById('btnSaveCierre').onclick=()=>{
        document.querySelectorAll('[data-cz-field]').forEach(inp=>{
          const i = Number(inp.dataset.czRow);
          const field = inp.dataset.czField;
          let val = inp.value;
          if(field==='numero') val = val==='' ? null : Number(val);
          tiendas[i][field] = val;
        });
        const ng = document.getElementById('notasGeneralesCierre');
        if(ng) cz.notas_generales = ng.value;
        descripcionActualizacion = 'Edición manual — Cierre de tiendas';
        save();
        editingCierre = false;
      };
      document.querySelectorAll('[data-cz-remove]').forEach(btn=>{
        btn.onclick = ()=>{ tiendas.splice(Number(btn.dataset.czRemove),1); render(); };
      });
    } else {
      const btnEditCz = document.getElementById('btnEditCierre');
      if(btnEditCz) btnEditCz.onclick=()=>{editingCierre=true;render();};
    }
  }

  window.initCaidasApp = function(role){
    canEdit = (role === 'admin');
    load();
    cargarCatalogoVivo();
    iniciarAutoRefreshEstatusServicio();
  };
})();
</script>
</body>
</html>
