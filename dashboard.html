        <div class="bi-insight mejora"><div class="body"><b>🛠️ La columna "Anual" del archivo original no sumaba bien</b><span>La fórmula era <code>SUM(H:L)</code> en casi todas las filas — solo Enero a Mayo, sin Junio ni Julio. Aquí la columna Anual suma las 12 celdas reales/proyectadas.</span></div></div>
        <div class="bi-insight mejora"><div class="body"><b>🛠️ El ahorro promedio del Excel dividía entre 5 en vez de 6</b><span>Eso inflaba el ahorro proyectado a ~10.5% cuando el real (con los 6 meses cerrados) es ${fmtPct(Math.abs(d.ahorroProyectado), d.opexAnnualBudget)}.</span></div></div>
        <div class="bi-insight riesgo"><div class="body"><b>⚠️ MARAFIC concentra ~24% del gasto mensual de OPEX</b><span>Es el proveedor individual más grande. Cualquier renegociación o incidente impacta el presupuesto de forma desproporcionada.</span></div></div>
        <div class="bi-insight riesgo"><div class="body"><b>⚠️ ${fmtPct(d.capexPendiente, d.capexBudget)} del presupuesto CAPEX sigue sin ejecutarse</b><span>Principalmente el proyecto de Antispam ($2,500,000). Si se ejecuta de golpe en Q4 puede haber presión de flujo de caja.</span></div></div>
        <div class="bi-insight oportunidad"><div class="body"><b>💡 Total Play Office 365 y AWS corren consistentemente debajo de su presupuesto</b><span>Son candidatos claros para bajar el presupuesto 2026 y liberar esa diferencia hacia otra partida.</span></div></div>
      </div>

      <div class="panel">
        <h3>Gráficas</h3>
        <div style="display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:16px;">
          <div><div class="foot" style="margin-bottom:6px;">Ejercido mensual vs. presupuesto</div><canvas id="chartBudgetItTrend"></canvas></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div><div class="foot" style="margin-bottom:6px;">Gasto Ene–Jun por categoría</div><canvas id="chartBudgetItCat"></canvas></div>
          <div>
            <div class="foot" style="margin-bottom:6px;">Presupuesto anual OPEX vs. proyección</div>
            <div class="bi-bullet-wrap">
              <div class="bi-bullet-track">
                <div class="bi-bullet-seg bi-bullet-real" style="width:${pctReal}%;"></div>
                <div class="bi-bullet-seg bi-bullet-proj" style="left:${pctReal}%; width:${pctProj}%;"></div>
              </div>
              <div class="bi-bullet-labels"><span>$0</span><span>${moneyIT(d.opexAnnualBudget)} (100% del presupuesto)</span></div>
              <div class="bi-bullet-legend">
                <span><span class="bi-sw real"></span> Ejercido Ene–Jun</span>
                <span><span class="bi-sw proj"></span> Proyectado Jul–Dic</span>
                <span><span class="bi-sw gap"></span> ${d.ahorroProyectado>=0?'Ahorro':'Sobre-ejercicio'} proyectado</span>
              </div>
              <div class="bi-bullet-callout ${d.ahorroProyectado>=0?'':'warn'}">${d.ahorroProyectado>=0?'✓ Ahorro proyectado':'⚠ Sobre-ejercicio proyectado'}: ${moneyIT(Math.abs(d.ahorroProyectado))} (${fmtPct(Math.abs(d.ahorroProyectado), d.opexAnnualBudget)} del presupuesto anual)</div>
            </div>
          </div>
        </div>
        <div style="margin-top:16px;">
          <div class="foot" style="margin-bottom:6px;">Gasto Ene–Jun por proveedor (de mayor a menor)</div>
          <canvas id="chartBudgetItProv"></canvas>
        </div>
      </div>

      ${canEdit ? renderHistorialBudgetIT() : ''}
    `;

    if(editing && puedeEditar){
      document.getElementById('btnCancelBI').onclick = ()=>{ editing=false; render(); };
      document.getElementById('btnSaveBI').onclick = ()=>{
        document.querySelectorAll('[data-bi-v]').forEach(inp=>{
          const vi = Number(inp.dataset.biV), mi = Number(inp.dataset.biM);
          const raw = inp.value.trim();
          data.opex[vi].meses[mi] = raw==='' ? null : Number(raw);
        });
        document.querySelectorAll('[data-bi-capex-incluir]').forEach(chk=>{
          data.capex[Number(chk.dataset.biCapexIncluir)].incluir = chk.checked;
        });
        document.querySelectorAll('[data-bi-capex]').forEach(sel=>{
          data.capex[Number(sel.dataset.biCapex)].mes_plan = sel.value;
        });
        const dSave = computeBudgetIT();
        if(!state.budget_it.historial) state.budget_it.historial = [];
        state.budget_it.historial.unshift({
          fecha: new Date().toISOString(),
          usuario: (typeof currentUser!=='undefined' && currentUser) ? currentUser.username : 'desconocido',
          resumen: { ejercido_anual_proyectado: dSave.opexAnnualProjected, ahorro_proyectado: dSave.ahorroProyectado, capex_pendiente: dSave.capexPendiente }
        });
        if(state.budget_it.historial.length > 30) state.budget_it.historial.length = 30;
        editing = false;
        save();
      };
    } else if(puedeEditar){
      document.getElementById('btnEditBI').onclick = ()=>{ editing=true; render(); };
    }
    document.querySelectorAll('[data-hist-bi-ver]').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = Number(btn.dataset.histBiVer);
        historialBudgetItExpandido = historialBudgetItExpandido===idx ? null : idx;
        render();
      };
    });

    const catEntries = Object.entries(d.catTotals).sort((a,b)=>b[1]-a[1]);
    const provEntries = data.opex.map((v,vi)=>[v.proveedor, d.valoresPorVendor[vi].slice(0,6).reduce((s,o)=>s+o.valor,0)]).sort((a,b)=>b[1]-a[1]);
    if(charts.budgetItTrend) charts.budgetItTrend.destroy();
    charts.budgetItTrend = new Chart(document.getElementById('chartBudgetItTrend'), {
      data:{ labels: MESES_CORTOS_BI,
        datasets:[
          {type:'bar', label:'Ejercido', data:d.monthlyActual, backgroundColor: d.monthlyActual.map((v,i)=> i<6 ? '#0C8599' : 'rgba(12,133,153,.55)'), borderRadius:4, maxBarThickness:30},
          {type:'line', label:'Presupuesto', data:d.budgetSeries, borderColor:'#4B5A6B', borderDash:[5,4], borderWidth:2, pointRadius:0}
        ]},
      options:{plugins:{legend:{position:'bottom'}}, scales:{y:{ticks:{callback:(v)=>'$'+(v/1e6).toFixed(1)+'M'}}}}
    });
    if(charts.budgetItCat) charts.budgetItCat.destroy();
    charts.budgetItCat = new Chart(document.getElementById('chartBudgetItCat'), {
      type:'bar',
      data:{labels:catEntries.map(e=>e[0]), datasets:[{data:catEntries.map(e=>e[1]), backgroundColor:'#0C8599', borderRadius:4, maxBarThickness:16}]},
      options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{ticks:{callback:(v)=>'$'+(v/1e6).toFixed(1)+'M'}}}}
    });
    if(charts.budgetItProv) charts.budgetItProv.destroy();
    charts.budgetItProv = new Chart(document.getElementById('chartBudgetItProv'), {
      type:'bar',
      data:{labels:provEntries.map(e=>e[0]), datasets:[{data:provEntries.map(e=>e[1]), backgroundColor:'#0C8599', borderRadius:4, maxBarThickness:16}]},
      options:{indexAxis:'y', plugins:{legend:{display:false}, tooltip:{callbacks:{label:(ctx)=>moneyIT(ctx.parsed.x)}}}, scales:{x:{ticks:{callback:(v)=>'$'+(v/1e6).toFixed(1)+'M'}}}}
    });
    if(charts.budgetItCapex) charts.budgetItCapex.destroy();
    charts.budgetItCapex = new Chart(document.getElementById('chartBudgetItCapex'), {
      type:'bar',
      data:{labels:['CAPEX 2026'], datasets:[
        {label:'Ejecutado', data:[d.capexEjecutado], backgroundColor:'#00B050', borderRadius:4},
        {label:'Pendiente', data:[d.capexPendiente], backgroundColor:'#C00000', borderRadius:4}
      ]},
      options:{indexAxis:'y', plugins:{legend:{position:'bottom'}}, scales:{x:{stacked:true, ticks:{callback:(v)=>'$'+(v/1e6).toFixed(1)+'M'}}, y:{stacked:true}}}
    });
  }

  function renderHistorialBudgetIT(){
    const hist = (state.budget_it && state.budget_it.historial) || [];
    if(!hist.length){
      return `<div class="panel"><h3>Historial de cambios</h3><div class="foot">Todavía no hay cambios guardados en esta pestaña.</div></div>`;
    }
    return `
      <div class="panel">
        <h3>Historial de cambios</h3>
        <div class="foot" style="margin-bottom:10px;">Solo visible para admin. Se guardan los últimos 30 cambios, más reciente arriba.</div>
        <div style="overflow-x:auto;"><table>
          <thead><tr><th style="text-align:left;">Fecha</th><th style="text-align:left;">Usuario</th><th></th></tr></thead>
          <tbody>${hist.map((h,i)=>`
            <tr>
              <td style="text-align:left;">${fmtFecha(h.fecha)}</td>
              <td style="text-align:left;">${h.usuario}</td>
              <td><button data-hist-bi-ver="${i}" style="padding:3px 8px;">${historialBudgetItExpandido===i ? 'Ocultar' : 'Ver'}</button></td>
            </tr>
            ${historialBudgetItExpandido===i ? `
            <tr><td colspan="3">
              <div style="font-size:12.5px; padding:8px 0; text-align:left;">
                Proyección anual OPEX al guardar: ${moneyIT(h.resumen.ejercido_anual_proyectado)} · Ahorro proyectado: ${moneyIT(h.resumen.ahorro_proyectado)} · CAPEX pendiente: ${moneyIT(h.resumen.capex_pendiente)}
              </div>
            </td></tr>` : ''}
          `).join('')}
          </tbody>
        </table></div>
      </div>
    `;
  }

  function renderExpansion(c){
    const exp = state.expansion;
    const tiendas = exp.tiendas || [];
    if(tiendas.length===0){
      c.innerHTML = `
        <div class="title">Plan de expansión · PrimeMX ${state.anio}</div>
        <div class="subtitle">Aperturas de tienda, hardware e internet asignado</div>
        ${canEdit ? `
        <div class="uploadbar">
          <div class="txt">
            <b>Cargar archivo de expansión (.xlsx)</b> — agrega o actualiza tiendas (por Clave PDV); no borra lo que ya tenías cargado.
            <div id="uploadErrorExp"></div>
          </div>
          <input type="file" id="fileExpansion" accept=".xlsx,.xls" style="display:none">
          <button class="upload" id="btnUploadExp">Cargar archivo</button>
        </div>` : ''}
        ${cargaPendienteExpansion ? panelConfirmacionExpansion() : `
        <div class="placeholder">
          <h3>Todavía no hay tiendas cargadas</h3>
          <p>Sube el Excel de expansión (el mismo formato de "NVO_EXPANSION") para llenar esta pestaña: acumulado de aperturas, tiendas en proceso, y la tabla completa con notas manuales por tienda.</p>
        </div>`}
      `;
      wireExpansionUpload();
      return;
    }

    const abiertas = tiendas.filter(t=>t.estatus==='Abierta');
    const enProceso = tiendas.filter(t=>t.estatus==='En proceso');
    const prospecto = tiendas.filter(t=>t.estatus==='Prospecto');
    const cerradas = tiendas.filter(t=>t.estatus==='Cerrada');
    const esteMes = abiertas.filter(t=>t.mes.startsWith(state.periodo_actual)).length;

    c.innerHTML = `
      <div class="title">Plan de expansión · PrimeMX ${state.anio}</div>
      <div class="subtitle">${exp.carga.archivo ? `Última carga: ${exp.carga.archivo}${exp.carga.agregadas!==undefined ? ` · ${exp.carga.agregadas} nuevas, ${exp.carga.actualizadas} actualizadas` : ''} · ${fmtFecha(exp.carga.fecha)}` : 'Aperturas de tienda, hardware e internet asignado'}</div>

      ${canEdit ? `
      <div class="uploadbar">
        <div class="txt">
          <b>Cargar archivo de la semana (.xlsx)</b> — solo necesitas subir los registros nuevos: se agregan a lo que ya tienes o actualizan la tienda que coincida por Clave PDV. Nada se borra. Las notas se conservan.
          <div id="uploadErrorExp"></div>
        </div>
        <input type="file" id="fileExpansion" accept=".xlsx,.xls" style="display:none">
        <button class="upload" id="btnUploadExp">Cargar archivo</button>
      </div>` : ''}
      ${cargaPendienteExpansion ? panelConfirmacionExpansion() : ''}

      <div class="cards">
        <div class="card"><div class="head" style="background:#6600CC">Total tiendas</div>
          <div class="body"><div class="big">${tiendas.length}</div><div class="lbl">${prospecto.length} prospecto sin clave</div></div></div>
        <div class="card"><div class="head" style="background:#00B050">Abiertas</div>
          <div class="body"><div class="big">${abiertas.length}</div><div class="lbl">${esteMes} etiquetadas "${state.periodo_actual}"</div></div></div>
        <div class="card"><div class="head" style="background:#B8860B">En proceso</div>
          <div class="body"><div class="big">${enProceso.length}</div><div class="lbl">con ARQ o impresora pendiente</div></div></div>
        <div class="card"><div class="head" style="background:#C00000">Cerradas</div>
          <div class="body"><div class="big">${cerradas.length}</div><div class="lbl">marcadas manualmente</div></div></div>
      </div>

      <div class="panel">
        <div class="editbar">${editing
          ? `<button id="btnCancel">Cancelar</button><button id="btnAddTienda">Agregar tienda</button><button class="primary" id="btnSave">Guardar cambios</button>`
          : (canEdit ? `<button id="btnEdit">Editar todo</button>` : '')}</div>
        <h3>Tiendas — mes, hardware, internet y estatus</h3>
        <div style="overflow-x:auto;"><table>
          <thead><tr>
            <th>#</th><th>Clave PDV</th><th>Tienda</th><th>Región</th><th>Mes</th>
            <th>PC</th><th>Lap</th><th>Internet</th><th>ARQ</th><th>Impresora</th><th>Estatus</th><th style="text-align:left;">Nota</th>${editing?'<th></th>':''}
          </tr></thead>
          <tbody>${tiendas.map((t,i)=> editing ? `
            <tr data-exp-row="${i}">
              <td><input type="text" style="width:44px;" data-exp-field="numero" data-exp-row="${i}" value="${t.numero!==null && t.numero!==undefined ? t.numero : ''}"></td>
              <td><input type="text" style="width:110px;" data-exp-field="clave" data-exp-row="${i}" value="${t.clave||''}"></td>
              <td><input type="text" style="width:220px; text-align:left;" data-exp-field="nombre" data-exp-row="${i}" value="${(t.nombre||'').replace(/"/g,'&quot;')}"></td>
              <td><input type="text" style="width:90px;" data-exp-field="region" data-exp-row="${i}" value="${t.region||''}"></td>
              <td><input type="text" style="width:80px;" data-exp-field="mes" data-exp-row="${i}" value="${t.mes||''}"></td>
              <td><input type="text" style="width:36px;" data-exp-field="pc" data-exp-row="${i}" value="${t.pc||''}"></td>
              <td><input type="text" style="width:36px;" data-exp-field="lap" data-exp-row="${i}" value="${t.lap||''}"></td>
              <td><input type="text" style="width:70px;" data-exp-field="internet" data-exp-row="${i}" value="${t.internet||''}"></td>
              <td><input type="text" style="width:80px;" data-exp-field="entregado_arq" data-exp-row="${i}" value="${t.entregado_arq||''}"></td>
              <td><input type="text" style="width:80px;" data-exp-field="entrega_impresora" data-exp-row="${i}" value="${t.entrega_impresora||''}"></td>
              <td><select data-exp-field="estatus" data-exp-row="${i}">
                ${['Abierta','En proceso','Prospecto','Cerrada'].map(op=>`<option value="${op}" ${t.estatus===op?'selected':''}>${op}</option>`).join('')}
              </select></td>
              <td><input type="text" style="width:220px; text-align:left;" data-exp-field="nota" data-exp-row="${i}" value="${(t.nota||'').replace(/"/g,'&quot;')}"></td>
              <td><button data-exp-remove="${i}" style="padding:3px 8px;">✕</button></td>
            </tr>` : `
            <tr data-exp-row="${i}">
              <td>${t.numero!==null && t.numero!==undefined ? t.numero : '—'}</td>
              <td>${t.clave||'—'}</td>
              <td style="text-align:left;">${t.nombre}</td>
              <td>${t.region}</td>
              <td>${t.mes||'—'}</td>
              <td>${t.pc}</td>
              <td>${t.lap}</td>
              <td>${t.internet}</td>
              <td>${t.entregado_arq}</td>
              <td>${t.entrega_impresora}</td>
              <td><span class="status-badge ${estatusExpClass(t.estatus)}">${t.estatus}</span></td>
              <td style="text-align:left;">${t.nota||'<span style="color:var(--sub)">—</span>'}</td>
            </tr>`).join('')}
          </tbody>
        </table></div>
      </div>
      <div class="panel">
        <h3>Notas generales de expansión</h3>
        ${editing
          ? `<textarea id="notasGenerales" rows="6" style="width:100%; font-family:inherit; font-size:13px; padding:10px; border:1px solid var(--line); border-radius:8px;" placeholder="Ejemplo: Tienda CITY SHOP — cierre de tienda para el 03 de agosto">${exp.notas_generales||''}</textarea>`
          : `<div style="font-size:13px; white-space:pre-wrap; color:${exp.notas_generales ? 'var(--ink)' : 'var(--sub)'};">${exp.notas_generales || 'Sin notas capturadas todavía. Da clic en "Editar todo" arriba para agregar.'}</div>`}
        <div class="foot">Espacio libre para movimientos que no vienen en el archivo (cierres, cambios de plaza, pausas, etc.). No se sobreescribe al cargar un nuevo Excel.</div>
      </div>
      <div class="foot">En modo edición puedes cambiar cualquier campo de la tabla, agregar tiendas manualmente o quitarlas. Al cargar un archivo nuevo, esos cambios manuales se respetan salvo que ese mismo campo venga distinto en el Excel para esa Clave PDV.</div>
    `;
    if(editing){
      document.getElementById('btnCancel').onclick=()=>{editing=false;render();};
      document.getElementById('btnAddTienda').onclick=()=>{
        tiendas.push({numero:null, clave:'', nombre:'Nueva tienda', mes:'', region:'-', pc:'-', lap:'-', hc:'-', pinpad:'-', dif_pinpad:'-', biometricos:'-', dif_biometricos:'-', prep_equipo:'-', envio_mac:'-', internet:'-', solicitud_arq:'-', entregado_arq:'-', entrega_impresora:'-', modelo_impresora:'-', estatus:'Prospecto', nota:''});
        render();
      };
      document.getElementById('btnSave').onclick=()=>{
        document.querySelectorAll('[data-exp-field]').forEach(inp=>{
          const i = Number(inp.dataset.expRow);
          const field = inp.dataset.expField;
          let val = inp.value;
          if(field==='numero') val = val==='' ? null : Number(val);
          tiendas[i][field] = val;
        });
        const ng = document.getElementById('notasGenerales');
        if(ng) exp.notas_generales = ng.value;
        save();
      };
      document.querySelectorAll('[data-exp-remove]').forEach(btn=>{
        btn.onclick = ()=>{ tiendas.splice(Number(btn.dataset.expRemove),1); render(); };
      });
    } else {
      if(canEdit) document.getElementById('btnEdit').onclick=()=>{editing=true;render();};
    }
    wireExpansionUpload();
  }
  function panelConfirmacionExpansion(){
    const d = cargaPendienteExpansion;
    const existentes = state.expansion.tiendas || [];
    const keyOf = t => t.clave ? ('clave:'+t.clave) : ('nombre:'+t.nombre);
    const clavesExistentes = new Set(existentes.map(keyOf));
    const nuevas = d.tiendas.filter(t=>!clavesExistentes.has(keyOf(t))).length;
    const actualizan = d.tiendas.length - nuevas;
    return `<div class="panel" style="border-color:var(--tm);">
      <h3 style="color:var(--tm);">Confirmar carga · ${d.fileName}</h3>
      <div style="font-size:13px; line-height:1.8;">
        Filas en el archivo: <b>${d.resumen.total}</b> → <b>${nuevas} tiendas nuevas</b> se agregarán, <b>${actualizan}</b> ya existían y se actualizarán.<br>
        En el archivo: Abiertas <b>${d.resumen.abiertas}</b> · En proceso <b>${d.resumen.enProceso}</b> · Prospecto <b>${d.resumen.prospecto}</b>
      </div>
      <div class="foot">No se borra nada de lo que ya tenías. Las notas manuales que ya hayas escrito se conservan (se empatan por Clave PDV, o por nombre si no tiene clave).</div>
      <div class="editbar" style="margin-top:10px;">
        <button id="btnCancelCargaExp">Cancelar</button>
        <button class="primary" id="btnAplicarCargaExp">Aplicar datos</button>
      </div>
    </div>`;
  }
  function wireExpansionUpload(){
    const btn = document.getElementById('btnUploadExp');
    if(btn) btn.onclick = () => document.getElementById('fileExpansion').click();
    const inp = document.getElementById('fileExpansion');
    if(inp) inp.onchange = handleFileUploadExpansion;
    const btnCancel = document.getElementById('btnCancelCargaExp');
    if(btnCancel) btnCancel.onclick = ()=>{ cargaPendienteExpansion = null; render(); };
    const btnAplicar = document.getElementById('btnAplicarCargaExp');
    if(btnAplicar) btnAplicar.onclick = ()=>{ aplicarDatosExpansion(cargaPendienteExpansion); };
  }

  window.initCaidasApp = function(role){
    canEdit = (role === 'admin');
    load();
  };
})();
</script>
</body>
</html>
