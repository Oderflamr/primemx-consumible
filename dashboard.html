<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Dashboard IT · PrimeMX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ===== Portal: variables, login, shell y header (igual que directorio.html) ===== */
<style>
:root{
  --bg:#F4F6F5;
  --panel:#FFFFFF;
  --ink:#122031;
  --ink-soft:#4B5A6B;
  --line:#DCE3E2;
  --signal:#0C8599;
  --signal-dark:#0A6B79;
  --signal-soft:#E3F1F2;
  --ok:#1E8E5A;
  --ok-soft:#E6F5EC;
  --warn:#C6421B;
  --warn-soft:#FBE9E4;
  --radius:10px;
  --font-ui:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}

/* ===== LOGIN ===== */
#login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 15% 20%, rgba(12,133,153,0.10), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(12,133,153,0.08), transparent 45%),
    var(--bg);
}
.login-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:40px 36px;
  width:100%;
  max-width:380px;
  box-shadow:0 12px 40px rgba(18,32,49,0.08);
}
.login-signal{
  display:flex;
  gap:4px;
  align-items:flex-end;
  height:22px;
  margin-bottom:18px;
}
.login-signal span{
  width:6px;
  background:var(--signal);
  border-radius:2px;
  animation:pulseBar 1.6s ease-in-out infinite;
}
.login-signal span:nth-child(1){height:30%;animation-delay:0s;}
.login-signal span:nth-child(2){height:55%;animation-delay:.15s;}
.login-signal span:nth-child(3){height:80%;animation-delay:.3s;}
.login-signal span:nth-child(4){height:100%;animation-delay:.45s;}
@keyframes pulseBar{0%,100%{opacity:.4;}50%{opacity:1;}}
.login-card h1{
  font-size:20px;
  margin:0 0 2px;
  letter-spacing:-0.01em;
}
.login-card .sub{
  color:var(--ink-soft);
  font-size:13px;
  margin:0 0 26px;
}
.field{margin-bottom:14px;}
.field label{
  display:block;
  font-size:12px;
  font-weight:600;
  color:var(--ink-soft);
  margin-bottom:6px;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.field input, .field select{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:14px;
  background:#FAFBFB;
  color:var(--ink);
}
.field input:focus, .field select:focus{
  outline:2px solid var(--signal);
  outline-offset:1px;
  border-color:var(--signal);
}
.btn{
  border:none;
  border-radius:8px;
  padding:11px 18px;
  font-size:14px;
  font-weight:600;
  transition:transform .05s ease, opacity .15s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--signal);color:#fff;width:100%;}
.btn-primary:hover{background:var(--signal-dark);}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
.btn-ghost:hover{background:#F0F2F1;}
.btn-danger{background:var(--warn);color:#fff;}
.btn-danger:hover{opacity:.9;}
.login-error{
  background:var(--warn-soft);
  color:var(--warn);
  font-size:13px;
  padding:9px 12px;
  border-radius:8px;
  margin-bottom:14px;
  display:none;
}
.login-error.show{display:block;}
.login-hint{
  margin-top:18px;
  font-size:11.5px;
  color:#8B9AA5;
  line-height:1.5;
}

/* ===== APP SHELL ===== */
#app{display:none;min-height:100vh;flex-direction:column;}
#app.show{display:flex;}
header.topbar{
  background:var(--panel);
  border-bottom:1px solid var(--line);
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  position:sticky;
  top:0;
  z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{
  width:30px;height:30px;border-radius:8px;
  background:var(--signal);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--font-mono);font-weight:600;font-size:13px;
}
.brand h1{font-size:15px;margin:0;font-weight:700;}
.brand .brand-sub{font-size:11px;color:var(--ink-soft);margin:0;}
.user-chip{
  display:flex;align-items:center;gap:10px;
  font-size:13px;color:var(--ink-soft);
}
.role-tag{
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  padding:3px 8px;
  border-radius:20px;
  background:var(--signal-soft);
  color:var(--signal-dark);
}
.role-tag.admin{background:#FDEBD8;color:#A6560F;}

main{flex:1;padding:20px;max-width:1400px;margin:0 auto;width:100%;}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;
  font-size:13px;opacity:0;transition:all .25s ease;z-index:200;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{background:var(--warn);}
.toast.ok{background:var(--ok);}

</style>
<style>
/* ===== Estilos propios del dashboard de caídas ===== */
  :root{
    --tp:#6600CC; --tm:#00B0F0; --mg:#92D050; --st:#212121;
    --ink:#1A1A1F; --sub:#6B7280; --line:#E5E7EB;
    --crit:#C00000; --med:#B8860B; --good:#00B050;
    --bg:#FFFFFF;
    font-family:'Segoe UI','Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;}
  #caidas-root{background:var(--bg); color:var(--ink);}
  .topbar{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .brand{font-weight:800; font-size:22px;}
  .brand span{color:var(--tm);}
  .status-line{font-size:12px; color:var(--sub); display:flex; gap:8px; align-items:center;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--good); display:inline-block;}

  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:20px; overflow-x:auto;}
  .tab{padding:9px 14px; font-size:13px; font-weight:600; color:var(--sub); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
  .tab.active{color:var(--tp); border-color:var(--tp);}
  .tab:hover{color:var(--ink);}

  .title{font-size:19px; font-weight:700; margin-bottom:2px;}
  .subtitle{color:var(--sub); font-size:13px; margin-bottom:18px;}

  .cards{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:24px;}
  @media (max-width:1100px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:560px){ .cards{grid-template-columns:1fr;} }
  .card{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; min-width:0;}
  .card .head{padding:9px 14px; font-weight:700; color:#fff; font-size:14px;}
  .card .body{padding:14px;}
  .card .big{font-size:27px; font-weight:800; line-height:1;}
  .card .lbl{font-size:11px; color:var(--sub); margin-top:2px;}
  .card .rule{border-top:1px solid var(--line); margin:8px 0;}
  .pill{display:inline-block; margin-top:8px; font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:20px; border:1.5px solid;}
  .pill.crit{color:var(--crit); border-color:var(--crit);}
  .pill.med{color:var(--med); border-color:var(--med);}
  .pill.good{color:var(--good); border-color:var(--good);}

  .panel{border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:18px; max-width:100%; overflow-x:hidden;}
  .panel h3{margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--sub);}
  canvas{max-height:320px;}

  .editbar{display:flex; justify-content:flex-end; gap:8px; margin-bottom:12px;}
  #caidas-root button{font-family:inherit; font-size:13px; font-weight:600; padding:7px 14px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink);}
  button.primary{background:var(--tp); color:#fff; border-color:var(--tp);}
  button.primary:hover{background:#5400a8;}
  button:hover{background:#f7f7f8;}

  #caidas-root table{width:100%; border-collapse:collapse; font-size:12.5px;}
  #caidas-root th, #caidas-root td{padding:6px 7px; text-align:center; border-bottom:1px solid var(--line);}
  #caidas-root th{color:var(--sub); font-weight:600; font-size:11px; text-transform:uppercase;}
  td:first-child, th:first-child{text-align:left; font-weight:600;}
  input[type=number],input[type=text]{width:56px; padding:4px; border:1px solid var(--line); border-radius:5px; text-align:center; font-size:12.5px;}
  input[type=text]{width:190px; text-align:left;}
  .status-badge{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:10px;}
  .status-badge.critica{background:#FDECEC; color:var(--crit);}
  .status-badge.alerta{background:#FFF3D6; color:#A15C00;}
  .status-badge.atencion{background:#FFF9DB; color:var(--med);}
  .status-badge.estable{background:#E7F7EC; color:var(--good);}

  .servicios-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:6px;}
  .sv-field label{font-size:11px; color:var(--sub); display:block; margin-bottom:4px;}
  .sv-field input{width:100%;}

  .placeholder{border:1.5px dashed var(--line); border-radius:12px; padding:32px 26px; text-align:center; color:var(--sub);}
  .placeholder h3{color:var(--ink); font-size:16px; margin-bottom:8px;}
  .placeholder ul{text-align:left; max-width:460px; margin:16px auto 0; font-size:13px; line-height:1.7;}

  .toast{position:fixed; bottom:20px; right:20px; background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transform:translateY(8px); transition:.25s; z-index:99;}
  .toast.show{opacity:1; transform:translateY(0);}
  .foot{font-size:11px; color:var(--sub); margin-top:6px;}
  #caidas-root:not(.is-admin) .foot{display:none;}

  @media (max-width:1366px){
    .title{font-size:17px;}
    .card .big{font-size:22px;}
    .panel{padding:14px 16px;}
  }
  @media (max-width:640px){
    .title{font-size:16px;}
    .subtitle{font-size:12px;}
    .card .big{font-size:19px;}
    .card .head{font-size:13px; padding:7px 10px;}
    .panel{padding:12px 14px;}
    #caidas-root table{font-size:11.5px;}
  }

  .uploadbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:16px; background:#FAFAFB;}
  .uploadbar .txt{font-size:12px; color:var(--sub); flex:1; min-width:220px;}
  .uploadbar .txt b{color:var(--ink);}
  button.upload{background:var(--tm); color:#fff; border-color:var(--tm);}
  button.upload:hover{background:#0090c8;}
  button.upload:disabled{opacity:.55; cursor:default;}
  .upload-summary{font-size:11.5px; color:var(--good); margin-top:2px;}
  .upload-error{font-size:11.5px; color:var(--crit); margin-top:2px;}

  /* ===== Budget IT 2026 ===== */
  #tbl-budget-it{min-width:1640px; table-layout:fixed;}
  /* Proveedor / Categoría / Presup. quedan fijas (sticky) al hacer scroll horizontal para llegar al mes que se necesita editar */
  #tbl-budget-it .bi-prov{position:sticky; left:0; z-index:2; background:#fff; text-align:left; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #tbl-budget-it .bi-cat{position:sticky; left:200px; z-index:2; background:#fff; text-align:left; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #tbl-budget-it .bi-presup{position:sticky; left:330px; z-index:2; background:#fff; border-right:2px solid var(--line);}
  #tbl-budget-it thead th.bi-prov, #tbl-budget-it thead th.bi-cat, #tbl-budget-it thead th.bi-presup{background:#fff; z-index:3;}
  #tbl-budget-it tr.bi-totales .bi-prov, #tbl-budget-it tr.bi-totales .bi-cat, #tbl-budget-it tr.bi-totales .bi-presup{background:#FAFAFB;}
  #tbl-budget-it td.bi-locked{background:#F4F5F7; color:var(--sub); position:relative;}
  #tbl-budget-it td.bi-locked::after{content:'🔒'; font-size:8px; position:absolute; top:1px; right:2px; opacity:.5;}
  #tbl-budget-it input.bi-proyectado{color:var(--sub); font-style:italic; background:#FBFBFC;}
  #tbl-budget-it tr.bi-totales td{font-weight:700; border-top:2px solid var(--ink); background:#FAFAFB;}
  #tbl-budget-it tr.bi-presupuesto td{color:var(--sub); font-style:italic;}
  #tbl-budget-it tr.bi-ahorro td.pos{color:var(--good); font-weight:700;}
  #tbl-budget-it tr.bi-ahorro td.neg{color:var(--crit); font-weight:700;}
  .bi-legend{display:flex; gap:16px; margin:10px 0 0; font-size:11.5px; color:var(--sub); flex-wrap:wrap;}
  .bi-legend span{display:inline-flex; align-items:center; gap:5px;}
  .bi-swatch{width:10px; height:10px; border-radius:3px; display:inline-block; border:1px solid var(--line);}
  .bi-swatch.locked{background:#F4F5F7;}
  .bi-swatch.real{background:#fff;}
  .bi-swatch.proy{background:#FBFBFC; border-style:dashed;}
  .bi-insight{display:flex; gap:9px; padding:10px 11px; border-radius:8px; background:#FAFAFB; border:1px solid var(--line); margin-bottom:9px; border-left:3px solid var(--line);}
  .bi-insight.mejora{border-left-color:var(--med);}
  .bi-insight.riesgo{border-left-color:var(--crit);}
  .bi-insight.oportunidad{border-left-color:var(--good);}
  .bi-insight .body b{display:block; font-size:12.5px; margin-bottom:2px;}
  .bi-insight .body span{font-size:12px; color:var(--sub); line-height:1.4;}

  /* Barra de progreso "presupuesto anual vs. proyección" (bullet bar) */
  .bi-bullet-wrap{padding:10px 2px 0;}
  .bi-bullet-track{position:relative; height:34px; border-radius:8px; background:#EEF1F1; border:1px solid var(--line); overflow:hidden;}
  .bi-bullet-seg{position:absolute; top:0; left:0; height:100%;}
  .bi-bullet-real{background:#0C8599; z-index:2;}
  .bi-bullet-proj{background:repeating-linear-gradient(135deg, #0C8599 0 5px, #cfe9ec 5px 10px); opacity:.75; border-right:2px solid #0A6B79; z-index:1;}
  .bi-bullet-labels{display:flex; justify-content:space-between; margin-top:8px; font-size:11px; color:var(--sub);}
  .bi-bullet-legend{display:flex; gap:14px; margin-top:10px; font-size:11px; color:var(--sub); flex-wrap:wrap;}
  .bi-bullet-legend span{display:inline-flex; align-items:center; gap:5px;}
  .bi-sw{width:12px; height:12px; border-radius:3px; display:inline-block;}
  .bi-sw.real{background:#0C8599;}
  .bi-sw.proj{background:repeating-linear-gradient(135deg, #0C8599 0 2px, #cfe9ec 2px 4px); border:1px solid #0A6B79;}
  .bi-sw.gap{background:#fff; border:1.5px dashed var(--sub);}
  .bi-bullet-callout{margin-top:12px; background:#E7F7EC; border-radius:8px; padding:9px 12px; font-size:12.5px; color:var(--good); font-weight:600;}
  .bi-bullet-callout.warn{background:#FDECEC; color:var(--crit);}
</style>
</head>

</div>

const ROLES_COLLECTION = "usuarios";

function toast(msg, type=""){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(()=> el.className = 'toast', 2500);
}

/* LOGIN (mismo mecanismo que Directorio de Tiendas: usuario+contraseña de Firebase Auth) */
document.getElementById('login-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const u = document.getElementById('login-user').value.trim().toLowerCase();
  const p = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  try{
    await auth.signInWithEmailAndPassword(u + '@' + AUTH_DOMAIN, p);
    errEl.classList.remove('show');
  }catch(err){
    console.error(err);
    errEl.textContent = 'No se pudo entrar (' + (err.code || err.message || 'error desconocido') + ').';
    errEl.classList.add('show');
  }
  submitBtn.disabled = false;
});

document.getElementById('logout-btn').addEventListener('click', function(){
  auth.signOut();
});

// Cierre de sesión automático tras 5 minutos sin actividad.
const LIMITE_INACTIVIDAD = 5 * 60 * 1000;
let temporizadorInactividad = null;
function reiniciarTemporizadorInactividad(){
  if(!currentUser) return;
  clearTimeout(temporizadorInactividad);
  temporizadorInactividad = setTimeout(()=>{ auth.signOut(); }, LIMITE_INACTIVIDAD);
}
['mousedown','mousemove','keydown','scroll','touchstart','click'].forEach(evt=>{
  document.addEventListener(evt, reiniciarTemporizadorInactividad, {passive:true});
});

document.getElementById('link-olvide-pass').addEventListener('click', function(e){
  e.preventDefault();
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('reset-pass-box').style.display = 'block';
  document.getElementById('reset-user').value = document.getElementById('login-user').value || '';
  document.getElementById('login-error').classList.remove('show');
});

document.getElementById('link-cancelar-reset').addEventListener('click', function(e){
  e.preventDefault();
  document.getElementById('reset-pass-box').style.display = 'none';
  document.getElementById('login-form').style.display = '';
  document.getElementById('reset-msg').style.display = 'none';
});

document.getElementById('btn-reset-pass').addEventListener('click', async function(){
  const u = document.getElementById('reset-user').value.trim().toLowerCase();
  const msg = document.getElementById('reset-msg');
  if(!u){
    msg.textContent = 'Escribe tu usuario primero.';
    msg.style.color = 'var(--warn)';
    msg.style.display = 'block';
    return;
  }
  const btn = document.getElementById('btn-reset-pass');
  btn.disabled = true;
  try{
    await auth.sendPasswordResetEmail(u + '@' + AUTH_DOMAIN);
    msg.textContent = 'Listo. Revisa tu correo (' + u + '@' + AUTH_DOMAIN + ') para crear una contraseña nueva.';
    msg.style.color = 'var(--ok)';
  }catch(err){
    console.error(err);
    // Mensaje genérico a propósito: no confirmamos si el usuario existe o no.
    msg.textContent = 'Si el usuario existe, te llegará un correo para restablecer la contraseña.';
    msg.style.color = 'var(--ink-soft)';
  }
  msg.style.display = 'block';
  btn.disabled = false;
});

auth.onAuthStateChanged(async function(user){
  if(user){
    const username = (user.email || '').split('@')[0];
    let roleInfo = { role: 'consulta', label: username };
    try{
      const doc = await db.collection(ROLES_COLLECTION).doc(username).get();
      if(doc.exists){
        roleInfo = { role: doc.data().role || 'consulta', label: doc.data().label || username };
      }
    }catch(err){
      console.error('No se pudo leer el rol del usuario', err);
    }
    currentUser = { username, role: roleInfo.role, label: roleInfo.label };
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('show');
    document.getElementById('user-label').textContent = currentUser.label;
    const roleTag = document.getElementById('role-tag');
    roleTag.textContent = currentUser.role === 'admin' ? 'Administrador' : 'Consulta';
    roleTag.className = 'role-tag' + (currentUser.role === 'admin' ? ' admin' : '');
    window.initCaidasApp(currentUser.role);
    reiniciarTemporizadorInactividad();
    const enlaceConsumibles = document.getElementById('link-a-consumibles');
    if(enlaceConsumibles) enlaceConsumibles.style.display = (currentUser.username === 'marafic') ? 'none' : '';
  } else {
    currentUser = null;
    document.getElementById('app').classList.remove('show');
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-pass').value = '';
  }
});
</script>

  // ---------- Carga de archivo de tickets (Excel) ----------
  const DIST_LABELS = ['<4h','4-12h','12-24h','1-3d','>3d'];

  function parseFechaTicket(v){
    if(!v) return null;
    if(v instanceof Date) return isNaN(v.getTime()) ? null : v;
    const s = String(v).trim();
    const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s*(\d{1,2}):(\d{2})/);
    if(!m) return null;
    const [,d,mo,y,h,mi] = m.map(Number);
    const dt = new Date(y, mo-1, d, h, mi);
    return isNaN(dt.getTime()) ? null : dt;
  }
  // A qué proveedor y si cuenta como "caída" según la categoría del ticket
  // El campo "Cliente" de los tickets trae un alias pegado antes del nombre real de la tienda
  // (ej. "CDMX FLORENCIA PRM TDA CDMX FLORENCIA"). El nombre correcto es lo que empieza en la ÚLTIMA
  // aparición de "PRM TDA" (o "PRM " si esa tienda no usa "TDA"), para no cortar a la mitad si el
  // propio alias también arranca con "PRM TDA".
  // Correcciones manuales de nombre: cuando el ticket trae un alias distinto al nombre real de catálogo.
  // Clave = nombre tal como sale de extraerNombreCanonico(); valor = nombre correcto (el del catálogo).
  const CORRECCIONES_NOMBRE = {
    'PRM TDA IRAPUATO BERRIOZABAL CENTRO': 'PRM TDA IRAPUATO DE BERRIOZABAL',
    'PRM TDA HEB LOS MORALES SAN NICOLAS': 'PRM TDA HEB LOS MORALES NICOLAS',
    'PRM TDA MIGUEL ANGEL DE QUEVEDO CDMX': 'PRM TDA MIGUEL A DE QUEVEDO CDMX',
    'PRM TDA GOMEZ PALACIO LAS ROSAS': 'PRM TDA TORREON GOMEZ PALACIO LAS ROSAS'
  };

  function extraerNombreCanonico(cliente){
    if(!cliente) return '';
    const c = String(cliente).trim();
    const up = c.toUpperCase();
    let idx = up.lastIndexOf('PRM TDA');
    if(idx === -1) idx = up.lastIndexOf('PRM ');
    if(idx === -1) return c;
    const nombre = c.slice(idx).trim();
    return CORRECCIONES_NOMBRE[nombre.toUpperCase()] || nombre;
  }
  // Busca Carrier/Tecnología en el catálogo por nombre canónico exacto (mayúsculas), con un
  // segundo intento quitando/agregando "TDA" (el catálogo no siempre lo incluye).
  function buscarCatalogo(nombreCanonico){
    const up = String(nombreCanonico).toUpperCase();
    let info = CATALOGO_TIENDAS[up];
    if(!info){
      const alt = up.includes('PRM TDA ') ? up.replace('PRM TDA ', 'PRM ') : up.replace('PRM ', 'PRM TDA ');
      info = CATALOGO_TIENDAS[alt];
    }
    return info ? { carrier: info.carrier, tecnologia: info.tecnologia } : { carrier: '—', tecnologia: '—' };
  }

  function proveedorCaida(categoria){
    if(!categoria) return null;
    const c = String(categoria);
    if(!c.startsWith('Internet y telefonia')) return null;
    const esCaida = c.includes('Sin servicio');
    if(!esCaida) return null;
    if(c.includes('Totalplay')) return 'TotalPlay';
    if(c.includes('Telmex')) return 'Telmex';
    if(c.includes('Metro Carrier')) return 'Metrocarrier';
    return null;
  }
  // Problemas de velocidad se mide aparte: ya NO cuenta como "caída", pero se muestra
  // como tendencia informativa en Top 15 TotalPlay/Telmex.
  function proveedorVelocidad(categoria){
    if(!categoria) return null;
    const c = String(categoria);
    if(!c.startsWith('Internet y telefonia')) return null;
    if(!c.includes('Problemas con velocidad')) return null;
    if(c.includes('Totalplay')) return 'TotalPlay';
    if(c.includes('Telmex')) return 'Telmex';
    if(c.includes('Metro Carrier')) return 'Metrocarrier';

  }
  function median(sortedArr){
    const n = sortedArr.length;
    if(n===0) return 0;
    const mid = Math.floor(n/2);
    return n%2 ? sortedArr[mid] : (sortedArr[mid-1]+sortedArr[mid])/2;
  }
  function statsFromDurations(durations){
    if(!durations.length) return {tickets:0,avg:0,dias:0,min:0,mediana:0,max:0,dist:[0,0,0,0,0],pct24:0,pct48:0};
    const sorted = [...durations].sort((a,b)=>a-b);
    const tickets = durations.length;
    const sum = durations.reduce((a,b)=>a+b,0);
    const dist = [0,0,0,0,0];
    let c24=0, c48=0;
    durations.forEach(h=>{
      if(h<4) dist[0]++; else if(h<12) dist[1]++; else if(h<24) dist[2]++; else if(h<72) dist[3]++; else dist[4]++;
      if(h<24) c24++;
      if(h<48) c48++;
    });
    return {
      tickets,
      avg: Math.round((sum/tickets)*10)/10,
      dias: Math.round((sum/tickets/24)*100)/100,
      min: Math.round(sorted[0]*10)/10,
      mediana: Math.round(median(sorted)*10)/10,
      max: Math.round(sorted[sorted.length-1]*10)/10,
      dist,
      pct24: Math.round(100*c24/tickets),
      pct48: Math.round(100*c48/tickets)
    };
  }

  // Agentes que se miden aparte, en la pestaña "Tickets Mesa de control" (son colas, no personas individuales).
  const AGENTES_MESA_CONTROL = ['MC PPM','MC EGF','MESA CONTROL'];
  const MESAS_CONTROL = ['Mesa de Control','Mesa de Control Nivel 1'];
  // Tickets Soporte: se cuentan TODOS los tickets del archivo, sin importar categoría ni mesa de
  // ayuda, EXCEPTO estas 4 categorías exactas (que son de Mesa de Control, no de Soporte).
  const CATEGORIAS_EXCLUIR_SOPORTE = [

  // Tickets que se quedaron mal categorizados (Sin subcategoría / Otros) y que se decidió

  // Calcula los datos a partir de las filas del Excel SIN tocar el estado (para poder confirmar antes de aplicar)
  function calcularDatosTickets(rows, fileName){
    const monthCounts = { TotalPlay:new Array(12).fill(0), Telmex:new Array(12).fill(0), Metrocarrier:new Array(12).fill(0) };
    const velocidadCounts = { TotalPlay:new Array(12).fill(0), Telmex:new Array(12).fill(0), Metrocarrier:new Array(12).fill(0) };
    const durations   = { TotalPlay:[], Telmex:[], Metrocarrier:[] };
    const storeMonth  = { TotalPlay:{}, Telmex:{} };
    const storeMonthVelocidad = { TotalPlay:{}, Telmex:{} };
    const mesaSoporteIT = new Array(12).fill(0);
    const mesaControl = new Array(12).fill(0);
    const agenteMonth = {};
    const agenteDuraciones = {};
    const agenteMonthMC = {};
    const agenteDuracionesMC = {};
    const catMonth = {};
    const catAgente = {};
    let rechazoCancelMC = 0;
    let maxMonthIdx = -1, totalCaidas = 0;

    // Caídas de la semana en curso (lunes a domingo), calculado sobre la fecha real de hoy.
    const hoy = new Date();
    const diaSemana = (hoy.getDay() + 6) % 7; // 0=lunes ... 6=domingo
    const lunesActual = new Date(hoy); lunesActual.setDate(hoy.getDate() - diaSemana); lunesActual.setHours(0,0,0,0);
    const domingoActual = new Date(lunesActual); domingoActual.setDate(lunesActual.getDate() + 6); domingoActual.setHours(23,59,59,999);
    function numeroSemanaISO(d){
      const t = new Date(d.getTime());
      t.setHours(0,0,0,0);
      t.setDate(t.getDate() + 3 - ((t.getDay()+6)%7));
      const enero1 = new Date(t.getFullYear(),0,1);
      return Math.round(((t - enero1) / 86400000 - 3 + ((enero1.getDay()+6)%7)) / 7) + 1;
    }
    let caidasSemanaActual = 0;

    // Detecta tickets duplicados de caída: misma tienda, categoría "Sin servicio", creados con
    // 90 minutos o menos de diferencia, ambos con Estado "Cerrado". El segundo (el más nuevo de
    // cada pareja) se trata igual que un "Rechazado" — no cuenta como caída real.
    const LIMITE_DUPLICADO_MIN = 90;
    const idsDuplicados = new Set();
    {
      const porTienda = {};
      rows.forEach(row=>{
        const prov = proveedorCaida(row['Categoría']);
        if(!prov) return;
        if(String(row['Estado']).trim() !== 'Cerrado') return;
        const fc = parseFechaTicket(row['Fecha de creación']);
        if(!fc) return;
        const tienda = extraerNombreCanonico(row['Cliente']) || 'Sin nombre';
        if(!porTienda[tienda]) porTienda[tienda] = [];
        porTienda[tienda].push({ id: row['ID'], fc });
      });
      Object.values(porTienda).forEach(lista=>{
        lista.sort((a,b)=> a.fc - b.fc);
        for(let i=1; i<lista.length; i++){
          const diffMin = (lista[i].fc - lista[i-1].fc) / 60000;
          if(diffMin <= LIMITE_DUPLICADO_MIN && !idsDuplicados.has(lista[i-1].id)){
            idsDuplicados.add(lista[i].id);
          }
        }
      });
    }

    rows.forEach(row=>{
      const fc = parseFechaTicket(row['Fecha de creación']);
      if(!fc) return;
      const mIdx = fc.getMonth();
      if(mIdx > maxMonthIdx) maxMonthIdx = mIdx;

      // Tickets Soporte: UNA sola fuente de verdad — TODOS los tickets del archivo, sin importar
      // categoría ni mesa de ayuda, EXCEPTO las 4 categorías de Mesa de Control (arriba). La tabla
      // por ingeniero es un recorte de este MISMO conjunto de filas, para que el total de la
      // gráfica y el total de la tabla siempre cuadren entre sí. Los agentes que no se miden
      // individualmente (Alfredo, Eder, Daniel, Ariadna, Luis Alzaga, MC PPM/EGF/Mesa de Control)
      // y los tickets sin agente asignado se agrupan todos en una sola fila: "Soporte Prime".
      const mesaAyuda = String(row['Mesa de ayuda']).trim();
      const agente = row['Agente asignado'] ? String(row['Agente asignado']).trim().replace(/\s+/g, ' ') : '';
      const categoriaTicket = String(row['Categoría']||'').trim();
      if(!CATEGORIAS_EXCLUIR_SOPORTE.includes(categoriaTicket)){
        mesaSoporteIT[mIdx]++;
        const agenteSoporte = (!agente || AGENTES_EXCLUIDOS.includes(agente)) ? 'Soporte Prime' : agente;
        if(!agenteMonth[agenteSoporte]) agenteMonth[agenteSoporte] = new Array(12).fill(0);
        agenteMonth[agenteSoporte][mIdx]++;
        if(String(row['Estado']).trim()==='Cerrado'){
          const fcierreAg = parseFechaTicket(row['Fecha de cierre']);
          if(fcierreAg){
            const hrsAg = (fcierreAg - fc)/3600000;
            if(hrsAg >= 0){
              if(!agenteDuraciones[agenteSoporte]) agenteDuraciones[agenteSoporte] = [];
              agenteDuraciones[agenteSoporte].push(hrsAg);
            }
          }
        }
      }

      // Mesa de Control: UNA sola fuente de verdad (columna "Mesa de ayuda"). Todo lo que se
      // desglosa abajo (por agente, por categoría, el cruce) es un recorte de este MISMO
      // conjunto de filas, para que los totales siempre cuadren entre las distintas tablas.
      if(MESAS_CONTROL.includes(mesaAyuda)){
        mesaControl[mIdx]++;
        const estadoMC = String(row['Estado']).trim();
        const idTicket = Number(row['ID']);
        const forzarRechazado = IDS_FORZAR_RECHAZADO.includes(idTicket);

        if(forzarRechazado || estadoMC === 'Rechazado' || estadoMC === 'Cancelado'){
          rechazoCancelMC++;
        } else {
          // Solo Cerrado/Abierto entran al detalle por agente y por categoría.
          // Los que no tienen agente asignado se cuentan como MESA CONTROL (no aparte).
          const agenteMC = agente || 'MESA CONTROL';
          if(!agenteMonthMC[agenteMC]) agenteMonthMC[agenteMC] = new Array(12).fill(0);
          agenteMonthMC[agenteMC][mIdx]++;
          let hrsMC = null;
          if(estadoMC === 'Cerrado'){
            const fcierreMC = parseFechaTicket(row['Fecha de cierre']);
            if(fcierreMC){
              const h = (fcierreMC - fc)/3600000;
              if(h >= 0) hrsMC = h;
            }
          }
          if(hrsMC !== null){
            if(!agenteDuracionesMC[agenteMC]) agenteDuracionesMC[agenteMC] = [];
            agenteDuracionesMC[agenteMC].push(hrsMC);
          }

          const categoriaFull = String(row['Categoría']||'').trim();
          const catCorta = categoriaFull.startsWith('Mesa de Control > ')
            ? categoriaFull.replace('Mesa de Control > ', '')
            : (categoriaFull === 'Mesa de Control' || !categoriaFull ? 'Sin subcategoría' : 'Otros');
          if(!catMonth[catCorta]) catMonth[catCorta] = new Array(12).fill(0);
          catMonth[catCorta][mIdx]++;
          if(!catAgente[catCorta]) catAgente[catCorta] = {};
          if(!catAgente[catCorta][agenteMC]) catAgente[catCorta][agenteMC] = { count:0, dur:[] };
          catAgente[catCorta][agenteMC].count++;
          if(hrsMC !== null) catAgente[catCorta][agenteMC].dur.push(hrsMC);
        }
      }

      const provVel = proveedorVelocidad(row['Categoría']);
      if(provVel){
        velocidadCounts[provVel][mIdx]++;
        if(provVel==='TotalPlay' || provVel==='Telmex'){
          const storeV = extraerNombreCanonico(row['Cliente']) || 'Sin nombre';
          if(!storeMonthVelocidad[provVel][storeV]) storeMonthVelocidad[provVel][storeV] = new Array(12).fill(0);
          storeMonthVelocidad[provVel][storeV][mIdx]++;
        }
      }

      const prov = proveedorCaida(row['Categoría']);
      if(!prov) return;
      if(String(row['Estado']).trim()==='Rechazado') return; // un ticket rechazado no cuenta como caída real
      if(idsDuplicados.has(row['ID'])) return; // duplicado de otra caída de la misma tienda (<=90 min)
      monthCounts[prov][mIdx]++;
      totalCaidas++;
      if(fc >= lunesActual && fc <= domingoActual) caidasSemanaActual++;

      if(prov==='TotalPlay' || prov==='Telmex'){
        const store = extraerNombreCanonico(row['Cliente']) || 'Sin nombre';
        if(!storeMonth[prov][store]) storeMonth[prov][store] = new Array(12).fill(0);
        storeMonth[prov][store][mIdx]++;
      }
      if(String(row['Estado']).trim()==='Cerrado'){
        const fcierre = parseFechaTicket(row['Fecha de cierre']);
        if(fcierre){
          const hrs = (fcierre - fc)/3600000;
          if(hrs >= 0) durations[prov].push(hrs);
        }
      }
    });

    if(maxMonthIdx < 0){
      throw new Error('No se encontraron tickets con categoría "Internet y telefonia" (Sin servicio / Problemas con velocidad) en el archivo.');
    }

    const hasta = maxMonthIdx;
    const provs = ['TotalPlay','Telmex','Metrocarrier'];
    const atencion = {};
    provs.forEach(p=>{ atencion[p] = statsFromDurations(durations[p]); });
    const tops = {};
    const topsVelocidad = {};
    // El nombre en mayúsculas usado como "carrier esperado" para comparar contra el catálogo.
    const carrierEsperado = { TotalPlay:'TOTALPLAY', Telmex:'TELMEX' };
    // Si el catálogo dice que la tienda tiene contratado un carrier distinto al de la categoría
    // del ticket, es muy probable que sea un error de captura del agente (eligió mal el carrier
    // al levantar el ticket) — se descarta esa fila y se confía en el catálogo, no en el ticket.
    function coincideConCatalogo(nombre, prov){
      const cat = buscarCatalogo(nombre);
      if(cat.carrier === '—') return true; // sin dato en catálogo: no se puede descartar, se deja
      return cat.carrier === carrierEsperado[prov];
    }
    ['TotalPlay','Telmex'].forEach(p=>{
      tops[p] = Object.entries(storeMonth[p])
        .filter(([nombre])=> coincideConCatalogo(nombre, p))
        .map(([nombre,meses])=>{
          const cat = buscarCatalogo(nombre);
          return { nombre, meses: meses.slice(0,hasta+1), carrier: cat.carrier, tecnologia: cat.tecnologia };
        });
      topsVelocidad[p] = Object.entries(storeMonthVelocidad[p])
        .filter(([nombre])=> coincideConCatalogo(nombre, p))
        .map(([nombre,meses])=>{
          const cat = buscarCatalogo(nombre);
          return { nombre, meses: meses.slice(0,hasta+1), carrier: cat.carrier, tecnologia: cat.tecnologia };
        });
    });

    const ingenieros = Object.entries(agenteMonth).map(([nombre,meses])=>{
      const dur = agenteDuraciones[nombre] || [];
      const promedio = dur.length ? Math.round((dur.reduce((a,b)=>a+b,0)/dur.length)*10)/10 : null;
      return { nombre, meses: meses.slice(0,hasta+1), promedio };
    });
    const agentesMC = Object.entries(agenteMonthMC).map(([nombre,meses])=>{
      const dur = agenteDuracionesMC[nombre] || [];
      const promedio = dur.length ? Math.round((dur.reduce((a,b)=>a+b,0)/dur.length)*10)/10 : null;
      return { nombre, meses: meses.slice(0,hasta+1), promedio };
    });
    const mcCategorias = Object.entries(catMonth).map(([categoria,meses])=>({
      categoria, meses: meses.slice(0,hasta+1)
    }));
    const mcCategoriaAgente = Object.entries(catAgente).map(([categoria,porAgente])=>{
      const fila = { categoria };
      Object.entries(porAgente).forEach(([ag,d])=>{
        const promedio = d.dur.length ? Math.round((d.dur.reduce((a,b)=>a+b,0)/d.dur.length)*10)/10 : null;
        fila[ag] = { count: d.count, promedio };
      });
      return fila;
    });

    return {
      fileName,
      periodo_actual: MESES[hasta],
      tendencia_data: { TotalPlay: monthCounts.TotalPlay, Telmex: monthCounts.Telmex, Metrocarrier: monthCounts.Metrocarrier },
      velocidad_data: { TotalPlay: velocidadCounts.TotalPlay, Telmex: velocidadCounts.Telmex, Metrocarrier: velocidadCounts.Metrocarrier },
      atencion,
      top_totalplay: tops.TotalPlay,
      top_telmex: tops.Telmex,
      top_velocidad_totalplay: topsVelocidad.TotalPlay,
      top_velocidad_telmex: topsVelocidad.Telmex,
      mesa_soporte_it: mesaSoporteIT,
      mesa_control: mesaControl,
      mesa_control_rechazado_cancelado: rechazoCancelMC,
      ingenieros,
      agentes_mc: agentesMC,
      mc_categorias: mcCategorias,
      mc_categoria_agente: mcCategoriaAgente,
      resumen: {
        totalCaidas, mesesCubiertos: hasta+1,
        tiendasTP: tops.TotalPlay.length,
        tiendasTM: tops.Telmex.length,
        criticasTP: tops.TotalPlay.filter(r=>r.meses.reduce((a,b)=>a+b,0)>=5).length,
        criticasTM: tops.Telmex.filter(r=>r.meses.reduce((a,b)=>a+b,0)>=5).length,
        semana_actual: {
          numero: numeroSemanaISO(hoy),
          inicio: lunesActual.toISOString(),
          fin: domingoActual.toISOString(),
          caidas: caidasSemanaActual
        }
      }
    };
  }

  // ---------- Carga de archivo de expansión (Excel) ----------
  function normalizeMes(v){
    if(v === null || v === undefined || v === '') return '';
    if(v instanceof Date){
      return MESES[v.getMonth()] + ' ' + v.getFullYear();
    }
    return String(v).trim();
  }
  function fmtCellExp(v){
    if(v === null || v === undefined || v === '') return '-';
    if(v instanceof Date) return v.toISOString().slice(0,10);
    return String(v).trim();
  }
  function numOrDashExp(v){
    if(v === null || v === undefined || v === '') return '-';
    return v;
  }
  function computeEstatusExpansion(clave, region, mes, entregadoArq, entregaImpresora){
    const sinDatos = !clave && (!region || region==='-');
    if(sinDatos) return 'Prospecto';
    const mesStr = String(mes).toUpperCase();
    const arq = String(entregadoArq).toUpperCase();
    const imp = String(entregaImpresora).toUpperCase();
    if(mesStr.includes('PROCESO') || arq.includes('PENDIENTE') || imp.includes('PENDIENTE')) return 'En proceso';
    return 'Abierta';
  }
  function estatusExpClass(estatus){
    if(estatus==='Abierta') return 'estable';
    if(estatus==='En proceso') return 'alerta';
    if(estatus==='Cerrada') return 'critica';
    return 'atencion';
  }

  function calcularDatosExpansion(rows2d, fileName){
    let headerIdx = -1;
    for(let i=0;i<Math.min(10,rows2d.length);i++){
      if(String((rows2d[i]||[])[0]).trim()==='#Tienda'){ headerIdx = i; break; }
    }
    if(headerIdx < 0) throw new Error('No se encontró el encabezado "#Tienda" en la hoja. Verifica que sea el archivo de expansión correcto.');

    const tiendas = [];
    for(let i=headerIdx+1; i<rows2d.length; i++){
      const row = rows2d[i] || [];
      const isBlank = row.slice(0,19).every(v=> v===undefined || v===null || v==='');
      if(isBlank){
        if(tiendas.length>0) break; else continue;
      }
      const pdv = row[3];
      if(!pdv || String(pdv).trim()==='') continue;
      const clave = row[2] ? String(row[2]).trim() : '';
      const region = row[4] ? String(row[4]).trim() : '';
      const mes = normalizeMes(row[1]);
      const entregadoArq = row[16];
      const entregaImpresora = row[17];
      tiendas.push({
        numero: (row[0]!==undefined && row[0]!==null && row[0]!=='') ? Number(row[0]) : null,
        clave,
        nombre: String(pdv).trim(),
        mes,
        region: region || '-',
        pc: numOrDashExp(row[5]),
        lap: numOrDashExp(row[6]),
        hc: numOrDashExp(row[7]),
        pinpad: numOrDashExp(row[8]),
        dif_pinpad: numOrDashExp(row[9]),
        biometricos: numOrDashExp(row[10]),
        dif_biometricos: numOrDashExp(row[11]),
        prep_equipo: fmtCellExp(row[12]),
        envio_mac: fmtCellExp(row[13]),
        internet: row[14] ? String(row[14]).trim() : '-',
        solicitud_arq: fmtCellExp(row[15]),
        entregado_arq: entregadoArq ? String(entregadoArq).trim() : '-',
        entrega_impresora: fmtCellExp(entregaImpresora),
        modelo_impresora: row[18] ? String(row[18]).trim() : '-',
        estatus: computeEstatusExpansion(clave, region, mes, entregadoArq, entregaImpresora),
        nota: ''
      });
    }
    if(tiendas.length===0) throw new Error('No se encontraron filas de tiendas después del encabezado.');

    const abiertas = tiendas.filter(t=>t.estatus==='Abierta').length;
    const enProceso = tiendas.filter(t=>t.estatus==='En proceso').length;
    const prospecto = tiendas.filter(t=>t.estatus==='Prospecto').length;
    const esteMes = tiendas.filter(t=>t.estatus==='Abierta' && t.mes.startsWith(state.periodo_actual)).length;

    return { fileName, tiendas, resumen:{ total:tiendas.length, abiertas, enProceso, prospecto, esteMes } };
  }

  // Acumula (no reemplaza): las tiendas del archivo nuevo se agregan o actualizan por Clave PDV
  // (o por nombre si no tienen clave); las tiendas que ya estaban y no vienen en este archivo
  // se quedan tal cual (así funciona la carga semanal de "solo lo nuevo de esta semana").
  // Las notas manuales (por tienda y generales) nunca se tocan aquí.
  function aplicarDatosExpansion(datos){
    const existentes = state.expansion.tiendas || [];
    const keyOf = t => t.clave ? ('clave:'+t.clave) : ('nombre:'+t.nombre);
    const indexPorKey = {};
    existentes.forEach((t,i)=>{ indexPorKey[keyOf(t)] = i; });

    let agregadas = 0, actualizadas = 0;
    datos.tiendas.forEach(nuevo=>{
      const key = keyOf(nuevo);
      if(indexPorKey.hasOwnProperty(key)){
        const i = indexPorKey[key];
        const notaPrevia = existentes[i].nota || '';
        existentes[i] = { ...nuevo, nota: notaPrevia };
        actualizadas++;
      } else {
        existentes.push({ ...nuevo });
        indexPorKey[key] = existentes.length - 1;
        agregadas++;
      }
    });

    state.expansion.tiendas = existentes;
    state.expansion.carga = { archivo: datos.fileName, fecha: new Date().toISOString(), agregadas, actualizadas };
    cargaPendienteExpansion = null;
    save();
  }

  function handleFileUploadExpansion(e){
    const file = e.target.files[0];
    if(!file) return;
    const errBox = document.getElementById('uploadErrorExp');
    if(errBox) errBox.innerHTML = '';
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'array', cellDates:true});
        const sheetName = wb.SheetNames.find(n=>/hoja ?1|expansi/i.test(n)) || wb.SheetNames[0];
        const ws = wb.Sheets[sheetName];
        const rows2d = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
        cargaPendienteExpansion = calcularDatosExpansion(rows2d, file.name);
        render();
      }catch(err){
        console.error(err);
        if(errBox) errBox.innerHTML = `<div class="upload-error">No se pudo procesar el archivo: ${err.message}</div>`;
      }finally{
        e.target.value = '';
      }
    };
    reader.onerror = ()=>{ if(errBox) errBox.innerHTML = '<div class="upload-error">No se pudo leer el archivo.</div>'; };
    reader.readAsArrayBuffer(file);
  }

  function cumulativo(prov){
    const hasta = idxMes(state.periodo_actual);
    const arr = state.tendencia.data[prov] || [];
    let s = 0; for(let i=0;i<=hasta;i++) s += Number(arr[i]||0);
    return s;
  }
  function estatusProveedor(caidas){
    if(caidas >= 150) return {cls:'crit', label:'CRÍTICO'};
    if(caidas >= 20) return {cls:'med', label:'MEDIO'};
    return {cls:'good', label:'BUENO'};
  }
  function estatusTienda(total){
    if(total >= 5) return {cls:'critica', label:'CRÍTICA'};
    if(total === 4) return {cls:'alerta', label:'ALERTA'};
    if(total >= 2) return {cls:'atencion', label:'ATENCIÓN'};
    if(total === 1) return {cls:'estable', label:'ESTABLE'};
    return {cls:'estable', label:'—'};
  }

  // ---------- YoY (TotalPlay / Telmex) ----------
  function renderYoy(c, prov){

    const serie2025 = state.yoy_2025[prov];

      <div class="title">Caídas ${prov} — comparativo 2025 vs 2026</div>
      <div class="subtitle">Barras por mes, acumulado por año</div>

        <div class="card"><div class="head" style="background:${COLOR_2025[prov]||'#B39DDB'}">Año ${state.anio-1}</div>
          <div class="body"><div class="big">${serie2025.reduce((a,b)=>a+Number(b||0),0)}</div><div class="lbl">Caídas acumuladas (año completo)</div></div></div>
      </div>
      <div class="panel">
        <div class="editbar">${editing

        <h3>Comparativo mensual</h3>

          ${notas.map((n,i)=>`
            <div style="font-size:12px; padding:6px 10px; border-radius:8px; background:${n.anio===state.anio-1?'#EDE7F6':'#F3E5F5'}; border:1px solid ${n.anio===state.anio-1?(COLOR_2025[prov]||'#B39DDB'):CARD_COLOR[prov]}; display:flex; align-items:center; gap:6px;">
              🚩 <b>${n.mes} ${n.anio}:</b> ${n.nota}
              ${editing ? `<button data-yoy-nota-remove="${i}" style="padding:1px 6px; margin-left:4px;">✕</button>` : ''}

        ${editing ? `
        <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line);">
          <h3 style="margin-bottom:8px;">Agregar anotación</h3>
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <select id="notaMes">${MESES.map(m=>`<option value="${m}">${m}</option>`).join('')}</select>
            <select id="notaAnio"><option value="${state.anio-1}">${state.anio-1}</option><option value="${state.anio}">${state.anio}</option></select>
            <input type="text" id="notaTexto" placeholder="Ej. Migración de servicios" style="flex:1; min-width:220px; padding:6px 10px; border:1px solid var(--line); border-radius:6px;">
            <button id="btnAddNota">Agregar</button>
          </div>
        </div>` : ''}
      </div>
      ${editing ? `<div class="panel"><h3>Caídas ${prov} — año ${state.anio-1}</h3>
        <div style="overflow-x:auto;"><table><thead><tr>${MESES.map(m=>`<th>${m}</th>`).join('')}</tr></thead>
        <tbody><tr>${MESES.map((m,i)=>`<td><input type="number" min="0" data-yoy-idx="${i}" value="${serie2025[i]}"></td>`).join('')}</tr></tbody></table></div>
        <div class="foot">El año ${state.anio} se toma de la pestaña "Tendencia mensual" — no se edita aquí, para que ambos siempre coincidan.</div>
      </div>` : ''}
    `;
    if(editing){
      document.getElementById('btnCancel').onclick=()=>{editing=false;render();};
      document.getElementById('btnSave').onclick=()=>{
        document.querySelectorAll('input[data-yoy-idx]').forEach(i=>{ state.yoy_2025[prov][Number(i.dataset.yoyIdx)] = Number(i.value||0); });
        save();
      };
      document.querySelectorAll('[data-yoy-nota-remove]').forEach(btn=>{
        btn.onclick = ()=>{ notas.splice(Number(btn.dataset.yoyNotaRemove),1); render(); };
      });
      const btnAdd = document.getElementById('btnAddNota');
      if(btnAdd) btnAdd.onclick = ()=>{
        const mes = document.getElementById('notaMes').value;
        const anio = Number(document.getElementById('notaAnio').value);
        const texto = document.getElementById('notaTexto').value.trim();
        if(!texto) return;
        notas.push({anio, mes, nota:texto});
        render();
      };

      if(canEdit) document.getElementById('btnEdit').onclick=()=>{editing=true;render();};
    }
    // Plugin de dibujo: pone una bandera roja arriba de la barra que tenga una nota para ese mes/año
    const banderaPlugin = {
      id:'banderasYoy',
      afterDatasetsDraw(chart){
        try{
          const ctx = chart.ctx;
          ctx.save();
          ctx.font = '14px sans-serif';
          ctx.textAlign = 'center';
          [state.anio-1, state.anio].forEach((anio,dsIdx)=>{
            const meta = chart.getDatasetMeta(dsIdx);
            if(!meta || !meta.data) return;
            MESES.forEach((mes,i)=>{
              const tieneNota = notas.some(n=>n.anio===anio && n.mes===mes);
              if(!tieneNota) return;
              const el = meta.data[i];
              if(!el) return;
              ctx.fillText('🚩', el.x, el.y - 8);
            });
          });
          ctx.restore();
        }catch(e){ /* no bloquear el render de la gráfica por un error de dibujo */ }
      }
    };

      type:'bar',
      data:{ labels:MESES, datasets:[
        {label:String(state.anio-1), data:serie2025, backgroundColor:COLOR_2025[prov]||'#CBB6E8'},
        {label:String(state.anio), data:MESES.map((m,i)=> i<=hasta ? serie2026[i] : 0), backgroundColor:CARD_COLOR[prov]}

      options:{responsive:true, plugins:{legend:{position:'bottom'}, tooltip:{ callbacks:{
        afterLabel(ctx){
          const anio = ctx.datasetIndex===0 ? state.anio-1 : state.anio;
          const mes = MESES[ctx.dataIndex];
          const n = notas.find(x=>x.anio===anio && x.mes===mes);
          return n ? '🚩 ' + n.nota : '';
        }
      }}}, scales:{y:{beginAtZero:true}}},
      plugins:[banderaPlugin]
    });
  }

  // ---------- Resumen 2026 ----------
  function renderResumen(c){
    const tp=cumulativo('TotalPlay'), tm=cumulativo('Telmex'), mg=cumulativo('Metrocarrier');
    const sl=Number(state.tendencia.caidas_extra.Starlink||0);
    const total = tp+tm+mg+sl;
    const r = state.resumen;
    const TIENDAS_CATALOGO = { TotalPlay:478, Telmex:138, Megacable:5 }; // total de tiendas por carrier (catálogo)
    function autoPeer(prov, caidas){
      const totalTiendas = TIENDAS_CATALOGO[prov];
      if(!totalTiendas) return r.peer[prov]; // Starlink: no viene del catálogo de tickets, se queda con el valor guardado
      return Math.round((caidas / totalTiendas) * 100) / 100;
    }
    function autoAtn(prov){
      const clave = prov==='Megacable' ? 'Metrocarrier' : prov;
      if(prov==='Starlink' || !state.atencion[clave]) return r.atn[prov];
      return state.atencion[clave].avg + ' hrs';
    }
    function card(prov,caidas){
      const peerVal = autoPeer(prov,caidas);
      const atnVal = autoAtn(prov);
      return `<div class="card"><div class="head" style="background:${CARD_COLOR[prov]}">${prov}</div>
        <div class="body">
          <div class="big" style="font-size:22px">${caidas}</div><div class="lbl">Caídas · ${fmtPct(caidas,total)} del total</div>
          <div class="rule"></div>
          <div style="font-size:12px;color:var(--sub)">Peer: <b style="color:var(--ink)">${peerVal}</b> &nbsp;·&nbsp; Atn: <b style="color:var(--ink)">${atnVal}</b></div>
        </div></div>`;
    }
    const sem = r.semana_actual;
    const textoSemana = (sem && sem.numero)
      ? `Semana ${sem.numero} (${fmtFechaCorta(sem.inicio)} – ${fmtFechaCorta(sem.fin)}): <b>${sem.caidas}</b> caídas`
      : 'Carga un archivo de tickets para ver la semana en curso.';
    c.innerHTML = `
      ${canEdit ? `
      <div class="uploadbar">
        <div class="txt">
          <b>Cargar reporte de tickets (.xlsx, año completo)</b> — recalcula Tendencia, Atención y Top 15 (TotalPlay/Telmex/Metrocarrier) a partir de las categorías "Internet y telefonia".
          ${state.carga.archivo ? `<div class="upload-summary">Último archivo: ${state.carga.archivo} · ${state.carga.tickets_caidas} tickets de caídas procesados · ${fmtFecha(state.carga.fecha)}</div>` : ''}
          <div id="uploadError"></div>
        </div>
        <input type="file" id="fileTickets" accept=".xlsx,.xls" style="display:none">
        <button class="upload" id="btnUpload">Cargar archivo</button>
      </div>` : ''}
      ${cargaPendiente ? `
      <div class="panel" style="border-color:var(--tm);">
        <h3 style="color:var(--tm);">Confirmar carga · ${cargaPendiente.fileName}</h3>
        <div style="font-size:13px; line-height:1.8;">
          Tickets de caídas identificados: <b>${cargaPendiente.resumen.totalCaidas}</b> (Ene–${cargaPendiente.periodo_actual})<br>
          Tiendas con caídas — TotalPlay: <b>${cargaPendiente.resumen.tiendasTP}</b> (${cargaPendiente.resumen.criticasTP} críticas) ·
          Telmex: <b>${cargaPendiente.resumen.tiendasTM}</b> (${cargaPendiente.resumen.criticasTM} críticas)
        </div>
        <div class="foot">Esto reemplaza Tendencia mensual, Atención y Top 15 (TotalPlay/Telmex/Metrocarrier). Peer y Atn se recalculan solos; Megacable/Starlink no se tocan.</div>
        <div class="editbar" style="margin-top:10px;">
          <button id="btnCancelCarga">Cancelar</button>
          <button class="primary" id="btnAplicarCarga">Aplicar datos</button>
        </div>
      </div>` : ''}
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;">
        <div>
          <div class="title" style="margin-bottom:2px;">Total de caídas ${state.anio}</div>
          <div class="subtitle">${textoSemana}</div>
        </div>
        <div class="panel" style="text-align:center; padding:14px 26px; margin:0;">
          <div style="font-size:24px; font-weight:800;">${total}</div>
          <div class="foot" style="margin-top:2px;">total caídas ${state.anio}</div>
        </div>
      </div>
      <div class="cards" style="margin-top:16px;">${card('TotalPlay',tp)}${card('Telmex',tm)}${card('Megacable',mg)}${card('Starlink',sl)}</div>
      <div class="panel">
        <h3>Caídas por proveedor</h3>
        <canvas id="chartResumen"></canvas>
      </div>
      <div class="foot" style="margin-top:6px;">Peer = caídas ÷ tiendas del catálogo, redondeado a 2 decimales. Atn = mismo promedio que aparece en "ETR". Starlink sigue siendo manual (no viene del archivo de tickets).</div>
    `;
    if(canEdit){
      document.getElementById('btnUpload').onclick = () => document.getElementById('fileTickets').click();
      document.getElementById('fileTickets').onchange = handleFileUpload;
      if(cargaPendiente){
        document.getElementById('btnCancelCarga').onclick = ()=>{ cargaPendiente = null; render(); };
        document.getElementById('btnAplicarCarga').onclick = ()=>{ aplicarDatosTickets(cargaPendiente); };
      }
    }
    charts.resumen = new Chart(document.getElementById('chartResumen'), {
      type:'bar',
      data:{ labels:['TotalPlay','Telmex','Megacable','Starlink'], datasets:[{ data:[tp,tm,mg,sl],
        backgroundColor:[CARD_COLOR.TotalPlay,CARD_COLOR.Telmex,CARD_COLOR.Megacable,CARD_COLOR.Starlink] }] },
      options:{responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}
    });
  }

  // ---------- Atencion ----------
  function renderAtencion(c){
    const a = state.atencion;
    const provs = ['TotalPlay','Telmex','Metrocarrier'];
    const dLabels = ['<4h','4-12h','12-24h','1-3d','>3d'];

  }
  function editorAtencion(p){

  // ---------- Top 15 tiendas ----------
  function renderVelocidadTrend(prov){
    const hasta = idxMes(state.periodo_actual);
    const mesesCortos = MESES.slice(0,hasta+1);
    const key = prov==='TotalPlay' ? 'top_velocidad_totalplay' : 'top_velocidad_telmex';
    const filas = state[key] || [];
    const totalServicios = filas.length;
    const totalTickets = filas.reduce((s,r)=>s+r.meses.reduce((a,b)=>a+Number(b||0),0),0);
    const withTotals = filas.map(r=>{
        const cat = buscarCatalogo(r.nombre);
        const carrier = cat.carrier !== '—' ? cat.carrier : r.carrier;
        const tecnologia = cat.tecnologia !== '—' ? cat.tecnologia : r.tecnologia;
        return {...r, carrier, tecnologia, total:r.meses.reduce((a,b)=>a+Number(b||0),0)};
      })
      .sort((a,b)=>b.total-a.total).slice(0,15);
    return `
      <div class="panel">
        <h3 style="margin-bottom:2px;">Problemas con velocidad — ${prov} (no cuenta como caída)</h3>
        <div class="foot" style="margin-bottom:10px;">Tendencia informativa aparte: estos tickets ya no se suman a "caídas", pero se siguen monitoreando por si conviene actuar.</div>
        <div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr)); margin-bottom:16px;">
          <div class="card"><div class="head" style="background:var(--sub)">Servicios afectados</div>
            <div class="body"><div class="big">${totalServicios}</div><div class="lbl">tiendas con al menos 1 ticket de velocidad</div></div></div>
          <div class="card"><div class="head" style="background:var(--sub)">Tickets de velocidad</div>
            <div class="body"><div class="big">${totalTickets}</div><div class="lbl">Ene-${state.periodo_actual} ${state.anio}</div></div></div>
        </div>
        ${filas.length===0 ? `<div class="foot">No hay tickets de "Problemas con velocidad" para ${prov} en el periodo cargado.</div>` : `
        <div style="overflow-x:auto;"><table>
          <thead><tr><th>#</th><th>Tienda</th><th>Carrier</th><th>Tecnología</th>${mesesCortos.map(m=>`<th>${m.slice(0,3)}</th>`).join('')}<th>Total</th><th>Estatus</th></tr></thead>
          <tbody>${withTotals.map((r,i)=>`
            <tr>
              <td>${i+1}</td>
              <td style="text-align:left;">${r.nombre}</td>
              <td>${r.carrier||'—'}</td>
              <td>${r.tecnologia||'—'}</td>
              ${mesesCortos.map((m,mi)=>`<td>${r.meses[mi]||'-'}</td>`).join('')}
              <td><b>${r.total}</b></td>
              <td><span class="status-badge alerta">Problema de velocidad</span></td>
            </tr>`).join('')}</tbody>
        </table></div>
        <div class="foot" style="margin-top:8px;">Mostrando las 15 tiendas con más tickets de velocidad, de ${totalServicios} en total.</div>
        `}
      </div>
    `;
  }
  function renderTop(c, key, prov){
    const rows = state[key];
    c.innerHTML = `
      <div class="title">Top 15 tiendas con más caídas — ${prov} — Ene-${state.periodo_actual} ${state.anio}</div>
      <div class="subtitle">CRÍTICA ≥5 · ALERTA = 4 · ATENCIÓN 2-3 · ESTABLE = 1</div>
      <div class="editbar">${editing
        ? `<button id="btnCancel">Cancelar</button><button class="primary" id="btnSave">Guardar cambios</button>`
        : (canEdit ? `<button id="btnEdit">Editar tabla</button><button id="btnAddRow">Agregar tienda</button>` : '')}</div>
      ${rows.length===0 && !editing ? `
        <div class="placeholder">
          <h3>Todavía no hay datos capturados</h3>
          <p>No prellené esta tabla con las cifras del PPTX original porque, al extraer el archivo, el texto de esa tabla vino aplanado y no pude garantizar que cada número quedara en la fila/mes correcto — prefiero dejarla vacía a arriesgar un dato mal capturado en un reporte para el director.</p>
          <p>Da clic en <b>"Editar tabla"</b> y agrega tienda por tienda con su conteo mensual; el total y el estatus se calculan solos.</p>

      document.getElementById('btnCancel').onclick=()=>{editing=false;render();};

          const carrierInp = row.querySelector('[data-field="carrier"]');
          if(carrierInp) rows[i].carrier = carrierInp.value;
          const tecInp = row.querySelector('[data-field="tecnologia"]');
          if(tecInp) rows[i].tecnologia = tecInp.value;
          rows[i].meses = rows[i].meses.map((_,mi)=> Number(row.querySelector(`[data-mes="${mi}"]`).value||0));
        });
        save();
      };
      document.getElementById('btnAddRow')?.remove();
      wireRemoveButtons(rows,key);
    } else {

  function handleFileUploadWin11(e){
    const file = e.target.files[0];
    if(!file) return;
    const errBox = document.getElementById('uploadErrorWin11');
    errBox.innerHTML = '';
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        function detectarChasis(row){
          const chasisCol = String(row['Tipo de chasis']||'').trim().toLowerCase();
          if(chasisCol) return chasisCol.includes('lap') ? 'laptop' : 'desktop';
          const nombre = String(row['Nombre']||'').toUpperCase();
          if(nombre.startsWith('CMB-')) return 'laptop';
          if(nombre.includes('LAP')) return 'laptop';
          if(nombre.includes('PC')) return 'desktop';
          return 'laptop';
        }
        function detectarTipoSO(row){
          const so = String(row['Sistema Operativo'] || row['Sistema_Operativo F  '] || row['Sistema_Operativo F'] || '').trim();
          if(so.includes('Windows 10')) return 'win10';
          if(so.toLowerCase().includes('no es compatible') || so.toLowerCase().includes('no compatible')) return 'nocompat';
          return so.includes('Windows 11') ? 'win11' : 'otro';
        }
        const nuevos = rows.map(row=>({
          pdv: String(row['Nombre_PDV']||'').trim(),
          region: String(row['Region']||'').trim(),
          chasis: detectarChasis(row),
          tipo_so: detectarTipoSO(row)
        })).filter(r=>r.pdv && (r.tipo_so==='win10' || r.tipo_so==='nocompat'));
        if(!nuevos.length){ throw new Error('No se encontraron filas de Windows 10 o "No compatible" con "Nombre_PDV" en el archivo.'); }
        state.win11_pendientes = nuevos;
        if(!state.win11_pendientes_historial) state.win11_pendientes_historial = [];
        state.win11_pendientes_historial.unshift({
          fecha: new Date().toISOString(),
          usuario: (typeof currentUser!=='undefined' && currentUser) ? currentUser.username : 'desconocido',
          archivo: file.name,
          total: nuevos.length
        });
        if(state.win11_pendientes_historial.length > 30) state.win11_pendientes_historial.length = 30;
        save();
      }catch(err){
        console.error(err);
        errBox.innerHTML = `<div style="color:var(--warn); font-size:12px; margin-top:6px;">No se pudo leer el archivo: ${err.message}</div>`;
      }
    };
    reader.readAsArrayBuffer(file);
  }

    const inv = state.inventario;
    const puedeEditar = canEditInventario();
    c.innerHTML = `
      <div class="title">Adquisición de Equipo ${state.anio}</div>
      <div class="subtitle">Laptop y CPU — Estado de adquisición, entrega y asignación</div>
      <div class="editbar">${editing && puedeEditar

        : (puedeEditar ? `<button id="btnEdit">Editar</button>` : '')}</div>

          ${panelMasarykDetalle(inv, editing && puedeEditar, '#1565C0')}
        </div>
        ${panelInventario('CPU', inv.cpu, '#1B5E20', editing && puedeEditar)}
      </div>
      ${canEdit ? renderHistorialInventario() : ''}
    `;
    if(editing && puedeEditar){
      document.getElementById('btnCancel').onclick = ()=>{ editing=false; render(); };
      document.getElementById('btnSave').onclick = ()=>{
        document.querySelectorAll('[data-inv]').forEach(inp=>{
          const [tipo,key] = inp.dataset.inv.split('.');
          const obj = tipo==='LAPTOP' ? inv.laptop : inv.cpu;
          obj[key] = Number(inp.value||0);
        });
        document.querySelectorAll('[data-inv-asig-nombre]').forEach(inp=>{
          const [tipo,idx] = inp.dataset.invAsigNombre.split('.');
          const obj = tipo==='LAPTOP' ? inv.laptop : inv.cpu;
          obj.asignaciones[Number(idx)].nombre = inp.value;
        });
        document.querySelectorAll('[data-inv-asig-valor]').forEach(inp=>{
          const [tipo,idx] = inp.dataset.invAsigValor.split('.');
          const obj = tipo==='LAPTOP' ? inv.laptop : inv.cpu;
          obj.asignaciones[Number(idx)].valor = Number(inp.value||0);
        });
        const inpUtil = document.getElementById('masarykUtilizadas');
        if(inpUtil) inv.masaryk_detalle.utilizadas = Number(inpUtil.value||0);
        document.querySelectorAll('[data-masaryk-obs]').forEach(inp=>{
          inv.masaryk_detalle.observaciones[Number(inp.dataset.masarykObs)] = inp.value;
        });
        if(!state.inventario_historial) state.inventario_historial = [];
        state.inventario_historial.unshift({
          fecha: new Date().toISOString(),
          usuario: (typeof currentUser!=='undefined' && currentUser) ? currentUser.username : 'desconocido',
          snapshot: JSON.parse(JSON.stringify(inv))
        });
        if(state.inventario_historial.length > 30) state.inventario_historial.length = 30;
        editing = false;
        save();
      };
      document.querySelectorAll('[data-inv-asig-quitar]').forEach(btn=>{
        btn.onclick = ()=>{
          const [tipo,idx] = btn.dataset.invAsigQuitar.split('.');
          const obj = tipo==='LAPTOP' ? inv.laptop : inv.cpu;
          obj.asignaciones.splice(Number(idx),1);
          render();
        };
      });
      document.querySelectorAll('[data-inv-asig-agregar]').forEach(btn=>{
        btn.onclick = ()=>{
          const tipo = btn.dataset.invAsigAgregar;
          const obj = tipo==='LAPTOP' ? inv.laptop : inv.cpu;
          obj.asignaciones.push({nombre:'Nuevo renglón', valor:0});
          render();
        };
      });
      const inpUtil = document.getElementById('masarykUtilizadas');
      if(inpUtil) inpUtil.onchange = ()=>{
        inv.masaryk_detalle.utilizadas = Math.max(0, Number(inpUtil.value||0));
        render();
      };
    } else if(puedeEditar){
      document.getElementById('btnEdit').onclick = ()=>{ editing=true; render(); };
    }
    if(canEdit){
      document.querySelectorAll('[data-hist-ver]').forEach(btn=>{
        btn.onclick = ()=>{
          const idx = Number(btn.dataset.histVer);
          historialExpandido = historialExpandido===idx ? null : idx;
          render();
        };
      });
    }
  }

  function panelMasarykDetalle(inv, editando, color){
    const masarykRow = inv.laptop.asignaciones.find(a=>/mazaryk|masaryk/i.test(a.nombre));
    const entregadas = masarykRow ? Number(masarykRow.valor||0) : 0;
    const det = inv.masaryk_detalle;
    let utilizadas = Math.max(0, Math.min(Number(det.utilizadas||0), entregadas));
    if(det.utilizadas !== utilizadas) det.utilizadas = utilizadas;
    while(det.observaciones.length < utilizadas) det.observaciones.push('');
    while(det.observaciones.length > utilizadas) det.observaciones.pop();
    const totalDisponible = entregadas - utilizadas;
    return `
      <div style="border:1px solid var(--line); border-radius:10px; overflow:hidden;">
        <div style="background:${color}; color:#fff; font-weight:700; font-size:15px; padding:10px 16px;">Detalle — Masaryk</div>
        <div style="padding:10px 16px;">
          <div class="foot" style="margin-bottom:8px;">Cada laptop "utilizada" resta del total disponible y agrega su propio recuadro de observación.</div>
          <div style="display:flex; justify-content:space-between; padding:5px 0;">
            <span>Entregadas</span><b>${entregadas}</b>
          </div>
          <div style="display:flex; justify-content:space-between; padding:5px 0;">
            <span>Utilizadas</span>
            ${editando ? `<input type="number" id="masarykUtilizadas" min="0" max="${entregadas}" value="${utilizadas}" style="width:70px; text-align:right;">` : `<b>${utilizadas}</b>`}
          </div>
          ${det.observaciones.length ? `
          <div style="margin-top:10px;">
            <div style="font-size:11px; font-weight:700; color:var(--sub); letter-spacing:.5px; margin-bottom:6px;">OBSERVACIONES (a quién se asignó)</div>
            ${det.observaciones.map((obs,i)=> editando
              ? `<input type="text" data-masaryk-obs="${i}" value="${(obs||'').replace(/"/g,'&quot;')}" placeholder="Nombre de quién recibió esta laptop" style="width:100%; margin-bottom:6px;">`
              : `<div style="padding:4px 0;">${obs || '<span style="color:var(--sub);">— sin capturar —</span>'}</div>`
            ).join('')}
          </div>` : ''}
          <div style="border-top:1px solid var(--line); margin-top:8px;"></div>
          <div style="display:flex; justify-content:space-between; padding:8px 0 2px;">
            <span style="font-weight:700; color:${color};">Total disponible</span><b style="color:${color};">${totalDisponible}</b>
          </div>
        <div class="foot" style="margin-top:2px;">Entregadas (${entregadas}) − Utilizadas (${utilizadas}) = ${totalDisponible}</div>
        </div>
      </div>
    `;
  }

  // ---------- Budget IT 2026 ----------
  const MESES_CORTOS_BI = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const CAPEX_MESES_BI = ['Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  function moneyIT(n){ return '$' + Math.round(n||0).toLocaleString('es-MX'); }
  // Para meses sin dato real (null) se muestra una proyección: promedio de los hasta 3 meses reales
  // más recientes anteriores a ese mes. No se guarda como dato real hasta que alguien lo edite.
  function budgetItValorMes(serie, i){
    if(serie[i]!==null && serie[i]!==undefined) return {valor:Number(serie[i]), esReal:true};
    let vals = [];
    for(let k=i-1; k>=0 && vals.length<3; k--){ if(serie[k]!==null && serie[k]!==undefined) vals.push(Number(serie[k])); }
    return {valor: vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0, esReal:false};
  }
  // Nota: los valores calculados (reales + proyectados) se guardan en un arreglo aparte (valoresPorVendor),
  // nunca sobre state.budget_it.opex directamente — así el objeto que se persiste en Firestore solo
  // contiene los datos reales que alguien capturó, sin caché de cálculos.
  function computeBudgetIT(){
    const data = state.budget_it;
    const valoresPorVendor = data.opex.map(v=> v.meses.map((_,i)=>budgetItValorMes(v.meses,i)));
    const monthlyActual = new Array(12).fill(0);
    valoresPorVendor.forEach(valores=> valores.forEach((o,i)=> monthlyActual[i]+=o.valor));
    const monthlyBudget = data.opex.reduce((s,v)=>s+Number(v.presupuesto_mes||0),0);
    const budgetSeries = new Array(12).fill(monthlyBudget);
    const janJunActual = monthlyActual.slice(0,6).reduce((a,b)=>a+b,0);
    const janJunBudget = monthlyBudget*6;
    const ahorroJanJun = janJunBudget - janJunActual;
    const opexAnnualProjected = monthlyActual.reduce((a,b)=>a+b,0);
    const opexAnnualBudget = monthlyBudget*12;
    const ahorroProyectado = opexAnnualBudget - opexAnnualProjected;
    // Solo los proyectos con la casilla "incluir" marcada entran al cálculo de CAPEX y a sus gráficas.
    const capexIncluidos = data.capex.filter(c=>c.incluir!==false);
    const capexBudget = capexIncluidos.reduce((s,c)=>s+Number(c.presupuesto||0),0);
    const capexEjecutado = capexIncluidos.reduce((s,c)=>s+Number(c.ejecutado||0),0);
    const capexPendiente = Math.max(capexBudget - capexEjecutado, 0);
    const totalPresupuestoAnual = opexAnnualBudget + capexBudget;
    const totalProyeccionAnual = opexAnnualProjected + capexEjecutado + capexPendiente;
    const ahorroTotalProyectado = totalPresupuestoAnual - totalProyeccionAnual;
    const catTotals = {};
    data.opex.forEach((v,vi)=>{
      const total6 = valoresPorVendor[vi].slice(0,6).reduce((a,o)=>a+o.valor,0);
      catTotals[v.categoria] = (catTotals[v.categoria]||0) + total6;
    });
    return {monthlyActual, monthlyBudget, budgetSeries, janJunActual, janJunBudget, ahorroJanJun,
      opexAnnualProjected, opexAnnualBudget, ahorroProyectado, capexBudget, capexEjecutado, capexPendiente,
      totalPresupuestoAnual, totalProyeccionAnual, ahorroTotalProyectado, catTotals, valoresPorVendor};
  }
