<title>PrimeMX · Directorio de Tiendas</title>

<style>
:root{
  --bg:#F4F6F5;
  --panel:#FFFFFF;
  --ink:#122031;
  --ink-soft:#4B5A6B;
  --line:#DCE3E2;
  --signal:#0C8599;
  --signal-dark:#0A6B79;
  --signal-soft:#E3F1F2;
  --ok:#1E8E5A;
  --ok-soft:#E6F5EC;
  --warn:#C6421B;
  --warn-soft:#FBE9E4;
  --radius:10px;
  --font-ui:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}

/* ===== LOGIN ===== */
#login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 15% 20%, rgba(12,133,153,0.10), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(12,133,153,0.08), transparent 45%),
    var(--bg);
}
.login-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:40px 36px;
  width:100%;
  max-width:380px;
  box-shadow:0 12px 40px rgba(18,32,49,0.08);
}
.login-signal{
  display:flex;
  gap:4px;
  align-items:flex-end;
  height:22px;
  margin-bottom:18px;
}
.login-signal span{
  width:6px;
  background:var(--signal);
  border-radius:2px;
  animation:pulseBar 1.6s ease-in-out infinite;
}
.login-signal span:nth-child(1){height:30%;animation-delay:0s;}
.login-signal span:nth-child(2){height:55%;animation-delay:.15s;}
.login-signal span:nth-child(3){height:80%;animation-delay:.3s;}
.login-signal span:nth-child(4){height:100%;animation-delay:.45s;}
@keyframes pulseBar{0%,100%{opacity:.4;}50%{opacity:1;}}
.login-card h1{
  font-size:20px;
  margin:0 0 2px;
  letter-spacing:-0.01em;
}
.login-card .sub{
  color:var(--ink-soft);
  font-size:13px;
  margin:0 0 26px;
}
.field{margin-bottom:14px;}
.field label{
  display:block;
  font-size:12px;
  font-weight:600;
  color:var(--ink-soft);
  margin-bottom:6px;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.field input, .field select{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:14px;
  background:#FAFBFB;
  color:var(--ink);
}
.field input:focus, .field select:focus{
  outline:2px solid var(--signal);
  outline-offset:1px;
  border-color:var(--signal);
}
.btn{
  border:none;
  border-radius:8px;
  padding:11px 18px;
  font-size:14px;
  font-weight:600;
  transition:transform .05s ease, opacity .15s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--signal);color:#fff;width:100%;}
.btn-primary:hover{background:var(--signal-dark);}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
.btn-ghost:hover{background:#F0F2F1;}
.btn-danger{background:var(--warn);color:#fff;}
.btn-danger:hover{opacity:.9;}
.login-error{
  background:var(--warn-soft);
  color:var(--warn);
  font-size:13px;
  padding:9px 12px;
  border-radius:8px;
  margin-bottom:14px;
  display:none;
}
.login-error.show{display:block;}
.login-hint{
  margin-top:18px;
  font-size:11.5px;
  color:#8B9AA5;
  line-height:1.5;
}

/* ===== APP SHELL ===== */
#app{display:none;min-height:100vh;flex-direction:column;}
#app.show{display:flex;}
header.topbar{
  background:var(--panel);
  border-bottom:1px solid var(--line);
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  position:sticky;
  top:0;
  z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{
  width:30px;height:30px;border-radius:8px;
  background:var(--signal);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--font-mono);font-weight:600;font-size:13px;
}
.brand h1{font-size:15px;margin:0;font-weight:700;}
.brand .brand-sub{font-size:11px;color:var(--ink-soft);margin:0;}
.user-chip{
  display:flex;align-items:center;gap:10px;
  font-size:13px;color:var(--ink-soft);
}
.role-tag{
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  padding:3px 8px;
  border-radius:20px;
  background:var(--signal-soft);
  color:var(--signal-dark);
}
.role-tag.admin{background:#FDEBD8;color:#A6560F;}

main{flex:1;padding:20px;max-width:1400px;margin:0 auto;width:100%;}

.stats-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
  margin-bottom:16px;
}
.stat-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px 14px;
}
.stat-card .num{font-family:var(--font-mono);font-size:22px;font-weight:600;}
.stat-card .lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}

/* Tiendas por carrier (oct. 2026): una fila de recuadros debajo de los indicadores; al hacer clic en uno
   se filtra la lista por ese carrier (y otro clic lo quita). */
.carrier-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
  margin-bottom:16px;
}
.carrier-card{
  position:relative;
  overflow:hidden;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:10px 14px 10px 18px;
  cursor:pointer;
}
.carrier-card:hover{border-color:var(--ink-soft);}
.carrier-card.sel{border-color:var(--signal);box-shadow:0 0 0 2px var(--signal-soft);}
.carrier-card .bar{position:absolute;left:0;top:0;bottom:0;width:5px;}
.carrier-card .nom{font-size:12px;font-weight:600;color:var(--ink-soft);}
.carrier-card .num{font-family:var(--font-mono);font-size:24px;font-weight:600;line-height:1.2;}
.carrier-card .sub{font-size:11px;color:var(--ink-soft);}

.toolbar{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:16px;
  align-items:center;
}
.search-box{
  flex:1 1 220px;
  position:relative;
}
.search-box input{
  width:100%;
  padding:10px 12px 10px 34px;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:13.5px;
  background:#FAFBFB;
}
.search-box::before{
  content:'⌕';
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--ink-soft);font-size:16px;
}
.filter-select{
  padding:10px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:13px;
  background:#FAFBFB;
  color:var(--ink);
  min-width:130px;
}
.toolbar .spacer{flex:1;}
.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;}

.result-count{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-bottom:10px;
}

/* Cards grid */
.store-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:12px;
}
.store-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  cursor:pointer;
  transition:border-color .12s ease, box-shadow .12s ease;
}
.store-card:hover{
  border-color:var(--signal);
  box-shadow:0 4px 14px rgba(18,32,49,0.07);
}
.store-card .row-top{
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;
}
.store-card .cc{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--signal-dark);
  background:var(--signal-soft);
  padding:2px 7px;
  border-radius:5px;
  font-weight:600;
}
.status-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;
}
.status-dot.on{background:var(--ok);}
.status-dot.off{background:var(--warn);}
.store-card .plaza{
  font-size:14px;font-weight:600;margin:0 0 4px;line-height:1.3;
}
.store-card .meta{
  font-size:12px;color:var(--ink-soft);
  display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;
}
.meta-tag{
  background:#EFF2F1;
  border-radius:5px;
  padding:2px 7px;
  font-size:11px;
}
.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--ink-soft);
}
.empty-state .big{font-size:32px;margin-bottom:8px;}

.pagination{
  display:flex;justify-content:center;align-items:center;gap:10px;
  margin-top:20px;padding-bottom:30px;
  font-size:13px;color:var(--ink-soft);
}
.pagination button{
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:6px 12px;font-size:13px;
}
.pagination button:disabled{opacity:.4;cursor:not-allowed;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(18,32,49,0.45);
  display:none;align-items:center;justify-content:center;
  padding:16px;z-index:100;
}
.modal-overlay.show{display:flex;}
.modal{
  background:var(--panel);
  border-radius:14px;
  max-width:560px;width:100%;
  max-height:90vh;overflow-y:auto;
  padding:26px;
}
.modal h2{margin:0 0 4px;font-size:18px;}
.modal .modal-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 20px;}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-grid .full{grid-column:1/-1;}
.modal-grid .field label{font-size:11px;}
.modal-actions{
  display:flex;justify-content:flex-end;gap:10px;margin-top:22px;
}
.detail-row{
  display:flex;justify-content:space-between;gap:14px;
  padding:9px 0;border-bottom:1px solid var(--line);
  font-size:13.5px;
}
.detail-row:last-child{border-bottom:none;}
.fallas-section{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;}
.fallas-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.fallas-title-row h3{font-size:13.5px;margin:0;font-weight:700;color:var(--ink);}
.falla-card{border-radius:9px;padding:10px 12px;margin-bottom:8px;}
.falla-card.abierta{background:var(--warn-soft);}
.falla-card.cerrada{background:var(--ok-soft);}
.falla-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.falla-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff;text-transform:uppercase;}
.falla-badge.abierta{background:var(--warn);}
.falla-badge.cerrada{background:var(--ok);}
.falla-tipo{font-size:12.5px;font-weight:600;color:var(--ink);margin-top:5px;}
.falla-fecha{font-size:11px;color:var(--ink-soft);white-space:nowrap;}
.falla-meta{display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--ink-soft);flex-wrap:wrap;}
.falla-cierre-row{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.falla-cierre-row input{font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:3px 6px;}
.falla-cierre-row button{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:4px 9px;cursor:pointer;}
.falla-form{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px;}
.falla-form .field{margin-bottom:8px;}
.falla-form label{font-size:11px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:3px;}
.falla-form input,.falla-form select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;}
.falla-empty{font-size:12.5px;color:var(--ink-soft);padding:6px 0;}
.report-modal{max-width:1180px !important;width:calc(100% - 32px) !important;}
.report-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
.report-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:border-color .12s ease;}
.report-card:hover{border-color:var(--signal);}
.report-card.active{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal);}
.report-card .num{font-family:var(--font-mono);font-size:22px;font-weight:600;}
.report-card .lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
.report-table-wrap{overflow-x:auto;}
.report-table{width:100%;font-size:12px;border-collapse:collapse;table-layout:auto;}
.report-table th{padding:7px 8px;text-align:left;color:var(--ink-soft);border-bottom:1px solid var(--line);white-space:nowrap;}
.report-table td{padding:7px 8px;border-top:1px solid var(--line);word-break:break-word;}
.report-table td.num-cell,.report-table th.num-cell{text-align:center;}
.report-table td.total-cell{text-align:right;font-weight:600;}
.report-table input[type="date"]{width:118px;}
.report-table button{white-space:nowrap;}
.detail-row .k{color:var(--ink-soft);}
.detail-row .v{font-weight:500;text-align:right;}
.detail-row .v.mono{font-family:var(--font-mono);font-size:12.5px;}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;
  font-size:13px;opacity:0;transition:all .25s ease;z-index:200;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{background:var(--warn);}
.toast.ok{background:var(--ok);}

@media (max-width:640px){
  header.topbar{padding:12px 14px;}
  .brand h1{font-size:13.5px;}
  main{padding:14px;}
  .modal-grid{grid-template-columns:1fr;}
  .toolbar-actions{width:100%;}
  .toolbar-actions .btn{flex:1;}
}
</style>
</head>

<script>
/* ══════════════════ CONFIGURACIÓN FIREBASE ══════════════════
   1. Ve a https://console.firebase.google.com
   2. Crea un proyecto → activa Firestore Database (modo de prueba)

const firebaseConfig = {
  apiKey: "AIzaSyCIQGZGwNEw3vAlL4clGVbClLYCcUy3CYU",

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const COLLECTION = "tiendas";
const ROLES_COLLECTION = "usuarios";
const ESTRUCTURA_HIST_COLLECTION = "estructura_regional_historial";

/* ══════════════════ USUARIOS Y ROLES ══════════════════
   Las contraseñas YA NO viven en este archivo: se dan de alta en
   Firebase Authentication (Consola → Authentication → Users).
   El usuario escribe solo su nombre de usuario (ej. "asanchez"); la app
   arma el correo internamente como usuario@AUTH_DOMAIN para iniciar sesión.
   El rol (admin/consulta) de cada usuario se lee de la colección
   "usuarios" en Firestore, usando el nombre de usuario como ID de documento.
   Ver el README para el paso a paso de cómo dar de alta cada persona.     */
const AUTH_DOMAIN = "primecomms.mx";

/* ══════════════════ DATOS INICIALES (SEMILLA) ══════════════════
   Ya no trae datos (ver SEED_DATA): si `tiendas` estuviera vacia hay que importarla con Admin SDK, no desde el navegador.     */
const SEED_DATA = []; // (28-oct-2026) Se vaciaron los 631 registros de la semilla: eran datos de tiendas y correos de gerentes visibles en GitHub Pages sin login. La coleccion `tiendas` ya vive en Firestore.

/* ══════════════════ ESTADO ══════════════════ */
let currentUser = null;
let allStores = [];      // [{id, ...fields}]
let filtered = [];
let page = 1;
const PAGE_SIZE = 24;
let editingId = null;    // id en edición, null = alta nueva

/* ══════════════════ UTILIDADES ══════════════════ */
function toast(msg, type=""){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(()=> el.className = 'toast', 2500);
}
function esc(v){
  // Escapa también & > " ' (antes solo <): sirve dentro de atributos (data-id="...", value="...") — revisión de seguridad 5-nov-2026.
  return (v===undefined||v===null) ? '' : String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Color de contorno de la tarjeta según el proveedor de servicio (carrier)
function getCarrierBorderColor(carrier){
  const c = String(carrier||'').toUpperCase();
  if(c.includes('TELMEX')) return '#3B82F6';               // azul
  if(c.includes('TOTALPLAY')) return '#9333EA';            // morado
  if(c.includes('MEGA') || c.includes('METRO')) return '#22C55E'; // verde
  if(c.includes('STARLINK') || c.includes('STARLIK')) return '#000000'; // negro
  return null; // sin contorno especial
}

function fieldLabelMap(){
  return {
    plaza:'Plaza', cc:'Centro de Costo', hostname:'HostName', cve_pdv:'Clave PDV', pos_id:'POS ID',
    carrier:'Carrier', tecnologia:'Tecnología', clasificacion:'Clasificación',
    vigencia_servicio:'Vigencia del servicio',
    origen:'Origen', activo:'Estatus', direccion:'Dirección',
    region:'Región', gerente_regional:'Gerente Regional', director:'Director',
    gerente_tienda:'Gerente de Tienda', correo_gerente:'Correo', fecha_apertura:'Fecha Apertura',
    latitud:'Latitud', longitud:'Longitud', observaciones:'Observaciones'
  };
}
// Campos que se muestran en el detalle de solo-lectura (cc se usa internamente para
// identificar/buscar tiendas, pero no se despliega como fila en el detalle)
const DETAIL_FIELDS = ['plaza','cc','hostname','cve_pdv','pos_id','carrier',
  'tecnologia','clasificacion','observaciones','vigencia_servicio','origen','activo','direccion',
  'region','gerente_regional','director','gerente_tienda','correo_gerente','fecha_apertura',
  'latitud','longitud'];

// Observaciones de acceso según la clasificación de la tienda
function getObservaciones(clasificacion){
  const c = String(clasificacion||'').toUpperCase();
  if(c === 'POWER CENTER' || c === 'CENTRO COMERCIAL'){
    return 'En esta tienda es necesario pedir el permiso a la administración para que el proveedor pueda ir a revisar la falla, se requiere acceso a azotea, pasillos, ductos, escaleras, estacionamientos, etc.';
  }
  if(c === 'PIE DE CALLE'){
    return 'No se necesitan permisos para el acceso.';
  }
  return '—';
}

/* ══════════════════ LOGIN ══════════════════ */
document.getElementById('login-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const u = document.getElementById('login-user').value.trim().toLowerCase();
  const p = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  try{
    await auth.signInWithEmailAndPassword(u + '@' + AUTH_DOMAIN, p);
    errEl.classList.remove('show');
    localStorage.setItem('primemx_sesion_inicio', String(Date.now()));
    // el resto (mostrar la app, cargar el rol) lo dispara onAuthStateChanged
  }catch(err){
    console.error(err);
    errEl.textContent = 'Usuario o contraseña incorrectos.';
    errEl.classList.add('show');
  }
  submitBtn.disabled = false;
});

document.getElementById('logout-btn').addEventListener('click', function(){
  localStorage.removeItem('primemx_sesion_inicio');
  auth.signOut();
});

// Caducidad de sesión (agosto 2026, pedido explícito del cliente — reemplaza la nota anterior de que
// esto se había quitado): 10 horas desde que se inició sesión, sin importar actividad. El timestamp
// (primemx_sesion_inicio) es compartido con Dashboard y Consumibles (mismo origen/localStorage).
const SESION_DURACION_MS = 10 * 60 * 60 * 1000;
function sesionExpirada(){
  const inicio = Number(localStorage.getItem('primemx_sesion_inicio') || 0);
  // Sin marca de tiempo todavía NO cuenta como vencida (bug real, sept. 2026): ver dashboard.html para
  // el detalle completo de la carrera entre onAuthStateChanged y el guardado de la marca al iniciar sesión.
  if(!inicio) return false;
  return (Date.now() - inicio) > SESION_DURACION_MS;
}
setInterval(()=>{
  if(currentUser && sesionExpirada()){
    localStorage.removeItem('primemx_sesion_inicio');
    auth.signOut();
    toast('Tu sesión expiró después de 10 horas. Vuelve a iniciar sesión.', 'error');
  }
}, 5 * 60 * 1000);

// Se dispara automáticamente al iniciar sesión, cerrar sesión, o al cargar
// la página si Firebase recuerda una sesión activa.
auth.onAuthStateChanged(async function(user){
  if(user && sesionExpirada()){
    localStorage.removeItem('primemx_sesion_inicio');
    auth.signOut();
    return;
  }
  if(user && !localStorage.getItem('primemx_sesion_inicio')){
    localStorage.setItem('primemx_sesion_inicio', String(Date.now()));
  }
  if(user){
    const username = (user.email || '').split('@')[0];
    let roleInfo = { role: 'consulta', label: username };
    try{
      const doc = await db.collection(ROLES_COLLECTION).doc(username).get();
      if(doc.exists){
        roleInfo = { role: doc.data().role || 'consulta', label: doc.data().label || username };
      }
    }catch(err){
      console.error('No se pudo leer el rol del usuario', err);
    }
    currentUser = { username, role: roleInfo.role, label: roleInfo.label };
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('show');
    initApp();
    const enlaceDashboard = document.getElementById('link-a-dashboard');
    if(enlaceDashboard) enlaceDashboard.style.display = (currentUser.username === 'marafic') ? 'none' : '';
  } else {
    currentUser = null;
    document.getElementById('app').classList.remove('show');
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-pass').value = '';
  }
});

async function ensureSeed(){
  try{
    const snap = await db.collection(COLLECTION).limit(1).get();
    if(snap.empty && SEED_DATA.length){
      toast('Cargando datos iniciales, un momento...');
      const batchSize = 400;
      for(let i=0;i<SEED_DATA.length;i+=batchSize){
        const batch = db.batch();
        SEED_DATA.slice(i,i+batchSize).forEach(item=>{
          const ref = db.collection(COLLECTION).doc();
          batch.set(ref, item);
        });
        await batch.commit();
      }
      toast('Datos iniciales cargados', 'ok');
    }
  }catch(err){
    console.error(err);
    toast('No se pudo conectar a la base de datos. Revisa tu firebaseConfig.', 'error');
  }
}

async function loadStores(){
  try{
    const snap = await db.collection(COLLECTION).get();
    allStores = snap.docs.map(d=>({id:d.id, ...d.data()}));

function populateFilterOptions(){

// Un mismo carrier puede venir escrito distinto en el catálogo ("MEGA CABLE" / "MEGACABLE", "STARLIK" /
// "STARLINK"): para contar y filtrar se compara por esta clave, sin espacios ni mayúsculas.
function normCarrier(v){
  const k = String(v||'').toUpperCase().replace(/\s+/g,'');
  return k === 'STARLIK' ? 'STARLINK' : k;
}
// Escritura ESTÁNDAR del carrier (oct. 2026): MEGACABLE y STARLINK. Corrige las variantes conocidas ("MEGA CABLE",
// "Mega Cable", "STARLIK"...) y deja igual cualquier otro valor. Se usa al guardar una tienda y en "Actualizar catálogo".
function carrierEstandar(v){
  const t = String(v==null?'':v).trim();
  const k = normCarrier(t);
  return ['TOTALPLAY','TELMEX','MEGACABLE','STARLINK'].includes(k) ? k : t;
}
const CARRIERS_FILA = [
  { key:'TOTALPLAY', nombre:'TotalPlay', color:'#6600CC' },
  { key:'TELMEX',    nombre:'Telmex',    color:'#29B6F6' },
  { key:'MEGACABLE', nombre:'Megacable', color:'#92D050' },
  { key:'STARLINK',  nombre:'Starlink',  color:'#000000' }
];
function renderCarrierRow(){
  const cuenta = {};
  allStores.forEach(s=>{
    const k = normCarrier(s.carrier);
    if(!k) return;
    if(!cuenta[k]) cuenta[k] = { total:0, activas:0, raw:s.carrier };
    cuenta[k].total++;
    if(String(s.activo)==='1') cuenta[k].activas++;
  });
  const conocidos = new Set(CARRIERS_FILA.map(c=>c.key));
  const lista = CARRIERS_FILA.concat(Object.keys(cuenta).filter(k=>!conocidos.has(k)).map(k=>({ key:k, nombre:cuenta[k].raw, color:'#9AA5B1' })));
  document.getElementById('carrier-row').innerHTML = lista.map(c=>{
    const n = cuenta[c.key] || { total:0, activas:0, raw:c.nombre };
    return `<div class="carrier-card" data-carrier-key="${esc(c.key)}" data-carrier-raw="${esc(n.raw)}" title="Ver las tiendas activas de ${esc(c.nombre)}">
      <span class="bar" style="background:${c.color}"></span>
      <div class="nom">${esc(c.nombre)}</div>
      <div class="num">${n.activas}</div>
      <div class="sub">${n.activas===1?'activa':'activas'}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.carrier-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      // El recuadro cuenta solo tiendas activas, así que el clic filtra carrier + Estatus "Activo" para que
      // la lista tenga el mismo número; el segundo clic quita los dos filtros.
      const sel = document.getElementById('filter-carrier');
      const yaActivo = normCarrier(sel.value) === el.dataset.carrierKey;
      sel.value = yaActivo ? '' : el.dataset.carrierRaw;
      document.getElementById('filter-activo').value = yaActivo ? '' : '1';
      page = 1; applyFilters();
    });
  });
  marcarCarrierActivo();
}
function marcarCarrierActivo(){
  const k = normCarrier(document.getElementById('filter-carrier').value);
  document.querySelectorAll('.carrier-card').forEach(el=>el.classList.toggle('sel', !!k && el.dataset.carrierKey === k));
}

function renderStats(){
  const total = allStores.length;
  const activas = allStores.filter(s=>String(s.activo)==='1').length;
  const inactivas = total - activas;
  const carriers = new Set(allStores.map(s=>normCarrier(s.carrier)).filter(Boolean)).size;

function applyFilters(){
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const fCarrier = document.getElementById('filter-carrier').value;
  const fTecnologia = document.getElementById('filter-tecnologia').value;
  const fClasif = document.getElementById('filter-clasif').value;
  const fOrigen = document.getElementById('filter-origen').value;
  const fActivo = document.getElementById('filter-activo').value;
  const fRegion = document.getElementById('filter-region').value;
  const fDirector = document.getElementById('filter-director').value;
  marcarCarrierActivo();

  filtered = allStores.filter(s=>{
    if(fCarrier && normCarrier(s.carrier) !== normCarrier(fCarrier)) return false;
    if(fTecnologia && s.tecnologia !== fTecnologia) return false;
    if(fClasif && s.clasificacion !== fClasif) return false;
    if(fOrigen && s.origen !== fOrigen) return false;
    if(fActivo !== '' && String(s.activo) !== fActivo) return false;
    if(fRegion && s.region !== fRegion) return false;
    if(fDirector && s.director !== fDirector) return false;
    if(q){
      const hay = [s.cc,s.plaza,s.hostname,s.direccion,s.cve_pdv,s.cve_inventario,s.pos_id,s.region,s.gerente_regional,s.director,s.gerente_tienda,s.correo_gerente,s.fecha_apertura]
        .map(v=>String(v||'').toLowerCase()).join(' ');
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  renderGrid();
}

        ${tiendasConFallaAbierta.has(s.id) ? `<span style="font-size:10.5px; font-weight:700; color:#fff; letter-spacing:.3px; background:#C0392B; border-radius:6px; padding:2px 8px;">ABIERTO</span>` : ''}
        <span class="status-dot ${String(s.activo)==='1' ? 'on':'off'}" title="${String(s.activo)==='1'?'Activo':'Inactivo'}"></span>
      </div>
      <p class="plaza">${esc(s.plaza||'Sin nombre')}</p>
      <div class="meta">
        ${s.region ? `<span class="meta-tag">${esc(s.region)}</span>`:''}
        ${s.carrier ? `<span class="meta-tag">${esc(s.carrier)}</span>`:''}
        ${s.clasificacion ? `<span class="meta-tag">${esc(s.clasificacion)}</span>`:''}
        ${s.hostname ? `<span class="meta-tag">${esc(s.hostname)}</span>`:''}

  grid.querySelectorAll('.store-card').forEach(card=>{

  document.getElementById('prev-page')?.addEventListener('click', ()=>{page--; renderGrid();});
  document.getElementById('next-page')?.addEventListener('click', ()=>{page++; renderGrid();});
}

// Solo el admin y el usuario marafic pueden registrar fallas / poner fecha de cierre
function canManageFallas(){
  return currentUser.role === 'admin' || currentUser.username === 'marafic';
}

function fallasRef(storeId){
  return db.collection(COLLECTION).doc(storeId).collection('fallas');
}

function fmtFechaHora(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yyyy} ${hh}:${mi}`;
}

// Validación central para cerrar una falla (agosto 2026) — antes el campo de cierre era type="date"
// (solo día) y se guardaba tal cual: un string "YYYY-MM-DD" se interpreta como medianoche UTC, que en
// hora de México se ve como las 6pm del día ANTERIOR (de ahí que "Tardó en cerrarse" saliera negativo
// en el calendario de Dashboard IT). Ahora el campo es datetime-local (día y hora reales); new Date()
// sobre un string sin zona horaria sí lo toma como hora local, sin ese corrimiento.
// Devuelve {ok:false} sin toast si valorDatetimeLocal viene vacío (para que cada llamador decida qué
// hacer con "vacío" — en unos casos es error, en el formulario de editar es "reabrir la falla").
function fechaCierreDesdeInput(valorDatetimeLocal, fechaCapturaISO){
  if(!valorDatetimeLocal) return {ok:false};
  const cierre = new Date(valorDatetimeLocal);
  if(isNaN(cierre)){ toast('Fecha de cierre inválida.', 'error'); return {ok:false, error:true}; }
  const captura = new Date(fechaCapturaISO);
  if(!isNaN(captura) && cierre < captura){
    toast('La fecha de cierre no puede ser anterior a la fecha de alta.', 'error');
    return {ok:false, error:true};
  }
  return {ok:true, iso: cierre.toISOString()};
}

// Corrección masiva de cierres de agosto 2026 (agosto 2026, a petición explícita del cliente) —
// exclusiva de amartinez. Busca fallas cuyo fecha_cierre siga guardado con el formato viejo (un string
// "YYYY-MM-DD" de solo fecha, sin hora — la señal inequívoca del bug: nunca se genera así desde el
// arreglo de hoy, que siempre guarda un ISO completo). Para esas, reconstruye el día EXACTO que se
// había escrito a mano (leyendo el string tal cual, sin pasar por new Date() que lo correría un día por
// la zona horaria) y le pone las 18:01 hora de México como referencia — no se inventa la hora real,
// solo se corrige el día.
function esAmartinez(){
  return !!(typeof currentUser !== 'undefined' && currentUser && currentUser.username === 'amartinez');
}

async function abrirFixCierresAgosto(){
  toast('Buscando fallas de agosto con el formato de cierre viejo...');
  let snap;
  try{
    snap = await db.collectionGroup('fallas').get();
  }catch(err){
    console.error(err);
    toast('No se pudo leer las fallas.', 'error');
    return;
  }
  const corregibles = [];
  const revisarManual = [];
  snap.forEach(doc=>{
    const f = doc.data();
    if(typeof f.fecha_cierre !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(f.fecha_cierre)) return;
    const captura = new Date(f.fecha_captura);
    if(isNaN(captura) || captura.getFullYear()!==2026 || captura.getMonth()!==7) return; // solo agosto 2026
    const [y, m, d] = f.fecha_cierre.split('-').map(Number);
    const corregido = new Date(y, m-1, d, 18, 1, 0); // día tal cual se guardó, 18:01 hora de México
    const storeId = doc.ref.parent.parent.id;
    const store = allStores.find(s=>s.id===storeId);
    const item = {
      ref: doc.ref,
      plaza: store?.plaza || 'Tienda no encontrada',
      ticket: f.ticket || '—',
      capturaTexto: fmtFechaHora(f.fecha_captura),
      viejoTexto: fmtFechaHora(f.fecha_cierre),
      nuevoIso: corregido.toISOString(),
      nuevoTexto: fmtFechaHora(corregido.toISOString())
    };
    if(corregido < captura) revisarManual.push(item);
    else corregibles.push(item);
  });
  mostrarPreviewFixCierres(corregibles, revisarManual);
}

function mostrarPreviewFixCierres(corregibles, revisarManual){
  document.getElementById('modal-content').innerHTML = `
    <h2>Corregir horas de cierre — agosto 2026</h2>

function toggleFallaForm(storeId){
  const wrap = document.getElementById('falla-form-wrap');
  if(!wrap) return;
  if(wrap.innerHTML.trim() !== ''){
    wrap.innerHTML = '';
    return;
  }
  const isAdmin = currentUser.role === 'admin';
  // Valor por defecto para el campo de fecha/hora: ahora mismo, en formato compatible con input datetime-local
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const nowLocal = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;

  wrap.innerHTML = `
    <div class="falla-form">
      <div class="field">
        <label>Tipo de falla</label>
        <select id="new-falla-tipo">
          <option value="Sin servicio">Sin servicio</option>
          <option value="Falla de velocidad">Falla de velocidad</option>
        </select>
      </div>
      <div class="field">
        <label>Folio de Proveedor *</label>
        <input type="text" id="new-falla-folio">
      </div>
      <div class="field">
        <label>Ticket *</label>
        <input type="text" id="new-falla-ticket">
      </div>
      ${isAdmin ? `
      <div class="field">
        <label>Fecha y hora de captura</label>
        <input type="datetime-local" id="new-falla-fecha" value="${nowLocal}">
      </div>` : ''}
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn btn-ghost" id="cancel-falla-btn" style="padding:7px 12px;font-size:12.5px;">Cancelar</button>
        <button class="btn btn-primary" id="save-falla-btn" style="padding:7px 14px;font-size:12.5px;">Guardar</button>
      </div>
    </div>`;
  document.getElementById('cancel-falla-btn').addEventListener('click', ()=>{ wrap.innerHTML=''; });
  document.getElementById('save-falla-btn').addEventListener('click', async ()=>{
    const tipo = document.getElementById('new-falla-tipo').value;
    const folio = document.getElementById('new-falla-folio').value.trim();
    const ticket = document.getElementById('new-falla-ticket').value.trim();
    if(!folio || !ticket){
      toast('El Folio del proveedor y el Ticket son obligatorios para guardar.', 'error');
      return;
    }
    // No se puede registrar una falla nueva si esta tienda ya tiene una sin cerrar —
    // así evitamos contar dos veces la misma caída mientras no se resuelva la anterior.
    try{
      const abiertasSnap = await fallasRef(storeId).where('fecha_cierre', '==', null).get();
      if(!abiertasSnap.empty){
        toast('Esta tienda ya tiene un ticket sin cerrar. Cierra el anterior antes de registrar uno nuevo.', 'error');
        return;
      }
    }catch(err){
      console.error('No se pudo verificar si hay una falla abierta', err);
      toast('No se pudo verificar si hay una falla abierta. Intenta de nuevo.', 'error');
      return;
    }
    // Solo el admin puede elegir una fecha distinta a "ahora"; para marafic y demás
    // usuarios la fecha de captura sigue siendo automática, como antes.
    let fechaCaptura = new Date().toISOString();
    if(isAdmin){
      const fechaInput = document.getElementById('new-falla-fecha').value;
      if(fechaInput){
        const parsed = new Date(fechaInput);
        if(!isNaN(parsed)) fechaCaptura = parsed.toISOString();
      }
    }
    try{
      await fallasRef(storeId).add({
        tipo,
        folio_proveedor: folio,
        ticket,
        fecha_captura: fechaCaptura,
        fecha_cierre: null,
        capturado_por: currentUser.username
      });
      toast('Falla registrada', 'ok');
      wrap.innerHTML = '';
      await refrescarFallasAbiertasYGrid();
      loadAndRenderFallas(storeId);
    }catch(err){
      console.error(err);
      toast('Error al registrar la falla','error');
    }
  });
}

let allFallasRecords = [];

async function loadFallasReport(){
  const cardsEl = document.getElementById('report-cards');
  try{
    const snap = await db.collectionGroup('fallas').get();
    const now = new Date();
    const year = now.getFullYear();
    const mesActual = now.getMonth();
    const registrosCrudos = [];
    snap.forEach(doc=>{
      const data = doc.data();
      const fecha = new Date(data.fecha_captura);
      if(isNaN(fecha) || fecha.getFullYear() !== year) return;
      const storeId = doc.ref.parent.parent.id;
      const store = allStores.find(s=>s.id===storeId);
      registrosCrudos.push({
        id: doc.id,
        storeId,
        plaza: store?.plaza || 'Tienda no encontrada',
        carrier: store?.carrier || 'Sin carrier',
        tecnologia: store?.tecnologia || '',
        month: fecha.getMonth(),
        tipo: data.tipo || '',
        folio_proveedor: data.folio_proveedor || '',
        ticket: data.ticket || '',
        fecha_captura: data.fecha_captura,
        fecha_cierre: data.fecha_cierre || null
      });
    });
    allFallasRecords = registrosCrudos; // se usa para el buscador de ticket/folio, sin congelar

    // Meses ya cerrados (antes del mes actual) quedan congelados para siempre: la primera
    // vez que se abre el reporte después de que un mes cerró, se guarda un "snapshot" fijo
    // en Firestore; de ahí en adelante ese mes ya no se recalcula ni cambia, aunque después
    // se edite o borre una falla.
    const records = registrosCrudos.filter(r=>r.month === mesActual);
    for(let m=0; m<mesActual; m++){
      const docId = `${year}-${m}`;
      const congeladoRef = db.collection('reportes_mensuales_fallas').doc(docId);
      let congelado;
      try{
        const congeladoSnap = await congeladoRef.get();
        congelado = congeladoSnap.exists ? congeladoSnap.data().registros : null;
      }catch(e){ congelado = null; }
      if(!congelado){
        const delMes = registrosCrudos.filter(r=>r.month === m);
        const agrupado = {};
        delMes.forEach(r=>{
          const key = r.storeId;
          if(!agrupado[key]) agrupado[key] = {storeId:r.storeId, plaza:r.plaza, carrier:r.carrier, tecnologia:r.tecnologia, month:m, count:0};
          agrupado[key].count++;
        });
        congelado = Object.values(agrupado);
        try{ await congeladoRef.set({ registros: congelado, congelado_en: new Date().toISOString() }); }
        catch(e){ console.error('No se pudo congelar el mes', docId, e); }
      }
      records.push(...congelado);
    }

    const ORDEN_CARRIERS = ['TOTALPLAY','TELMEX','MEGACABLE','STARLINK'];
    function normalizarCarrier(c){
      return String(c||'').toUpperCase().replace(/[^A-Z]/g,''); // quita espacios/acentos/símbolos
    }
    function claveOrden(c){
      const n = normalizarCarrier(c);
      if(n.startsWith('TOTALPLAY')) return 0;
      if(n.startsWith('TELMEX')) return 1;
      if(n.startsWith('MEGA')) return 2;
      if(n.startsWith('STARLI')) return 3; // cubre "STARLINK" y la variante "STARLIK"
      return 99;
    }
    const carriers = [...new Set(allStores.map(s=>s.carrier).filter(Boolean))]
      .sort((a,b)=>{
        const ka = claveOrden(a), kb = claveOrden(b);
        if(ka !== kb) return ka - kb;
        return a.localeCompare(b);
      });
    const countsByCarrier = {};
    carriers.forEach(c=> countsByCarrier[c] = 0);
    records.forEach(r=>{ if(countsByCarrier[r.carrier] !== undefined) countsByCarrier[r.carrier] += (r.count || 1); });

    cardsEl.innerHTML = carriers.map(c=>`
      <div class="report-card" data-carrier="${esc(c)}">
        <div class="num" style="${countsByCarrier[c]>0?'color:var(--warn)':''}">${countsByCarrier[c]}</div>
        <div class="lbl">Fallas ${esc(c)}</div>
      </div>
    `).join('');

    renderTodosLosCarriers(carriers, records);
  }catch(err){
    console.error(err);
    cardsEl.innerHTML = '<p class="falla-empty">No se pudo cargar el reporte de fallas.</p>';
  }
}

function renderTodosLosCarriers(carriers, records){
  const detailEl = document.getElementById('report-detail');
  const carriersConFallas = carriers.filter(c=> records.some(r=>r.carrier===c));
  if(!carriersConFallas.length){
    detailEl.innerHTML = '<p class="falla-empty">No hay fallas registradas este año.</p>';
    return;
  }
  detailEl.innerHTML = carriersConFallas.map(c=>`
    <h3 style="margin-top:20px;">Reporte Mensual ${esc(c)}</h3>
    <div id="report-detail-${esc(c).replace(/\s+/g,'_')}"></div>
  `).join('');
  carriersConFallas.forEach(c=>{
    renderCarrierDetail(c, records, `report-detail-${c.replace(/\s+/g,'_')}`);
  });
}

function renderCarrierDetail(carrier, records, targetId){
  const detailEl = document.getElementById(targetId || 'report-detail');
  if(!detailEl) return;
  const filtered = records.filter(r=>r.carrier === carrier);
  if(filtered.length === 0){
    detailEl.innerHTML = `<p class="falla-empty">Sin fallas registradas para ${esc(carrier)} este año.</p>`;
    return;
  }
  const byStore = {};
  filtered.forEach(r=>{
    if(!byStore[r.storeId]){
      byStore[r.storeId] = {plaza:r.plaza, carrier:r.carrier, tecnologia:r.tecnologia, months:Array(12).fill(0)};
    }
    byStore[r.storeId].months[r.month] += (r.count || 1);
  });
  const rows = Object.values(byStore).map(row=>({...row, total: row.months.reduce((a,b)=>a+b,0)}));
  rows.sort((a,b)=> b.total - a.total);

  const monthHeaders = MESES.map(m=>`<th class="num-cell">${m}</th>`).join('');
  const bodyRows = rows.map((row,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${esc(row.plaza)}</td>
      <td>${esc(row.carrier)}</td>
      <td>${esc(row.tecnologia)}</td>
      ${row.months.map(v=>`<td class="num-cell">${v>0?v:'-'}</td>`).join('')}
      <td class="total-cell">${row.total}</td>
    </tr>
  `).join('');

  detailEl.innerHTML = `
    <div class="report-table-wrap">
      <table class="report-table">
        <thead><tr>
          <th>#</th><th>Tienda</th><th>Carrier</th><th>Tecnología</th>
          ${monthHeaders}
          <th class="num-cell">Total</th>
        </tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>
  `;
}

            <td>${cierreCell}</td>

          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>
  `;

  resultsEl.querySelectorAll('.btn-guardar-cierre-search').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        await fallasRef(btn.dataset.store).doc(btn.dataset.id).update({fecha_cierre: new Date().toISOString()});
        toast('Falla cerrada', 'ok');
        await refrescarFallasAbiertasYGrid();
        await loadFallasReport();
        renderFallaSearchResults();
      }catch(err){
        console.error(err);
        toast('Error al guardar la fecha de cierre','error');
      }
    });
  });
  resultsEl.querySelectorAll('.btn-editar-falla').forEach(btn=>{
    btn.addEventListener('click', ()=> openEditFallaForm(btn.dataset.store, btn.dataset.id));
  });
  resultsEl.querySelectorAll('.btn-eliminar-falla').forEach(btn=>{
    btn.addEventListener('click', ()=> confirmDeleteFalla(btn.dataset.store, btn.dataset.id));
  });
}

  // Ojo al revisar un registro viejo: si su fecha_cierre todavía viene del formato con el bug (solo

  // descrito arriba en fechaCierreDesdeInput) — bórralo y escribe la fecha y hora reales de cierre.
  const dCierre = f.fecha_cierre ? new Date(f.fecha_cierre) : null;
  const cierreLocal = (dCierre && !isNaN(dCierre)) ? `${dCierre.getFullYear()}-${pad(dCierre.getMonth()+1)}-${pad(dCierre.getDate())}T${pad(dCierre.getHours())}:${pad(dCierre.getMinutes())}` : '';

  editOverlay.innerHTML = `
    <div class="modal">

      <div class="field">
        <label>Tipo de falla</label>

          <option value="Falla de velocidad" ${f.tipo==='Falla de velocidad'?'selected':''}>Falla de velocidad</option>
        </select>
      </div>
      <div class="field">
        <label>Folio de Proveedor</label>
        <input type="text" id="edit-falla-folio" value="${esc(f.folio_proveedor)}">
      </div>
      <div class="field">
        <label>Ticket</label>
        <input type="text" id="edit-falla-ticket" value="${esc(f.ticket)}">
      </div>
      <div class="field">
        <label>Fecha y hora de captura</label>
        <input type="datetime-local" id="edit-falla-fecha" value="${fechaLocal}">
      </div>
      <div class="field">
        <label>Fecha y hora de cierre (dejar vacío si sigue abierta)</label>
        <input type="datetime-local" id="edit-falla-cierre" value="${cierreLocal}">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancel-edit-falla-btn">Cancelar</button>
        <button class="btn btn-primary" id="save-edit-falla-btn">Guardar cambios</button>
      </div>
    </div>`;
  document.body.appendChild(editOverlay);
  document.getElementById('cancel-edit-falla-btn').addEventListener('click', ()=> editOverlay.remove());
  editOverlay.addEventListener('click', e=>{ if(e.target===editOverlay) editOverlay.remove(); });
  document.getElementById('save-edit-falla-btn').addEventListener('click', async ()=>{
    const tipo = document.getElementById('edit-falla-tipo').value;
    const folio = document.getElementById('edit-falla-folio').value.trim();
    const ticket = document.getElementById('edit-falla-ticket').value.trim();
    const fechaInput = document.getElementById('edit-falla-fecha').value;

      return;

    let fechaCierreFinal = null;
    if(cierreInput){
      const res = fechaCierreDesdeInput(cierreInput, fechaCapturaFinal);
      if(!res.ok) return; // fechaCierreDesdeInput ya mostró el toast de error correspondiente
      fechaCierreFinal = res.iso;

/* ══════════════════ ACTUALIZACIÓN MASIVA: ESTRUCTURA REGIONAL ══════════════════
   Carga mensual de Excel (Clave PDV, Nombre PDV, Regional Manager, Director
   Regional, Región) para actualizar SOLO esos 3 campos por tienda -- nunca toca
   el resto del catálogo. Cada carga se guarda en Firestore
   (ESTRUCTURA_HIST_COLLECTION) con el nombre real del archivo (incluye el mes,
   ej. "NACIONAL_ESTRUCTURA_REGIONAL_AGOSTO_2026.xlsx") para poder rastrear de
   qué archivo/mes vino cada actualización si algo sale mal.                */

function buscarCampoEstructura(row, posibles){
  const keys = Object.keys(row);
  for(const p of posibles){
    const k = keys.find(k2=>k2.toLowerCase().trim()===p.toLowerCase());
    if(k) return row[k];
  }
  return '';
}

function handleEstructuraFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const wb = XLSX.read(ev.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      procesarEstructuraRegional(rows, file.name);
    }catch(err){
      console.error(err);
      toast('No se pudo leer el archivo (revisa la consola si el error persiste).', 'error');
    }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
}

function procesarEstructuraRegional(rows, nombreArchivo){
  const matched = [];
  const noCoincidieron = [];
  const clavesEnArchivo = new Set();

  rows.forEach(r=>{
    const clave = String(buscarCampoEstructura(r, ['CLAVE PDV','CVE PDV','CLAVE_PDV']) || '').trim().toUpperCase();
    if(!clave) return;
    const nombrePdv = buscarCampoEstructura(r, ['NOMBRE PDV','NOMBRE','PLAZA']);
    const regionalManager = String(buscarCampoEstructura(r, ['REGIONAL MANAGER','GERENTE REGIONAL']) || '').trim();
    const directorRegional = String(buscarCampoEstructura(r, ['DIRECTOR REGIONAL','DIRECTOR']) || '').trim();
    const region = String(buscarCampoEstructura(r, ['REGION','REGIÓN']) || '').trim();
    clavesEnArchivo.add(clave);

    const store = allStores.find(s => String(s.cve_pdv||'').trim().toUpperCase() === clave);
    if(store){
      matched.push({
        id: store.id, clave_pdv: clave, plaza: store.plaza,
        region_antes: store.region||'—', region_despues: region,
        gerente_antes: store.gerente_regional||'—', gerente_despues: regionalManager,
        director_antes: store.director||'—', director_despues: directorRegional
      });
    } else {
      noCoincidieron.push({clave_pdv: clave, nombre_excel: nombrePdv||'—'});
    }
  });

  // Tiendas activas del catálogo que no vinieron en este archivo (no se tocan)
  const noIncluidas = allStores
    .filter(s => String(s.activo) === '1' && !clavesEnArchivo.has(String(s.cve_pdv||'').trim().toUpperCase()))
    .map(s => ({clave_pdv: s.cve_pdv||'—', plaza: s.plaza||'—'}));

  mostrarModalEstructuraRegional(matched, noCoincidieron, noIncluidas, nombreArchivo, rows.length);
}

function fmtFechaHist(iso){
  try{
    return new Date(iso).toLocaleDateString('es-MX', {day:'2-digit', month:'2-digit', year:'numeric'}) +
           ' ' + new Date(iso).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
  }catch(e){ return iso || '—'; }
}

function mostrarModalEstructuraRegional(matched, noCoincidieron, noIncluidas, nombreArchivo, totalFilas){
  const cambios = matched.filter(m => m.region_antes!==m.region_despues || m.gerente_antes!==m.gerente_despues || m.director_antes!==m.director_despues);

  const listaNoCoincidieron = noCoincidieron.length ? `
    <div style="max-height:140px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px;padding:6px 10px;">
      ${noCoincidieron.map(n=>`<div style="font-size:12.5px;padding:3px 0;"><span class="mono">${esc(n.clave_pdv)}</span> — ${esc(n.nombre_excel)}</div>`).join('')}
    </div>` : '';

  const listaNoIncluidas = noIncluidas.length ? `
    <div style="max-height:140px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px;padding:6px 10px;">
      ${noIncluidas.map(n=>`<div style="font-size:12.5px;padding:3px 0;"><span class="mono">${esc(n.clave_pdv)}</span> — ${esc(n.plaza)}</div>`).join('')}
    </div>` : '';

  document.getElementById('modal-content').innerHTML = `
    <h2>Actualizar estructura regional</h2>
    <p class="modal-sub">${esc(nombreArchivo)} · ${totalFilas} filas leídas</p>
    <div class="detail-row"><span class="k">Se actualizarán</span><span class="v">${matched.length} tiendas (${cambios.length} con cambios reales)</span></div>
    <div class="detail-row"><span class="k">No coincidieron (Clave PDV no encontrada)</span><span class="v" style="color:var(--warn);">${noCoincidieron.length}</span></div>
    <div class="detail-row"><span class="k">Tiendas activas sin incluir en este archivo</span><span class="v" style="color:var(--warn);">${noIncluidas.length}</span></div>
    ${noCoincidieron.length ? `<p class="modal-sub" style="margin:12px 0 0;">Filas del archivo que no se pudieron aplicar (revisar Clave PDV):</p>${listaNoCoincidieron}` : ''}
    ${noIncluidas.length ? `<p class="modal-sub" style="margin:12px 0 0;">Tiendas activas del catálogo que NO vienen en este archivo — no se tocan:</p>${listaNoIncluidas}` : ''}
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancel-estructura-btn">Cancelar</button>
      <button class="btn btn-primary" id="confirm-estructura-btn" ${matched.length?'':'disabled'}>Actualizar ${matched.length} tiendas</button>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('cancel-estructura-btn').addEventListener('click', closeModal);
  document.getElementById('confirm-estructura-btn')?.addEventListener('click', ()=> aplicarEstructuraRegional(matched, noCoincidieron, noIncluidas, nombreArchivo, totalFilas));
}

async function aplicarEstructuraRegional(matched, noCoincidieron, noIncluidas, nombreArchivo, totalFilas){
  closeModal();
  toast('Actualizando estructura regional, un momento...');
  try{
    const fechaCarga = new Date().toISOString();
    const batchSize = 400;
    for(let i=0; i<matched.length; i+=batchSize){
      const batch = db.batch();
      matched.slice(i, i+batchSize).forEach(m=>{
        batch.update(db.collection(COLLECTION).doc(m.id), {
          region: m.region_despues,
          gerente_regional: m.gerente_despues,
          director: m.director_despues,
          estructura_regional_archivo: nombreArchivo,
          estructura_regional_fecha: fechaCarga
        });
      });
      await batch.commit();
    }

    await db.collection(ESTRUCTURA_HIST_COLLECTION).add({
      archivo: nombreArchivo,
      fecha: fechaCarga,
      usuario: currentUser.label || currentUser.username,
      total_filas: totalFilas,
      actualizadas: matched.length,
      no_coincidieron: noCoincidieron,
      no_incluidas: noIncluidas
    });

    toast('Estructura regional actualizada', 'ok');
    await loadStores();
    await loadEstructuraInfo();
  }catch(err){
    console.error(err);
    toast('Error al actualizar la estructura regional', 'error');
  }
}

async function loadEstructuraInfo(){
  const info = document.getElementById('estructura-info');
  try{
    const snap = await db.collection(ESTRUCTURA_HIST_COLLECTION).orderBy('fecha','desc').limit(1).get();
    if(snap.empty){ info.style.display = 'none'; return; }
    const h = snap.docs[0].data();
    info.innerHTML = `Última actualización de estructura regional: <strong>${esc(h.archivo)}</strong> · ${h.actualizadas} tiendas · por ${esc(h.usuario)} · ${fmtFechaHist(h.fecha)} · <a href="#" id="ver-hist-estructura-link">ver historial</a>`;
    info.style.display = 'block';
    document.getElementById('ver-hist-estructura-link').addEventListener('click', (e)=>{ e.preventDefault(); verHistorialEstructura(); });
  }catch(err){
    console.error(err);
    info.style.display = 'none';
  }
}

async function verHistorialEstructura(){
  try{
    const snap = await db.collection(ESTRUCTURA_HIST_COLLECTION).orderBy('fecha','desc').limit(12).get();
    const docs = snap.docs.map(d=>d.data());
    const rowsHtml = docs.length ? docs.map(h=>`
      <div class="detail-row">
        <span class="k">${fmtFechaHist(h.fecha)}</span>
        <span class="v">${esc(h.archivo)} · ${h.actualizadas} tiendas · por ${esc(h.usuario)}${(h.no_coincidieron&&h.no_coincidieron.length)?` · ⚠️ ${h.no_coincidieron.length} sin coincidir`:''}</span>
      </div>`).join('') : `<p class="modal-sub">Todavía no hay cargas registradas.</p>`;

    document.getElementById('modal-content').innerHTML = `
      <h2>Historial de estructura regional</h2>
      <p class="modal-sub">Últimas ${docs.length} cargas (archivo, fecha y quién la subió)</p>
      <div>${rowsHtml}</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="close-modal-btn">Cerrar</button>
      </div>
    `;
    document.getElementById('modal-overlay').classList.add('show');
    document.getElementById('close-modal-btn').addEventListener('click', closeModal);
  }catch(err){
    console.error(err);
    toast('Error al cargar el historial', 'error');
  }
}

function openForm(id){

  const labels = fieldLabelMap();
  const textFields = ['cc','hostname','cve_pdv','pos_id','plaza','carrier',
                       'tecnologia','clasificacion','vigencia_servicio',
                       'region','gerente_regional','director','gerente_tienda','correo_gerente','fecha_apertura',
                       'latitud','longitud'];

  // Carrier como lista (oct. 2026): escrito a mano salían variantes ("MEGA CABLE" / "MEGACABLE", "STARLIK") que
  // descuadraban los conteos. Estándar: MEGACABLE. Si la tienda trae un valor que no está en la lista (ej.
  // "STARLIK" del catálogo actual) se conserva como opción para no borrarlo al guardar.
  const CARRIERS_ESTANDAR = ['TOTALPLAY','TELMEX','MEGACABLE','STARLINK'];
  const carrierActual = carrierEstandar(s.carrier);
  const opcionesCarrier = CARRIERS_ESTANDAR.slice();
  if(carrierActual && !opcionesCarrier.includes(carrierActual)) opcionesCarrier.push(carrierActual);
  const inputsHtml = textFields.map(key=> key==='carrier' ? `
    <div class="field">
      <label>${labels[key]}</label>
      <select id="f-carrier">
        <option value="">(sin carrier)</option>
        ${opcionesCarrier.map(c=>`<option value="${esc(c)}" ${c===carrierActual?'selected':''}>${esc(c)}${CARRIERS_ESTANDAR.includes(c)?'':' (actual)'}</option>`).join('')}
      </select>
    </div>
  ` : `
    <div class="field">
      <label>${labels[key]}</label>
      <input type="text" id="f-${key}" value="${esc(s[key])}">
    </div>
  `).join('');

  document.getElementById('modal-content').innerHTML = `
    <h2>${id ? 'Editar tienda' : 'Nueva tienda'}</h2>
    <p class="modal-sub">${id ? 'Modifica los campos y guarda los cambios.' : 'Completa los datos de la nueva tienda.'}</p>
    <div class="modal-grid">
      ${inputsHtml}
      <div class="field">
        <label>Origen</label>
        <select id="f-origen">
          <option value="ATT" ${s.origen==='ATT'?'selected':''}>ATT</option>
          <option value="PRIME" ${s.origen==='PRIME'?'selected':''}>PRIME</option>
          <option value="MAS MOVIL" ${s.origen==='MAS MOVIL'?'selected':''}>MAS MOVIL</option>
        </select>
      </div>
      <div class="field">
        <label>Estatus</label>
        <select id="f-activo">
          <option value="1" ${String(s.activo)==='1'||s.activo===undefined?'selected':''}>Activo</option>
          <option value="0" ${String(s.activo)==='0'?'selected':''}>Inactivo</option>
        </select>
      </div>
      <div class="field full">
        <label>Dirección</label>
        <input type="text" id="f-direccion" value="${esc(s.direccion)}">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancel-form-btn">Cancelar</button>
      <button class="btn btn-primary" id="save-form-btn">${id ? 'Guardar cambios' : 'Crear tienda'}</button>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('cancel-form-btn').addEventListener('click', closeModal);
  document.getElementById('save-form-btn').addEventListener('click', saveForm);
}

async function saveForm(){
  const textFields = ['cc','hostname','cve_pdv','pos_id','plaza','carrier',
                       'tecnologia','clasificacion','vigencia_servicio','direccion',
                       'region','gerente_regional','director','gerente_tienda','correo_gerente','fecha_apertura',
                       'latitud','longitud'];
  const data = {};
  textFields.forEach(key=> data[key] = document.getElementById(`f-${key}`).value.trim());
  data.carrier = carrierEstandar(data.carrier);
  data.origen = document.getElementById('f-origen').value;
  data.activo = document.getElementById('f-activo').value;

  if(!data.plaza){
    toast('El nombre de la plaza es obligatorio', 'error');
    return;
  }

  if(data.cve_pdv){
    const clave = data.cve_pdv.trim().toUpperCase();
    const dup = allStores.find(s => s.id !== editingId && String(s.cve_pdv||'').trim().toUpperCase() === clave);
    if(dup){
      toast(`Ya existe una tienda con Clave PDV "${data.cve_pdv}": ${dup.plaza}`, 'error');
      return;
    }
  }

  try{
    if(editingId){
      await db.collection(COLLECTION).doc(editingId).update(data);
      toast('Tienda actualizada', 'ok');
    } else {
      await db.collection(COLLECTION).add(data);
      toast('Tienda creada', 'ok');
    }
    closeModal();
    await loadStores();
  }catch(err){
    console.error(err);
    toast('Error al guardar', 'error');
  }
}

  });
}

/* ══════════════════ EXPORTAR CSV ══════════════════ */
document.getElementById('export-btn').addEventListener('click', ()=>{
  if(filtered.length===0){ toast('No hay datos para exportar','error'); return; }
  const labels = fieldLabelMap();
  const keys = DETAIL_FIELDS;
  const header = keys.map(k=>labels[k]).join(',');
  const rows = filtered.map(s=> keys.map(k=>{
    let v = k==='activo' ? (String(s.activo)==='1'?'Activo':'Inactivo') :
            k==='observaciones' ? getObservaciones(s.clasificacion) : (s[k]||'');
    v = String(v).replace(/"/g,'""');
    return `"${v}"`;
  }).join(','));
  const csv = [header, ...rows].join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `directorio_tiendas_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
